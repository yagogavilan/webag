# TLS moderno (perfil "intermediate" da Mozilla, 2026): TLS 1.2 e 1.3.
ssl_certificate     /etc/letsencrypt/live/webag/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/webag/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# OCSP stapling: ligue depois que o certificado real existir (o autoassinado de bootstrap não tem OCSP).
