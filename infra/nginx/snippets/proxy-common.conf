# Repasse ao upstream. IMPORTANTE (SEC-114): o IP do cliente é SOBRESCRITO com $remote_addr (o IP da conexão com o nginx),
# nunca anexado ao que o navegador mandou. O web lê X-Real-IP (WEB_CLIENT_IP_HEADER=x-real-ip) e a API confia só neste nginx (TRUST_PROXY).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Não deixa o cliente falar como se fosse o painel (BFF): o segredo só é enviado pelo próprio web, dentro da rede.
proxy_set_header X-Webag-Bff-Secret "";
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
