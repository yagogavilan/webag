# Cabeçalhos de segurança. Incluído no nível do `server` (add_header dentro de um `location` apaga os do `server`).
# O proxy_hide_header em proxy-common.conf remove os mesmos cabeçalhos vindos do upstream, para não duplicar.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
