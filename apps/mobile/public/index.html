<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app usa a tela toda no iPhone e respeita as áreas seguras (notch e barra inferior) pelo react-native-safe-area-context -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- "Adicionar à Tela de Início" no Safari do iPhone: ícone, nome, abertura sem a barra do navegador e cor da barra de status -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Webag" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Abertura: enquanto o JS do app baixa (alguns segundos em 4G) aparece a marca na cor do tema, como a splash do app nativo. O app tira esta camada
         quando a primeira tela está pronta (app/_layout.tsx). Sem isto a página ficava branca até o bundle rodar. */
      #webag-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent; /* a cor do tema é aplicada pelo script abaixo */
      }
      #webag-splash img {
        width: 120px;
        height: 120px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="webag-splash" aria-hidden="true"><img src="/icon-192.png" alt="" width="120" height="120" /></div>
    <script>
      /* cor do tema vem do app.config (tokens): evita repetir a cor aqui */
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) document.getElementById("webag-splash").style.background = tc.getAttribute("content");
    </script>
  </body>
</html>
