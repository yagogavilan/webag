  /v1/admin/delivery-fees:
    get:
      tags: [logistics]
      operationId: listDeliveryFeeTables
      summary: Tabelas de taxa de entrega em vigor (WB-236)
      description: "Uma tabela por escopo (padrão geral, cidade ou bairro). A taxa de entrega é da Webag, cobrada do cliente e vem do ENDEREÇO DE DESTINO (bairro > cidade > padrão) e da faixa de distância em linha reta; o lojista não tem taxa nem raio próprio (DEC-036). Pedido mínimo e entrega grátis são os parâmetros globais `pedido_minimo_cents` e `frete_gratis_acima_cents`. Permissão de admin: `delivery-fees:read`."
      responses:
        '200':
          description: Tabelas
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeliveryFeeTable' } }
                  nextCursor: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [logistics]
      operationId: putDeliveryFeeTable
      summary: Nova versão da tabela de um escopo
      description: "Cria uma versão NOVA (histórico), válida a partir de `effectiveFrom` (padrão: agora; não retroativa; até 90 dias à frente); o pedido guarda a faixa usada. Até 6 faixas `[fromM, toM)` contíguas a partir de 0, a última terminando no `raio_max_km`. Taxa de entrega de R$ 0 a R$ 50; taxa de troca até `taxa_coleta_max_cents` (padrão: 50% da entrega). `expectedVersion` = versão atual (0 se não houver): outra pessoa gravou antes = 409 `FEE_TABLE_CONFLICT`. Só super admin e financeiro: `delivery-fees:write`. Auditado."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryFeeTableInput'
      responses:
        '200':
          description: Versão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryFeeTable'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
