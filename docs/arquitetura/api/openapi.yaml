  /v1/me/addresses:
    get:
      tags: [addresses]
      operationId: listAddresses
      summary: Meus endereços salvos
      description: "Padrão primeiro, depois do mais antigo ao mais novo. No máximo `enderecos_max` (8) por conta; a lista cabe numa página. Dado pessoal (LGPD): só o dono lê."
      responses:
        '200':
          description: Endereços da conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [addresses]
      operationId: createAddress
      summary: Salvar endereço
      description: "A cidade precisa estar ativa em `/v1/regions` (422 `REGION_NOT_SERVED`). Sem `lat`/`lng` o servidor usa o ponto do CEP; sem nenhum dos dois, 422 `ADDRESS_GEOCODING_FAILED` e o app pede a posição. SEC-169: CEP INEXISTENTE = 422 `ADDRESS_CEP_NOT_FOUND`, com ou sem `lat`/`lng` (o GPS não dispensa um CEP que não existe); CEP de outra cidade ou UF que a informada = 422 `ADDRESS_CEP_CITY_MISMATCH`. Com o geocodificador ligado (`GEOCODER_URL` na API) e no ar, o `lat`/`lng` é conferido com o centro do CEP (`endereco_pino_max_m`, padrão 2.000 m): longe demais = 422 `ADDRESS_PIN_FAR_FROM_CEP` (o app mostra a mensagem e reabre o mapa) e o endereço volta com `pinVerified=true`. SEM geocodificador (desligado, o padrão) ou com o serviço de CEP fora do ar, o ponto do app é aceito, só valem município/UF e o raio de entrega da loja, e o endereço volta com `pinVerified=false` (o app não precisa tratar: é informativo). 422 `ADDRESS_LIMIT_REACHED` no limite. O primeiro endereço vira o padrão. Reenviar o mesmo endereço (CEP, número e complemento) devolve 200 com o existente, sem duplicar (rede ruim)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAddressRequest' }
      responses:
        '200':
          description: O endereço já estava salvo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '201':
          description: Endereço salvo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/addresses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [addresses]
      operationId: getAddress
      summary: Um endereço meu
      description: "Endereço de outra conta responde 404 (não revela existência, SEC-020)."
      responses:
        '200':
          description: Endereço
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [addresses]
      operationId: updateAddress
      summary: Editar endereço
      description: "Só os campos enviados mudam. `isDefault` aceita apenas `true` (promove este e rebaixa o antigo padrão). 409 `ADDRESS_DUPLICATE` se igualar outro endereço seu. SEC-169: CEP INEXISTENTE = 422 `ADDRESS_CEP_NOT_FOUND`, com ou sem `lat`/`lng` (o GPS não dispensa um CEP que não existe); CEP de outra cidade ou UF que a informada = 422 `ADDRESS_CEP_CITY_MISMATCH`. Com o geocodificador ligado (`GEOCODER_URL` na API) e no ar, o `lat`/`lng` é conferido com o centro do CEP (`endereco_pino_max_m`, padrão 2.000 m): longe demais = 422 `ADDRESS_PIN_FAR_FROM_CEP` (o app mostra a mensagem e reabre o mapa) e o endereço volta com `pinVerified=true`. SEM geocodificador (desligado, o padrão) ou com o serviço de CEP fora do ar, o ponto do app é aceito, só valem município/UF e o raio de entrega da loja, e o endereço volta com `pinVerified=false` (o app não precisa tratar: é informativo)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAddressRequest' }
      responses:
        '200':
          description: Endereço atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [addresses]
      operationId: deleteAddress
      summary: Apagar endereço
      description: "Apagar o padrão promove o mais antigo restante. Pedidos já feitos guardam a própria cópia do endereço."
      responses:
        '204':
          description: Apagado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/banners:
    get:
