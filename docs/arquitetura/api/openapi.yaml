      description: "Permissão da loja `settings` (só o dono; outra loja: 404). Para a 'Prévia para o cliente' e o aviso de alcance em Minha loja > Entrega e retirada: é a MESMA conta do `quote` do checkout (`computeEta` com os parâmetros `entrega_*`, o teto no FIM da faixa e `raio_max_km`), só com o preparo do formulário (`prepMin`, ainda não salvo; sem ele vale o salvo) e sem o que depende do carrinho. O web não calcula isto no navegador. Destino: ponto (`lat` e `lng`, distância medida a partir da loja) OU `distanceKm`, exatamente um dos dois (400). `cityId`/`neighborhoodId` escolhem a tabela de taxa (senão a padrão). `reachKm`: até onde a loja alcança com este preparo (menor entre o raio máximo e o limite do teto de entrega); `maxPrepMin`: o maior preparo que ainda deixa a loja entregar em algum lugar. Sem horário da logística, estoque ou frete grátis. Não grava nada. (`previewStoreDelivery`, em `/delivery/preview`, continua só com a taxa para um CEP.)"
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                distanceKm: { type: number, minimum: 0, maximum: 100 }
                prepMin: { type: integer, minimum: 5, maximum: 120 }
                cityId: { type: string, format: uuid }
                neighborhoodId: { type: string, format: uuid }
      responses:
        '200':
          description: Prévia
          content:
            application/json:
              schema:
                type: object
                required: [available, reason, distanceM, eta, etaRange, fee, prepMin, reachKm, maxPrepMin, radiusKm]
                properties:
                  available: { type: boolean }
                  reason: { type: [string, 'null'], enum: [OUT_OF_RANGE, NO_FEE_TABLE, null] }
                  distanceM: { type: [integer, 'null'] }
                  eta:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [estimateMin, fromMin, toMin, prepMin, dispatchMin, travelMin, bandMin, withinCeiling]
                        properties:
                          estimateMin: { type: integer }
                          fromMin: { type: integer }
                          toMin: { type: integer }
                          prepMin: { type: integer }
                          dispatchMin: { type: integer }
                          travelMin: { type: integer }
                          bandMin: { type: integer, description: 'Folga de + e - minutos da faixa' }
                          withinCeiling: { type: boolean }
                  etaRange: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }] }
                  fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Taxa de entrega da faixa de distância (sem frete grátis)' }
                  prepMin: { type: integer }
                  reachKm: { type: number }
                  maxPrepMin: { type: integer }
                  radiusKm: { type: number }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
