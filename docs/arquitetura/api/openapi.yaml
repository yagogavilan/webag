      summary: Dados de partida da tela Produtos (WB-370, WB-371, RN-Q1)
      description: "Uma chamada só para a tela de Produtos e o \"Novo produto\" (3G): categoria sugerida (a última usada pela loja ou a mais frequente), rascunho mais recente (\"Continuar de onde parei\"), contagem e limite de rascunhos, quantos produtos ativos estão sem descrição e os limites que o app usa na tela (`variacoes_max`, `reajuste_max_pct`). Permissão da loja: `catalog` (dono, ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Catálogo só com a loja aprovada (409 `STORE_NOT_APPROVED`). Sem dado de cliente."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
      responses:
        '200':
          description: Dados de partida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogQuickStart' }
              example:
                suggestedCategoryId: 3f2b8c1e-5d44-4a0b-9d7a-0a6f1f9b2c11
                draftCount: 2
                draftLimit: 100
                latestDraft: { id: 7d9e2a40-1c3b-4f5e-8a61-2b7c9d0e4f12, name: Camiseta básica preta, basePriceCents: null, cover: null, missing: [price, photo], updatedAt: '2026-11-22T17:32:00Z', expiresAt: '2026-12-22T17:32:00Z', expiresInDays: 30, version: 3, via: camera }
                withoutDescriptionCount: 12
                limits: { variantsMax: 100, reajusteMaxPct: 30 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/stores/{storeId}/product-drafts:
    get:
      tags: [catalog]
      operationId: listProductDrafts
      summary: Rascunhos da loja (WB-371)
      description: "Aba \"Rascunhos (n)\" da lista de Produtos: separados dos ativos e nunca visíveis ao cliente (C6). Cada item diz o que falta para publicar (`missing`) e quando vence (`expiresAt`: 30 dias sem alteração; `expiresInDays` <= 3 mostra o aviso). Mais recentes primeiro; cursor. `count` e `limit` (100, parâmetro `rascunhos_max_por_loja`) vêm na resposta. Permissão da loja: `catalog`; não-membro 404 (SEC-020); loja não aprovada 409 `STORE_NOT_APPROVED`."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Rascunhos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDraftPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [catalog]
      operationId: createProductDraft
      summary: Abrir um rascunho ao tocar em "Novo produto" (WB-370 C1, WB-371, RN-Q2)
      description: "O rascunho nasce ANTES da câmera (o navegador pode descarregar a aba ao voltar dela): sem nome, sem preço, só `via`. Rascunho sem nome tem `name: \"\"` e só deixa de ser rascunho ao publicar (`PRODUCT_INCOMPLETE` lista o que falta). Grava o início da medição (`product_create_started`, WB-379). Aceita `Idempotency-Key` (obrigatória: toque duplo ou repetição por 3G gera 1 rascunho). Mesma chave e mesmo corpo devolvem o mesmo rascunho; corpo diferente é 422 `IDEMPOTENCY_KEY_REUSED`; em andamento 409 `IDEMPOTENCY_IN_PROGRESS`. 422 `DRAFT_LIMIT_REACHED` (\"Limite de 100 rascunhos\", vale também para `createProduct`, `duplicateProduct` e o lote), `CATEGORY_FORBIDDEN` (\"Esse tipo de produto não é permitido no Webag\"; a tela mostra o link para os Termos do Lojista e \"Escolher outra categoria\"), `CATEGORY_INACTIVE`, `PRICE_OUT_OF_RANGE`. Permissão da loja: `catalog`; não-membro 404 (SEC-020); loja não aprovada 409 `STORE_NOT_APPROVED`. Nome e demais textos entram como texto puro (C-CAD-04): caracteres de controle são removidos."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductDraftRequest' }
            example: { via: camera }
      responses:
        '201':
          description: "Rascunho criado (`status: draft`, `version: 1`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/stores/{storeId}/product-drafts/batch:
    post:
      tags: [catalog]
      operationId: createProductDraftsBatch
      summary: Criar rascunhos a partir da lista colada (WB-376 C4, RN-Q8)
      description: "Depois da tabela de revisão, o app cria os rascunhos de uma vez (até 100 itens; a leitura do texto colado é LOCAL, no aparelho: nada do texto sai antes desta chamada, C7). Itens incompletos (sem preço, sem foto) também viram rascunho com `missing`; item sem nome é rejeitado na linha. Variações (`variants`) cobrem o \"Juntar 3 linhas em 1 produto\" (preço por variação quando diferem). **Atômico quanto ao limite (DEC-118):** o lote vai até 100 itens e o teto de rascunhos da loja é 100 (`rascunhos_max_por_loja`; o teto nunca fica abaixo do lote). Se `rascunhos atuais + itens` passar do teto, nada é criado e a resposta é 422 `DRAFT_LIMIT_REACHED` com `slotsAvailable` (vagas que restam), `draftCount` e `limit` (`DraftLimitProblem`); a tela oferece \"criar os N que cabem\" reenviando só os N primeiros com outra `Idempotency-Key`. A contagem e a inserção ocorrem sob lock da loja (`SELECT ... FOR UPDATE` em `stores`), então requisições simultâneas não passam do teto. `Idempotency-Key` obrigatória; reenviar devolve o mesmo resultado. Nome e atributos entram como texto puro; fórmula e HTML saem escapados (C-CAD-04). Permissão da loja: `catalog`; não-membro 404; loja não aprovada 409 `STORE_NOT_APPROVED`. Limite de 10 lotes por hora por loja [HIPÓTESE]."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductDraftsBatchRequest' }
      responses:
        '201':
          description: Rascunhos criados e linhas recusadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateProductDraftsBatchResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DraftLimitUnprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/stores/{storeId}/products/{productId}/duplicate:
    post:
      tags: [catalog]
      operationId: duplicateProduct
      summary: Duplicar produto (WB-372, RN-Q4)
      description: "Cria um RASCUNHO com nome \"<nome> (cópia)\", mesma categoria, descrição, preço, atributos e variações; NÃO copia fotos, SKU, estoque (começa em 1 por variação, ou 0 em grade) nem promoção (C1, C3). A cópia é um produto novo e passa pela moderação ao publicar (C4). **SEC-215:** a cópia NÃO herda o texto interno da moderação, mas herda o bloqueio: duplicar produto REMOVIDO ou PAUSADO pela moderação gera a cópia com `moderationStatus: paused` (e `moderationReason` genérico), que não publica por `publishProduct` nem por `quickPublishProduct` (403 `PRODUCT_MODERATED`) até o admin liberar (`moderateProduct` com `restore`); produto em revisão gera cópia em revisão; produto normal gera cópia sem estado. A cópia grava `duplicatedFrom` e um evento de moderação na fila do admin. Grava no histórico \"duplicado de <id>\" (C5). **Posse conferida:** produto de outra loja é 404 igual a inexistente (C6, C-CAD-10). Duplicar a variação (C2) é edição da tabela de variações no app, salva por `setProductVariants`; não tem rota. `Idempotency-Key` obrigatória. 422 `DRAFT_LIMIT_REACHED`. Permissão da loja: `catalog`; não-membro 404; loja não aprovada 409 `STORE_NOT_APPROVED`."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
        - { $ref: '#/components/parameters/ProductIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      responses:
        '201':
          description: Rascunho da cópia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/category-templates:
    get:
      tags: [categories]
      operationId: listCategoryTemplates
      summary: Modelos por categoria (WB-375, RN-Q6)
      description: "Público e sem dado pessoal (como `/v1/categories`; ETag/304). Para cada categoria com modelo: atributos e valores sugeridos (tamanhos P a GG; 34 a 44 em calçado), avisos (`sizeChartHint` = tabela de medidas; `noVoluntaryExchangeHint` = sugerir \"sem troca voluntária\" em íntimos e higiene) e `descriptionRequired` com `descriptionMinChars` (RN-Q1, DEC-106: Cosméticos e Eletrônicos, 20 caracteres). O modelo SÓ SUGERE; a única exigência que ele carrega é `descriptionRequired`, validada no servidor nas duas vias (rápida e formulário completo): 422 `DESCRIPTION_REQUIRED` ao publicar. Categoria sem modelo não aparece (C5). Limitada ao total de categorias ativas (no máximo 100 itens, sem paginação; `nextCursor` sempre nulo, como em `listCategories`)."
      security: []
      responses:
        '200':
          description: Modelos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryTemplateList' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
