  /v1/me/deletion:
    get:
      tags: [privacy]
      operationId: getAccountDeletion
      summary: O que impede (ou não) a exclusão da minha conta
      description: "Bloqueios (pedido ou troca em aberto; dono de loja: pedidos, trocas e estornos da loja) e os prazos que o texto \"O que acontece\" cita (nunca fixos na tela). `canDelete` é falso para conta de admin."
      responses:
        '200':
          description: Situação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [privacy]
      operationId: deleteAccount
      summary: Excluir minha conta (só a senha, SEC-096)
      description: |
        Confirma só com a senha (nunca código por e-mail, mesmo com e-mail não confirmado; DEC-014/015). A conta fecha na hora: sessões e sockets
        revogados, aparelhos de push e sacola apagados, loja do dono encerrada (`closed`). A anonimização roda em `effectiveAt` (imediata quando
        o período de arrependimento é 0). Erros: 403 `INVALID_PASSWORD` (conta no limite de tentativas do login, depois 429), 403
        `ADMIN_ACCOUNT_NOT_DELETABLE`, 409 `DELETION_BLOCKED` (com `blockers`), 409 `PASSWORD_NOT_SET` (conta só com login social).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Conta fechada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/account-deletion/cancel:
    post:
      tags: [privacy]
      operationId: cancelAccountDeletion
      summary: Arrependimento - cancelar a exclusão da conta
      description: |
        Só vale enquanto há período de arrependimento (`exclusao_arrependimento_horas` > 0) e antes de `effectiveAt`. Qualquer falha (e-mail inexistente, conta que não está em exclusão, senha errada) responde 401 `INVALID_CREDENTIALS`, igual ao login: não revela se a conta existe nem se está em exclusão.

        **Fluxo do código de step-up (SEC-168/176; app e `/lojista/desistir-da-exclusao` usam o mesmo):**
        1. `POST` com `{ email, password }`. Sem ataque em curso: `204` e a conta reabre.
        2. Se a conta está sob ataque (5 falhas/h na conta, contador compartilhado com o login, ou mais de 10 tentativas/h no e-mail, de qualquer IP) e a senha está CERTA: `403` com `code = LOGIN_CODE_REQUIRED`; o código `delete_web` (6 dígitos, 10 min, uso único) é enviado ao e-mail. O app mostra "Enviamos um código ao seu e-mail" e o campo de 6 dígitos.
        3. Repetir o `POST` com `{ email, password, code }`: `204`. Código errado ou usado: `400 CODE_INVALID`; vencido: `400 CODE_EXPIRED` (repita o passo 1 sem `code` para receber outro). **Reenviar o código = repetir o passo 1 sem `code`**; o reenvio respeita `otp_reenvio_s` (429 `Retry-After`).
        4. Senha errada recebe sempre `401 INVALID_CREDENTIALS`, com ou sem `code`, e NUNCA dispara o envio de código (quem só sabe o e-mail não consegue esgotar o limite de envio nem bloquear o dono).
        5. E-mail não confirmado sob ataque: a mesma `401` genérica (não há para onde enviar o código; o suporte resolve).

        **Limites:** 5 por hora por e-mail + IP (`429` com `Retry-After`; só quem insiste do mesmo IP é barrado). O contador por e-mail (sem IP) NUNCA devolve 429: acima de 10/h ele só liga o passo 2 para a senha certa. Sucesso zera os contadores.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAccountDeletionRequest'
            examples:
              primeiraTentativa: { summary: Passo 1, value: { email: ana@example.com, password: "senha-certa-1" } }
              comCodigo: { summary: Passo 3 (depois do 403), value: { email: ana@example.com, password: "senha-certa-1", code: "482913" } }
      responses:
        '204':
          description: Conta reativada (e loja do dono reaberta no estado anterior)
        '400':
          description: "Validação do corpo (`VALIDATION_ERROR`) ou, no passo 3, `CODE_INVALID` (código errado, usado ou invalidado) / `CODE_EXPIRED` (vencido)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                codigoErrado: { value: { type: 'https://api.webag.com.br/errors/code-invalid', title: Código incorreto, status: 400, detail: Confira o código ou peça um novo., code: CODE_INVALID } }
        '401':
          description: "`INVALID_CREDENTIALS`: e-mail ou senha incorretos (mensagem única, inclusive para conta inexistente, fora de exclusão, com prazo vencido, ou e-mail não confirmado sob ataque)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "`LOGIN_CODE_REQUIRED` (senha certa, conta sob ataque, e-mail confirmado): o código `delete_web` foi enviado ao e-mail; repita a chamada com `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                stepUp: { value: { type: 'https://api.webag.com.br/errors/login-code-required', title: Confirme com o código, status: 403, detail: 'Para sua segurança, confirme com o código enviado ao seu e-mail.', code: LOGIN_CODE_REQUIRED } }
        '429':
          description: "Mais de 5 tentativas na hora do mesmo IP para o mesmo e-mail, ou reenvio do código antes de `otp_reenvio_s`. Traz `Retry-After`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
