      description: "Permissão `stores:write` (super admin e operação). **Nada é apagado:** grava um NOVO registro (`type` do original, `restores: <entryId>`) e a contagem do `audit_log` só cresce (C5); o lojista é avisado (C1). Se o valor atual já não é o que a linha original deixou (outra pessoa mudou depois), responde 409 `RESTORE_VALUE_CHANGED` com o valor atual e só restaura com `confirmOverride: true` (C2). Restaurar preço obedece às regras do admin: motivo de preço, `confirmLargeChange` acima de `admin_preco_variacao_max_pct` e **redução acima de 50% só super admin** (403 `SUPER_ADMIN_REQUIRED`). Linha já restaurada: 409 `ENTRY_ALREADY_RESTORED`; linha não restaurável: 422 `ENTRY_NOT_RESTORABLE`. Também é o \"Desfazer\" de 8 s do toast (a resposta de toda edição traz `auditEntryId`). Sem `Idempotency-Key`: restaurar a mesma linha duas vezes é 409."
