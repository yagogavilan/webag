      description: "Permissão da loja: `orders` (dono ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Só pedidos já PAGOS. `in_preparation`, `ready_for_collection` (só entrega Webag: cria a corrida da logística; aceita `volumes` e `note`; DEC-036), `ready_for_pickup` (só retirada) e `delivered` (só retirada). Na entrega Webag a loja NÃO marca “saiu” nem “entregue”: são da logística. “Voltar para a separação” (`in_preparation`) só enquanto a corrida está sem motoboy (409 `DELIVERY_ALREADY_ASSIGNED`). Retirada só conclui com `pickupCode` igual ao do cliente (422 `PICKUP_CODE_INVALID`); 5 erros bloqueiam por 30 min (429 `PICKUP_CODE_LOCKED`). Transição inválida: 409 `INVALID_TRANSITION` com `currentStatus`; repetir o mesmo destino é idempotente."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
