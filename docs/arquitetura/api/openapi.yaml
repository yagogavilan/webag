  /v1/stores/{storeId}/products/import:
    post:
      tags: [catalog]
      operationId: importProducts
      summary: Importar produtos por planilha (CSV)
      description: "Permissão da loja: `catalog` (dono, ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Catálogo só com a loja aprovada (409 `STORE_NOT_APPROVED`). Corpo `text/csv` (UTF-8, vírgula ou ponto e vírgula) **ou, na v1.1 R1 (WB-376 C6, C9, C-CAD-05), `.xlsx`**; até 1 MB e **1.000 linhas** (`import_max_linhas` sobe de 500 para 1.000; 1.001 linhas ou arquivo maior: 422 `IMPORT_FILE_INVALID` e nada é criado). **SEC-213 (a importação é edição de catálogo):** `mode=commit` com `onExisting=update` que muda preço ou estoque sobe `products.version` UMA vez por produto alterado (uma prévia de reajuste aberta antes vira 409 `BULK_VERSION_CONFLICT`) e grava antes/depois no histórico da loja (`product.price`, `product.stock_adjust`, com `store_id`), na mesma transação; produto que a planilha deixa igual não é tocado. Produtos NOVOS contam no teto de rascunhos (`rascunhos_max_por_loja`, DEC-118): acima dele, 422 `DRAFT_LIMIT_REACHED` e nada é criado nem atualizado (tudo ou nada). Com `Idempotency-Key` (só no `commit`), a chave, o efeito e a resposta são gravados NA MESMA transação, com escopo por loja e usuário: repetir devolve a mesma resposta sem duplicar; corpo diferente com a mesma chave: 422 `IDEMPOTENCY_KEY_REUSED`; erro (teto, planilha) libera a chave. Planilha: lê VALORES e nunca avalia fórmula; limite de descompressão (bomba de zip recusada); macros e vínculos externos ignorados; fórmula e HTML em texto saem literais e escapados em qualquer CSV (C-CAD-04). **Mapeamento de colunas:** `nameColumn`, `priceColumn`, `stockColumn` e `sizeColumn` (índice da coluna, a partir de 1) quando o cabeçalho não bate com o modelo; no `preview` a resposta traz `headers`, `suggestedMapping` e as 3 primeiras linhas em `sampleRows`. `commit` cria rascunhos (via `spreadsheet`), sem foto: a etapa de fotos vem depois (RN-Q8). Aceita `Idempotency-Key`: repetir o `commit` não duplica. `mode=preview` valida e devolve o resumo com linha e motivo de cada erro; `mode=commit` cria só as válidas, como rascunho. Mesmo código (SKU) já existente: `onExisting=skip` ignora, `update` atualiza preço e estoque. Sem coluna de foto (WB-065 C6). Cabeçalho errado ou arquivo grande: 422 `IMPORT_FILE_INVALID` e nada é criado."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mode, in: query, schema: { type: string, enum: [preview, commit], default: preview } }
        - { name: onExisting, in: query, schema: { type: string, enum: [skip, update], default: skip } }
        - { name: nameColumn, in: query, description: 'v1.1 R1: coluna do nome (1 a 50)', schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: priceColumn, in: query, description: 'v1.1 R1: coluna do preço', schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: stockColumn, in: query, description: 'v1.1 R1: coluna do estoque', schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: sizeColumn, in: query, description: 'v1.1 R1: coluna do tamanho (opcional)', schema: { type: integer, minimum: 1, maximum: 50 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              { type: string }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              { type: string, format: binary }
      responses:
        '200':
          description: Resumo da importação
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ImportResult' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/stores/{storeId}/products/bulk:
    post:
      tags: [catalog]
      operationId: bulkProducts
      summary: Ação em massa
      description: "Permissão da loja: `catalog` (dono, ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Catálogo só com a loja aprovada (409 `STORE_NOT_APPROVED`). Pausar, reativar, mover de seção ou ajustar preço (+/-% ou +/- centavos). `dryRun: true` só mostra o que mudaria. Se algum preço sairia da faixa, a ação INTEIRA é bloqueada (422 `BULK_BLOCKED`, com a lista). Id de outra loja: 404 para o pedido todo. **v1.1 R1 (WB-377):** reajuste de N itens é UMA transação (tudo ou nada); o `dryRun` devolve a prévia por item (`preview`); acima de `reajuste_max_pct` em algum item exige `confirmLargeChange: true` (422 `BULK_NEEDS_CONFIRMATION`, com os itens); estoque menor que o reservado nunca é tocado aqui. Aplicado, devolve `batchId` e `undoUntil` (10 min; `undoBulkBatch`). Promoção NÃO é editada em massa na v1.1. Cada ação registra quem, quando e quantos itens (`listBulkBatches`). Funcionário sem `catalog`: 403/404 como nas demais rotas (a tela fica somente leitura). **Repetição em 3G (tech-lead B2):** `price_adjust` repetido depois de timeout aplicaria o reajuste duas vezes (+10% vira +21%). Por isso, sem `dryRun`, `price_adjust` EXIGE no servidor o header `Idempotency-Key` (ausente: 400 `IDEMPOTENCY_KEY_REQUIRED`; mesma chave e mesmo corpo devolvem o mesmo `batchId`) e `expectedVersions` com a `version` de CADA item vinda da prévia (ausente ou incompleto: 400 `EXPECTED_VERSIONS_REQUIRED`; item com versão diferente: 409 `BULK_VERSION_CONFLICT` com `conflicts`, nada é aplicado e o app refaz a prévia). **SEC-208 (mesma transação):** a conferência de `expectedVersions`, o `version = version + 1` de cada item, o lote e a resposta da chave (`batchId`) são gravados NA MESMA transação do efeito; repetir o mesmo corpo depois de aplicado devolve o mesmo `batchId` ou 409, nunca reaplica (ADR-018 D17; tarefa da R1.1). O header é opcional na assinatura porque `pause`, `resume` e `move_section` são estados absolutos (repetir é seguro) e o app 1.0 não o envia. **Arredondamento do reajuste (A3):** `percent` com no máximo 2 casas, de -90 a +500; `amount` em centavos inteiros; o cálculo é em inteiro, com arredondamento meio para cima ao centavo; resultado fora de 1 a 9.999.999 bloqueia o item (`BULK_BLOCKED`)."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/BulkRequest' }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/BulkResult' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BulkVersionConflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
