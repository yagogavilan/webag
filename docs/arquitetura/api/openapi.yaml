        installments: { type: integer }
        threeDsUrl: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    Exchange:
      type: object
      required: [id, number, orderId, orderNumber, status, type, method, resolution, quantity, fee, difference, totalDue, refund, answerDeadlineAt, windowEndsAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: 'Protocolo (TR-XXXXX).' }
        orderId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/ExchangeStatus' }
        type: { $ref: '#/components/schemas/ExchangeType' }
        reasonCode: { type: [string, 'null'], enum: [size, color, null] }
        description: { type: [string, 'null'] }
        method: { type: string, enum: [pickup_at_home, drop_at_store] }
        resolution: { type: string, enum: [replace, refund] }
        quantity: { type: integer }
        item:
          type: [object, 'null']
          properties:
            orderItemId: { type: string, format: uuid }
            name: { type: string }
            attributes: { type: object, additionalProperties: { type: string } }
            image: { $ref: '#/components/schemas/ImageUrls' }
            unitPrice: { $ref: '#/components/schemas/Money' }
        newVariant:
          type: [object, 'null']
          properties:
            variantId: { type: string, format: uuid }
            attributes: { type: object, additionalProperties: { type: string } }
        fee: { $ref: '#/components/schemas/Money' }
        difference: { $ref: '#/components/schemas/Money' }
        totalDue: { $ref: '#/components/schemas/Money' }
        feeDueAt: { type: [string, 'null'], format: date-time }
        feePaid: { type: boolean }
        refund: { $ref: '#/components/schemas/Money' }
        answerDeadlineAt: { type: string, format: date-time }
        windowEndsAt: { type: string, format: date-time }
        itemDueAt: { type: [string, 'null'], format: date-time }
        autoApproved: { type: boolean }
        decidedBy: { type: [string, 'null'], enum: [customer, store, system, admin, null] }
        decisionReason: { type: [string, 'null'] }
        contestableUntil: { type: [string, 'null'], format: date-time, description: 'Até quando o cliente pode contestar a recusa da loja (WB-176); nulo quando não cabe.' }
        contested: { type: boolean }
        photoCount: { type: integer }
        storeCode: { type: [string, 'null'], description: 'Só ao cliente, na troca na loja já aprovada.' }
        photos:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              url: { type: [string, 'null'], description: 'URL assinada de curta duração.' }
        timeline:
          type: array
          items:
            type: object
            properties:
              from: { type: [string, 'null'] }
              to: { type: string }
              actor: { type: string }
              reason: { type: [string, 'null'] }
              at: { type: string, format: date-time }
        runs:
          type: array
