  /v1/home:
    get:
      tags: [home]
      operationId: getHome
      summary: Home do cliente, seções por posição (público)
      description: "Lojas que entregam na posição (RN-03/RN-04): aprovada, conta de recebimento ativa, 1+ produto ativo e distância em linha reta (PostGIS) dentro do raio da loja e da faixa de taxa; loja fora do raio não aparece. `nearbyStores`: abertas primeiro, depois distância, depois avaliação. `offers`: promoção vigente, produto com estoque, maior desconto primeiro. `newStores`: aprovadas há até 30 dias. `bestSellers`: vazio até a Onda 4 (precisa de pedidos); seção vazia é ocultada pelo app. `availableCategoryIds`: categorias (com a mãe das filhas) que têm loja visível ali. `empty=true`: nenhuma loja visível (estado 'Ainda não há lojas aqui'). `mode=pickup` (WB-036): lojas com retirada ativa até `retirada_distancia_max_km`, sem exigir entrega. Cache no servidor de 30 s por posição exata; no aparelho `private, max-age=30`. As coordenadas não vão ao log de acesso."
      security: []
      parameters:
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
        - { name: mode, in: query, schema: { type: string, enum: [delivery, pickup], default: delivery } }
      responses:
        '200':
          description: Seções da home
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
