        '409': { $ref: '#/components/responses/BulkVersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  # ---- Coleta de eventos de navegação, só em STAGING até o J24 (WB-360, 361, 363, 369). Flag `coleta_eventos` nasce DESLIGADA (C-GEN-01).
  /v1/analytics/events:
    post:
      tags: [analytics]
      operationId: ingestAnalyticsEvents
      x-planned: v1.1 R1
      summary: Enviar eventos de navegação, sem identificar a conta (WB-361)
      description: "**Rota PÚBLICA e sem identidade de propósito (C-ANA-01):** o app NÃO envia `Authorization`, cookie nem `X-Device-Id`; a rota não passa pelo guard de autenticação nem pelo log com `userId`; **nenhum log grava IP, user-agent, cabeçalhos nem `session_id` desta rota** (tech-lead I5): o `pino-http` a ignora no log de acesso e o serializer do caminho não inclui `remoteAddress` nem cabeçalhos, então 413, 422 e 429 viram CONTADOR (não linha); o nginx tem `access_log off` e nenhum `limit_req` nessa `location` (o limite é da API); o Sentry descarta o evento da rota. O `session_id` só trafega no corpo e não vai a log, pedido nem usuário. **Vida do `sessionId` (obrigação do app, threat model §15.5 c):** UUID novo a CADA abertura do app (processo novo) e também depois de 30 min sem uso; nunca igual ao id do aparelho ou da instalação, nunca guardado em disco entre aberturas nem entre dias. Sem isso ele vira identificador de aparelho (afeta o Data Safety e a SEC-194). Ao receber 429 o app mantém a fila local com tamanho limitado (R7 c). Corpo em lote: até 100 eventos e 64 KB (acima: 413 `PAYLOAD_TOO_LARGE` ou 422), Zod estrito (campo fora do esquema, texto livre ou `user_id`: 422 `VALIDATION_FAILED` e a rejeição é CONTADA, C6; o lote inteiro é recusado). Idempotente por `eventId` (reenvio do lote não duplica, C5). Resposta SEMPRE 202 quando válido, com `accepted`, `duplicates` e `discarded` (evento com `storeId` ou `productId` inexistente é descartado e contado; com a flag `coleta_eventos` desligada TUDO é descartado em silêncio: o app não distingue). Limites (C-ANA-03, tech-lead I6): o controle real é por **sessão pseudônima**: 60 requisições por minuto por `sessionId` (chave Redis = HMAC do `sessionId`, validade de até 120 s; `sessionId` e IP em claro nunca); acima, 429 com `Retry-After` e o app mantém a fila no aparelho (nada é perdido em silêncio). O IP é só trava anti-inundação com teto alto, porque a rede móvel da região fica atrás de CGNAT (SEC-200, R-38): 600 requisições por minuto e 300 sessões novas por hora por IP (chave Redis = HMAC do IP, nunca o IP em claro: contador por minuto com validade de até 120 s e contador de sessões novas com validade de no máximo 1 h; o segredo do HMAC é uma variável de ambiente PRÓPRIA da coleta, obrigatória no boot e diferente do `AUTH_HMAC_KEY`, threat model §15.5 e R7 a) `[HIPÓTESE: parâmetros `analytics_ip_req_min` e `analytics_sessoes_novas_ip_hora`; o Security confirma os números]`, também com 429, nunca descarte silencioso com 202. Os descartes e recusas são contados por motivo (`rate_ip`, `rate_session`, `unknown_store`, `flag_off`) e aparecem em `getAdminAnalyticsAccess` (`discards`). Validação de `storeId` e `productId` do lote com UMA consulta `= ANY(:ids)` (ou cache curto de ids existentes), nunca 1 por evento (A5). `occurredAt` é do aparelho e o servidor o limita a [-24 h, +5 min] e o grava truncado ao minuto. O `order_paid` NÃO vem por aqui: o servidor o grava ao confirmar o pagamento, com hora cheia e sem `order_id`, `user_id` nem valor (SEC-194). O app não envia com conta de lojista ou admin logada nem com o opt-out ligado (C-ANA-08): decisão do app."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsEventsRequest' }
            example:
              events:
                - { name: app_session_started, eventId: 0d3e5a7c-2b61-4f08-9a74-5c1e8b3d6f20, sessionId: 9b1c4e72-6a35-4d18-8f02-7e5a3c9d1b46, occurredAt: '2026-11-22T14:03:10Z', platform: android, appVersion: 1.1.0, cityId: 5c8a1f3e-7b24-4e69-a0d1-3f6b9c2e8a75 }
                - { name: store_viewed, eventId: 4a7f2c19-8d03-4b5e-a1c6-9e0d3b7f5a82, sessionId: 9b1c4e72-6a35-4d18-8f02-7e5a3c9d1b46, occurredAt: '2026-11-22T14:03:40Z', storeId: 2e9d6b4a-1c58-4f37-8a0e-6d3b9f1c7a24, origin: home }
      responses:
        '202':
          description: Lote recebido (não significa que todos foram gravados)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsIngestResult' }
              example: { accepted: 2, duplicates: 0, discarded: 0 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
