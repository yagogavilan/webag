        pickupAvailable: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId: { type: string, format: uuid }
              name: { type: string }
              attributes: { type: object, additionalProperties: { type: string } }
              quantity: { type: integer }
              openExchange:
