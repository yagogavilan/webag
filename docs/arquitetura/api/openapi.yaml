    post:
      tags: [orders]
      operationId: createCardIntent
      summary: "Intenção de cartão para a página segura do Mercado Pago (B.2)"
      description: "O app NUNCA toca em dado de cartão: pede a intenção (o que quer comprar e o total que viu, SEC-147) e abre `url` no navegador do sistema (`/pagar/cartao?i=<token>`, MP.js/Bricks/3DS). Uso único, 15 min, ligada a usuário e sessão. Depois o app acompanha o pedido por REST (`GET /v1/orders`). Cartão recusado: o app pede uma intenção nova."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardIntentRequest' }
      responses:
        '201':
          description: Intenção criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardIntent' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "`MAINTENANCE` (WB-121): modo manutenção; não abra a página do cartão. Mesmo formato do `POST /v1/orders`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
