  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Criar o pedido a partir da sacola e iniciar o pagamento (WB-023, WB-024, WB-025)
      description: |
        Cria o pedido da sacola da conta, reserva o estoque (RN-06) e cria o pagamento no provedor (ADR-002). O app NUNCA envia valores: o servidor recalcula tudo e o pedido grava o snapshot de preço, nome, variação, taxas e política de trocas (RN-05).

        **Idempotência (obrigatória):** header `Idempotency-Key` (8 a 80 caracteres, gerado pelo app ao abrir o checkout e reaproveitado em toda repetição). Repetir a mesma chave com o mesmo corpo devolve o MESMO pedido, com o estado atual (200, sem novo estoque reservado nem nova cobrança); mesma chave com corpo diferente é 409 `IDEMPOTENCY_KEY_REUSED`. A chave vale 24 h. Tocar duas vezes em "Pagar" nunca gera dois pedidos.

        **Conferência (RN-05):** `cartRevision` é a `revision` da sacola que o cliente viu. `expectedTotalCents` (opcional) é o total que o cliente viu: se o frete ou o desconto mudaram e o total difere, também responde 409 `CART_CHANGED`. Se a sacola mudou ou se preço ou estoque mudaram, responde 409 `CART_CHANGED` com `changes` (o app abre 'Algo mudou na sua sacola'); o cliente aceita com `POST /v1/cart/acknowledge` e repete com a nova `revision`. Nada é cobrado sem o cliente ver o valor.

        **Pagamento:** PIX devolve `payment.pix` (copia e cola, QR e validade). Cartão exige `card.token` gerado pelo checkout/Brick do Mercado Pago no aparelho; o servidor nunca recebe nem guarda número de cartão. O status só muda por webhook assinado do provedor (não há rota para 'confirmar' pagamento). O estado inicial é `awaiting_payment`; vira `received` quando o pagamento é aprovado.

        **Erros 409:** `CART_CHANGED`, `STORE_CLOSED` (com `opensAt`), `STOCK_CONFLICT` (a última unidade foi de outro cliente: 'Acabou o estoque de X'), `IDEMPOTENCY_KEY_REUSED`. **422:** `EMPTY_CART`, `ITEM_UNAVAILABLE`, `BELOW_MINIMUM`, `OUT_OF_RANGE`, `ADDRESS_REQUIRED`, `PICKUP_UNAVAILABLE`, `ABOVE_MAX_ORDER`, `NEW_STORE_LIMIT` (loja nova: pedido acima do teto, WB-225), `EMAIL_UNVERIFIED` (se a flag `confirmacao_email_bloqueia_compra` estiver ligada), `PAYER_DOCUMENT_REQUIRED`, `PAYMENT_DECLINED` (cartão recusado: o pedido fica `expired` e o estoque volta). **429** `TOO_MANY_PENDING_ORDERS` (2 pedidos aguardando pagamento por conta) e `TOO_MANY_PIX_ORDERS` (5 PIX por hora; SEC-131), com `Retry-After`. **503** `PAYMENT_PROVIDER_UNAVAILABLE`: nada foi cobrado e nenhum pedido ficou aberto.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: 'Repetição da mesma requisição (mesma chave e mesmo corpo): o pedido original'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '201':
          description: Pedido criado, aguardando pagamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`CART_CHANGED` (com `changes`), `STORE_CLOSED`, `STOCK_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CheckoutConflictProblem' }
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "`PAYMENT_PROVIDER_UNAVAILABLE`: nada foi cobrado; tentar de novo com a mesma `Idempotency-Key`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [orders]
      operationId: listOrders
      summary: Meus pedidos (WB-030)
      description: "Só os pedidos da conta, mais recentes primeiro. `scope=active` traz os em andamento (`awaiting_payment` a `ready_for_pickup`); `past` os encerrados (`delivered`, `cancelled`, `refused`, `expired`). Paginado por cursor."
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [active, past] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [orders]
      operationId: getOrder
      summary: Detalhe e acompanhamento do pedido (WB-027)
      description: "Fonte da verdade do estado: o app também ouve o canal em tempo real do pedido (Socket.IO, ADR-004), mas SEMPRE pode recuperar tudo por esta rota ao reabrir ou perder eventos. Pedido de outra conta responde 404 (SEC-020). `allowedActions` diz o que o cliente pode fazer agora. `pickup.code` (4 dígitos) só aparece depois de pago."
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/cancel:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancelar o pedido (WB-028, RN-08)
      description: "Cliente cancela livremente em `awaiting_payment` (libera o estoque, sem estorno), `received` e `accepted` (estorno total automático, sem comissão). Depois disso responde 409 `ORDER_NOT_CANCELLABLE` e o app oferece o pedido de cancelamento à loja ou o suporte. Idempotente: cancelar um pedido já cancelado pelo cliente devolve 200 com o mesmo pedido. Pedido de outra conta responde 404."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/orders/{orderId}/payment:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [orders]
      operationId: getOrderPayment
      summary: Estado do pagamento do pedido (WB-024, WB-158)
      description: "Para o app reabrir a tela do PIX (copia e cola, QR, validade) e acompanhar a aprovação quando o evento em tempo real não chegar (polling a cada poucos segundos, com recuo). Somente leitura: o status vem do provedor por webhook assinado e da conciliação, nunca de uma chamada do cliente (SEC-035). Pedido de outra conta responde 404."
      responses:
        '200':
          description: Pagamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPayment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor`
      schema: { type: string, maxLength: 200 }
    CartMode:
      name: mode
      in: query
      description: Como o cliente quer receber; define frete e bloqueios do resumo
      schema: { type: string, enum: [delivery, pickup], default: delivery }
    CartAddressId:
      name: addressId
      in: query
      description: "Endereço de entrega (de `/v1/me/addresses`); sem ele vale o padrão da conta. Endereço de outra conta responde 404"
      schema: { type: string, format: uuid }
    Lat:
      name: lat
      in: query
      required: true
      description: Latitude da posição do cliente (endereço salvo, CEP ou GPS)
      schema: { type: number, minimum: -90, maximum: 90 }
    Lng:
      name: lng
      in: query
      required: true
      description: Longitude da posição do cliente
      schema: { type: number, minimum: -180, maximum: 180 }
    Limit:
      name: limit
      in: query
      description: Itens por página (padrão 20, máximo 50)
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  responses:
    ValidationError:
      description: Entrada inválida (campo desconhecido, formato ou tamanho). `errors[]` lista os campos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Não autenticado, token inválido ou sessão encerrada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sem permissão (ou `REAUTH_REQUIRED`, `MFA_REQUIRED`, `EMAIL_VERIFICATION_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Não encontrado (também para recurso de outro usuário, sem revelar existência)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito de estado ou duplicidade
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Convite inválido, usado, revogado ou vencido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regra de negócio violada (senha fraca, fora da faixa...)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de tentativas. Header `Retry-After` em segundos.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    HealthIndicator:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
    HealthStatus:
      type: object
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
        info:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
    Money:
      type: object
      description: Valor monetário em centavos.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Centavos
          example: 1990
        currency:
          type: string
          enum: [BRL]
    Problem:
      type: object
      description: Erro no formato RFC 9457.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável; o cliente decide a ação por ele.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LegalDocumentType:
      type: string
      enum: [customer_terms, merchant_terms, privacy]
    DocumentRef:
      type: object
      required: [type, version]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: integer, minimum: 1 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string, description: JWT HS256 de 15 min }
        refreshToken: { type: string, description: Token opaco de 256 bits, rotativo }
        expiresIn: { type: integer, description: Segundos de validade do access token, example: 900 }
        tokenType: { type: string, enum: [Bearer] }
    UserSummary:
      type: object
      required: [id, email, emailVerified, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
    AuthResult:
      type: object
      required: [user, tokens, mfaSetupRequired]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        mfaSetupRequired: { type: boolean, description: Admin sem TOTP configurado (ou que usou código de recuperação). Só a configuração do TOTP fica liberada. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, adultDeclaration, acceptedDocuments]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, description: 'Celular brasileiro, ex.: (11) 99999-9999' }
        password: { type: string, description: '8 a 128 caracteres, fora da lista de senhas comuns (422 WEAK_PASSWORD)' }
        adultDeclaration: { type: boolean, enum: [true], description: Declaração de ter 18 anos ou mais }
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          description: Versões exibidas ao usuário. Devem ser as vigentes de customer_terms e privacy (409 TERMS_OUTDATED).
