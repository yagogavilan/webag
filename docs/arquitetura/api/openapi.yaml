    get:
      tags: [logistics]
      operationId: getDelivery
      summary: Detalhe da corrida com a linha do tempo
      description: "Nome, telefone e endereço do cliente (`contact`) só aparecem enquanto a corrida está ativa (LGPD) E para quem despacha (`logistics:write`); financeiro e suporte usam `POST .../contact-reveal` (SEC-144). Nunca devolve o código de entrega. Permissão: `logistics:read`."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Corrida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/availability:
    get:
      tags: [logistics]
      operationId: getLogisticsAvailability
      summary: Horário e pausas da logística agora (BUG-016)
      description: "`open=false` com `closedBy` `HOURS` (fora de `logistica_horario`/`logistica_dias`, Brasília; `opensAt` = próxima abertura) ou `PAUSED`. `pauses` lista as pausas abertas (geral = `cityId` nulo)."
      responses:
        '200':
          description: Estado atual
          content:
            application/json:
              schema:
                type: object
                required: [open, closedBy, opensAt, pauses]
                properties:
                  open: { type: boolean }
                  closedBy: { type: [string, 'null'], enum: [HOURS, PAUSED, null] }
                  opensAt: { type: [string, 'null'], format: date-time }
                  pauses: { type: array, items: { $ref: '#/components/schemas/LogisticsPause' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/pause:
    post:
      tags: [logistics]
      operationId: pauseLogistics
      summary: Pausar as entregas, geral ou de uma cidade, com motivo (BUG-016, DEC-039c)
      description: "Enquanto pausada, o carrinho bloqueia a entrega com `LOGISTICS_CLOSED` (só retirada) e a descoberta mostra a entrega indisponível. Auditado. Repetir a mesma pausa devolve a existente."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                cityId: { type: [string, 'null'], format: uuid, description: 'Nulo = todas as cidades' }
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Pausa ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogisticsPause'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/resume:
    post:
      tags: [logistics]
      operationId: resumeLogistics
      summary: Liberar a entrega pausada (geral ou de uma cidade)
      description: "409 `NOT_PAUSED` se não há pausa ativa nesse escopo. Auditado."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cityId: { type: [string, 'null'], format: uuid }
      responses:
        '204':
          description: Liberada
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/logistics/deliveries/assign-batch:
    post:
      tags: [logistics]
      operationId: assignDeliveryBatch
      summary: Atribuir um lote de corridas da mesma cidade ao mesmo motoboy (DEC-053)
      description: "De 2 a `entrega_lote_max` corridas de entrega prontas e sem motoboy, todas da mesma cidade. 422 `INVALID_BATCH` (quantidade, tipo ou estado) e `BATCH_DIFFERENT_AREA`. Cada corrida segue a regra de `assignDelivery`; as que perderam a disputa vêm em `failed` com o `code`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deliveryIds, courierId]
              properties:
                deliveryIds: { type: array, minItems: 2, maxItems: 10, items: { type: string, format: uuid } }
                courierId: { type: string, format: uuid }
                addressConfirmed: { type: boolean }
      responses:
        '200':
          description: Lote processado
          content:
            application/json:
              schema:
                type: object
                required: [assigned, failed]
                properties:
                  assigned: { type: array, items: { $ref: '#/components/schemas/DeliveryDetail' } }
                  failed: { type: array, items: { type: object, required: [deliveryId, code], properties: { deliveryId: { type: string, format: uuid }, code: { type: string } } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/logistics/deliveries/{deliveryId}/assign:
    post:
      tags: [logistics]
      operationId: assignDelivery
      summary: Atribuir motoboy (PRONTA -> AGUARDANDO)
      description: "Dois operadores: vale o primeiro, o outro recebe 409 `DELIVERY_ALREADY_ASSIGNED`. Motoboy inativo: 422 `COURIER_INACTIVE`. Endereço incompleto: 422 `ADDRESS_INCOMPLETE` até enviar `addressConfirmed: true`. Permissão: `logistics:write`. Auditado."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [courierId]
              properties:
                courierId: { type: string, format: uuid }
                addressConfirmed: { type: boolean }
      responses:
        '200':
          description: Corrida atribuída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/deliveries/{deliveryId}/whatsapp:
    get:
      tags: [logistics]
      operationId: getDeliveryWhatsapp
      summary: Mensagem pronta e link wa.me para o motoboy
      description: "Só com a corrida atribuída e ativa. A mensagem leva só loja, endereços, 1º nome e telefone do cliente, volumes e observação; nunca CPF, e-mail, itens, valores nem o código de entrega. Permissão: `logistics:write` (a mensagem leva o contato do cliente; financeiro e suporte recebem 403, SEC-144)."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Mensagem
          content:
            application/json:
              schema:
                type: object
                required: [courierPhone, message, link, courierActiveDeliveries]
                properties:
                  courierPhone: { type: string }
                  message: { type: string }
                  link: { type: string }
                  courierActiveDeliveries: { type: integer, description: 'Corridas ativas do motoboy (aviso "Já tem 2 corridas ativas").' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/deliveries/{deliveryId}/whatsapp-sent:
    post:
      tags: [logistics]
      operationId: markDeliveryWhatsappSent
      summary: Registrar que a mensagem foi enviada
      description: "Permissão: `logistics:write`."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Registrado
        '404':
