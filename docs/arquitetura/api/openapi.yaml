        endsAt: { type: string, format: date-time }
        position: { type: integer, minimum: 0, maximum: 999 }
        active: { type: boolean }
    OperationsReport:
      type: object
      required: [period, timezone, empty, kpis, variation, revenue, series, cancellations]
      properties:
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        timezone: { type: string }
        empty: { type: boolean }
        kpis:
          type: object
          required: [orders, gmv, gmvDelivered, deliveredOrders, averageTicket, newStores, newCustomers, repurchase, cancelledOrders, cancellationRatePct]
          properties:
            orders: { type: integer }
            gmv: { $ref: '#/components/schemas/Money' }
            gmvDelivered: { $ref: '#/components/schemas/Money' }
            deliveredOrders: { type: integer }
            averageTicket: { $ref: '#/components/schemas/Money' }
            newStores: { type: integer }
            newCustomers: { type: integer }
            repurchase:
              type: object
              required: [cohort, repurchased, ratePct]
              properties:
                cohort: { type: integer }
                repurchased: { type: integer }
                ratePct: { type: [number, 'null'] }
            cancelledOrders: { type: integer }
            cancellationRatePct: { type: number }
        variation:
          type: object
          description: "% contra o período anterior de mesma duração; nulo quando o anterior é zero"
          properties:
            ordersPct: { type: [number, 'null'] }
            gmvPct: { type: [number, 'null'] }
            gmvDeliveredPct: { type: [number, 'null'] }
            averageTicketPct: { type: [number, 'null'] }
            newStoresPct: { type: [number, 'null'] }
            newCustomersPct: { type: [number, 'null'] }
        revenue:
          type: object
          properties:
            orders:
              type: object
              description: "Snapshot dos pedidos não cancelados"
              properties:
                commission: { $ref: '#/components/schemas/Money' }
                serviceFee: { $ref: '#/components/schemas/Money' }
                deliveryFee: { $ref: '#/components/schemas/Money' }
                platformDiscount: { $ref: '#/components/schemas/Money' }
                applicationFee: { $ref: '#/components/schemas/Money' }
            ledger:
              type: object
              description: "Do ledger (vendas menos devoluções) para o mesmo filtro; precisa bater com `orders`"
              properties:
                commission: { $ref: '#/components/schemas/Money' }
                serviceFee: { $ref: '#/components/schemas/Money' }
                deliveryFee: { $ref: '#/components/schemas/Money' }
                platformPromoExpense: { $ref: '#/components/schemas/Money' }
        series:
          type: array
          items:
            type: object
            required: [date, orders, gmv]
            properties:
              date: { type: string, format: date }
              orders: { type: integer }
              gmv: { $ref: '#/components/schemas/Money' }
        cancellations:
          type: array
          items:
            type: object
            required: [actor, reason, orders, value]
            properties:
              actor: { type: string, enum: [customer, store, system, admin] }
              reason: { type: string }
              orders: { type: integer }
              value: { $ref: '#/components/schemas/Money' }
    ReportOrder:
      type: object
      required: [id, number, store, status, mode, total, commission, paidAt, deliveredAt, cancelledBy, cancelReason]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        store: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, 'null'] } } }
        status: { type: string }
        mode: { type: string, enum: [delivery, pickup] }
        total: { $ref: '#/components/schemas/Money' }
        commission: { $ref: '#/components/schemas/Money' }
        paidAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        cancelledBy: { type: [string, 'null'] }
        cancelReason: { type: [string, 'null'] }
    ReportOrderPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReportOrder' } }
        nextCursor: { type: [string, 'null'] }
    CardIntentRequest:
      type: object
      additionalProperties: false
      required: [mode, cartRevision, expectedTotalCents]
      properties:
        mode: { type: string, enum: [delivery, pickup] }
        addressId: { type: string, format: uuid }
        cartRevision: { type: integer, minimum: 0 }
        expectedTotalCents: { type: integer, minimum: 0 }
        payerDocument: { type: string, pattern: '^[0-9]{11}$' }
    CardIntent:
      type: object
      required: [token, url, expiresAt, amount]
      properties:
        token: { type: string }
        url: { type: string, format: uri, description: "Abrir no navegador do sistema" }
        expiresAt: { type: string, format: date-time }
        amount: { $ref: '#/components/schemas/Money' }
    CardIntentView:
      type: object
      required: [amount, provider, publicKey, installmentsMax, expiresAt]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        provider: { type: string, enum: [fake, mercadopago] }
        publicKey: { type: [string, 'null'] }
        installmentsMax: { type: integer, description: "Maior número de parcelas que o servidor aceita para ESTE total: `parcelas_max` limitado pela parcela mínima (`parcela_min_cents`). Mínimo 1 (só à vista)" }
        installmentMinCents: { type: integer, description: "Valor mínimo da parcela, em centavos (`parcela_min_cents`)" }
        expiresAt: { type: string, format: date-time }
    CardIntentPayRequest:
      type: object
      additionalProperties: false
      required: [card]
      properties:
        card:
          type: object
          additionalProperties: false
          required: [token, installments]
          properties:
            token: { type: string, minLength: 8, maxLength: 200 }
            installments: { type: integer, minimum: 1, maximum: 3 }
            paymentMethodId: { type: string }
            issuerId: { type: string }
    CardIntentResult:
      type: object
      required: [orderId, status, payment, threeDsUrl]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment: { $ref: '#/components/schemas/OrderPayment' }
        threeDsUrl: { type: [string, 'null'] }
    Help:
      type: object
      required: [audience, contacts, privacy, groups]
      properties:
        audience: { type: string, enum: [customer, merchant] }
        contacts:
          type: object
          required: [whatsapp, email, hours]
          properties:
            whatsapp: { type: [string, 'null'], description: "Só dígitos com DDD" }
            email: { type: [string, 'null'] }
            hours: { type: [string, 'null'] }
        privacy:
          type: object
          required: [officerName, officerEmail]
          description: 'Encarregado e, desde SEC-178/W.1, os prazos REAIS da exclusão de conta citados na página pública `/excluir-conta` (a página lê daqui; as variáveis `PUBLIC_DELETION_*` ficam só de reserva). Campos novos opcionais.'
          properties:
            officerName: { type: [string, 'null'] }
            officerEmail: { type: [string, 'null'] }
            deletionRegretHours: { type: integer, description: 'Horas para desistir antes de a exclusão ficar definitiva (`exclusao_arrependimento_horas`, limitado a `exclusao_anonimizacao_dias` x 24); 0 = imediata e sem volta.' }
            fiscalRetentionYears: { type: integer, description: 'Anos de guarda de pedidos e pagamentos sem identificação (`retencao_fiscal_anos`).' }
            accessLogMonths: { type: integer, description: 'Meses de guarda do registro de acesso (`retencao_log_acesso_meses`; piso do Marco Civil).' }
            privacyAnswerDays: { type: integer, description: 'Dias para o encarregado responder um pedido de titular (LGPD art. 19; constante `DSR_DEADLINE_DAYS`).' }
        groups:
          type: array
          items:
            type: object
            required: [id, label, items]
            properties:
              id: { type: string }
              label: { type: string }
              items:
                type: array
                items:
                  type: object
                  required: [id, question, answer]
                  properties:
                    id: { type: string, format: uuid }
                    question: { type: string }
                    answer: { type: string }
    HelpFaq:
      type: object
      required: [id, audience, group, question, answer, position, published, updatedAt]
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [customer, merchant] }
        group: { type: string }
        question: { type: string }
        answer: { type: string }
        position: { type: integer }
        published: { type: boolean }
        updatedAt: { type: string, format: date-time }
    HelpFaqList:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/HelpFaq' } }
        nextCursor: { type: 'null' }
    HelpFaqCreate:
      type: object
      additionalProperties: false
      required: [audience, group, question, answer]
      properties:
        audience: { type: string, enum: [customer, merchant] }
        group: { type: string }
        question: { type: string, minLength: 3, maxLength: 100 }
        answer: { type: string, minLength: 3, maxLength: 600 }
        published: { type: boolean }
    HelpContacts:
      type: object
      required: [supportWhatsapp, supportEmail, supportHours, privacyOfficerName, privacyOfficerEmail]
      properties:
        supportWhatsapp: { type: [string, 'null'] }
        supportEmail: { type: [string, 'null'] }
        supportHours: { type: [string, 'null'] }
        privacyOfficerName: { type: [string, 'null'] }
        privacyOfficerEmail: { type: [string, 'null'] }
    HelpContactsPatch:
      type: object
      additionalProperties: false
      properties:
        supportWhatsapp: { type: [string, 'null'] }
        supportEmail: { type: [string, 'null'] }
        supportHours: { type: [string, 'null'], maxLength: 60 }
        privacyOfficerName: { type: [string, 'null'], maxLength: 80 }
        privacyOfficerEmail: { type: [string, 'null'] }
    ContentReportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [review, product, store] }
        targetId: { type: string, format: uuid }
        reason: { type: string, enum: [offensive, 'false', prohibited, scam, other] }
        text: { type: string, maxLength: 200 }
    ContentReportQueue:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            type: object
            required: [targetType, targetId, reports, reasons, oldestAt, overdue, title, excerpt, available]
            properties:
              targetType: { type: string, enum: [review, product, store] }
              targetId: { type: string, format: uuid }
              reports: { type: integer }
              reasons: { type: array, items: { type: string } }
              oldestAt: { type: string, format: date-time }
              overdue: { type: boolean }
              title: { type: string }
              excerpt: { type: [string, 'null'] }
              available: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    ContentReportCase:
      type: object
      required: [targetType, targetId, title, excerpt, available, item, reports]
      properties:
        targetType: { type: string, enum: [review, product, store] }
        targetId: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: [string, 'null'] }
        available: { type: boolean }
        item: { type: object, additionalProperties: true, description: "Avaliação: nota, texto, autor abreviado, loja, resposta" }
        reports:
          type: array
          items:
            type: object
            required: [reason, text, reporter, status, reportedAt, handledAt, resolution]
            properties:
              reason: { type: string }
              text: { type: [string, 'null'] }
              reporter: { type: string, description: "Iniciais" }
              status: { type: string, enum: [open, kept, removed, forwarded] }
              reportedAt: { type: string, format: date-time }
              handledAt: { type: [string, 'null'], format: date-time }
              resolution: { type: [string, 'null'] }
    ContentReportOutcome:
      type: object
      required: [status, reports]
      properties:
        status: { type: string, enum: [kept, removed, forwarded] }
        reports: { type: integer }
        next: { type: object, additionalProperties: true, description: "Só em forward: para onde seguir (moderação de produto ou de loja)" }
    StoreReview:
      type: object
      required: [id, rating, comment, fit, reviewer, target, createdAt, storeReply, storeRepliedAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer }
        comment: { type: [string, 'null'] }
        fit: { type: [string, 'null'], enum: [small, ok, large, null] }
        reviewer: { type: string }
        target:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [product, store] }
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        storeReply: { type: [string, 'null'] }
        storeRepliedAt: { type: [string, 'null'], format: date-time }
    StoreReviewPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StoreReview' } }
        nextCursor: { type: [string, 'null'] }
    # ======================================================================================================================
    # v1.1 R1 (ADR-018). Dinheiro em centavos inteiros (`...Cents`), como no restante do catálogo.
    # ======================================================================================================================
    ProductVia:
      type: string
      enum: [camera, duplicate, paste, spreadsheet, form]
      description: 'Por onde o cadastro nasceu (WB-379): câmera, duplicar, colar texto, planilha ou formulário completo'
    ProductMissingField:
      type: string
      enum: [name, price, photo, category, stock, description]
      description: 'O que falta para publicar (`PRODUCT_INCOMPLETE`). `description` só quando a categoria tem `descriptionRequired`'
    ProductDraftSummary:
      type: object
      required: [id, name, basePriceCents, cover, missing, updatedAt, expiresAt, expiresInDays, version, via]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80, description: 'Vazio ("") enquanto o lojista não digitou' }
        basePriceCents: { type: [integer, 'null'] }
        cover: { type: [object, 'null'], additionalProperties: { type: string }, description: 'Largura em px para URL pública WebP; nulo sem foto' }
        missing: { type: array, items: { $ref: '#/components/schemas/ProductMissingField' } }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: '30 dias após a última alteração (RN-Q2)' }
        expiresInDays: { type: integer, minimum: 0, description: 'Dias inteiros até vencer; 3 ou menos mostra "Será apagado em N dias"' }
        version: { type: integer, minimum: 1 }
        via: { $ref: '#/components/schemas/ProductVia' }
    ProductDraftPage:
      type: object
      required: [data, nextCursor, count, limit]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProductDraftSummary' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer, minimum: 0, description: 'Total de rascunhos da loja (não só desta página)' }
        limit: { type: integer, example: 100 }
    CatalogQuickStart:
      type: object
      required: [suggestedCategoryId, draftCount, draftLimit, latestDraft, withoutDescriptionCount, limits]
      properties:
        suggestedCategoryId: { type: [string, 'null'], format: uuid, description: 'A última categoria usada na loja; sem histórico, a mais frequente; sem produtos, nulo' }
        draftCount: { type: integer, minimum: 0 }
        draftLimit: { type: integer, example: 100 }
        latestDraft: { oneOf: [{ $ref: '#/components/schemas/ProductDraftSummary' }, { type: 'null' }], description: 'Para "Continuar: Camiseta básica preta"' }
        withoutDescriptionCount: { type: integer, minimum: 0, description: 'Produtos ativos sem descrição ("X produtos sem descrição"; só lembrete, não bloqueia)' }
        limits:
          type: object
          required: [variantsMax, reajusteMaxPct]
          properties:
            variantsMax: { type: integer, example: 100 }
            reajusteMaxPct: { type: number, example: 30, description: 'Confirmação inline de preço e reajuste acima deste percentual (nos dois sentidos)' }
    QuickPublishRequest:
      type: object
      additionalProperties: false
      required: [name, basePriceCents, imageIds]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        basePriceCents: { type: integer, minimum: 1, maximum: 9999999 }
        categoryId: { type: [string, 'null'], format: uuid, description: 'Omitida: vale a do rascunho; sem categoria nenhuma, 422 `PRODUCT_INCOMPLETE`' }
        description: { type: [string, 'null'], maxLength: 1000, description: 'Obrigatória só nas categorias com `descriptionRequired` (422 `DESCRIPTION_REQUIRED`)' }
        stock: { type: integer, minimum: 0, maximum: 99999, default: 1, description: 'Estoque da variação padrão' }
        imageIds: { type: array, minItems: 1, maxItems: 8, items: { type: string, format: uuid }, description: 'Uploads `product_image` concluídos da mesma loja; o primeiro é a capa' }
    CreateProductDraftRequest:
      type: object
      additionalProperties: false
      required: [via]
      properties:
        via: { $ref: '#/components/schemas/ProductVia' }
        name: { type: string, maxLength: 80, description: 'Opcional; "" ou ausente = ainda sem nome' }
        categoryId: { type: [string, 'null'], format: uuid }
        basePriceCents: { type: [integer, 'null'], description: 'Centavos, de 1 a 9999999 (422 fora da faixa)' }
    DraftBatchVariant:
      type: object
      additionalProperties: false
      required: [attributes]
      properties:
        attributes: { type: object, additionalProperties: { type: string, maxLength: 40 }, example: { Tamanho: M } }
        stock: { type: integer, minimum: 0, maximum: 99999, default: 1 }
        priceCents: { type: [integer, 'null'], description: 'Preço próprio quando difere do produto (linhas juntadas com preços diferentes)' }
    DraftBatchItem:
      type: object
      additionalProperties: false
      required: [clientRef, name]
      properties:
        clientRef: { type: string, minLength: 1, maxLength: 40, description: 'Referência do app (ex.: número da linha) para casar a resposta; não é persistida' }
        name: { type: string, minLength: 1, maxLength: 80 }
        basePriceCents: { type: [integer, 'null'], description: 'Nulo = "Falta o preço" (vira rascunho mesmo assim)' }
        quantity: { type: integer, minimum: 0, maximum: 99999, default: 1, description: 'Estoque quando não há `variants`' }
        variantAttributes: { type: array, maxItems: 3, items: { type: string, maxLength: 30 }, description: 'Nomes dos atributos de `variants` (ex.: Tamanho)' }
        variants: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DraftBatchVariant' } }
        categoryId: { type: [string, 'null'], format: uuid }
    CreateProductDraftsBatchRequest:
      type: object
      additionalProperties: false
      required: [via, items]
      properties:
        via: { type: string, enum: [paste, spreadsheet] }
        items: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/DraftBatchItem' } }
    CreateProductDraftsBatchResult:
      type: object
      required: [created, rejected]
      properties:
        created:
          type: array
          items:
            type: object
            required: [clientRef, productId, missing]
            properties:
              clientRef: { type: string }
              productId: { type: string, format: uuid }
              missing: { type: array, items: { $ref: '#/components/schemas/ProductMissingField' }, description: 'Ex.: ["photo"] na etapa de fotos' }
        rejected:
          type: array
          items:
            type: object
            required: [clientRef, code, message]
            properties:
              clientRef: { type: string }
              code: { type: string, enum: [NAME_REQUIRED, NAME_TOO_LONG, PRICE_OUT_OF_RANGE, QUANTITY_OUT_OF_RANGE, VARIANTS_INVALID, CATEGORY_FORBIDDEN] }
              message: { type: string }
    CategoryTemplateAttribute:
      type: object
      additionalProperties: false
      required: [name, values]
      properties:
        name: { type: string, minLength: 1, maxLength: 30, example: Tamanho }
        values: { type: array, maxItems: 30, items: { type: string, maxLength: 40 }, example: [P, M, G, GG], description: 'SUGESTÕES: nenhum vem marcado (evita estoque falso)' }
    CategoryTemplate:
      type: object
      required: [categoryId, attributes, sizeChartHint, noVoluntaryExchangeHint, descriptionRequired, descriptionMinChars]
      properties:
        categoryId: { type: string, format: uuid }
        attributes: { type: array, items: { $ref: '#/components/schemas/CategoryTemplateAttribute' } }
        sizeChartHint: { type: boolean, description: 'Moda e calçado: lembrar a tabela de medidas (WB-246)' }
        noVoluntaryExchangeHint: { type: boolean, description: 'Íntimos e higiene: sugerir "Não aceita troca por tamanho ou cor" (WB-244); só sugestão' }
        descriptionRequired: { type: boolean, description: 'RN-Q1 / DEC-106: a descrição é obrigatória ao publicar, nas duas vias' }
        descriptionMinChars: { type: integer, example: 20 }
    CategoryTemplateList:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CategoryTemplate' } }
        nextCursor: { type: 'null' }
    SetCategoryTemplateRequest:
      type: object
      additionalProperties: false
      required: [attributes, sizeChartHint, noVoluntaryExchangeHint, descriptionRequired]
      properties:
        attributes: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/CategoryTemplateAttribute' } }
        sizeChartHint: { type: boolean }
        noVoluntaryExchangeHint: { type: boolean }
        descriptionRequired: { type: boolean }
        descriptionMinChars: { type: integer, minimum: 1, maximum: 200, default: 20 }
    ProductTableRow:
      type: object
      required: [id, name, status, moderationStatus, cover, basePriceCents, youReceiveCents, available, reserved, variantCount, singleVariantId, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused] }
        moderationStatus: { type: string, enum: [ok, review, paused, removed] }
        cover: { type: [object, 'null'], additionalProperties: { type: string } }
        basePriceCents: { type: [integer, 'null'] }
        youReceiveCents: { type: [integer, 'null'], description: '"Você recebe cerca de" (DEC-035) sobre o preço base. Nulo para membro sem `catalog` (a lista só mostra a comissão a quem gerencia o catálogo). Sempre nulo com `X-View-As` (VA-14)' }
        available: { type: integer, description: 'Soma de (estoque - reservado) das variações ativas' }
        reserved: { type: integer, description: 'Soma reservada em pedidos ("2 reservadas em pedidos")' }
        variantCount: { type: integer }
        singleVariantId: { type: [string, 'null'], format: uuid, description: 'Preenchido quando há UMA variação: o estoque se edita na linha (`adjustVariantStock`)' }
        version: { type: integer, minimum: 1, description: 'Para `If-Match` na edição em linha' }
        updatedAt: { type: string, format: date-time }
    ProductTablePage:
      type: object
      required: [data, nextCursor, matchingCount]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProductTableRow' } }
        nextCursor: { type: [string, 'null'] }
        matchingCount: { type: integer, minimum: 0, description: 'Contagem exata do filtro (botão "Selecionar os 12 da busca")' }
    BulkPreviewItem:
      type: object
      required: [productId, name, version, fromCents, toCents, changePct, youReceiveCents, exceedsLimit]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1, description: 'Versão do produto na prévia; volta em `expectedVersions` ao aplicar' }
        fromCents: { type: integer }
        toCents: { type: integer }
        changePct: { type: number, description: 'Positivo ou negativo, 1 casa' }
        youReceiveCents: { type: [integer, 'null'], description: '"Você recebe" do preço novo' }
        exceedsLimit: { type: boolean, description: 'Acima de `reajuste_max_pct` (pede a caixa "Conferi os valores novos")' }
    BulkBatch:
      type: object
      required: [id, kind, itemsCount, source, actorName, at, undoUntil, undone]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [price_adjust, pause, resume, move_section] }
        itemsCount: { type: integer }
        source: { type: string, enum: [merchant, admin] }
        actorName: { type: string, description: 'Nome do membro da loja; "Webag" quando `source: admin` (nunca o nome da pessoa)' }
        at: { type: string, format: date-time }
        undoUntil: { type: [string, 'null'], format: date-time, description: 'Só reajuste de preço; 10 min depois de `at`' }
        undone: { type: boolean }
    BulkBatchPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BulkBatch' } }
        nextCursor: { type: [string, 'null'] }
    BulkUndoResult:
      type: object
      required: [batchId, reverted, skipped, alreadyUndone]
      properties:
        batchId: { type: string, format: uuid }
        alreadyUndone: { type: boolean, description: 'Verdadeiro quando o lote já tinha sido desfeito: a repetição (resposta perdida em 3G) devolve o mesmo resultado, sem erro' }
        reverted: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [productId, name, reason]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              reason: { type: string, enum: [CHANGED_AFTER], description: 'Editado depois do reajuste: não é sobrescrito' }
    StoreAdminChange:
      type: object
      required: [id, at, type, summary, target, reasonLabel, before, after, actor]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/StoreHistoryType' }
        summary: { type: string, example: 'A Webag alterou o preço de Camiseta básica preta de R$ 50,00 para R$ 45,00' }
        target: { type: [string, 'null'], description: 'Nome do produto ou da área (horário, pausa); sem dado de cliente' }
        reasonLabel: { type: string, example: 'Solicitado pelo lojista (WhatsApp, 24/11)' }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        actor: { type: string, enum: [Webag] }
    StoreAdminChangePage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StoreAdminChange' } }
        nextCursor: { type: [string, 'null'] }
    ProductCreationMetrics:
      type: object
      required: [days, groupBy, minSample, computedAt, rows, nextCursor]
      properties:
        days: { type: integer }
        groupBy: { type: string, enum: [via, store] }
        minSample: { type: integer, example: 5 }
        computedAt: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            required: [key, label, n, interrupted, insufficient, medianSeconds, p90Seconds]
            properties:
              key: { type: string, description: 'Valor de `via` ou id da loja' }
              label: { type: string }
              n: { type: integer, description: 'Cadastros contínuos publicados no período' }
              interrupted: { type: integer, description: 'Publicados depois do limite de sessão contínua; fora da mediana' }
              insufficient: { type: boolean, description: 'n < minSample' }
              medianSeconds: { type: [integer, 'null'] }
              p90Seconds: { type: [integer, 'null'] }
        nextCursor: { type: [string, 'null'] }
    # ---- Admin de lojas
    AdminReasonCode:
      type: string
      enum: [requested_by_merchant, error_fix, moderation, operational_decision, other, obvious_price_error, legal_or_inspection_order, agreed_campaign]
      description: |
        Catálogo de motivos (PRD admin, WB-351 C7). Edição geral: `requested_by_merchant` ("Solicitado pelo lojista"), `error_fix` ("Correção de erro"), `moderation`, `operational_decision`, `other`.
        **Preço** só aceita `requested_by_merchant`, `obvious_price_error` ("Erro evidente"), `legal_or_inspection_order` ("Ordem de fiscalização ou do jurídico") e `agreed_campaign` ("Campanha acordada").
    AdminReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/AdminReasonCode' }
        note: { type: string, maxLength: 200, description: 'Obrigatório com `requested_by_merchant` (canal e data, ex.: "WhatsApp, 24/11") e com `other`. Texto puro' }
    AdminEditResult:
      type: object
      required: [product, auditEntryIds, merchantNotified]
      properties:
        product: { $ref: '#/components/schemas/Product' }
        auditEntryIds: { type: array, items: { type: integer }, description: 'Linhas gravadas no `audit_log` (o "Desfazer" do toast usa a 1ª em `restoreAdminStoreHistoryEntry`)' }
        merchantNotified: { type: string, enum: [now, digest, aggregate], description: '`now` (pausa, status, horário), `digest` (resumo de 10 min) ou `aggregate` (ação em massa)' }
    AdminStoreEditResult:
      type: object
      required: [storeVersion, auditEntryId, merchantNotified]
      properties:
        storeVersion: { type: integer, minimum: 1, description: 'Nova versão da loja' }
        auditEntryId: { type: integer }
        merchantNotified: { type: string, enum: [now, digest, aggregate] }
    StoreHistoryType:
      type: string
      enum: [price, stock, catalog, hours, holidays, delivery, pickup, exchange_policy, pause, status, profile, commission, access, bulk, restore, other]
      description: '`access` = abertura e encerramento de "Ver como o lojista". Filtros da tela: Tudo, Preço, Estoque, Horário, Acesso'
    AdminStoreHistoryEntry:
      type: object
      required: [id, at, type, target, actor, summary, before, after, reason, restorable, restoredByEntryId]
      properties:
        id: { type: integer, description: 'Id da linha do `audit_log` (append-only)' }
        at: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/StoreHistoryType' }
        target:
          type: object
          required: [type, id, label]
          properties:
            type: { type: string, enum: [store, product, variant, config] }
            id: { type: [string, 'null'], format: uuid }
            label: { type: [string, 'null'], description: 'Nome do produto ou da seção; sem dado de cliente' }
        actor:
          type: object
          required: [kind, name]
          properties:
            kind: { type: string, enum: [admin, merchant, system] }
            name: { type: [string, 'null'], description: 'Nome do admin ou do membro (o lojista só vê "Webag" em `listStoreAdminChanges`)' }
        summary: { type: string }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        reason: { oneOf: [{ $ref: '#/components/schemas/AdminReason' }, { type: 'null' }] }
        restorable: { type: boolean, description: 'Preço e estoque com valor anterior conhecido e ainda não restaurados' }
        restoredByEntryId: { type: [integer, 'null'] }
    AdminStoreHistoryPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminStoreHistoryEntry' } }
        nextCursor: { type: [string, 'null'] }
    RestoreHistoryEntryRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        confirmOverride: { type: boolean, default: false, description: 'Restaurar mesmo com o valor atual diferente do que a linha deixou (C2)' }
        confirmLargeChange: { type: boolean, default: false }
    AdminStoreOverview:
      type: object
      required: [store, operation, commission, indicators, recentOrders]
      properties:
        store:
          type: object
          required: [id, name, status, city, ownerName, version, live, phone, whatsapp, description]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, 'null'] }
            status: { type: string, enum: [draft, in_review, correction_requested, approved, rejected, suspended, closed] }
            city: { type: [string, 'null'] }
            ownerName: { type: [string, 'null'] }
            version: { type: integer, minimum: 1, description: 'Valor de `expectedVersion` das edições da loja' }
            live: { type: boolean }
            phone: { type: [string, 'null'] }
            whatsapp: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
        operation:
          type: object
          required: [openNow, closesAt, pause]
          properties:
            openNow: { type: boolean }
            closesAt: { type: [string, 'null'], format: date-time }
            pause:
              oneOf:
                - type: object
                  required: [until, by, reasonLabel]
                  properties:
                    until: { type: [string, 'null'], format: date-time, description: 'Nulo = até reabrir' }
                    by: { type: string, enum: [merchant, admin] }
                    reasonLabel: { type: [string, 'null'] }
                - type: 'null'
        commission:
          type: object
          required: [pct, source, sourceLabel]
          properties:
            pct: { type: number }
            source: { type: string, enum: [store, category, default] }
            sourceLabel: { type: string, example: 'Categoria Calçados' }
        indicators:
          type: object
          required: [empty, activeProducts, orders, gmv, cancellations]
          properties:
            empty: { type: boolean, description: 'Sem pedidos nos últimos 30 dias' }
            activeProducts: { type: integer }
            orders: { type: integer }
            gmv: { $ref: '#/components/schemas/Money' }
            cancellations:
              type: object
              required: [count, pct]
              properties:
                count: { type: integer }
                pct: { type: [number, 'null'], description: 'Nulo com menos de 20 pedidos (DEC-108: poucos dados)' }
        recentOrders:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, status, total, createdAt]
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
              total: { $ref: '#/components/schemas/Money' }
              createdAt: { type: string, format: date-time }
    AdminStoreProfileChanges:
      type: object
      additionalProperties: false
      description: 'Lista FECHADA de campos editáveis pelo admin (C-ADM-03). Qualquer outro campo é recusado'
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        phone: { type: string }
        whatsapp: { type: string }
    AdminStoreProfileEditRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, changes]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        changes: { $ref: '#/components/schemas/AdminStoreProfileChanges' }
    AdminStoreConfigEditRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, data]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        data:
          oneOf:
            - { $ref: '#/components/schemas/HoursRequest' }
            - { $ref: '#/components/schemas/HolidaysRequest' }
            - { $ref: '#/components/schemas/DeliveryRequest' }
            - { $ref: '#/components/schemas/PickupRequest' }
            - { $ref: '#/components/schemas/ExchangePolicyRequest' }
    AdminPauseStoreRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, kind]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        kind: { type: string, enum: [30m, 1h, 2h, end_of_day, until_resume] }
    AdminResumeStoreRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
    ViewAsReasonCode:
      type: string
      enum: [merchant_support, investigate_issue, check_registration, other]
      description: 'Suporte ao lojista por telefone, investigar um problema, conferir o cadastro, outro (com `note`)'
    OpenViewAsRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { $ref: '#/components/schemas/ViewAsReasonCode' }
            note: { type: string, maxLength: 200 }
    ViewAsSession:
      type: object
      required: [id, token, storeId, storeName, expiresAt, reason]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, pattern: '^vas_[A-Za-z0-9_-]{43}$', description: 'Credencial `vas_` mostrada UMA vez; vai no cabeçalho `X-View-As`, somada ao Bearer do admin, nas rotas `x-view-as`. Não vai em `Authorization`, URL nem corpo, e não é logada' }
        storeId: { type: string, format: uuid }
        storeName: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time, description: 'No máximo 30 min, ou o fim da sessão do admin, o que vier antes' }
        reason: { type: object, required: [code], properties: { code: { $ref: '#/components/schemas/ViewAsReasonCode' }, note: { type: string } } }
    StoreViewAs:
      type: object
      description: "Resposta de `getStore` com `X-View-As` (apresentador `view_as`, threat model §14.3): sem CPF/CNPJ, razão social, comissão, tarifa, conta de recebimento, `settings` embutido nem papel. Lista fechada: campo novo só entra com parecer do Security. A rota devolve este corpo, e não `Store`, quando o cabeçalho está presente"
      additionalProperties: false
      required: ["id", "status", "pendingReview", "reviewItems", "extraCategoryIds", "createdAt"]
      properties:
        id: {"type": "string", "format": "uuid"}
        version: {"type": "integer", "minimum": 1, "description": "v1.1 R1: versão da loja, sobe a cada alteração de dados, horário, pausa ou status. Base do `expectedVersion` das edições do admin (WB-351 C6). Campo novo, opcional para o app antigo"}
        live: {"type": "boolean", "description": "Z.1 / DEC-072f: loja \"no ar\" = `status` approved + 1 ou mais produtos ativos (não removidos nem pausados) + conta de recebimento ativa. O painel do dia do lojista (vendas, ranking, avaliação) usa este campo em vez de deduzir. Campo novo, opcional para o app antigo"}
        status: {"type": "string", "enum": ["draft", "in_review", "correction_requested", "approved", "rejected", "suspended", "closed"]}
        name: {"type": ["string", "null"]}
        description: {"type": ["string", "null"]}
        phone: {"type": ["string", "null"]}
        whatsapp: {"type": ["string", "null"]}
        mainCategoryId: {"type": ["string", "null"], "format": "uuid"}
        extraCategoryIds: {"type": "array", "items": {"type": "string", "format": "uuid"}}
        logo: {"type": ["object", "null"], "additionalProperties": {"type": "string"}}
        cover: {"type": ["object", "null"], "additionalProperties": {"type": "string"}}
        pendingReview: {"type": "boolean"}
        reviewItems: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["item", "reason"], "properties": {"item": {"type": "string"}, "reason": {"type": "string"}}}}
        submittedAt: {"type": ["string", "null"], "format": "date-time"}
        decisionReason: {"type": ["string", "null"]}
        createdAt: {"type": "string", "format": "date-time"}
        address: {"oneOf": [{"type": "object", "additionalProperties": false, "description": "Só o que a vitrine pública mostra: bairro, cidade e UF; sem rua, número, CEP nem coordenadas", "required": ["neighborhood", "city", "state"], "properties": {"neighborhood": {"type": ["string", "null"]}, "city": {"type": ["string", "null"]}, "state": {"type": ["string", "null"]}}}, {"type": "null"}]}
    StoreSettingsViewAs:
      type: object
      description: "Resposta de `getStoreSettings` com `X-View-As`: horários, pausa, entrega, retirada, política de troca e limiar de estoque; sem `notifications` nem qualquer destino de contato (e-mail ou telefone)"
      additionalProperties: false
      required: ["isOpenNow", "hours", "holidays", "pause", "delivery", "pickup", "exchangePolicy", "lowStockThreshold"]
      properties:
        isOpenNow: {"type": "boolean"}
        hours: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["weekday", "intervals"], "properties": {"weekday": {"type": "integer"}, "intervals": {"type": "array", "items": {"$ref": "#/components/schemas/Interval"}}}}}
        holidays: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["date"], "properties": {"date": {"type": "string"}, "label": {"type": ["string", "null"]}}}}
        pause: {"type": "object", "additionalProperties": false, "required": ["active", "until", "indefinitely"], "properties": {"active": {"type": "boolean"}, "until": {"type": ["string", "null"], "format": "date-time"}, "indefinitely": {"type": "boolean"}}}
        delivery: {"type": "object", "additionalProperties": false, "required": ["acceptsDelivery", "radiusKm", "feeMode", "feeFixedCents", "tiers", "minOrderCents", "freeAboveCents", "etaMinMinutes", "etaMaxMinutes"], "description": "Campos de taxa, raio, mínimo e entrega grátis são SOMENTE LEITURA e globais do admin (DEC-036); `feeManagedBy` = webag.", "properties": {"prepMinutes": {"type": "integer", "description": "DEC-053: preparo em uso (o da loja ou o padrão do admin)"}, "prepMinutesIsDefault": {"type": "boolean"}, "acceptsDelivery": {"type": "boolean"}, "feeManagedBy": {"type": "string", "enum": ["webag"]}, "radiusKm": {"type": "number"}, "feeMode": {"type": "string"}, "feeFixedCents": {"type": "integer"}, "tiers": {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["fromKm", "toKm", "feeCents"], "properties": {"fromKm": {"type": "number"}, "toKm": {"type": "number"}, "feeCents": {"type": "integer"}}}}, "minOrderCents": {"type": "integer"}, "freeAboveCents": {"type": "integer"}, "etaMinMinutes": {"type": "integer"}, "etaMaxMinutes": {"type": "integer"}}}
        pickup: {"type": "object", "additionalProperties": false, "required": ["enabled", "useStoreAddress", "prepMinMinutes", "prepMaxMinutes"], "properties": {"enabled": {"type": "boolean"}, "useStoreAddress": {"type": "boolean"}, "address": {"type": ["string", "null"]}, "instructions": {"type": ["string", "null"]}, "prepMinMinutes": {"type": "integer"}, "prepMaxMinutes": {"type": "integer"}}}
        exchangePolicy: {"type": "object", "additionalProperties": false, "required": ["voluntaryDays", "collectionFeeCents", "version", "legalFloor"], "properties": {"voluntaryDays": {"type": "integer"}, "collectionFeeCents": {"type": "integer"}, "version": {"type": "integer"}, "defaultVoluntaryDays": {"type": "integer", "description": "BUG-017: `troca_voluntaria_dias_padrao`; o painel propõe este prazo ao religar a troca voluntária e a loja confirma (WB-059 C2)."}, "legalFloor": {"type": "object", "additionalProperties": false, "required": ["withdrawalDays", "defectDays"], "properties": {"withdrawalDays": {"type": "integer"}, "defectDays": {"type": "integer"}, "defectDurableDays": {"type": "integer", "description": "BUG-017: `troca_defeito_duravel_dias` (piso legal fixo de 90 dias para produto durável)."}}}}}
        lowStockThreshold: {"type": "integer"}
    StoreOrderViewAs:
      type: object
      description: "Resposta de `getStoreOrder` com `X-View-As` (SEC-207): só primeiro nome e bairro, também em pedido ativo; sem sobrenome, telefone, e-mail, CPF, rua, número, complemento, CEP, coordenadas, observação do cliente, código de entrega, `cancelRequest`, comissão nem líquido. Em `listStoreOrders` a única diferença é `allowedActions` vazio (o resumo já só traz o primeiro nome)"
      additionalProperties: false
      required: ["id", "number", "status", "mode", "createdAt", "paidAt", "acceptedAt", "acceptDeadlineAt", "customer", "items", "delivery", "pickup", "values", "couponCode", "timeline", "cancellation", "allowedActions"]
      properties:
        id: {"type": "string", "format": "uuid"}
        number: {"type": "string"}
        status: {"$ref": "#/components/schemas/OrderStatus"}
        mode: {"type": "string", "enum": ["delivery", "pickup"]}
        createdAt: {"type": "string", "format": "date-time"}
        paidAt: {"type": ["string", "null"], "format": "date-time"}
        acceptedAt: {"type": ["string", "null"], "format": "date-time"}
        acceptDeadlineAt: {"type": ["string", "null"], "format": "date-time"}
        readyByAt: {"type": ["string", "null"], "format": "date-time", "description": "W.8 / DEC-064 (c): \"Marque pronto até HH:MM\" = pagamento aprovado + preparo da loja (o preparo gravado no pedido; na retirada, o fim da janela de preparo informada ao cliente `[HIPÓTESE]`). Só em `received`, `accepted` e `in_preparation`; nulo depois do \"pronto\", sem pagamento ou em pedido anterior à DEC-053. Campo novo opcional."}
        customer: {"type": "object", "additionalProperties": false, "required": ["firstName"], "description": "Só o primeiro nome, mesmo em pedido ativo (SEC-207)", "properties": {"firstName": {"type": "string"}}}
        items: {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["name", "attributes", "image", "quantity", "unitPrice", "lineTotal"], "properties": {"name": {"type": "string"}, "attributes": {"type": "object", "additionalProperties": {"type": "string"}}, "image": {"$ref": "#/components/schemas/ImageUrls"}, "quantity": {"type": "integer"}, "unitPrice": {"oneOf": [{"$ref": "#/components/schemas/Money"}, {"type": "null"}]}, "lineTotal": {"oneOf": [{"$ref": "#/components/schemas/Money"}, {"type": "null"}]}}}}
        delivery: {"oneOf": [{"type": "null"}, {"type": "object", "additionalProperties": false, "required": ["neighborhood", "etaMinMinutes", "etaMaxMinutes"], "properties": {"neighborhood": {"type": ["string", "null"]}, "etaMinMinutes": {"type": "integer"}, "etaMaxMinutes": {"type": "integer"}, "eta": {"oneOf": [{"$ref": "#/components/schemas/EtaRange"}, {"type": "null"}], "description": "DEC-053: faixa gravada no pedido; a espera do PIX não conta (reancora no pagamento) e só fica mais cedo com o motoboy a caminho. Nulo em pedido anterior à regra."}}}], "description": "Só o bairro; sem rua, número, complemento, CEP, coordenadas nem observação"}
        pickup: {"oneOf": [{"type": "null"}, {"type": "object", "additionalProperties": false, "required": ["prepMinMinutes", "prepMaxMinutes"], "properties": {"prepMinMinutes": {"type": "integer"}, "prepMaxMinutes": {"type": "integer"}}}]}
        values: {"oneOf": [{"type": "null"}, {"type": "object", "additionalProperties": false, "description": "Sem comissão nem líquido (\"você recebe\")", "required": ["subtotal", "delivery", "storeDiscount", "total"], "properties": {"subtotal": {"$ref": "#/components/schemas/Money"}, "delivery": {"$ref": "#/components/schemas/Money"}, "storeDiscount": {"$ref": "#/components/schemas/Money"}, "total": {"$ref": "#/components/schemas/Money"}}}]}
        couponCode: {"type": ["string", "null"]}
        timeline: {"type": "array", "description": "SEC-209: SEM `reason` (o motivo do cancelamento é texto livre do cliente, `order_events.reason`); só estado, hora e ator", "items": {"type": "object", "additionalProperties": false, "required": ["status", "at", "actor"], "properties": {"status": {"$ref": "#/components/schemas/OrderStatus"}, "at": {"type": "string", "format": "date-time"}, "actor": {"type": "string", "enum": ["customer", "store", "system", "admin"]}}}}
        cancellation: {"oneOf": [{"type": "null"}, {"type": "object", "additionalProperties": false, "required": ["by", "at"], "description": "Sem o texto do motivo (pode ser digitado pelo cliente)", "properties": {"by": {"type": "string", "enum": ["customer", "store", "system", "admin"]}, "at": {"type": "string", "format": "date-time"}}}]}
        logistics: {"description": "Estado da corrida e o primeiro nome do motoboy (sem telefone). Nulo na retirada ou antes do pronto.", "oneOf": [{"type": "null"}, {"type": "object", "additionalProperties": false, "properties": {"status": {"$ref": "#/components/schemas/DeliveryStatus"}, "courierFirstName": {"type": ["string", "null"]}, "volumes": {"type": "integer"}}}]}
        allowedActions: {"type": "array", "maxItems": 0, "items": {"$ref": "#/components/schemas/StoreOrderAction"}, "description": "Sempre vazio: o visualizador não age"}
    ExchangeViewAs:
      type: object
      description: "Resposta de `getStoreExchange` com `X-View-As`: motivo (código), status, prazos e itens; sem texto livre nem fotos do cliente, sem dados de reembolso, sem a justificativa digitada"
      additionalProperties: false
      required: ["id", "number", "orderId", "orderNumber", "status", "type", "method", "resolution", "quantity", "fee", "difference", "totalDue", "answerDeadlineAt", "windowEndsAt", "createdAt", "updatedAt"]
      properties:
        id: {"type": "string", "format": "uuid"}
        number: {"type": "string", "description": "Protocolo (TR-XXXXX)."}
        orderId: {"type": "string", "format": "uuid"}
        storeId: {"type": "string", "format": "uuid"}
        orderNumber: {"type": "string"}
        status: {"$ref": "#/components/schemas/ExchangeStatus"}
        type: {"$ref": "#/components/schemas/ExchangeType"}
        reasonCode: {"type": ["string", "null"], "enum": ["size", "color", null]}
        method: {"type": "string", "enum": ["pickup_at_home", "drop_at_store"]}
        resolution: {"type": "string", "enum": ["replace", "refund"]}
        quantity: {"type": "integer"}
        item: {"type": ["object", "null"], "additionalProperties": false, "properties": {"orderItemId": {"type": "string", "format": "uuid"}, "name": {"type": "string"}, "attributes": {"type": "object", "additionalProperties": {"type": "string"}}, "image": {"$ref": "#/components/schemas/ImageUrls"}, "unitPrice": {"$ref": "#/components/schemas/Money"}}}
        newVariant: {"type": ["object", "null"], "additionalProperties": false, "properties": {"variantId": {"type": "string", "format": "uuid"}, "attributes": {"type": "object", "additionalProperties": {"type": "string"}}}}
        fee: {"$ref": "#/components/schemas/Money"}
        difference: {"$ref": "#/components/schemas/Money"}
        totalDue: {"$ref": "#/components/schemas/Money"}
        feeDueAt: {"type": ["string", "null"], "format": "date-time"}
        feePaid: {"type": "boolean"}
        answerDeadlineAt: {"type": "string", "format": "date-time"}
        windowEndsAt: {"type": "string", "format": "date-time"}
        itemDueAt: {"type": ["string", "null"], "format": "date-time"}
        autoApproved: {"type": "boolean"}
        decidedBy: {"type": ["string", "null"], "enum": ["customer", "store", "system", "admin", null]}
        contestableUntil: {"type": ["string", "null"], "format": "date-time", "description": "Até quando o cliente pode contestar a recusa da loja (WB-176); nulo quando não cabe."}
        contested: {"type": "boolean"}
        timeline: {"type": "array", "description": "SEC-209: SEM `reason` (no evento `requested` é a descrição digitada pelo cliente, `exchanges.service`); só transição, ator e hora", "items": {"type": "object", "additionalProperties": false, "properties": {"from": {"type": ["string", "null"]}, "to": {"type": "string"}, "actor": {"type": "string"}, "at": {"type": "string", "format": "date-time"}}}}
        runs: {"type": "array", "items": {"type": "object", "additionalProperties": false, "properties": {"id": {"type": "string", "format": "uuid"}, "kind": {"type": "string", "enum": ["exchange_pickup", "exchange_return"]}, "status": {"type": "string"}}}}
        createdAt: {"type": "string", "format": "date-time"}
        updatedAt: {"type": "string", "format": "date-time"}
    ExchangePageViewAs:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ExchangeViewAs' } }
        nextCursor: { type: [string, 'null'] }
    AdminCreateProductDraftRequest:
      type: object
      additionalProperties: false
      required: [reason, data]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        data: { $ref: '#/components/schemas/CreateProductDraftRequest' }
    AdminProductEditRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, changes]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        confirmLargeChange: { type: boolean, default: false, description: 'Confirma variação de preço acima de `admin_preco_variacao_max_pct` depois de ver o novo "Você recebe"' }
        changes: { $ref: '#/components/schemas/UpdateProductRequest' }
    AdminSetVariantsRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, data]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        confirmLargeChange: { type: boolean, default: false }
        data: { $ref: '#/components/schemas/SetVariantsRequest' }
    AdminStockAdjustRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, data]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        data: { $ref: '#/components/schemas/StockAdjustBody' }
    AdminSetImagesRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, data]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        data: { $ref: '#/components/schemas/SetImagesRequest' }
    AdminProductStatusRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion, status]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        expectedVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, paused] }
    AdminBulkProductsRequest:
      type: object
      additionalProperties: false
      required: [reason, productIds, action]
      properties:
        reason: { $ref: '#/components/schemas/AdminReason' }
        productIds: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
        dryRun: { type: boolean, default: false }
        expectedVersions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ExpectedVersion' }
          description: 'B2: `version` de cada item, como veio em `preview[].version`. Obrigatória no servidor sem `dryRun` (cobre todos os `productIds`)'
        action:
          oneOf:
            - { type: object, additionalProperties: false, required: [type], properties: { type: { const: pause } } }
            - { type: object, additionalProperties: false, required: [type], properties: { type: { const: resume } } }
            - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: stock_set }, value: { type: integer, minimum: 0, maximum: 99999 } } }
            - { type: object, additionalProperties: false, required: [type, value], properties: { type: { const: stock_adjust }, value: { type: integer, minimum: -99999, maximum: 99999 } } }
    AdminBulkPreviewItem:
      type: object
      required: [productId, name, version]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1 }
    AdminBulkResult:
      type: object
      required: [dryRun, willChange, changed, auditEntries, blocked, batchId, merchantNotified]
      properties:
        dryRun: { type: boolean }
        willChange: { type: integer }
        changed: { type: integer }
        auditEntries: { type: integer, description: 'Uma por item alterado (C-ADM-07)' }
        batchId: { type: [string, 'null'], format: uuid }
        merchantNotified: { type: string, enum: [aggregate], description: 'Um único aviso agregado com o motivo' }
        preview:
          type: array
          items: { $ref: '#/components/schemas/AdminBulkPreviewItem' }
          description: 'B2: só em `dryRun`; traz a `version` de cada item para `expectedVersions`'
        blocked:
          type: array
          items:
            type: object
            required: [productId, name, reason]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              reason: { type: string, enum: [STOCK_BELOW_RESERVED, PRODUCT_MODERATED, NOT_ACTIVE] }
    ProductVersionConflictProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            current:
              description: 'Presente só quando `code` = `PRODUCT_VERSION_CONFLICT`'
              type: object
              required: [version, updatedAt]
              properties:
                version: { type: integer }
                updatedAt: { type: string, format: date-time }
                basePriceCents: { type: [integer, 'null'] }
    DraftLimitProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          description: 'Extensão do 422 `DRAFT_LIMIT_REACHED` (DEC-118): o que a tela precisa para oferecer "criar os N que cabem"'
          properties:
            limit: { type: integer, example: 100, description: 'Parâmetro `rascunhos_max_por_loja`' }
            draftCount: { type: integer, minimum: 0 }
            slotsAvailable: { type: integer, minimum: 0, description: 'Vagas que restam (limit - draftCount, nunca negativo)' }
    PriceChangeConfirmationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          description: 'Extensão do 422 `PRICE_CHANGE_NEEDS_CONFIRMATION` e do 422 `BULK_NEEDS_CONFIRMATION`: o que o diálogo mostra antes de confirmar'
          properties:
            fromCents: { type: integer }
            toCents: { type: integer }
            changePct: { type: number }
            youReceiveCents: { type: [integer, 'null'] }
    # ---- Coleta de eventos (staging)
    AnalyticsOrigin:
      type: string
      enum: [banner, home, search, category, favorites, external_link, push]
      description: 'De onde veio o toque (RN-A6). `?o=<canal>` do link da loja cai em `external_link` genérico (WB-368 cortada)'
    AppSessionStartedEvent:
      type: object
      additionalProperties: false
      required: [name, eventId, sessionId, occurredAt, platform, appVersion, cityId]
      properties:
        name: { const: app_session_started }
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        platform: { type: string, enum: [ios, android] }
        appVersion: { type: string, pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$' }
        cityId: { type: [string, 'null'], format: uuid }
    StoreViewedEvent:
      type: object
      additionalProperties: false
      required: [name, eventId, sessionId, occurredAt, storeId, origin]
      properties:
        name: { const: store_viewed }
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        storeId: { type: string, format: uuid }
        origin: { $ref: '#/components/schemas/AnalyticsOrigin' }
    ProductViewedEvent:
      type: object
      additionalProperties: false
      required: [name, eventId, sessionId, occurredAt, storeId, productId, origin]
      properties:
        name: { const: product_viewed }
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        storeId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        origin: { $ref: '#/components/schemas/AnalyticsOrigin' }
    ItemAddedEvent:
      type: object
      additionalProperties: false
      required: [name, eventId, sessionId, occurredAt, storeId, productId]
      properties:
        name: { const: item_added }
        eventId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        storeId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
    AnalyticsEvent:
      oneOf:
        - { $ref: '#/components/schemas/AppSessionStartedEvent' }
        - { $ref: '#/components/schemas/StoreViewedEvent' }
        - { $ref: '#/components/schemas/ProductViewedEvent' }
        - { $ref: '#/components/schemas/ItemAddedEvent' }
      discriminator:
        propertyName: name
        mapping:
          app_session_started: '#/components/schemas/AppSessionStartedEvent'
          store_viewed: '#/components/schemas/StoreViewedEvent'
          product_viewed: '#/components/schemas/ProductViewedEvent'
          item_added: '#/components/schemas/ItemAddedEvent'
    AnalyticsEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AnalyticsEvent' } }
    AnalyticsIngestResult:
      type: object
      required: [accepted, duplicates, discarded]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        discarded: { type: integer, description: 'Loja ou produto inexistente ou coleta desligada (`unknown_store`, `flag_off`). Limite de taxa NÃO descarta: responde 429' }
    AnalyticsCell:
      type: object
      required: [suppressed]
      description: 'Célula com menos de 5 sessões: `suppressed: true` e NENHUM `n` (nem valor). Com 5 ou mais: `n` presente'
      properties:
        suppressed: { type: boolean }
        n: { type: integer, minimum: 5 }
    AnalyticsAccessRow:
      type: object
      required: [key, label, isOther, visits, productOpens, bagAdds]
      properties:
        key: { type: [string, 'null'], description: 'Id da loja, do produto ou da origem; nulo na linha "Outras"' }
        label: { type: string, description: 'Nome, origem ou "Outras" / "Menos de 5"' }
        isOther: { type: boolean }
        visits: { $ref: '#/components/schemas/AnalyticsCell' }
        productOpens: { $ref: '#/components/schemas/AnalyticsCell' }
        bagAdds: { $ref: '#/components/schemas/AnalyticsCell' }
    AnalyticsAccessReport:
      type: object
      required: [period, groupBy, generatedAt, cached, approximateTotals, totals, rows, nextCursor]
      properties:
        period: { type: object, required: [from, to], properties: { from: { type: string, format: date }, to: { type: string, format: date, description: 'Ontem (America/Sao_Paulo)' } } }
        groupBy: { type: string, enum: [store, product, origin] }
        generatedAt: { type: string, format: date-time, description: '`atualizado_em`' }
        cached: { type: boolean, description: '`em_cache`' }
        approximateTotals: { type: boolean, description: 'Verdadeiro quando houve supressão: os totais vêm arredondados a múltiplo de 5 ("cerca de")' }
        totals:
          type: object
          required: [visits, productOpens, bagAdds]
          properties:
            visits: { type: integer }
            productOpens: { type: integer }
            bagAdds: { type: integer }
        rows: { type: array, items: { $ref: '#/components/schemas/AnalyticsAccessRow' } }
        nextCursor: { type: [string, 'null'] }
        discards:
          type: object
          description: 'Contadores operacionais do período, por motivo (tech-lead I6): o que o servidor recusou ou descartou. Não têm loja, produto nem sessão; servem para ver se o limite por IP em CGNAT está perdendo evento'
          required: [rate_ip, rate_session, unknown_store, flag_off]
          properties:
            rate_ip: { type: integer, minimum: 0 }
            rate_session: { type: integer, minimum: 0 }
            unknown_store: { type: integer, minimum: 0 }
            flag_off: { type: integer, minimum: 0 }
