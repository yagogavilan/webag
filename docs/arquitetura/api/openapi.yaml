        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/deliveries/{deliveryId}/contact-reveal:
    post:
      tags: [logistics]
      operationId: revealDeliveryContact
      summary: Revelar telefone e endereço do cliente da corrida (SEC-144)
      description: "Permissão: `logistics:contact` (super admin, operação, financeiro e suporte). Motivo obrigatório (10 a 200 caracteres); a leitura vai para a auditoria (`delivery.contact_revealed`: quem, quando e por quê, sem o dado). 409 `CONTACT_NOT_AVAILABLE` depois que a corrida termina e o contato é apagado (`pii_corrida_retencao_dias`, padrão 7)."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: Contato
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact:
                    type: object
                    properties:
                      pickupAddress: { type: [string, 'null'] }
                      storePhone: { type: [string, 'null'] }
                      dropoffAddress: { type: [string, 'null'] }
                      customerFirstName: { type: [string, 'null'] }
                      customerPhone: { type: [string, 'null'] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/orders/{orderId}/store-return:
    post:
      tags: [orders]
      operationId: adminConfirmStoreReturn
      summary: Admin registra que a loja recebeu a devolução (SEC-143)
      description: "Permissão: `logistics:write`, com reautenticação. A corrida `returned_to_store` NÃO cancela nem estorna o pedido (a operação declara, a loja confirma); quando a loja não confirma no painel, o admin registra com motivo (auditado). Quem declarou a devolução não confirma pela loja (403 `SEGREGATION_OF_DUTIES`; super admin pode). Cancela o pedido e estorna tudo, com a taxa de entrega. 409 `RETURN_NOT_PENDING` se não há devolução aguardando."
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 300 }
      responses:
        '200':
          description: Pedido cancelado e estorno agendado
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [cancelled] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/orders/{orderId}/late-cancel/respond:
    post:
      tags: [orders]
      operationId: adminRespondLateCancel
      summary: Operação responde ao cancelamento por atraso com o pedido em saída (WB-255 C6)
      description: "Permissão `logistics:write`. `accept`: a corrida vira `not_delivered` e segue o fluxo de devolução à loja (SEC-143). `arrive_soon`: informa ao cliente que chega logo (`note`, padrão 'Chegamos em até 10 minutos'); o cliente pode pedir de novo. Auditado. 409 `NO_CANCEL_REQUEST` se não há pedido pendente (ou já foi respondido, inclusive pelo aceite automático). SEC-175: se o pedido ou a corrida já não está em `out_for_delivery` (entregue, não entregue, cancelado), o pedido de cancelamento vira `superseded` (200, sem aceitar nem avisar o cliente); o aceite e a transição da corrida são uma só transação (se a corrida não puder mudar, nada é aceito e o pedido segue `pending`)."
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [accept, arrive_soon] }
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Pedido de cancelamento respondido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelRequest' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/orders/{orderId}/refunds:
    post:
      tags: [orders]
      operationId: adminRefundOrder
      summary: Estorno manual do admin, total ou parcial (SEC-039)
      description: "Permissão de admin: `orders:refund` (super admin e financeiro). Valor acima de `estorno_super_admin_cents` só o super admin (403 `SUPER_ADMIN_REQUIRED`); o limite vale pela SOMA dos estornos manuais do pedido (SEC-142, não se contorna fracionando) e há teto diário por operador (`estorno_financeiro_dia_cents`, mesma resposta 403). Reautenticação recente, motivo obrigatório e `Idempotency-Key` obrigatória (repetir a mesma chave e valor não estorna de novo; mesma chave com outro valor é 422 `IDEMPOTENCY_KEY_REUSED`). A soma dos estornos não passa do valor pago (422 `REFUND_EXCEEDS_PAID`). Se o provedor recusar, o estorno vai para a fila de pendências e a resposta é `queued`. Estorno que zera o pedido o leva a `cancelled` (ator admin; estoque devolvido, corrida cancelada); pedido já entregue ou encerrado fica como está (BUG-011). Auditado."
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountCents, reason]
              properties:
                amountCents: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 10, maxLength: 300 }
      responses:
        '200':
          description: Estorno concluído ou em fila
          content:
            application/json:
              schema:
                type: object
                required: [status, refunded, remaining]
                properties:
                  status: { type: string, enum: [done, queued] }
                  refunded: { $ref: '#/components/schemas/Money' }
                  remaining: { $ref: '#/components/schemas/Money' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/orders/{orderId}/cancel:
    post:
      tags: [orders]
      operationId: adminCancelOrder
      summary: Cancelamento do pedido pelo admin (RN-08, BUG-011)
      description: "Permissão de admin: `orders:refund`. Reautenticação recente e motivo obrigatório; auditado. Cancela o pedido em qualquer estado ativo, devolve o estoque, cancela a corrida em aberto e, por padrão (`refund` = true), estorna o que falta devolver; sem super admin, o estorno conta no limite acumulado (403 `SUPER_ADMIN_REQUIRED`, SEC-142). Pedido entregue ou já encerrado: 409 `ORDER_NOT_CANCELLABLE`. Repetir é idempotente."
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 300 }
                refund: { type: boolean, default: true }
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                type: object
                required: [status, refunded, remaining]
                properties:
                  status: { type: string, enum: [cancelled] }
                  refunded: { $ref: '#/components/schemas/Money' }
                  remaining: { $ref: '#/components/schemas/Money' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/payments/alerts:
    get:
      tags: [payments]
      operationId: listPaymentAlerts
      summary: Alertas de conciliação e divergência
      description: "Permissão de admin: `payments:alerts:read` (tabela em apps/api/src/platform/auth/permissions.ts)."
      parameters:
        - { name: openOnly, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAlertPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/payments/refund-queue:
    get:
      tags: [payments]
      operationId: listRefundQueue
      summary: Fila de estornos pendentes (SEC-130)
      description: "Estornos que o provedor recusou: em nova tentativa com backoff (`pending` com `failures` > 0), esgotados (`exhausted`) e cobertos pela Webag a pagar por fora (`covered`). Sem `status`, lista os três. Só `exhausted` pode ser coberto. Permissão de admin: `payments:refunds:read`."
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, exhausted, covered] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pendências
          content:
            application/json:
              schema:
