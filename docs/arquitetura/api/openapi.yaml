        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/push-devices/revoke:
    post:
      tags: [me]
      operationId: revokePushDevice
      summary: Desligar o push neste aparelho (logout)
      description: "Só o dono do token revoga; token de outra conta é ignorado (204, sem revelar nada). Chame no logout."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokePushDeviceRequest' }
      responses:
        '204':
          description: Revogado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/stores/{storeId}/finance/sales:
    get:
      tags: [finance]
      operationId: getStoreSales
      summary: Vendas do período (WB-075)
      description: "Permissão da loja `sales_values` (dono ou funcionário com a permissão): total de vendas (itens menos cupom da loja, sem frete nem taxa de serviço), número de pedidos e ticket médio. Sem comissão nem líquido (esses são só do dono). Pedido pago e ainda não cancelado conta pelo dia do pagamento (Brasília)."
      parameters:
