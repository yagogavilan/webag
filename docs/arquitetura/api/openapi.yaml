openapi: 3.1.0
info:
  title: Webag API
  version: 0.3.0
  description: |
    Contrato da API do Webag (fonte da verdade, ver skill `contrato-api` e ADR-007).
    Recursos de negócio ficam sob `/v1`. Endpoints operacionais (`/health`) ficam fora do versionamento.
    Erros seguem RFC 9457 (`application/problem+json`) com `code` estável.
    Autenticação: `Authorization: Bearer <accessToken>` (JWT de 15 min) + refresh opaco rotativo.
    Toda rota exige autenticação, exceto as marcadas com `security: []` (SEC-021: nega por padrão).
    Dinheiro sempre em centavos inteiros (`Money`). Listas paginadas: `{ data, nextCursor }`, `limit` máx. 50.
    A simulação de pagamento (`/v1/dev/*`) só existe fora de produção e não faz parte deste contrato.
    Header opcional `X-Device-Id` (8-64 caracteres) ajuda nos limites por dispositivo (SEC-063).
    Mudanças de 0.1.0 para 0.2.0: só adições (identidade, admin de configuração, pagamentos base).
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: ops
    description: Endpoints operacionais
  - name: auth
    description: Cadastro, login, sessão, códigos por e-mail e reset de senha
  - name: me
    description: Perfil, senha, papel de lojista, sessões, termos e consentimentos do próprio usuário
  - name: admin-users
    description: Gestão de admins, convites e TOTP (super admin)
  - name: regions
    description: Cidades e bairros atendidos
  - name: categories
    description: Categorias de 2 níveis
  - name: config
    description: Parâmetros do negócio e feature flags
  - name: legal
    description: Termos de uso, termos do lojista e política de privacidade versionados
  - name: audit
    description: Trilha de auditoria append-only
  - name: finance
    description: Comissão, taxa de serviço e ledger (admin financeiro)
  - name: logistics
    description: Logística da Webag (DEC-036), taxa de entrega por região e faixa, motoboys e entregas
  - name: payments
    description: Webhook do provedor de pagamento e alertas de conciliação
  - name: admin-stores
    description: Fila de aprovação, decisões, documentos e edição de lojas (admin)
  - name: stores
    description: "Loja do lojista (onboarding, perfil, configuração, documentos, conta de recebimento e equipe)"
  - name: catalog
    description: Catálogo da loja (produtos, variações, estoque, promoção, seções, planilha e ação em massa)
  - name: moderation
    description: Moderação de produtos e listas de categorias proibidas e palavras suspeitas (admin)
  - name: uploads
    description: Upload de arquivos em 2 passos (POST pré-assinado + complete), validado por magic bytes
  - name: addresses
    description: Endereços salvos do cliente (`/v1/me/addresses`, até 8, um padrão)
  - name: home
    description: Banners e seções da home do app do cliente (descoberta)
  - name: search
    description: Busca pública de produtos e lojas por posição, com filtros e ordenação
  - name: browse
    description: Loja e produto públicos para o cliente (vitrine, variações, avaliações lidas)
  - name: favorites
    description: Favoritos de lojas e produtos da conta
  - name: cart
    description: Sacola da conta no servidor (uma loja por pedido, cupom, resumo de valores)
  - name: exchanges
    description: Trocas e devoluções (arrependimento, defeito, tamanho/cor)
  - name: orders
    description: "Pedido do cliente (criar, acompanhar, cancelar, pagamento) e painel de pedidos da loja (lista, detalhe, comanda, aceitar, recusar, andamento, cancelar)"
  - name: privacy
    description: LGPD (O6.1) - excluir conta, exportar dados, pedidos de titulares e retenção
  - name: realtime
    description: Tempo real (Socket.IO /rt) - tickets de uso único para os painéis
  - name: marketing
    description: Marketing do admin (push segmentado, cupons da plataforma, destaques) e métricas de campanha
  - name: reports
    description: Relatórios operacionais do admin (RN-15)
  - name: help
    description: Ajuda (FAQ e contatos) do cliente e do lojista, editável pelo admin
  - name: content-reports
    description: Denúncia de avaliação, produto ou loja e moderação
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness, o processo está de pé
      description: Não consulta dependências. Usado pelo orquestrador para reiniciar o processo.
      security: []
      responses:
        '200':
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                info: {}
                error: {}
                details: {}
  /health/ready:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Readiness, dependências (PostgreSQL e Redis) respondem
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                info:
                  database: { status: up }
                  redis: { status: up }
                error: {}
                details:
                  database: { status: up }
                  redis: { status: up }
        '503':
          description: Alguma dependência fora do ar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: error
                info:
                  redis: { status: up }
                error:
                  database: { status: down, message: indisponível }
                details:
                  database: { status: down, message: indisponível }
                  redis: { status: up }
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Cadastrar conta de cliente
      description: "Cria a conta com aceite versionado de termos e privacidade, envia o código de confirmação por e-mail e já abre a sessão (a confirmação do e-mail não bloqueia a 1ª compra, DEC-014). 429 por IP (20/h) e por dispositivo (3/dia)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/email-exists:
    post:
      tags: [auth]
      operationId: emailExists
      summary: Consulta "e-mail primeiro"
      description: "Devolve só `exists`. Limite de 10/min por IP e 50/dia por dispositivo (SEC-005)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailExistsRequest'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailExistsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entrar com e-mail e senha
      description: "Mensagem única para e-mail inexistente e senha errada. Após 5 falhas de um IP contra a conta, esse IP espera 15 min (429); a conta nunca é bloqueada para o dono. Após 20 falhas/h na conta, a resposta é 403 `LOGIN_CODE_REQUIRED` e o cliente repete o login com o `code` recebido por e-mail. Admin com TOTP: a senha certa devolve só `{ mfaRequired, mfaToken, expiresIn }` (sem sessão) e o cliente conclui em `/auth/mfa/verify` (SEC-090). O caminho antigo de 1 passo (`totpCode` no login) foi REMOVIDO (SEC-115): enviar o campo é 400. SEC-113: admin que já teve 2º fator (TOTP ativo OU em reenrolamento após usar código de recuperação) NUNCA abre sessão só com a senha: sempre recebe o `mfaToken`. Código de recuperação vale uma vez, invalida o segredo antigo, MANTÉM os demais códigos e abre sessão sem MFA concluído (`mfaSetupRequired: true`, só reconfigura o TOTP). Admin que nunca configurou o TOTP entra só dentro de 48 h do convite/reativação; depois, 403 `ENROLLMENT_EXPIRED` (peça novo convite)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Sessão aberta, ou desafio de 2º fator (mfaRequired true) para admin com TOTP"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResult'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renovar a sessão (refresh rotativo)
      description: "Cada uso troca o refresh por um novo. Repetir o mesmo token em até 30 s devolve o mesmo novo par (retry de rede). Reuso fora da janela revoga a sessão inteira (401 `REFRESH_REUSED`)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Encerrar a sessão atual
      responses:
        '204':
          description: Sessão encerrada; o access token deixa de valer na hora
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Sair de todos os dispositivos
      responses:
        '204':
          description: Todas as sessões encerradas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirmar o e-mail com o código de 6 dígitos
      description: "Código com validade de 10 min, 5 tentativas e uso único. Erros 400: `CODE_INVALID`, `CODE_EXPIRED`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: E-mail confirmado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendEmailCode
      summary: Reenviar o código de confirmação
      description: "No máximo 1 envio a cada 60 s e 5 por hora (429 com `Retry-After`). O código anterior deixa de valer."
      responses:
        '204':
          description: Código enviado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/email/correct:
    post:
      tags: [auth]
      operationId: correctEmail
      summary: Corrigir o e-mail ainda não confirmado
      description: "Exige a senha. Os limites de envio (60 s entre envios, 5 por hora) valem ANTES de gravar: um 429 não muda o e-mail nem invalida o código anterior. Passando, o código anterior deixa de valer e o novo e-mail recebe um código novo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectEmailRequest'
      responses:
        '204':
          description: E-mail corrigido e código enviado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Pedir código de redefinição de senha
      description: "Resposta e tempo iguais para e-mail existente ou não (SEC-003). Limites por e-mail e por IP."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Se o e-mail existir, enviamos um código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Redefinir a senha com o código
      description: "Confirma o e-mail, revoga TODAS as sessões e envia aviso \"Sua senha foi alterada\". O código do e-mail é conferido primeiro. Admin com TOTP não troca a senha aqui: a resposta é `{ tokens: null, mfaRequired: true, resetTicket }` e a troca termina em `/auth/password/reset/complete` (SEC-095). Admin não recebe sessão (`tokens: null`). Admin que nunca configurou o TOTP não tem reset por e-mail: 403 `ADMIN_INVITE_REQUIRED` (pede novo convite, SEC-113). Admin em reenrolamento só conclui com código de recuperação restante."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/reauth:
    post:
      tags: [auth]
      operationId: reauth
      summary: Reautenticar (janela de 5 min para ações sensíveis)
      description: "Cliente e lojista: `password`. Admin com TOTP: `totpCode` (só o código de 6 dígitos, não o de recuperação)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '204':
          description: Reautenticado
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptAdminInvitation
      summary: Aceitar convite de admin
      description: "Cria a conta de admin (e-mail já confirmado pelo convite) e abre uma sessão limitada: só a configuração do TOTP fica liberada. 410 `INVITATION_INVALID` para convite usado, revogado ou vencido (48 h)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Convite aceito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Meu perfil
      description: "`pendingTerms` lista documentos a aceitar (primeiro aceite ou mudança relevante, WB-210)."
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [me]
      operationId: updateMe
      summary: Atualizar nome e celular
      description: "Só `name` e `phone`; qualquer outro campo (role, status, email...) responde 400."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Trocar a senha (logado)
      description: "Pede a senha atual (403 `INVALID_PASSWORD`), revoga todas as sessões e devolve uma sessão nova."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha trocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/merchant-role:
    post:
      tags: [me]
      operationId: becomeMerchant
      summary: Adicionar o papel de lojista à conta
      description: "Exige e-mail confirmado (403 `EMAIL_VERIFICATION_REQUIRED`), flag `cadastro_lojista` ligada (403 `MERCHANT_SIGNUP_DISABLED`) e aceite dos Termos do Lojista vigentes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantRoleRequest'
      responses:
        '204':
          description: Papel concedido
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: Minhas sessões ativas
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: Encerrar uma sessão minha
      description: "Sessão de outro usuário responde 404."
      parameters:
        - { name: sessionId, in: path, required: true, description: ID da sessão, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Sessão encerrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/terms:
    get:
      tags: [me]
      operationId: getMyPendingTerms
      summary: Termos pendentes de aceite
      responses:
        '200':
          description: Pendentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingTermsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/terms/accept:
    post:
      tags: [me]
      operationId: acceptTerms
      summary: Aceitar a versão vigente dos termos
      description: "Versão desatualizada responde 409 `TERMS_OUTDATED`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTermsRequest'
      responses:
        '200':
          description: Aceite registrado (IP e plataforma gravados)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingTermsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/me/consents:
    get:
      tags: [me]
      operationId: getMyConsents
      summary: Meus consentimentos
      responses:
        '200':
          description: Estado atual de cada finalidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/consents/{purpose}:
    put:
      tags: [me]
      operationId: setMyConsent
      summary: Conceder ou revogar um consentimento
      description: "Vale na hora; cada mudança grava um evento (tipo, versão do texto, canal, data/hora)."
      parameters:
        - { name: purpose, in: path, required: true, description: Finalidade, schema: { type: string, enum: [marketing_push, marketing_email, precise_location, waitlist] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConsentRequest'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/admins:
    get:
      tags: [admin-users]
      operationId: listAdmins
      summary: Listar admins
      description: "Permissão de admin: `admins:manage` (tabela em apps/api/src/platform/auth/permissions.ts)."
      responses:
        '200':
          description: Admins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin-users]
      operationId: inviteAdmin
      summary: Convidar admin
      description: "Convite de 256 bits, uso único, ligado ao e-mail, válido por 48 h. Exige reautenticação recente (403 `REAUTH_REQUIRED`). Permissão de admin: `admins:manage` (tabela em apps/api/src/platform/auth/permissions.ts)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAdminRequest'
      responses:
        '201':
          description: Convite criado e enviado por e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAdminResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/admins/invitations/{invitationId}:
    delete:
      tags: [admin-users]
      operationId: revokeAdminInvitation
      summary: Revogar convite de admin
