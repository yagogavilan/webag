      summary: Extrato por pedido (WB-077)
      description: "Permissão da loja `finance`. Um registro por pedido pago do período, do mais recente ao mais antigo, com vendas, comissão, tarifa do provedor, estornos, líquido e situação. Paginado por cursor."
