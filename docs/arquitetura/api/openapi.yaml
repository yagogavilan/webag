      summary: Cancelar sem custo por atraso da entrega (WB-253, RN-19 4d)
      description: "Vale depois do fim da faixa + `entrega_atraso_tolerancia_min` (`Order.delay.canCancelWithoutCost`). Antes de `out_for_delivery`: cancela na hora (ator cliente, motivo 'Atraso na entrega'), estoque devolvido, corrida cancelada e estorno TOTAL com a taxa de entrega. Em `out_for_delivery`: abre o pedido à operação (`Order.delay.cancelRequest`, `status=pending`); a operação aceita ou diz que chega logo e, sem resposta em `entrega_cancel_resposta_min`, o sistema aceita e a corrida segue para a devolução à loja (o pedido é cancelado e estornado por inteiro quando a loja confirma o recebimento). Idempotente (toque duplo: um só efeito). Retorna o pedido. Quem cancela por atraso não recebe compensação. 409 `LATE_CANCEL_NOT_AVAILABLE` (ainda não atrasou o suficiente), 409 `ORDER_ALREADY_DELIVERED`, 404 se o pedido não é do cliente."
      parameters:
