  /v1/uploads:
    post:
      tags:
      - uploads
      operationId: createUpload
      summary: Pedir um upload (POST pré-assinado)
      description: "A chave do objeto é gerada pelo servidor; a policy fixa `Content-Type` e `content-length-range` (até `upload_max_mb`, 5 MB). Logo e capa: JPG/PNG/WebP; documento de loja também PDF. Exige membro da loja com a permissão da finalidade (documento, logo e capa: `settings`; foto de produto: `catalog`); quem não é da loja recebe 404. `banner` (imagem 2:1 da home): sem `storeId`, só admin com `banners:write` e MFA concluído. **v1.1 R1:** admin com `store-catalog:write` (super admin e operação) também pede `product_image` com o `storeId` da loja que está ajustando (WB-353 C8); o upload fica de dono = admin e o envio é auditado. Foto de produto aceita só JPEG, PNG ou WebP (sem SVG e sem HEIC; o app converte no aparelho), até 5 MB e 40 MP, sem animação, assinatura dos bytes conferida (C-CAD-01)."
