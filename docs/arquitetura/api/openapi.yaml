  /v1/browse/products/{productId}:
    get:
      tags: [browse]
      operationId: getBrowseProduct
      summary: Página pública do produto (WB-017)
      description: "Variações com estoque próprio: `available=false` não é selecionável; `lastUnits` (1 a 3) mostra 'Últimas X unidades'; `maxQuantity` é o teto da quantidade (disponível limitado por `item_qtd_max`). O estoque exato nunca sai. Preço vigente por variação (promoção do produto herdada por percentual). Produto pausado ou removido pela moderação responde 200 com `available=false`, `unavailableReason` (`PAUSED`, `MODERATED`) e só `store` (atalho para a loja); rascunho, arquivado, inexistente ou de loja invisível responde 404."
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 }, description: 'DEC-053: com lat e lng a página traz `store.delivery` (disponível e faixa de chegada) para a posição.' }
