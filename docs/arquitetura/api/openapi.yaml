          maximum: 120
          description: 'DEC-053: preparo da loja no ETA (min); null volta ao padrão do admin (`entrega_preparo_padrao_min`); ausente não muda. 422 se preparo + despacho + folga da faixa passa do teto `entrega_max_min` (DEC-054).'
        etaMinMinutes:
          type: integer
          minimum: 1
          deprecated: true
          description: Ignorado desde a DEC-053 (o ETA é calculado).
        etaMaxMinutes:
          type: integer
          maximum: 1440
          deprecated: true
        radiusKm: { type: number, deprecated: true }
        feeMode: { type: string, enum: [fixed, by_distance], deprecated: true }
        feeFixedCents: { type: integer, deprecated: true }
        tiers: { type: array, items: { type: object }, deprecated: true }
        minOrderCents: { type: integer, deprecated: true }
        freeAboveCents: { type: integer, deprecated: true }
