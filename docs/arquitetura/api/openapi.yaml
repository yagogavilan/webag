  /v1/admin/stores:
    get:
      tags:
      - admin-stores
      operationId: listAdminStores
      x-admin-permission: 'stores:read'
      summary: Fila de lojas
      description: "Permissão `stores:read`. Ordem por data de envio; `overdue` conta dias úteis (seg a sex, America/Sao_Paulo) e fica falso em \"correção pedida\". **v1.1 R1 (WB-350):** `status=all`, busca `q` por nome ou cidade e os atalhos `noActiveProduct` (loja aprovada sem produto ativo: a loja a ativar) e `ownCommission`; os itens ganham `activeProducts`, `orders30d`, `sales30dCents`, `commissionPct` e `commissionSource` (campos novos, opcionais). Páginas de até 50 (a tela pede 25 ou 50; 100 não cabe no limite de 3G)."
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - in_review
          - correction_requested
          - approved
          - rejected
          - suspended
          - closed
          - all
        description: "Padrão: in_review. `all` = todas (v1.1 R1)"
      - name: q
        in: query
        description: "v1.1 R1: nome da loja ou cidade (até 80 caracteres)"
        schema:
          type: string
          maxLength: 80
      - name: noActiveProduct
        in: query
        description: "v1.1 R1: só lojas aprovadas sem produto ativo"
        schema:
          type: string
          enum:
          - 'true'
      - name: ownCommission
        in: query
        description: "v1.1 R1: só lojas com comissão própria"
        schema:
          type: string
          enum:
          - 'true'
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/Limit"
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - nextCursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminStoreListItem"
                  nextCursor:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
