          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCouponPage' }
              examples:
                compensacao: { value: { data: [{ id: 3f0c5f6e-8a3c-4d0e-9a53-6a4f9b2c1d10, code: ATRASOK7M2QXW9, kind: free_shipping, valueCents: null, percent: null, minOrderCents: 0, startsAt: '2026-11-19T18:00:00Z', expiresAt: '2026-12-19T18:00:00Z', status: available, origin: late_delivery }], nextCursor: null } }
        '400':
