  /v1/stores/{storeId}/finance/summary:
    get:
      tags: [finance]
      operationId: getStoreFinanceSummary
      summary: Resumo financeiro do dono (WB-076)
      description: "Permissão da loja `finance` (só o dono, RN-13). Vendas, comissão cobrada e devolvida, tarifa do provedor, estornos, líquido (do ledger) e o que ainda está para entrar. `receivable` é INFORMATIVO: em split o dinheiro cai direto na conta do Mercado Pago da loja e a Webag não retém nem repassa (DEC-016): `pending` = pedido ainda não entregue, `inGrace` = entregue há menos de `repasse_carencia_dias`, `released` = passou a carência."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, description: 'Dia inicial (Brasília), inclusivo.', schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'Dia final (Brasília), inclusivo. Período de no máximo 366 dias.', schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreFinanceSummary' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stores/{storeId}/finance/statement:
    get:
