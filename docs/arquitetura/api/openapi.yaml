    CityList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CityWithNeighborhoods' }
        nextCursor: { type: [string, 'null'] }
    PublicCity:
      type: object
      required: [id, name, state, slug, neighborhoods]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string }
        slug: { type: string }
        neighborhoods:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    PublicRegionList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicCity' }
        nextCursor: { type: [string, 'null'] }
    CreateCityRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 2, default: SP }
        active: { type: boolean, default: false }
    UpdateRegionRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        active: { type: boolean }
    CreateNeighborhoodRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        active: { type: boolean, default: true }
    Category:
      type: object
      required: [id, parentId, name, icon, position, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 30 }
        icon: { type: string, description: Nome do ícone da biblioteca fixa }
        position: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CategoryNode:
      allOf:
        - { $ref: '#/components/schemas/Category' }
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/Category' }
    CategoryTree:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
        nextCursor: { type: [string, 'null'] }
    CategoryTreeAdmin:
      type: object
      required: [data, icons, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
        icons:
          type: array
          description: Biblioteca fixa de ícones
          items: { type: string }
        nextCursor: { type: [string, 'null'] }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, icon]
      properties:
        name: { type: string, minLength: 2, maxLength: 30 }
        icon: { type: string, maxLength: 40 }
        parentId: { type: [string, 'null'], format: uuid, default: null }
        position: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        active: { type: boolean, default: true }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 30 }
        icon: { type: string, maxLength: 40 }
        position: { type: integer, minimum: 0, maximum: 10000 }
        active: { type: boolean }
    ReorderCategoriesRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    ParameterView:
      type: object
      required: [key, value, default, type, min, max, values, description, ref, legalFloor, updatedAt]
      properties:
        key: { type: string }
        value: { oneOf: [{ type: number }, { type: string }] }
        default: { oneOf: [{ type: number }, { type: string }] }
        type: { type: string, enum: [int, decimal, enum, window] }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        values: { type: [array, 'null'], items: { type: string } }
        description: { type: string }
        ref: { type: string, description: 'Origem da regra (HIP, WB, DEC)' }
        legalFloor: { type: boolean, description: Piso legal fixo (ninguém edita) }
        updatedAt: { type: [string, 'null'], format: date-time }
    ParameterList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ParameterView' }
        nextCursor: { type: [string, 'null'] }
    UpdateParameterRequest:
      type: object
      additionalProperties: false
      required: [value, reason]
      properties:
        value: { oneOf: [{ type: number }, { type: string, maxLength: 40 }] }
        reason: { type: string, minLength: 5, maxLength: 300 }
        expectedUpdatedAt: { type: [string, 'null'], format: date-time, description: "Versão que o painel viu (`updatedAt` do parâmetro; null = nunca editado). Se outro admin alterou antes, 409 `PARAMETER_CONFLICT`. Omitido = sem controle de versão." }
    ResetParameterRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 300 }
        expectedUpdatedAt: { type: [string, 'null'], format: date-time }
    FlagView:
      type: object
      required: [key, enabled, description, updatedAt]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        description: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
    FlagList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FlagView' }
        nextCursor: { type: [string, 'null'] }
    SetFlagRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo (vai à auditoria) }
    MaintenanceStatus:
      type: object
      required: [active, message, expectedBackAt]
      properties:
        active: { type: boolean }
        message: { type: [string, 'null'], description: "Texto para mostrar ao cliente; nulo desligado" }
        expectedBackAt: { type: [string, 'null'], format: date-time, description: "Previsão de volta (informativa; não desliga sozinha)" }
    MaintenanceAdminStatus:
      allOf:
        - $ref: '#/components/schemas/MaintenanceStatus'
        - type: object
          required: [updatedAt, updatedByName]
          properties:
            updatedAt: { type: [string, 'null'], format: date-time }
            updatedByName: { type: [string, 'null'] }
    SetMaintenanceRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        message: { type: string, minLength: 5, maxLength: 200, description: "Só ao ligar; sem ela vale o texto padrão" }
        expectedBackAt: { type: [string, 'null'], format: date-time, description: "Só ao ligar; precisa estar no futuro" }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo (vai à auditoria) }
    PublicFlags:
      type: object
      required: [flags]
      properties:
        flags:
          type: object
          additionalProperties: { type: boolean }
          example: { pix: true, cartao: true, login_social: false }
    LegalDocument:
      type: object
      required: [id, type, version, title, content, effectiveAt, relevantChange, createdAt]
      properties:
        changeSummary: { type: [string, 'null'], description: O que mudou nesta versão }
        publishedByName: { type: [string, 'null'], description: Nome de quem publicou (só nas rotas de admin) }
        acceptances: { type: [integer, 'null'], description: Quantos usuários aceitaram esta versão (só nas rotas de admin) }
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: integer }
        title: { type: string }
        content: { type: string, description: Texto simples; clientes devem exibir como texto puro }
        effectiveAt: { type: string, format: date-time }
        relevantChange: { type: boolean }
        createdAt: { type: string, format: date-time }
    LegalDocumentList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LegalDocument' }
        nextCursor: { type: [string, 'null'] }
    PublishLegalRequest:
      type: object
      additionalProperties: false
      required: [title, content, effectiveAt]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        content: { type: string, minLength: 20, maxLength: 200000 }
        effectiveAt: { type: string, format: date-time }
        relevantChange: { type: boolean, default: false }
        changeSummary: { type: string, minLength: 5, maxLength: 500, description: O que mudou (mostrado ao usuário no aceite) }
    AuditEntry:
      type: object
      required: [id, at, actorId, actorRole, action, targetType, targetId, before, after, ip, requestId, reason]
      properties:
        actorName: { type: [string, 'null'], description: Nome do ator no cadastro }
        device: { type: [string, 'null'], example: Chrome em Windows, description: Rótulo curto do aparelho }
        id: { type: integer }
        at: { type: string, format: date-time }
        actorId: { type: [string, 'null'], format: uuid }
        actorRole: { type: [string, 'null'] }
        action: { type: string, example: parameter.update }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        ip: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
    AuditPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { type: [string, 'null'] }
    WebhookAck:
      type: object
      required: [received, duplicate]
      properties:
        received: { type: boolean }
        duplicate: { type: boolean, description: Evento já recebido antes (sem novo efeito) }
    AdminAlertArea:
      type: string
      enum: [payments, orders, logistics, exchanges, stores, privacy, platform]
    AdminAlertSeverity:
      type: string
      enum: [critical, warning, info]
      description: "`critical`: dinheiro ou prazo legal em risco, agir no dia. `warning`: agir logo. `info`: acompanhar"
    AdminAlertKind:
      type: object
      required: [kind, label, area, severity, hint]
      properties:
        kind: { type: string, example: conciliation_mismatch }
        label: { type: string, example: Pagamento diverge do provedor }
        area: { $ref: '#/components/schemas/AdminAlertArea' }
        severity: { $ref: '#/components/schemas/AdminAlertSeverity' }
        hint: { type: string, description: 'O que fazer, em uma frase' }
    AdminAlert:
      type: object
      required: [id, kind, label, area, severity, hint, status, attemptId, details, links, createdAt, resolvedAt, resolvedByName, resolutionNote]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "Tipo estável; um tipo fora do catálogo vem com `label` \"Outro alerta\" (só o super admin vê)" }
        label: { type: string }
        area: { $ref: '#/components/schemas/AdminAlertArea' }
        severity: { $ref: '#/components/schemas/AdminAlertSeverity' }
        hint: { type: string }
        status: { type: string, enum: [open, resolved] }
        attemptId: { type: [string, 'null'], format: uuid }
        details: { type: object, additionalProperties: true, description: "Dados do alerta como o sistema gravou (ids, valores em centavos, minutos); sem dado pessoal do cliente" }
        links:
          type: object
          required: [orderId, storeId, deliveryId, exchangeId]
          properties:
            orderId: { type: [string, 'null'], format: uuid }
            storeId: { type: [string, 'null'], format: uuid }
            deliveryId: { type: [string, 'null'], format: uuid }
            exchangeId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByName: { type: [string, 'null'], description: Nulo quando o sistema encerrou sozinho }
        resolutionNote: { type: [string, 'null'] }
    AdminAlertPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminAlert' } }
        nextCursor: { type: [string, 'null'] }
    AdminAlertsSummary:
      type: object
      required: [open, bySeverity, byArea, byKind, oldestOpenAt]
      properties:
        open: { type: integer }
        bySeverity:
          type: object
          required: [critical, warning, info]
          properties: { critical: { type: integer }, warning: { type: integer }, info: { type: integer } }
        byArea:
          type: object
          additionalProperties: { type: integer }
          description: "Uma chave por área (`payments`, `orders`, `logistics`, `exchanges`, `stores`, `privacy`, `platform`)"
        byKind:
          type: array
          items:
            type: object
            required: [kind, label, area, severity, count]
            properties:
              kind: { type: string }
              label: { type: string }
              area: { $ref: '#/components/schemas/AdminAlertArea' }
              severity: { $ref: '#/components/schemas/AdminAlertSeverity' }
              count: { type: integer }
        oldestOpenAt: { type: [string, 'null'], format: date-time }
    ResolveAlertRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 5, maxLength: 300, description: O que foi feito ou por que se encerra }
    AdminUserRow:
      type: object
      required: [id, name, emailMasked, phoneMasked, roles, status, storeCount, createdAt, lastLoginAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'Abreviado ("Maria L.")', example: Maria L. }
        emailMasked: { type: [string, 'null'], example: m***@gmail.com }
        phoneMasked: { type: [string, 'null'], example: (11) 9****-8888 }
        roles: { type: array, items: { type: string, enum: [customer, merchant] } }
        status: { type: string, enum: [active, blocked, deleted] }
        storeCount: { type: integer, description: Lojas em que é dono ou funcionário }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    AdminUserPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminUserRow' } }
        nextCursor: { type: [string, 'null'] }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserRow'
        - type: object
          required: [emailVerified, stores, recentOrders, blockHistory, allowedActions]
          properties:
            emailVerified: { type: boolean }
            stores:
              type: array
              items:
                type: object
                required: [id, name, status, role]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: [string, 'null'] }
                  status: { type: string }
                  role: { type: string, enum: [owner, staff] }
            recentOrders:
              type: array
              description: Os 10 pedidos mais recentes como cliente
              items:
                type: object
                required: [id, number, status, mode, createdAt, total, storeName]
                properties:
                  id: { type: string, format: uuid }
                  number: { type: string }
                  status: { type: string }
                  mode: { type: string, enum: [delivery, pickup] }
                  createdAt: { type: string, format: date-time }
                  total: { $ref: '#/components/schemas/Money' }
                  storeName: { type: [string, 'null'] }
            blockHistory:
              type: array
              items:
                type: object
                required: [action, reason, at, byName, suspendedStoreIds]
                properties:
                  action: { type: string, enum: [blocked, unblocked] }
                  reason: { type: string }
                  at: { type: string, format: date-time }
                  byName: { type: [string, 'null'] }
                  suspendedStoreIds: { type: array, items: { type: string, format: uuid } }
            allowedActions:
              type: array
              items: { type: string, enum: [block, unblock] }
    AdminUserBlockResult:
      allOf:
        - $ref: '#/components/schemas/AdminUserDetail'
        - type: object
          required: [suspendedStoreIds, failedStoreIds]
          properties:
            suspendedStoreIds: { type: array, items: { type: string, format: uuid }, description: "Lojas suspensas junto com o bloqueio do dono (WB-102 C5)" }
            failedStoreIds: { type: array, items: { type: string, format: uuid }, description: Lojas que não foi possível suspender; o bloqueio do usuário vale mesmo assim }
    BlockUserRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 300 }
    AdminOrderRow:
      type: object
      required: [id, number, status, mode, paymentMethod, createdAt, paidAt, store, customer, total]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: WB-4F7K2 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mode: { type: string, enum: [delivery, pickup] }
        paymentMethod: { type: string, enum: [pix, card] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        store:
          type: object
          required: [id, name, city]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: [string, 'null'] }
        customer:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, description: 'Abreviado ("Maria L.")' }
        total: { $ref: '#/components/schemas/Money' }
    AdminOrderPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminOrderRow' } }
        nextCursor: { type: [string, 'null'] }
    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/AdminOrderRow'
        - type: object
          required: [acceptedAt, deliveredAt, cancelledAt, cancelledBy, cancelReason, disputedAt, notReceivedAt, couponCode, customer, delivery, items, values, payment, refunds, timeline, exchanges, review, allowedActions, refundLimit]
          properties:
            acceptedAt: { type: [string, 'null'], format: date-time }
            deliveredAt: { type: [string, 'null'], format: date-time }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancelledBy: { type: [string, 'null'], enum: [customer, store, system, admin, null] }
            cancelReason: { type: [string, 'null'] }
            disputedAt: { type: [string, 'null'], format: date-time, description: Pagamento contestado pelo provedor (chargeback) }
            notReceivedAt: { type: [string, 'null'], format: date-time, description: 'Primeiro "não recebi" do cliente' }
            couponCode: { type: [string, 'null'] }
            customer:
              type: object
              required: [id, name, emailMasked, phoneMasked]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                emailMasked: { type: [string, 'null'] }
                phoneMasked: { type: [string, 'null'] }
            delivery:
              type: [object, 'null']
              description: Só em pedido de entrega; endereço só com bairro, cidade e UF
              required: [neighborhood, city, state, logistics]
              properties:
                neighborhood: { type: [string, 'null'] }
                city: { type: [string, 'null'] }
                state: { type: [string, 'null'] }
                logistics:
                  type: [object, 'null']
                  required: [deliveryId, status]
                  properties:
                    deliveryId: { type: string, format: uuid }
                    status: { $ref: '#/components/schemas/DeliveryStatus' }
            items:
              type: array
              items:
                type: object
                required: [name, attributes, quantity, unitPrice, lineTotal]
                properties:
                  name: { type: string }
                  attributes: { type: object, additionalProperties: { type: string } }
                  quantity: { type: integer }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  lineTotal: { $ref: '#/components/schemas/Money' }
            values:
              type: object
              description: "A conta do pedido (RN-10), congelada no pagamento. SEC-184 / RN-13: `commission`, `applicationFee` e `merchantNetBeforeProviderFee` vêm `null` para quem não tem `commissions:read` (operação e suporte); financeiro e super admin recebem o valor."
              required: [subtotal, delivery, serviceFee, storeDiscount, platformDiscount, total, commission, applicationFee, merchantNetBeforeProviderFee]
              properties:
                subtotal: { $ref: '#/components/schemas/Money' }
                delivery: { $ref: '#/components/schemas/Money' }
                serviceFee: { $ref: '#/components/schemas/Money' }
                storeDiscount: { $ref: '#/components/schemas/Money' }
                platformDiscount: { $ref: '#/components/schemas/Money' }
                total: { $ref: '#/components/schemas/Money' }
                commission: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                applicationFee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                merchantNetBeforeProviderFee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            payment:
              type: [object, 'null']
              required: [method, status, installments, declineReason, attempts]
              properties:
                method: { type: string, enum: [pix, card] }
                status: { type: string, description: Estado da última tentativa }
                installments: { type: integer }
                declineReason: { type: [string, 'null'] }
                attempts:
                  type: array
                  items:
                    type: object
                    required: [id, status, method, amount, createdAt]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
                      method: { type: string, enum: [pix, card] }
                      amount: { $ref: '#/components/schemas/Money' }
                      createdAt: { type: string, format: date-time }
            refunds:
              type: object
              required: [paid, refunded, remaining, items]
              properties:
                paid: { $ref: '#/components/schemas/Money' }
                refunded: { $ref: '#/components/schemas/Money', description: Estornado ou em fila (não conta as falhas) }
                remaining: { $ref: '#/components/schemas/Money' }
                items:
                  type: array
                  items:
                    type: object
                    required: [id, amount, status, reason, at]
                    properties:
                      id: { type: string, format: uuid }
                      amount: { $ref: '#/components/schemas/Money' }
                      status: { type: string, enum: [pending, done, failed, exhausted, covered] }
                      reason: { type: string }
                      at: { type: string, format: date-time }
            timeline:
              type: array
              items:
                type: object
                required: [status, from, at, actor, actorName, reason]
                properties:
                  status: { $ref: '#/components/schemas/OrderStatus' }
                  from: { type: [string, 'null'] }
                  at: { type: string, format: date-time }
                  actor: { type: string, enum: [customer, store, system, admin] }
                  actorName: { type: [string, 'null'], description: Nulo quando o ator é o sistema }
                  reason: { type: [string, 'null'] }
            exchanges:
              type: array
              items:
                type: object
                required: [id, number, type, status]
                properties:
                  id: { type: string, format: uuid }
                  number: { type: string }
                  type: { type: string }
                  status: { type: string }
            review:
              type: [object, 'null']
              required: [rating, createdAt]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
