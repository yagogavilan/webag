        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/payments/refund-queue:
    get:
      tags: [payments]
      operationId: listRefundQueue
      x-admin-permission: 'payments:refunds:read'
      summary: Fila de estornos pendentes (SEC-130)
      description: "Estornos que o provedor recusou: em nova tentativa com backoff (`pending` com `failures` > 0), esgotados (`exhausted`) e cobertos pela Webag a pagar por fora (`covered`). Sem `status`, lista os três. Só `exhausted` pode ser coberto. Permissão de admin: `payments:refunds:read`."
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, exhausted, covered] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pendências
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundQueuePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/payments/refund-queue/{intentId}/retry:
    post:
      tags: [payments]
      operationId: retryRefundIntent
      x-admin-permission: 'payments:refunds:retry'
      summary: Tentar o estorno de novo agora
      description: "Reautenticação recente exigida. Mesma chave de idempotência do estorno: não estorna duas vezes. 409 `REFUND_IN_FLIGHT` se outra chamada ao provedor está em andamento (SEC-141). Auditado. Permissão de admin: `payments:refunds:retry`."
      parameters:
        - { name: intentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado depois da tentativa
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, done, exhausted, covered] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/payments/refund-queue/{intentId}/cover:
    post:
      tags: [payments]
      operationId: coverRefundIntent
      x-admin-permission: 'payments:refunds:cover'
      summary: Cobertura da Webag (DEC-020a)
      description: "Só super admin, com reautenticação e motivo. A Webag assume o valor até `estorno_cobertura_teto_cents` por pedido (422 `COVERAGE_ABOVE_LIMIT` acima); a parte da loja vira dívida no ledger. O estorno deixa de ser tentado no provedor. Só intenção `exhausted` e sem chamada ao provedor em andamento: `pending` (ainda em retentativa) ou em voo é 409 `REFUND_NOT_COVERABLE`/`REFUND_IN_FLIGHT` (SEC-141). Permissão de admin: `payments:refunds:cover`."
      parameters:
        - { name: intentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 300 }
      responses:
        '204':
          description: Coberto
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/payments/webhook-events/{eventId}/reprocess:
    post:
      tags: [payments]
      operationId: reprocessWebhookEvent
      x-admin-permission: 'payments:webhooks:reprocess'
