    post:
      tags: [auth]
      operationId: completeResetPassword
      summary: Concluir a redefinição de senha do admin (SEC-095, passos 2 e 3)
      description: "Recebe o `resetTicket` devolvido por `/auth/password/reset` (código do e-mail já validado, 10 min, uso único, 5 tentativas), o TOTP ou código de recuperação e a senha nova. O servidor só grava a senha se os dois fatores foram validados neste ticket. Revoga todas as sessões, avisa o titular e os outros super admins e audita."
