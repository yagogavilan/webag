  /v1/admin/logistics/deliveries/{deliveryId}/status:
    post:
      tags: [logistics]
      operationId: updateDeliveryStatus
      x-admin-permission: 'logistics:write'
      summary: Avançar a corrida (RN-18)
      description: "`action`: confirm (a caminho da loja), picked_up (saiu para entrega), delivered (exige o código de 4 dígitos quando a flag `codigo_entrega` está ligada; 5 erros bloqueiam com 429 `DELIVERY_CODE_LOCKED`; só o super admin conclui com `overrideReason`), not_delivered (exige `failReason`), reattempt (até `entrega_reentrega_max`), return_confirmed, reassign e cancel (exigem `reason`). Transição inválida: 409 `INVALID_DELIVERY_TRANSITION`. Cada mudança grava evento e auditoria e avisa o cliente. **WB-262:** em `delivered` a operação pode informar `deliveredAt` (a hora real, recuo até 60 min, motivo acima de 5 min); a hora real e a do clique ficam no histórico e na auditoria; a compensação por atraso (RN-19 4c), o relatório de prazo e as janelas de troca e avaliação contam da hora real. Permissão: `logistics:write`."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [confirm, picked_up, delivered, not_delivered, reattempt, return_confirmed, reassign, cancel] }
                reason: { type: string, maxLength: 200 }
                code: { type: string, pattern: '^\d{4}$' }
                failReason: { type: string, enum: [customer_absent, address_not_found, customer_refused, safety_risk, store_fault, other] }
                overrideReason: { type: string, minLength: 10, maxLength: 200 }
                deliveredAt: { type: string, format: date-time, description: 'WB-262 (só com `delivered` de entrega de pedido): a hora real da entrega. Omitida = a hora do clique. Nunca no futuro (tolerância de 2 min ao relógio do navegador, vale a hora do clique), nunca antes da saída para entrega e no máximo 60 min para trás: senão 422 `DELIVERED_AT_IN_FUTURE` | `DELIVERED_AT_TOO_OLD` | `DELIVERED_AT_BEFORE_DEPARTURE`. Corrida de troca e conclusão automática: 422 `DELIVERED_AT_NOT_ALLOWED`.' }
                deliveredAtReason: { type: string, enum: [courier_notified_late, no_signal, other], description: 'Obrigatório se a hora recuou mais de 5 min (400); opcional até 5 min. `other` exige `deliveredAtNote`.' }
                deliveredAtNote: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Corrida atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/deliveries/{deliveryId}/cost:
    put:
      tags: [logistics]
      operationId: setDeliveryCost
      x-admin-permission: 'logistics:write'
      summary: Custo pago ao motoboy (WB-239)
      description: "Só com a corrida terminada. Corrigir um custo já lançado exige `reason` e preserva o valor anterior no histórico. Acima de 1,5x o previsto da faixa ou de `entrega_custo_alerta_cents` exige `reason` (422 `COST_REASON_REQUIRED`) e alerta o financeiro (`delivery_cost_high`); acima de `entrega_custo_max_cents`, 422 `COST_ABOVE_LIMIT` (SEC-145). Permissão: `logistics:write`."
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [costCents]
              properties:
                costCents: { type: integer, minimum: 0 }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Corrida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/reports/summary:
    get:
      tags: [logistics]
      operationId: getLogisticsReportSummary
      x-admin-permission: 'logistics:report'
      summary: Relatório de logística (WB-240)
      description: "Corridas do período pela hora em que ficaram prontas (dia civil de Brasília), sem as canceladas. Entregas, no prazo (pronto até entregue dentro de `logistica_alerta_entrega_min`, [HIPÓTESE] até o PO definir o prazo), falhas por motivo, tempos médios em minutos, taxa cobrada, custo, margem (só das corridas com custo registrado), custo do subsídio do frete grátis (taxa zero) e margem por cidade com `negativeMargin` destacando a negativa; os totais são a soma das linhas. Permissão: `logistics:report` (super admin, operação, financeiro)."
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date, description: 'Inclusivo; no máximo 366 dias do início' } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: courierId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [delivery, exchange_pickup, exchange_return] } }
      responses:
        '200':
          description: Relatório
          content:
            application/json:
              schema:
                type: object
                required: [period, totals, byCity]
                properties:
                  period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
                  totals:
                    type: object
                    properties:
                      deliveries: { type: integer }
                      finished: { type: integer }
                      delivered: { type: integer }
                      onTime: { type: integer }
                      onTimeLimitMinutes: { type: integer }
                      failuresByReason: { type: object, additionalProperties: { type: integer } }
                      avgMinutes:
                        type: object
                        properties:
                          readyToAssigned: { type: [number, 'null'] }
                          readyToCollected: { type: [number, 'null'] }
                          readyToDelivered: { type: [number, 'null'] }
                      feeCollected: { $ref: '#/components/schemas/Money' }
                      cost: { $ref: '#/components/schemas/Money' }
                      margin: { $ref: '#/components/schemas/Money' }
                      runsWithoutCost: { type: integer }
                      freeShippingDeliveries: { type: integer }
                      freeShippingCost: { $ref: '#/components/schemas/Money' }
                  byCity:
                    type: array
                    items:
                      type: object
                      properties:
                        cityId: { type: [string, 'null'], format: uuid }
                        cityName: { type: [string, 'null'] }
                        deliveries: { type: integer }
                        fee: { $ref: '#/components/schemas/Money' }
                        cost: { $ref: '#/components/schemas/Money' }
                        margin: { $ref: '#/components/schemas/Money' }
                        negativeMargin: { type: boolean }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/reports/payable:
    get:
      tags: [logistics]
      operationId: getLogisticsReportPayable
      x-admin-permission: 'logistics:report'
      summary: A pagar por motoboy (WB-240 C2)
      description: "Custo das corridas já lançadas e ainda não pagas, por motoboy, com quem lançou (`registeredBy`, SEC-145). `format=csv` exporta (valores em centavos, BOM) e a exportação é auditada (`logistics.payable.export`). Permissão: `logistics:report`."
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date, description: 'Inclusivo; no máximo 366 dias do início' } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: courierId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [delivery, exchange_pickup, exchange_return] } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        '200':
          description: A pagar
          content:
            application/json:
              schema:
                type: object
                required: [period, data, total, runs]
                properties:
                  period: { type: object }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        courierId: { type: string, format: uuid }
                        courierName: { type: string }
                        courierPhone: { type: string }
                        runs: { type: integer }
                        total: { $ref: '#/components/schemas/Money' }
                        oldestRunAt: { type: string, format: date-time }
                        registeredBy: { type: array, items: { type: string, format: uuid } }
                  total: { $ref: '#/components/schemas/Money' }
                  runs: { type: integer }
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/logistics/stats:
    get:
      tags: [logistics]
      operationId: getLogisticsStats
      x-admin-permission: 'logistics:report'
      summary: Indicadores do piloto da logística (W.4, WB-258 C5)
      description: "Permissão `logistics:report` (super admin, operação e financeiro). Alimenta o 4º número da Logística (\"No prazo hoje\": use `from` = `to` = hoje) e o bloco \"Prazo no piloto\". Período por dia civil de Brasília da hora REAL da entrega (`deliveredAt`, WB-262). `onTime`: entregue até o fim da faixa reancorada no pagamento (`of` = entregas com faixa; `pct` nulo sem entregas). `withinCeiling`: até `entrega_max_min` (120) depois do pagamento, a meta de 95% em 2 h. `precisionMedianMinutes`: mediana de |entrega real - meio da faixa| `[HIPÓTESE: o PO não definiu a conta]`. `lateCancellations`: pedidos cancelados pelo cliente com o motivo 'Atraso na entrega'. `compensations`: cupons concedidos por atraso (`granted`), os já resgatados e o custo real deles; `abdicatedFee`: o frete que os cupons de frete grátis de compensação já zeraram. `prepByStore`: preparo real (ACEITO até PRONTO) x informado por loja, mediana, só lojas com 3 ou mais pedidos; `warn` quando o real passa do informado em 10 min ou mais (WB-258 C6). **Não traz 'atrasos por causa'**: a causa é marcada pela operação (WB-255 C5) e esse registro ainda não existe na API."
      parameters:
        - { name: from, in: query, required: true, description: 'Dia inicial (Brasília), inclusivo.', schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'Dia final (Brasília), inclusivo. No máximo 366 dias.', schema: { type: string, format: date } }
        - { name: cityId, in: query, description: 'Cidade de destino da corrida / da loja', schema: { type: string, format: uuid } }
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                type: object
                required: [period, delivered, onTime, withinCeiling, precisionMedianMinutes, lateCancellations, compensations, prepByStore]
                properties:
                  period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
                  delivered: { type: integer }
                  onTime: { type: object, required: [count, of, pct], properties: { count: { type: integer }, of: { type: integer }, pct: { type: [number, 'null'] } } }
                  withinCeiling: { type: object, required: [count, of, pct, ceilingMinutes], properties: { count: { type: integer }, of: { type: integer }, pct: { type: [number, 'null'] }, ceilingMinutes: { type: integer } } }
                  precisionMedianMinutes: { type: [number, 'null'] }
                  lateCancellations: { type: integer }
                  compensations:
                    type: object
