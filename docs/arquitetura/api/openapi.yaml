          application/json:
            schema:
              $ref: '#/components/schemas/ResetAdminAccessRequest'
      responses:
        '204':
          description: TOTP redefinido
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/totp/setup:
    post:
      tags: [admin-users]
      operationId: setupTotp
      summary: Iniciar a configuração do TOTP
      description: "Única área liberada a um admin sem segundo fator. 409 se já configurado. SEC-113: se o TOTP foi perdido (usou código de recuperação), só a sessão aberta por código de recuperação pode reconfigurar (403 `RECOVERY_SESSION_REQUIRED` nas demais); no primeiro enrolamento vale o prazo de 48 h (403 `ENROLLMENT_EXPIRED`)."
      responses:
