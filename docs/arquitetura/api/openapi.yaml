      tags: [search]
      operationId: clearSearchHistory
      summary: Limpar histórico
      description: "Apaga tudo da conta (LGPD). O app apaga também o do aparelho."
      responses:
        '204':
          description: Apagado
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Minha sacola, com valores vigentes (WB-020)
      description: "Uma sacola por conta, de uma loja só (DEC-006). Sempre recalculada na leitura (RN-05): preço, estoque, horário e frete. O que mudou vem como `warnings` por item (`PRICE_CHANGED`, `QUANTITY_EXCEEDS_STOCK`, `OUT_OF_STOCK`, `UNAVAILABLE`) e a leitura NÃO altera o que o cliente colocou; `POST /v1/cart/acknowledge` aceita as mudanças. `summary` já usa os valores vigentes (item esgotado fica de fora do subtotal). `delivery`: com `mode=delivery`, o endereço é `addressId` (do dono, senão 404) ou o padrão da conta; sem endereço, `estimated=true` e o frete é 'a partir de'. `checkout.blockers` lista o que impede o pagamento: loja fechada e frete/mínimo NÃO impedem montar a sacola (DEC-022). Sacola parada além de `carrinho_validade_dias` (7) é esvaziada com o aviso `CART_EXPIRED`. Cupom é reavaliado a cada leitura: `coupon.applied=false` com `rejection` quando deixou de valer (o código fica guardado)."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      responses:
        '200':
          description: Sacola
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [cart]
      operationId: clearCart
      summary: Esvaziar a sacola
      description: "Remove todos os itens e o cupom. Devolve a sacola vazia."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      responses:
        '200':
          description: Sacola vazia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/cart/items/{variantId}:
    parameters:
      - { name: variantId, in: path, required: true, description: 'ID da variação (vem de GET /v1/browse/products)', schema: { type: string, format: uuid } }
    put:
      tags: [cart]
      operationId: setCartItem
      summary: Definir a quantidade de uma variação (adicionar ou alterar)
      description: "IDEMPOTENTE: define a quantidade absoluta, então repetir em rede ruim é seguro (não precisa de `Idempotency-Key`). Acima do disponível ou de `item_qtd_max` (50) ajusta ao máximo e devolve o aviso `QUANTITY_ADJUSTED` em `notices` (WB-020 C2). Para remover, use DELETE. Loja fechada não impede adicionar (DEC-022). Item de OUTRA loja: 409 `CART_STORE_CONFLICT` com `currentStore`, `newStore` e `itemCount` (o app mostra 'Esvaziar a sacola?'); repetir com `replaceStore: true` esvazia e adiciona (WB-021). 404: variação inexistente ou de loja não visível; 422 `OUT_OF_STOCK` ou `ITEM_UNAVAILABLE`."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCartItemRequest' }
      responses:
        '200':
          description: Sacola atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "`CART_STORE_CONFLICT`: a sacola tem itens de outra loja"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CartStoreConflictProblem' }
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: Remover uma variação da sacola
      description: "Idempotente: remover o que não está na sacola também responde 200. Ao remover o último item a sacola fica sem loja e sem cupom."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      responses:
        '200':
          description: Sacola atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/cart/coupon:
    put:
      tags: [cart]
      operationId: applyCartCoupon
      summary: Aplicar ou trocar o cupom (WB-022)
      description: "Substitui o cupom anterior (não cumulativo). Recusa com 422 e `code` específico, sem mudar a sacola: `COUPON_NOT_FOUND`, `COUPON_NOT_STARTED`, `COUPON_EXPIRED`, `COUPON_EXHAUSTED`, `COUPON_ALREADY_USED`, `COUPON_MIN_ORDER`, `COUPON_OTHER_STORE`, `COUPON_FIRST_PURCHASE_ONLY`, `COUPON_EMAIL_UNVERIFIED` (cupom da plataforma e de primeira compra exigem e-mail confirmado), `COUPON_NOT_ALLOWED` (membro da loja na própria loja); `CART_EMPTY` sem itens. O texto em pt-BR vem em `detail`. Cupom que zeraria o total cobra o mínimo (`minimumTotalApplied`); cupom da plataforma é limitado à comissão (`platformDiscountCapped`). Limite de 30 tentativas por hora por IP."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyCouponRequest' }
      responses:
        '200':
          description: Cupom aplicado; sacola com o desconto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [cart]
      operationId: removeCartCoupon
      summary: Remover o cupom
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      responses:
        '200':
          description: Sacola sem cupom
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/cart/acknowledge:
    post:
      tags: [cart]
      operationId: acknowledgeCart
      summary: Aceitar o que mudou ("Aceitar e continuar")
      description: "Grava o que a leitura já mostrou: ajusta quantidades ao disponível e atualiza os preços vistos; some o aviso `PRICE_CHANGED`. Item esgotado ou fora do ar NÃO é removido sozinho (o cliente remove). É o passo entre `409 CART_CHANGED` do checkout e a nova tentativa."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      responses:
        '200':
          description: Sacola atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/cart/merge:
    post:
      tags: [cart]
      operationId: mergeCart
      summary: Juntar a sacola do visitante ao entrar na conta (RN-05)
      description: "O visitante monta a sacola no aparelho; ao entrar, o app envia os itens (até 50). Conta com sacola vazia adota os itens; mesma loja soma as quantidades até o estoque; loja diferente MANTÉM a da conta e avisa (`MERGE_KEPT_ACCOUNT_CART`). Item inválido é ignorado com `MERGE_ITEM_SKIPPED`. Cupom não faz parte (o visitante não aplica cupom offline)."
      parameters:
        - { $ref: '#/components/parameters/CartMode' }
        - { $ref: '#/components/parameters/CartAddressId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeCartRequest' }
      responses:
        '200':
          description: Sacola unificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/stores/{storeId}/orders:
    get:
      tags: [orders]
      operationId: listStoreOrders
