      operationId: getStoreStatementCsv
      summary: Extrato exportável em CSV (WB-077)
      description: "Permissão da loja `finance`. UTF-8 com BOM, separador `;`, valores em reais com vírgula; até 5.000 pedidos mais recentes do período. Células que começam com `=`, `+`, `-` ou `@` saem com apóstrofo. A exportação é auditada (`store.finance.export`). Limite de 20 por hora."
