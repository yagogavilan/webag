  /v1/admin/logistics/deliveries:
    get:
      tags: [logistics]
      operationId: listDeliveries
      summary: Fila de corridas (WB-230)
      description: "`tab=active` (padrão): mais antiga primeiro, a partir do horário de \"pronto\" (que não muda ao reatribuir), com `waitingMinutes` e `sla` (ok, long, late) pelos parâmetros `logistica_sla_atribuir_min` e `logistica_sla_atribuir_critico_min`. `tab=done`: concluídas hoje. Filtros no servidor. Permissão: `logistics:read`."
      parameters:
