      tags: [exchanges]
      operationId: switchExchangeToStore
      summary: "Levar o item à loja em vez da coleta (B.1)"
      description: "Depois de aprovada (`awaiting_fee` ou `approved`) e com a taxa de coleta AINDA NÃO paga: cancela a corrida de coleta, zera a taxa e gera o código do balcão (`storeCode`); se sobra só a diferença de preço, continua `awaiting_fee`. 409 `EXCHANGE_NOT_SWITCHABLE`, `EXCHANGE_FEE_ALREADY_PAID` (cancele a troca: a taxa volta integral) ou `EXCHANGE_PICKUP_STARTED` (motoboy já a caminho). Repetir é idempotente."
