        description: { type: string, maxLength: 500 }
        method: { type: string, enum: [pickup_at_home, drop_at_store] }
        resolution: { type: string, enum: [replace, refund], description: 'Padrão: `refund` no arrependimento, `replace` nos demais.' }
        newVariantId: { type: string, format: uuid, description: 'Variação desejada (com `replace`); em defeito, omitido = a mesma peça.' }
        photoIds: { type: array, maxItems: 5, items: { type: string, format: uuid } }
    CancelExchangeRequest:
      type: object
