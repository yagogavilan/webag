              schema: { $ref: '#/components/schemas/SearchHistoryList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [search]
      operationId: recordSearchTerm
      summary: Registrar um termo buscado
      description: "O app chama ao confirmar a busca (não a cada tecla). Termo repetido (sem acento, caixa e espaços extras) só volta ao topo; o 11º mais antigo é descartado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordSearchTermRequest' }
      responses:
