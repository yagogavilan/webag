        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/favorites:
    get:
      tags: [favorites]
      operationId: listFavorites
      summary: Meus favoritos (WB-019)
      description: "Mais recentes primeiro, paginado por cursor. `kind` filtra por loja ou produto. Favorito de loja ou produto que saiu do ar vem com `unavailable=true` (selo 'Indisponível') e pode ser removido. Teto de 200 por conta."
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [store, product] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Favoritos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoritePage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/favorites/stores/{storeId}:
    parameters:
      - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [favorites]
      operationId: addFavoriteStore
      summary: Favoritar loja
      description: "Idempotente: repetir devolve 204 sem duplicar. Loja inexistente ou não visível: 404. 422 `FAVORITES_LIMIT_REACHED` no teto."
      responses:
        '204':
          description: Favoritada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [favorites]
      operationId: removeFavoriteStore
      summary: Desfavoritar loja
      description: "Idempotente: 204 mesmo que não estivesse favoritada."
      responses:
        '204':
          description: Removida
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/favorites/products/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [favorites]
      operationId: addFavoriteProduct
      summary: Favoritar produto
      description: "Idempotente. Produto inexistente, inativo ou de loja não aprovada: 404."
      responses:
        '204':
          description: Favoritado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [favorites]
      operationId: removeFavoriteProduct
      summary: Desfavoritar produto
      responses:
        '204':
