      operationId: searchStores
      summary: Buscar lojas que entregam na posição (público)
      description: "Sem `q`, lista todas as lojas alcançáveis (serve à tela 'ver todas' e à categoria). `q` ignora acento e caixa, tolera 1 erro de digitação a partir de 4 letras, mínimo de 2 letras (400 abaixo disso). Filtros combinam em E. `freeShipping`: taxa R$ 0 nesse endereço. `minRating` só considera lojas com média pública (3+ avaliações). `categoryId` inclui as filhas. Ordenação: `relevance` (abertas primeiro, relevância do nome, distância), `distance`, `rating`, `fee` (menor taxa). Paginação por cursor opaco. Limite de 90 req/min por IP."
      security: []
      parameters:
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: maxDistanceKm, in: query, schema: { type: number, minimum: 0.5, maximum: 50 } }
        - { name: freeShipping, in: query, schema: { type: string, enum: ['true'] } }
        - { name: minRating, in: query, schema: { type: number, minimum: 1, maximum: 5 } }
        - { name: acceptsExchange, in: query, schema: { type: string, enum: ['true'] } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, distance, rating, fee], default: relevance } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Lojas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreCardPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/search/products:
    get:
      tags: [search]
      operationId: searchProducts
      summary: Buscar produtos de lojas que entregam na posição (público)
      description: "Só produto ativo, não pausado/removido pela moderação e com disponível (estoque - reservado) maior que zero, de loja visível ali. Produto de loja fechada aparece com `store.open=false` (selo 'Fechada'; o pagamento é bloqueado depois, DEC-022). Preço filtrado e ordenado é o vigente do produto (promoção dentro da janela). `minPriceCents` maior que `maxPriceCents` responde 400. Demais filtros como em `searchStores`. `sort`: `relevance`, `price_asc`, `distance`, `rating`, `discount`."
      security: []
      parameters:
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: minPriceCents, in: query, schema: { type: integer, minimum: 0, maximum: 9999999 } }
        - { name: maxPriceCents, in: query, schema: { type: integer, minimum: 0, maximum: 9999999 } }
        - { name: maxDistanceKm, in: query, schema: { type: number, minimum: 0.5, maximum: 50 } }
        - { name: freeShipping, in: query, schema: { type: string, enum: ['true'] } }
        - { name: minRating, in: query, schema: { type: number, minimum: 1, maximum: 5 } }
        - { name: acceptsExchange, in: query, schema: { type: string, enum: ['true'] } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, price_asc, distance, rating, discount], default: relevance } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Produtos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCardPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/search/suggestions:
    get:
      tags: [search]
      operationId: getSearchSuggestions
      summary: Sugestões enquanto digita (público)
      description: "Até 5 produtos, 5 lojas e 5 categorias. Com menos de 2 caracteres devolve listas vazias. O app espera 300 ms de pausa antes de chamar (WB-013 C4)."
      security: []
      parameters:
        - { $ref: '#/components/parameters/Lat' }
        - { $ref: '#/components/parameters/Lng' }
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Sugestões
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggestions' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/browse/stores/{storeId}:
    get:
      tags: [browse]
      operationId: getBrowseStore
      summary: Página pública da loja (WB-016)
      description: "Loja visível (aprovada, conta de recebimento ativa, 1+ produto ativo); qualquer outra, inexistente ou id inválido responde 404. Loja fechada é visível e navegável (DEC-022): `open=false` com `opensAt` (próxima abertura, nulo se pausada sem prazo) e `hoursToday`. Com `lat`/`lng` (juntas), `delivery` traz a entrega para aquela posição pela mesma conta do checkout (`available=false` = 'Não entrega no seu endereço'; `pickup.offered` diz se vale mostrar 'Retirar na loja': loja com retirada a até `retirada_distancia_max_km`); sem elas, `delivery.available` e `feeCents` vêm nulos. `supplier` traz a identificação do fornecedor com documento mascarado. Nota 'Novo' (`rating.isNew`) abaixo de 3 avaliações."
      security: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: Loja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowseStore' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/browse/stores/{storeId}/products:
    get:
      tags: [browse]
      operationId: listBrowseStoreProducts
      summary: Vitrine da loja (WB-016 C2)
      description: "Disponíveis primeiro, na ordem das seções da loja e dos produtos; sem estoque ao final com `available=false` ('Indisponível'). Só produto ativo e não pausado/removido pela moderação. Filtro por seção; paginação por cursor."
      security: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sectionId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Produtos da loja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowseProductPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/browse/stores/{storeId}/reviews:
    get:
      tags: [browse]
      operationId: listBrowseStoreReviews
      summary: Avaliações da loja (WB-018)
      description: "Só leitura: mais recentes primeiro, 10 por página (`limit` até 50), só publicadas. `summary.average` nula antes de 3 avaliações ('Novo'); os comentários existentes aparecem. Nome do autor reduzido ('Maria S.')."
      security: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Avaliações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/browse/products/{productId}:
    get:
      tags: [browse]
      operationId: getBrowseProduct
      summary: Página pública do produto (WB-017)
      description: "Variações com estoque próprio: `available=false` não é selecionável; `lastUnits` (1 a 3) mostra 'Últimas X unidades'; `maxQuantity` é o teto da quantidade (disponível limitado por `item_qtd_max`). O estoque exato nunca sai. Preço vigente por variação (promoção do produto herdada por percentual). Produto pausado ou removido pela moderação responde 200 com `available=false`, `unavailableReason` (`PAUSED`, `MODERATED`) e só `store` (atalho para a loja); rascunho, arquivado, inexistente ou de loja invisível responde 404."
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowseProduct' }
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/browse/products/{productId}/reviews:
    get:
      tags: [browse]
      operationId: listBrowseProductReviews
      summary: Avaliações do produto (WB-018)
      description: "Igual às da loja, para o produto."
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
