      description: "O painel repassa `code` e `state` do retorno do provedor. `state` de outra sessão, de outra loja, reutilizado ou vencido: 400 `OAUTH_STATE_INVALID` e nada é vinculado. Titular com CPF/CNPJ diferente da loja: `under_review` e a loja não fica apta até o admin liberar. Conta já usada por outra loja: 409 `PAYMENT_ACCOUNT_IN_USE`. Provedor `fake`: `code` = `fake-ok`."
