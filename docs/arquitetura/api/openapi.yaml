                courierId: { type: string, format: uuid }
                addressConfirmed: { type: boolean }
      responses:
        '200':
          description: Corrida atribuída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
