      tags: [exchanges]
      operationId: contestExchange
      summary: Contestar a recusa da loja (WB-176)
      description: "Só recusa da LOJA (a decisão do admin é final), uma vez e em até `contestacao_dias` (7) depois da recusa: 409 `EXCHANGE_NOT_CONTESTABLE` ou `EXCHANGE_CONTEST_EXPIRED`. A troca vai à mediação (`in_mediation`) e a loja e o admin são avisados. Repetir é idempotente (200). Texto de 10 a 500 caracteres. O campo `contestableUntil` da troca diz até quando cabe contestar."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Em mediação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/exchanges/{id}/payment:
    get:
      tags: [exchanges]
      operationId: getExchangePayment
      summary: Pagamento da taxa de coleta e da diferença
      description: "Estado da última tentativa (PIX copia e cola, 3DS). Somente leitura."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangePayment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [exchanges]
      operationId: payExchange
      summary: Pagar a taxa de coleta e a diferença de preço
      description: "Só em `awaiting_fee` (depois da aprovação da loja), dentro de `troca_taxa_pagamento_h`. Cobrança na conta da Webag (sem split): a taxa é receita da Webag. Valor = taxa + diferença positiva. Repetir com o PIX pendente devolve o mesmo pagamento. Aceita `Idempotency-Key` (opcional; mesma chave e corpo devolvem o mesmo resultado, corpo diferente é 409 `IDEMPOTENCY_KEY_REUSED`). Pagamento simultâneo da mesma troca (toque duplo, 2 aparelhos) gera uma só cobrança: a outra chamada recebe 409 `EXCHANGE_PAYMENT_IN_PROGRESS` (tente de novo em 2 s) ou `EXCHANGE_NOT_AWAITING_FEE` (I8). A confirmação vem só do webhook assinado (SEC-035); aprovado, a troca vai a `approved` e a coleta entra na fila da logística."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayExchangeRequest' }
      responses:
        '200':
          description: Pagamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangePayment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/stores/{storeId}/exchanges:
    get:
      tags: [exchanges]
      operationId: listStoreExchanges
      summary: Fila de trocas da loja (WB-172)
      description: "Permissão da loja `exchanges`. `scope`: pending (aguardando resposta), in_progress, history."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: scope, in: query, schema: { type: string, enum: [pending, in_progress, history] } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangePage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stores/{storeId}/exchanges/{id}:
    get:
      tags: [exchanges]
      operationId: getStoreExchange
      summary: Detalhe da troca para a loja
      description: "Troca de outra loja: 404."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Troca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stores/{storeId}/exchanges/{id}/accept:
    post:
      tags: [exchanges]
      operationId: acceptExchange
      summary: Loja aprova a troca
      description: "Congela taxa e diferença, reserva o tamanho novo. Com taxa a pagar vai a `awaiting_fee`; sem nada a pagar, libera a coleta na fila da logística (ou o código do balcão). Sem estoque do tamanho pedido: 409 `EXCHANGE_NO_STOCK`. Repetir é idempotente."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Aprovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/stores/{storeId}/exchanges/{id}/refuse:
    post:
      tags: [exchanges]
      operationId: refuseExchange
      summary: Loja recusa a troca
      description: "Motivo obrigatório. Tamanho/cor vira `rejected`; defeito vai à mediação; arrependimento não pode ser recusado (409 `EXCHANGE_CANNOT_REJECT`). Recusa nunca gera cobrança."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefuseExchangeRequest' }
      responses:
        '200':
          description: Recusada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/stores/{storeId}/exchanges/{id}/receive:
    post:
      tags: [exchanges]
      operationId: receiveExchange
      summary: Loja confere o item recebido (WB-173)
      description: "`ok: true` segue a resolução: reembolso (item e, no arrependimento, a taxa de entrega paga; cupom proporcional), troca no balcão ou liberação da reentrega pela logística (a peça nova só sai depois da antiga conferida). `ok: false` (com `reason`) vai à mediação. Troca na loja exige o `code` do cliente (5 tentativas, depois 429 `EXCHANGE_CODE_LOCKED`); coleta em casa exige a coleta confirmada (409 `ITEM_NOT_COLLECTED`)."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveExchangeRequest' }
      responses:
        '200':
          description: Conferida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exchange' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/orders/{orderId}/reviews:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [orders]
      operationId: createOrderReview
      summary: Avaliar um produto ou a loja de um pedido entregue (WB-031, WB-247)
      description: "Só pedido ENTREGUE, até `avaliacao_janela_dias` (30) depois da entrega (422 `REVIEW_WINDOW_CLOSED`; 409 `ORDER_NOT_DELIVERED`). Com `productId` (produto que está no pedido) avalia o produto e aceita `fit` (\"Como vestiu?\"); sem `productId` avalia a loja e `fit` é recusado. Uma por produto e uma da loja por pedido; sem edição: repetir devolve 409 `REVIEW_ALREADY_EXISTS` (o app trata como já enviada). Pedido de outra conta: 404."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [orders]
      operationId: listOrderReviews
      summary: Avaliações que o cliente já fez neste pedido
      description: "Para o app saber o que ainda falta avaliar. Pedido de outra conta: 404."
      responses:
        '200':
          description: Avaliações
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/OrderReview' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/exchanges/mediations:
    get:
      tags: [exchanges]
      operationId: listExchangeMediations
      summary: Fila "Em mediação" (WB-110)
      description: "Mais antiga primeiro, com `overdue` quando passa de `mediacao_dias_uteis` dias úteis e `origin` (`customer_contest`, `store_refusal` ou `inspection_failed`). `refusalNotAllowedByLaw` avisa que a recusa da loja não é permitida por lei (arrependimento; defeito dentro do prazo) e sugere aprovar. Permissão: `exchanges:mediate` (super admin e operação)."
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Fila
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        orderId: { type: string, format: uuid }
                        storeId: { type: string, format: uuid }
                        type: { type: string, enum: [withdrawal, defect, size_color] }
                        resolution: { type: string, enum: [replace, refund] }
                        origin: { type: string, enum: [customer_contest, store_refusal, inspection_failed] }
                        storeReason: { type: [string, 'null'] }
                        customerText: { type: [string, 'null'] }
                        photoCount: { type: integer }
                        startedAt: { type: string, format: date-time }
                        deadlineAt: { type: string, format: date-time }
                        overdue: { type: boolean }
                        refusalNotAllowedByLaw: { type: boolean }
                  nextCursor: { type: [string, 'null'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/exchanges/mediations/{exchangeId}/decision:
    post:
      tags: [exchanges]
      operationId: decideExchangeMediation
      summary: Decidir a mediação (WB-110 C2)
      description: "`customer` (a favor do cliente): antes de a loja receber o item, a troca é aprovada e segue o fluxo (inclusive a taxa); com o item já na loja, vale a inspeção como aprovada (reembolso ou peça nova). `store`: recusa FINAL, libera a reserva e o cliente não pode contestar de novo. Justificativa de 10 a 200 caracteres, registrada no histórico da troca; as partes são avisadas. 409 `EXCHANGE_NOT_IN_MEDIATION` se já decidida. Permissão: `exchanges:mediate`."
      parameters:
        - { name: exchangeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [customer, store] }
                reason: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: Decidida
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [decided] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/exchanges/report:
    get:
      tags: [exchanges]
      operationId: getExchangesReport
      summary: Relatório de trocas por loja e categoria (WB-248)
      description: "Permissão de admin `exchanges:report` (operação, financeiro e super admin). Período em dias de Brasília, no máximo 366 dias. Traz pedidos entregues, trocas por tipo, taxa de troca por loja (com `alert` acima de `troca_taxa_alerta_pct`), tamanho/cor com e sem tabela de medidas, resolvida como troca ou reembolso, aprovação automática, mediações e tempo até resolver. Receita da taxa e custo das corridas (`feeRevenue`, `logisticsCost`, `netLogisticsCost`) só para financeiro e super admin. `format=csv` exporta por loja e é auditado."
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ExchangeType' } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: Relatório
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangesReport' }
            text/csv:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/push-devices:
    put:
      tags: [me]
      operationId: registerPushDevice
      summary: Registrar o aparelho para push (RF-NOT-01)
      description: "Token do Expo (`ExponentPushToken[...]`) e plataforma. Idempotente. O token é do aparelho: se outra conta entrar no mesmo aparelho, o token passa a ela e a anterior deixa de receber. Push transacional (pedido e troca) não exige consentimento; marketing exige (`marketing_push`). O push nunca leva dado pessoal nem o código de retirada."
      requestBody:
        required: true
        content:
          application/json:
