        destination: { type: [string, 'null'], description: 'Bairro e cidade.' }
        customerPhoneMasked: { type: [string, 'null'], description: "Telefone do cliente mascarado '(11) 9****-7777' enquanto a corrida está ativa (SEC-144); o número inteiro e o endereço só por `contact-reveal`" }
        contactRevealable: { type: boolean, description: 'Há contato a revelar (corrida ativa, antes da retenção)' }
        dropoffPinVerified: { type: [boolean, 'null'], description: 'SEC-169 / DEC-067 (Y.2): `false` = o pino do endereço de entrega NÃO foi conferido (sem geocodificador contratado): a Logística confirma o endereço com o cliente antes de despachar. Nulo = não se sabe (pedido antigo, troca ou contato já apagado). Sem dado pessoal. Campo novo opcional.' }
        fee: { $ref: '#/components/schemas/Money' }
        expectedCost: { $ref: '#/components/schemas/Money' }
