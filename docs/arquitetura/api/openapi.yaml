        failReason: { type: [string, 'null'] }
        whatsappSentAt: { type: [string, 'null'], format: date-time }
        lateAlertedAt: { type: [string, 'null'], format: date-time, description: 'W.3: quando o alerta de atraso saiu (um por corrida; o painel toca o som uma vez). Nulo enquanto não passou do prazo. Campo novo opcional.' }
        lateCancelRequest: { oneOf: [{ $ref: '#/components/schemas/CancelRequest' }, { type: 'null' }], description: 'W.3 (WB-255 C6): o pedido de cancelamento por atraso mais recente do pedido (só corrida de entrega; `respondBy` = pedido + `entrega_cancel_resposta_min`) para a faixa "O cliente pediu cancelamento. Responda em 06:58". A resposta é `adminRespondLateCancel`. Nulo se nunca houve. Campo novo opcional.' }
        deliveredAt: { type: [string, 'null'], format: date-time, description: 'WB-262: a hora REAL da entrega (a informada pela operação, ou a do clique em "entregue"); nulo enquanto não entregue. Base da compensação, da pontualidade e dos relatórios. Campo novo opcional.' }
