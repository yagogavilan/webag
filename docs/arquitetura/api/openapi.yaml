              schema: { $ref: '#/components/schemas/CardIntentView' }
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/card-intents/{token}/pay:
    post:
      tags: [orders]
      operationId: payCardIntent
      summary: "Página segura: concluir com o token do cartão (sem login)"
      description: "O navegador manda o TOKEN gerado pelo MP.js (nunca o número). Consome a intenção (uso único; duas chamadas simultâneas: só uma vence) e cria o pedido da conta dona da intenção. 422 `PAYMENT_DECLINED` (texto seguro), 410 se a intenção foi usada, venceu ou a sessão do app foi encerrada, 409 `CART_CHANGED` se a sacola ou o total mudaram. 3DS: devolve `threeDsUrl`."
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardIntentPayRequest' }
      responses:
        '200':
          description: Pedido criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardIntentResult' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/help:
    get:
      tags: [help]
      operationId: getHelp
      summary: Ajuda pública (perguntas publicadas e contatos)
      description: "Visitante, cliente e lojista (`audience=customer|merchant`). Texto e contatos vêm da configuração editada pelo admin (WB-034 C1); cache de 60 s no servidor. Grupo sem pergunta publicada não vem. `privacy` traz o encarregado (WB-217 C1)."
      security: []
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [customer, merchant], default: customer } }
      responses:
        '200':
          description: Ajuda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Help' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/admin/help/faqs:
    get:
      tags: [help]
      operationId: listHelpFaqs
      summary: Perguntas da ajuda (admin)
      description: "`help:read` (todos os perfis de admin)."
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [customer, merchant] } }
      responses:
        '200':
          description: Perguntas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpFaqList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [help]
      operationId: createHelpFaq
      summary: Nova pergunta (operação e super admin)
      description: "Grupos do cliente: order, payment, exchange, account; do lojista: orders, products, exchanges, money, team. Entra no fim do grupo. Auditado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelpFaqCreate' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpFaq' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/help/faqs/reorder:
    post:
      tags: [help]
      operationId: reorderHelpFaqs
      summary: Nova ordem de um grupo
      description: "`ids` precisa ser exatamente o conjunto de perguntas do grupo, uma vez cada (400 caso contrário)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audience, group, ids]
              properties:
                audience: { type: string, enum: [customer, merchant] }
                group: { type: string }
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Perguntas do público na nova ordem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpFaqList' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/help/faqs/{id}:
    patch:
      tags: [help]
      operationId: updateHelpFaq
      summary: Editar, mover de grupo ou (des)publicar uma pergunta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                group: { type: string }
                question: { type: string, maxLength: 100 }
                answer: { type: string, maxLength: 600 }
                published: { type: boolean }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpFaq' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [help]
      operationId: deleteHelpFaq
      summary: Apagar uma pergunta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Apagada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/help/contacts:
    get:
      tags: [help]
      operationId: getHelpContacts
      summary: Contatos do suporte e do encarregado
      responses:
        '200':
          description: Contatos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpContacts' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [help]
      operationId: putHelpContacts
      summary: Salvar contatos (campo ausente = não muda; nulo ou vazio = apaga)
      description: "`help:write`. WhatsApp com DDD (10 a 13 dígitos), e-mails válidos, horário até 60 caracteres. Auditado."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelpContactsPatch' }
      responses:
        '200':
          description: Contatos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpContacts' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/reports:
    post:
      tags: [content-reports]
      operationId: reportContent
      summary: Denunciar avaliação, produto ou loja (DN1)
      description: "Sempre `202 { received: true }`, também na repetição (uma por alvo e denunciante) e na denúncia da própria avaliação: não revela o que já existia. Dono e equipe da loja não denunciam a própria loja ou produto (403 `CANNOT_REPORT_OWN`). 20 por hora."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentReportRequest' }
      responses:
        '202':
          description: Recebida
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties: { received: { type: boolean, enum: [true] } }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/reports:
    get:
      tags: [content-reports]
      operationId: listMyReports
      summary: O que já denunciei (o menu mostra "Denunciada")
      responses:
        '200':
          description: Alvos denunciados por mim
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [targetType, targetId]
                      properties:
                        targetType: { type: string, enum: [review, product, store] }
                        targetId: { type: string, format: uuid }
                  nextCursor: { type: 'null' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/content-reports:
    get:
      tags: [content-reports]
      operationId: listContentReports
      summary: Fila de denúncias por alvo (DN2)
      description: "`moderation:read` (super admin e operação). Várias denúncias do mesmo item viram uma linha, a mais antiga primeiro, com `overdue` depois de `denuncia_prazo_dias_uteis` dias úteis."
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string, enum: [review, product, store] } }
        - { name: status, in: query, schema: { type: string, enum: [open, handled], default: open } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReportQueue' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/content-reports/{targetType}/{targetId}:
    get:
      tags: [content-reports]
      operationId: getContentReport
      summary: "Caso: item denunciado e denúncias (denunciante abreviado)"
      parameters:
        - { name: targetType, in: path, required: true, schema: { type: string, enum: [review, product, store] } }
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Caso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReportCase' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/content-reports/{targetType}/{targetId}/keep:
    post:
      tags: [content-reports]
      operationId: keepReportedContent
      summary: "Manter (encerra as denúncias e avisa os denunciantes por e-mail)"
      description: "`moderation:write`. 409 `REPORT_ALREADY_HANDLED` se não há denúncia aberta."
      parameters:
        - { name: targetType, in: path, required: true, schema: { type: string, enum: [review, product, store] } }
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { note: { type: string, minLength: 3, maxLength: 200 } }
      responses:
        '200':
          description: Encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReportOutcome' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/content-reports/review/{targetId}/remove:
    post:
      tags: [content-reports]
      operationId: removeReportedReview
      summary: Remover a avaliação (ofensa, dado pessoal, ilegal ou spam)
      description: "`moderation:write`. NÃO existe o motivo \"avaliação negativa\" (RN-12). A nota deixa de contar, o autor e os denunciantes são avisados por e-mail e a ação é auditada (`review.removed`)."
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                reasonCode: { type: string, enum: [offense, personal_data, illegal, spam] }
                note: { type: string, maxLength: 150 }
      responses:
        '200':
          description: Removida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReportOutcome' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/content-reports/{targetType}/{targetId}/forward:
    post:
      tags: [content-reports]
      operationId: forwardReportedContent
      summary: Encaminhar produto ou loja à moderação própria
      description: "Só `product` e `store` (avaliação se mantém ou se remove). Devolve `next` com o destino da moderação."
      parameters:
        - { name: targetType, in: path, required: true, schema: { type: string, enum: [product, store] } }
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Encaminhada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentReportOutcome' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/stores/{storeId}/reviews:
    get:
      tags: [stores]
      operationId: listStoreReviews
      summary: Avaliações da loja no painel (com a resposta)
      description: "Permissão da loja `reviews`. Só publicadas; autor abreviado ('Joana L.'). Funcionário sem a permissão: 403; outra loja: 404."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: replied, in: query, schema: { type: boolean } }
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreReviewPage' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stores/{storeId}/reviews/{reviewId}/reply:
    put:
      tags: [stores]
      operationId: replyToReview
      summary: Responder (ou editar a resposta) a uma avaliação
      description: "Permissão da loja `reviews`. Uma resposta pública por avaliação, até 500 caracteres; a resposta aparece nas avaliações públicas (`storeReply`). Avaliação de outra loja ou removida: 404."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties: { text: { type: string, minLength: 1, maxLength: 500 } }
      responses:
        '200':
          description: Resposta publicada
          content:
            application/json:
              schema:
                type: object
                required: [id, storeReply, storeRepliedAt]
                properties:
                  id: { type: string, format: uuid }
                  storeReply: { type: string }
                  storeRepliedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [stores]
      operationId: deleteReviewReply
      summary: Apagar a resposta (idempotente)
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Apagada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor`
      schema: { type: string, maxLength: 200 }
    CartMode:
      name: mode
      in: query
      description: Como o cliente quer receber; define frete e bloqueios do resumo
      schema: { type: string, enum: [delivery, pickup], default: delivery }
    CartAddressId:
      name: addressId
      in: query
      description: "Endereço de entrega (de `/v1/me/addresses`); sem ele vale o padrão da conta. Endereço de outra conta responde 404"
      schema: { type: string, format: uuid }
    Lat:
      name: lat
      in: query
      required: true
      description: Latitude da posição do cliente (endereço salvo, CEP ou GPS)
      schema: { type: number, minimum: -90, maximum: 90 }
    Lng:
      name: lng
      in: query
      required: true
      description: Longitude da posição do cliente
      schema: { type: number, minimum: -180, maximum: 180 }
    Limit:
      name: limit
      in: query
      description: Itens por página (padrão 20, máximo 50)
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  responses:
    ValidationError:
      description: Entrada inválida (campo desconhecido, formato ou tamanho). `errors[]` lista os campos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Não autenticado, token inválido ou sessão encerrada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sem permissão (ou `REAUTH_REQUIRED`, `MFA_REQUIRED`, `EMAIL_VERIFICATION_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Não encontrado (também para recurso de outro usuário, sem revelar existência)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito de estado ou duplicidade
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Convite inválido, usado, revogado ou vencido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regra de negócio violada (senha fraca, fora da faixa...)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de tentativas. Header `Retry-After` em segundos.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    HealthIndicator:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
    HealthStatus:
      type: object
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
        info:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
    Money:
      type: object
      description: Valor monetário em centavos.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Centavos
          example: 1990
        currency:
          type: string
          enum: [BRL]
    Problem:
      type: object
      description: Erro no formato RFC 9457.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável; o cliente decide a ação por ele.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LegalDocumentType:
      type: string
      enum: [customer_terms, merchant_terms, privacy]
    DocumentRef:
      type: object
      required: [type, version]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: integer, minimum: 1 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string, description: JWT HS256 de 15 min }
        refreshToken: { type: string, description: Token opaco de 256 bits, rotativo }
        expiresIn: { type: integer, description: Segundos de validade do access token, example: 900 }
        tokenType: { type: string, enum: [Bearer] }
    UserSummary:
      type: object
      required: [id, email, emailVerified, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
    AuthResult:
      type: object
      required: [user, tokens, mfaSetupRequired]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        mfaSetupRequired: { type: boolean, description: Admin sem TOTP configurado (ou que usou código de recuperação). Só a configuração do TOTP fica liberada. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, adultDeclaration, acceptedDocuments]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, description: 'Celular brasileiro, ex.: (11) 99999-9999' }
        password: { type: string, description: '8 a 128 caracteres, fora da lista de senhas comuns (422 WEAK_PASSWORD)' }
        adultDeclaration: { type: boolean, enum: [true], description: Declaração de ter 18 anos ou mais }
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          description: Versões exibidas ao usuário. Devem ser as vigentes de customer_terms e privacy (409 TERMS_OUTDATED).
          items: { $ref: '#/components/schemas/DocumentRef' }
    EmailExistsRequest:
