        - { name: status, in: query, schema: { $ref: '#/components/schemas/DeliveryStatus' } }
        - { name: kind, in: query, schema: { type: string, enum: [delivery, exchange_pickup, exchange_return] } }
        - { name: courierId, in: query, schema: { type: string, format: uuid } }
        - { name: storeId, in: query, schema: { type: string, format: uuid } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Corridas
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Delivery' } }
                  nextCursor: { type: [string, 'null'] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
