      summary: Exportar a auditoria em CSV
      description: "Mesmos filtros da listagem (sem cursor), até 5.000 linhas mais recentes; `X-Export-Truncated: true` quando há mais. Células que começam com `=`, `+`, `-` ou `@` saem com apóstrofo (sem execução em planilha). A exportação é registrada na auditoria (`audit.export`). Limite de 10 por minuto. Permissão de admin: `audit:own`."
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 80 } }
        - { name: targetType, in: query, schema: { type: string, maxLength: 40 } }
        - { name: targetId, in: query, schema: { type: string, maxLength: 80 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Arquivo CSV (UTF-8 com BOM)
          content:
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/webhooks/{provider}:
    post:
      tags: [payments]
      operationId: receivePaymentWebhook
      summary: Webhook do provedor de pagamento
      description: "Público, mas só processa notificação com `x-signature` válida (HMAC, tolerância de 300 s); o `data.id` vem da QUERY (o corpo não é assinado). Responde 2xx rápido; o processamento é assíncrono, idempotente por `x-request-id` (24 h) e re-consulta o pagamento no provedor. Sem assinatura (IPN legado): 401. Nenhum endpoint do cliente muda o estado do pagamento."
      security: []
      parameters:
        - { name: provider, in: path, required: true, description: Provedor configurado (fake ou mercadopago), schema: { type: string } }
        - { name: data.id, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: x-signature, in: header, required: true, schema: { type: string } }
        - { name: x-request-id, in: header, schema: { type: string } }
      responses:
        '200':
          description: Recebida (ou duplicada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
