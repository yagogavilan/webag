  /v1/stores/{storeId}/products/{productId}/variants/{variantId}/stock:
    post:
      tags: [catalog]
      operationId: adjustVariantStock
      summary: Ajuste rápido de estoque
      description: "Permissão da loja: `catalog` (dono, ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Catálogo só com a loja aprovada (409 `STORE_NOT_APPROVED`). `{ delta }` ou `{ set }`, sob lock da variação: dois +1 simultâneos dão +2. Não deixa o estoque abaixo do reservado (409 `STOCK_BELOW_RESERVED`) nem fora de 0..99.999 (422). Estoque baixo (disponível <= limite da loja) avisa o dono por e-mail 1 vez e rearma quando sobe acima do limite. **v1.1 R1:** `If-Match` com a `version` do produto (edição em linha da tabela: \"Este produto foi alterado agora\"). **SEC-218 (idempotência transacional):** com `Idempotency-Key`, a chave, o ajuste, a subida de `version`, a auditoria e a resposta guardada são gravados NA MESMA transação; `{ delta }` repetido com a mesma chave e o mesmo corpo devolve a mesma resposta e soma UMA vez (nem depois de queda do servidor, nem depois de 120 s); corpo diferente com a mesma chave: 422 `IDEMPOTENCY_KEY_REUSED`; erro (409 `STOCK_BELOW_RESERVED`, 409 `PRODUCT_VERSION_CONFLICT`) desfaz tudo e libera a chave, então a repetição reavalia. A chave vale por loja e por usuário. Sem a chave (app 1.0) o ajuste continua funcionando, sem proteção contra repetição."
      parameters:
