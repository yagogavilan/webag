  /v1/cep/{cep}:
    get:
      tags:
      - stores
      operationId: lookupCep
      summary: Consultar CEP (rua, bairro, cidade e coordenada)
      description: "Qualquer conta autenticada (o app do cliente consulta o CEP por aqui em vez de falar direto com o ViaCEP; o lojista, no onboarding). Limite de 60 por 10 min; resposta cacheada por CEP. `lat`/`lng` são o centro aproximado do CEP e vêm NULOS quando o geocodificador está desligado ou fora do ar (SEC-169; o lojista ajusta o pino no mapa). 404 `NOT_FOUND` se o CEP não existe; 422 `CEP_LOOKUP_UNAVAILABLE` se o serviço de CEP está fora do ar (preencher à mão)."
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{5}-?\d{3}$
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CepResult"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
