    post:
      tags: [orders]
      operationId: payCardIntent
      summary: "Página segura: concluir com o token do cartão (sem login)"
      description: "O navegador manda o TOKEN gerado pelo MP.js (nunca o número). Consome a intenção (uso único; duas chamadas simultâneas: só uma vence) e cria o pedido da conta dona da intenção. 422 `PAYMENT_DECLINED` (texto seguro), 410 se a intenção foi usada, venceu ou a sessão do app foi encerrada, 409 `CART_CHANGED` se a sacola ou o total mudaram. 3DS: devolve `threeDsUrl`."
