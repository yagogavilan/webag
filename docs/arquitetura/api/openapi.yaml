      description: "De 2 a `entrega_lote_max` corridas de entrega prontas e sem motoboy, todas da mesma cidade. 422 `INVALID_BATCH` (quantidade, tipo ou estado) e `BATCH_DIFFERENT_AREA`. Cada corrida segue a regra de `assignDelivery`; as que perderam a disputa vêm em `failed` com o `code`."
