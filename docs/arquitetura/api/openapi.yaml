        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/moderation/terms:
    get:
      tags: [moderation]
      operationId: listModerationTerms
      summary: Listas de moderação
      description: "Categorias proibidas (BLOQUEIAM o cadastro) e palavras suspeitas (só SINALIZAM). Permissão de admin: `moderation:read`."
      responses:
        '200':
          description: Itens
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ModerationTermList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [moderation]
      operationId: addModerationTerm
      summary: Adicionar item às listas
      description: "Palavra suspeita: uma palavra só, casa como palavra inteira sem caixa nem acento. Categoria proibida: id de categoria existente (a subcategoria herda). Permissão de admin: `moderation:write`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/ModerationTermRequest' }
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ModerationTerm' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/moderation/terms/{termId}:
    delete:
      tags: [moderation]
      operationId: removeModerationTerm
      summary: Remover item das listas
      description: "Não altera produtos já cadastrados. Permissão de admin: `moderation:write`."
      parameters:
        - { name: termId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor`
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: Itens por página (padrão 20, máximo 50)
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  responses:
    ValidationError:
      description: Entrada inválida (campo desconhecido, formato ou tamanho). `errors[]` lista os campos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Não autenticado, token inválido ou sessão encerrada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sem permissão (ou `REAUTH_REQUIRED`, `MFA_REQUIRED`, `EMAIL_VERIFICATION_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Não encontrado (também para recurso de outro usuário, sem revelar existência)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito de estado ou duplicidade
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Convite inválido, usado, revogado ou vencido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regra de negócio violada (senha fraca, fora da faixa...)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de tentativas. Header `Retry-After` em segundos.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    HealthIndicator:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
    HealthStatus:
      type: object
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
        info:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
    Money:
      type: object
      description: Valor monetário em centavos.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Centavos
          example: 1990
        currency:
          type: string
          enum: [BRL]
    Problem:
      type: object
      description: Erro no formato RFC 9457.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável; o cliente decide a ação por ele.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LegalDocumentType:
      type: string
      enum: [customer_terms, merchant_terms, privacy]
    DocumentRef:
      type: object
      required: [type, version]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: integer, minimum: 1 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string, description: JWT HS256 de 15 min }
        refreshToken: { type: string, description: Token opaco de 256 bits, rotativo }
        expiresIn: { type: integer, description: Segundos de validade do access token, example: 900 }
        tokenType: { type: string, enum: [Bearer] }
    UserSummary:
      type: object
      required: [id, email, emailVerified, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
    AuthResult:
      type: object
      required: [user, tokens, mfaSetupRequired]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        mfaSetupRequired: { type: boolean, description: Admin sem TOTP configurado (ou que usou código de recuperação). Só a configuração do TOTP fica liberada. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, adultDeclaration, acceptedDocuments]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, description: 'Celular brasileiro, ex.: (11) 99999-9999' }
        password: { type: string, description: '8 a 128 caracteres, fora da lista de senhas comuns (422 WEAK_PASSWORD)' }
        adultDeclaration: { type: boolean, enum: [true], description: Declaração de ter 18 anos ou mais }
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          description: Versões exibidas ao usuário. Devem ser as vigentes de customer_terms e privacy (409 TERMS_OUTDATED).
          items: { $ref: '#/components/schemas/DocumentRef' }
    EmailExistsRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailExistsResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$', description: Step-up por e-mail }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 200 }
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    CorrectEmailRequest:
      type: object
      additionalProperties: false
      required: [newEmail, password]
      properties:
        newEmail: { type: string, format: email }
        password: { type: string }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string }
    ResetPasswordResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          oneOf:
            - { $ref: '#/components/schemas/TokenPair' }
            - { type: 'null' }
        mfaRequired: { type: boolean, enum: [true], description: 'Admin com TOTP: falta o 2º fator (use `resetTicket`)' }
        resetTicket: { type: string, description: 'Ticket opaco de 256 bits, 10 min, uso único' }
        expiresIn: { type: integer, example: 600 }
    MfaChallenge:
      type: object
      required: [mfaRequired, mfaToken, expiresIn]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        mfaToken: { type: string, description: 'Token opaco de 256 bits, 5 min, uso único, 5 tentativas' }
        expiresIn: { type: integer, example: 300 }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string, minLength: 20, maxLength: 200 }
        code: { type: string, minLength: 6, maxLength: 32, description: TOTP de 6 dígitos ou código de recuperação }
    CompleteResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [resetTicket, totpCode, newPassword]
      properties:
        resetTicket: { type: string, minLength: 20, maxLength: 200 }
        totpCode: { type: string, minLength: 6, maxLength: 32, description: TOTP de 6 dígitos ou código de recuperação }
        newPassword: { type: string }
    ReauthRequest:
      type: object
      additionalProperties: false
      properties:
        password: { type: string }
        totpCode: { type: string, minLength: 6, maxLength: 32 }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password: { type: string }
    AcceptInvitationResponse:
      type: object
      required: [tokens, mfaSetupRequired]
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        mfaSetupRequired: { type: boolean, enum: [true] }
    PendingTerm:
      type: object
      required: [type, documentId, version, title, reason]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        documentId: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        reason: { type: string, enum: [first, relevant_change] }
    PendingTermsResponse:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { $ref: '#/components/schemas/PendingTerm' }
    Me:
      type: object
      required: [id, email, emailVerified, name, phone, roles, adminProfile, pendingTerms]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
        phone: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, enum: [customer, merchant] }
        adminProfile: { type: [string, 'null'], enum: [super_admin, operations, finance, support, null] }
        pendingTerms:
          type: array
          items: { $ref: '#/components/schemas/PendingTerm' }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    ChangePasswordResponse:
      type: object
      required: [tokens]
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
    MerchantRoleRequest:
      type: object
      additionalProperties: false
      required: [acceptedDocuments]
      properties:
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/DocumentRef' }
    SessionView:
      type: object
      required: [id, current, createdAt, lastUsedAt, userAgent, ip]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        userAgent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
    SessionList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SessionView' }
        nextCursor: { type: [string, 'null'] }
    AcceptTermsRequest:
      type: object
      additionalProperties: false
      required: [acceptedDocuments]
      properties:
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/DocumentRef' }
    ConsentPurpose:
      type: string
      enum: [marketing_push, marketing_email, precise_location, waitlist]
    ConsentsResponse:
      type: object
      required: [consents]
      properties:
        consents:
          type: object
          description: Estado atual por finalidade (desmarcado por padrão)
          required: [marketing_push, marketing_email, precise_location, waitlist]
          properties:
            marketing_push: { type: boolean }
            marketing_email: { type: boolean }
            precise_location: { type: boolean }
            waitlist: { type: boolean }
    SetConsentRequest:
      type: object
      additionalProperties: false
      required: [granted]
      properties:
        granted: { type: boolean }
    AdminProfile:
      type: string
      enum: [super_admin, operations, finance, support]
    AdminView:
      type: object
      required: [userId, name, email, profile, active, totpConfigured]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        profile: { $ref: '#/components/schemas/AdminProfile' }
        active: { type: boolean }
        totpConfigured: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time, description: Último login com sucesso }
    PendingAdminInvitation:
      type: object
      required: [id, name, email, profile, reactivation, expired, invitedByName, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid, description: 'ID do convite (revogar em DELETE /admin/admins/invitations/{invitationId})' }
        name: { type: string }
        email: { type: string, format: email }
        profile: { $ref: '#/components/schemas/AdminProfile' }
        reactivation: { type: boolean, description: Link de reativação (redefinição de acesso), não convite novo }
        expired: { type: boolean }
        invitedByName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    TotpStatus:
      type: object
      required: [configured, recoveryCodesRemaining, recoveryCodesLow]
      properties:
        configured: { type: boolean }
        recoveryCodesRemaining: { type: integer }
        recoveryCodesLow: { type: boolean }
    AdminList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminView' }
        pendingInvitations:
          type: array
          items: { $ref: '#/components/schemas/PendingAdminInvitation' }
        nextCursor: { type: [string, 'null'] }
    InviteAdminRequest:
      type: object
      additionalProperties: false
      required: [name, email, profile]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        profile: { $ref: '#/components/schemas/AdminProfile' }
    InviteAdminResponse:
      type: object
      required: [invitationId, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    UpdateAdminRequest:
      type: object
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/AdminProfile' }
        active: { type: boolean }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo da mudança (vai à auditoria) }
    ResetAdminAccessRequest:
      type: object
      additionalProperties: false
      required: [reason, verifiedChannel]
      properties:
        reason: { type: string, minLength: 20, maxLength: 500 }
        verifiedChannel: { type: string, enum: [video_call, in_person, registered_phone], description: Canal em que a identidade foi conferida fora do sistema }
    TotpSetupResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Segredo base32 para digitar no app autenticador }
        otpauthUri: { type: string, description: URI para gerar o QR code }
    TotpConfirmRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    TotpConfirmResponse:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, description: 'Mostrado uma única vez; cada código vale uma vez' }
    Neighborhood:
      type: object
      required: [id, cityId, name, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        cityId: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    City:
      type: object
      required: [id, name, state, slug, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, example: SP }
        slug: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CityWithNeighborhoods:
      allOf:
        - { $ref: '#/components/schemas/City' }
        - type: object
          required: [neighborhoods]
          properties:
            neighborhoods:
              type: array
              items: { $ref: '#/components/schemas/Neighborhood' }
    CityList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CityWithNeighborhoods' }
        nextCursor: { type: [string, 'null'] }
    PublicCity:
      type: object
      required: [id, name, state, slug, neighborhoods]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string }
        slug: { type: string }
        neighborhoods:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    PublicRegionList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicCity' }
        nextCursor: { type: [string, 'null'] }
    CreateCityRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 2, default: SP }
        active: { type: boolean, default: false }
    UpdateRegionRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        active: { type: boolean }
    CreateNeighborhoodRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        active: { type: boolean, default: true }
    Category:
      type: object
      required: [id, parentId, name, icon, position, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 30 }
        icon: { type: string, description: Nome do ícone da biblioteca fixa }
        position: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CategoryNode:
      allOf:
        - { $ref: '#/components/schemas/Category' }
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/Category' }
    CategoryTree:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
        nextCursor: { type: [string, 'null'] }
    CategoryTreeAdmin:
      type: object
      required: [data, icons, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
        icons:
          type: array
          description: Biblioteca fixa de ícones
          items: { type: string }
        nextCursor: { type: [string, 'null'] }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, icon]
      properties:
        name: { type: string, minLength: 2, maxLength: 30 }
        icon: { type: string, maxLength: 40 }
        parentId: { type: [string, 'null'], format: uuid, default: null }
        position: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        active: { type: boolean, default: true }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 30 }
        icon: { type: string, maxLength: 40 }
        position: { type: integer, minimum: 0, maximum: 10000 }
        active: { type: boolean }
    ReorderCategoriesRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
    ParameterView:
      type: object
      required: [key, value, default, type, min, max, values, description, ref, legalFloor, updatedAt]
      properties:
        key: { type: string }
        value: { oneOf: [{ type: number }, { type: string }] }
        default: { oneOf: [{ type: number }, { type: string }] }
        type: { type: string, enum: [int, decimal, enum, window] }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        values: { type: [array, 'null'], items: { type: string } }
        description: { type: string }
        ref: { type: string, description: 'Origem da regra (HIP, WB, DEC)' }
        legalFloor: { type: boolean, description: Piso legal fixo (ninguém edita) }
        updatedAt: { type: [string, 'null'], format: date-time }
    ParameterList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ParameterView' }
        nextCursor: { type: [string, 'null'] }
    UpdateParameterRequest:
      type: object
      additionalProperties: false
      required: [value, reason]
      properties:
