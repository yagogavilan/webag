        documentMasked:
          type: string
        city:
          type:
          - string
          - 'null'
        submittedAt:
          type:
          - string
          - 'null'
          format: date-time
        overdue:
          type: boolean
        holderMismatch:
          type: boolean
    AdminStoreDetail:
      type: object
      required:
      - store
      - owner
      - documents
      - reviewItems
      - history
      - paymentAccount
      - sameDocument
      - settings
      properties:
        store:
          $ref: "#/components/schemas/Store"
        owner:
          type: object
          required:
          - email
          - name
          properties:
            email:
              type: string
            name:
              type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/StoreDocument"
        reviewItems:
          type: array
          items:
            type: object
            required:
            - item
            - reason
            properties:
              item:
                type: string
              reason:
                type: string
        history:
          type: array
          items:
            type: object
            required:
            - to
            - at
            properties:
              from:
                type:
                - string
                - 'null'
              to:
                type: string
              at:
                type: string
                format: date-time
              reason:
                type:
                - string
                - 'null'
        paymentAccount:
          oneOf:
          - type: object
            required:
            - status
            - holderDocumentMasked
            - holderMatchesStore
            properties:
              status:
                type: string
              holderDocumentMasked:
                type: string
              holderMatchesStore:
                type: boolean
          - type: 'null'
        sameDocument:
          type: array
          items:
            type: object
            required:
            - id
            - status
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
        settings:
          $ref: "#/components/schemas/StoreSettings"
    DocumentAccessRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          enum:
          - initial_review
          - doubt
          - report
    DocumentAccessResponse:
      type: object
      required:
      - url
      - expiresInSeconds
      - contentType
      properties:
        url:
          type: string
        expiresInSeconds:
          type: integer
          example: 300
        contentType:
          type: string
    DecisionReasonRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
    CorrectionRequest:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - item
            - reason
            properties:
              item:
                type: string
                description: Tipo do documento ou store_data
              reason:
                type: string
                minLength: 3
                maxLength: 500
          minItems: 1
          maxItems: 10
    AdminStorePatchRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
        profile:
          $ref: "#/components/schemas/UpdateStoreProfileRequest"
    ReleaseAccountRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
    ProductVariant:
      type: object
      required: [id, attributes, sku, priceCents, effectivePriceCents, originalPriceCents, discountPercent, stock, reserved, available, soldOut, low]
      properties:
        id: { type: string, format: uuid }
        attributes: { type: object, additionalProperties: { type: string }, example: { Tamanho: P, Cor: Azul } }
        sku: { type: [string, 'null'] }
        priceCents: { type: [integer, 'null'], description: Preço próprio da variação; vazio usa o do produto }
        effectivePriceCents: { type: [integer, 'null'], description: Preço vigente hoje (com a promoção, se ativa) }
        originalPriceCents: { type: [integer, 'null'], description: Preço "de" quando há promoção ativa }
        discountPercent: { type: [integer, 'null'], description: Percentual exibido, arredondado para baixo; abaixo de 1% não aparece }
        stock: { type: integer, minimum: 0, maximum: 99999 }
        reserved: { type: integer }
        available: { type: integer, description: estoque menos reservado }
        soldOut: { type: boolean }
        low: { type: boolean, description: Disponível maior que zero e menor ou igual ao limite da loja }
    Product:
      type: object
      required: [id, name, description, categoryId, sectionId, status, moderationStatus, moderationReason, basePriceCents, promotion, variantAttributes, variants, images, soldOut, publishedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 1000 }
        categoryId: { type: [string, 'null'], format: uuid }
        sectionId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, active, paused, archived] }
        moderationStatus: { type: string, enum: [ok, review, paused, removed], description: Separado do status do lojista; só o admin altera }
        moderationReason: { type: [string, 'null'], description: Motivo, só quando pausado ou removido pela moderação }
        basePriceCents: { type: [integer, 'null'], minimum: 1, maximum: 9999999 }
        promotion:
          type: object
          required: [priceCents, startsAt, endsAt, active]
          properties:
            priceCents: { type: [integer, 'null'] }
            startsAt: { type: [string, 'null'], format: date-time }
            endsAt: { type: [string, 'null'], format: date-time }
            active: { type: boolean, description: Calculado na leitura; o fim da promoção não depende de job }
        variantAttributes: { type: array, items: { type: string } }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
        images:
          type: array
          items:
            type: object
            required: [id, position, urls]
            properties:
              id: { type: string, format: uuid, description: Id do upload (`/uploads`) }
              position: { type: integer }
              urls: { type: [object, 'null'], additionalProperties: { type: string }, description: 'Largura em px para URL pública WebP' }
        soldOut: { type: boolean, description: Todas as variações sem disponível }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductSummary:
      type: object
      required: [id, name, status, moderationStatus, sectionId, basePriceCents, fromPriceCents, cover, availableTotal, low, soldOut, variantCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, paused, archived] }
        moderationStatus: { type: string, enum: [ok, review, paused, removed] }
        sectionId: { type: [string, 'null'], format: uuid }
        basePriceCents: { type: [integer, 'null'] }
        fromPriceCents: { type: [integer, 'null'] }
        cover: { type: [object, 'null'], additionalProperties: { type: string } }
        availableTotal: { type: integer }
        low: { type: boolean }
        soldOut: { type: boolean }
        variantCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } }
        nextCursor: { type: [string, 'null'] }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 1000 }
        categoryId: { type: [string, 'null'], format: uuid }
        sectionId: { type: [string, 'null'], format: uuid }
        basePriceCents: { type: [integer, 'null'], description: 'Centavos, de 1 a 9999999 (422 fora da faixa)' }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 1000 }
        categoryId: { type: [string, 'null'], format: uuid }
        sectionId: { type: [string, 'null'], format: uuid }
        basePriceCents: { type: [integer, 'null'] }
        promoPriceCents: { type: [integer, 'null'] }
        promoStartsAt: { type: [string, 'null'], format: date-time }
        promoEndsAt: { type: [string, 'null'], format: date-time }
    SetVariantsRequest:
      type: object
      additionalProperties: false
      required: [attributes, variants]
      properties:
        attributes: { type: array, maxItems: 5, items: { type: string, maxLength: 30 }, description: 'Nomes dos atributos (até 3 válidos). Vazio = sem variação' }
        variants:
          type: array
          minItems: 1
          maxItems: 300
          items:
            type: object
            additionalProperties: false
            required: [attributes]
            properties:
              id: { type: string, format: uuid }
              attributes: { type: object, additionalProperties: { type: string, maxLength: 40 } }
              stock: { type: integer }
              priceCents: { type: [integer, 'null'] }
              sku: { type: [string, 'null'], maxLength: 40 }
    StockAdjustBody:
      oneOf:
        - { type: object, additionalProperties: false, required: [delta], properties: { delta: { type: integer } } }
        - { type: object, additionalProperties: false, required: [set], properties: { set: { type: integer } } }
    SetImagesRequest:
      type: object
      additionalProperties: false
      required: [imageIds]
      properties:
        imageIds: { type: array, maxItems: 20, items: { type: string, format: uuid } }
    Section:
      type: object
      required: [id, name, position, productCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40 }
        position: { type: integer }
        productCount: { type: integer }
    SectionList:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Section' } }
        nextCursor: { type: 'null' }
    SectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
    SectionOrderRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
    BulkRequest:
      type: object
      additionalProperties: false
      required: [productIds, action]
      properties:
        productIds: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
        dryRun: { type: boolean, default: false }
        action:
          oneOf:
            - { type: object, additionalProperties: false, required: [type], properties: { type: { const: pause } } }
            - { type: object, additionalProperties: false, required: [type], properties: { type: { const: resume } } }
            - { type: object, additionalProperties: false, required: [type, sectionId], properties: { type: { const: move_section }, sectionId: { type: [string, 'null'], format: uuid } } }
            - { type: object, additionalProperties: false, required: [type, mode, value], properties: { type: { const: price_adjust }, mode: { type: string, enum: [percent, amount] }, value: { type: number, description: 'percent: ex. -10 ou 5.5; amount: centavos inteiros (positivo ou negativo)' } } }
    BulkResult:
      type: object
      required: [dryRun, willChange, changed, blocked]
      properties:
        dryRun: { type: boolean }
        willChange: { type: integer }
        changed: { type: integer }
        blocked:
          type: array
          items:
            type: object
            required: [productId, name, reason]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              reason: { type: string }
    ImportResult:
      type: object
      required: [totalLines, valid, invalid, errors, productsToCreate, alreadyExist, committed, created, updated, skipped]
      properties:
        totalLines: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [line, message]
            properties:
              line: { type: integer, description: Linha da planilha (o cabeçalho é a 1) }
              message: { type: string }
        productsToCreate: { type: integer }
        alreadyExist: { type: integer, description: Produtos cujo código (SKU) já existe na loja }
        committed: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
    AdminProduct:
      type: object
      required: [id, name, description, storeId, storeName, categoryId, status, moderationStatus, moderationReason, moderatedAt, basePriceCents, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        storeId: { type: string, format: uuid }
        storeName: { type: [string, 'null'] }
        categoryId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, active, paused, archived] }
        moderationStatus: { type: string, enum: [ok, review, paused, removed] }
        moderationReason: { type: [string, 'null'] }
        moderatedAt: { type: [string, 'null'], format: date-time }
        basePriceCents: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    AdminProductPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
        nextCursor: { type: [string, 'null'] }
    ModerateRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [pause, remove, restore] }
        reason: { type: string, minLength: 5, maxLength: 500, description: Obrigatório para pausar e remover }
    ModerationResult:
      type: object
      required: [id, moderationStatus, storeFlagged]
      properties:
        id: { type: string, format: uuid }
        moderationStatus: { type: string, enum: [ok, review, paused, removed] }
        storeFlagged: { type: boolean, description: A remoção completou 3 em 30 dias e a loja foi sinalizada para análise de suspensão }
    ModerationTerm:
      type: object
      required: [id, kind, value, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [forbidden_category, suspect_word] }
        value: { type: string, description: 'Palavra normalizada, ou id da categoria' }
        label: { type: [string, 'null'], description: Nome da categoria, ou a própria palavra }
        createdAt: { type: string, format: date-time }
    ModerationTermList:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ModerationTerm' } }
        nextCursor: { type: 'null' }
    ModerationTermRequest:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, enum: [forbidden_category, suspect_word] }
        value: { type: string, minLength: 1, maxLength: 80 }
