  /v1/stores/{storeId}/products/{productId}/quick-publish:
    post:
      tags: [catalog]
      operationId: quickPublishProduct
      summary: Publicar o rascunho com nome e preço, numa chamada só (WB-370 C3, R-36)
      description: "O \"publicar em 2 campos\" é UMA transação (tech-lead I11, decisão do CEO): grava nome, preço, categoria, descrição (se a categoria exige), as fotos já enviadas, a variação padrão com `stock` (1 se omitido) e publica. Sem isto o caminho mínimo eram 7 a 8 chamadas em série (`updateProduct`, `setProductVariants`, `setProductImages`, `publishProduct`...), inviável em 3G com RTT de 0,4 a 1 s para a meta de 60 s; agora, depois da foto, é 1 chamada (os 3 passos de upload correm em segundo plano enquanto o lojista digita). Serve ao produto SEM grade: rascunho que já tem variações com atributos é 422 `QUICK_PUBLISH_NOT_APPLICABLE` e segue por `setProductVariants` e `publishProduct`. **Tudo ou nada:** qualquer erro desfaz a transação e nada digitado se perde no app. As regras são as de `publishProduct` e `updateProduct`, sem exceção (moderação, `PRODUCT_INCOMPLETE` com a lista do que falta, `DESCRIPTION_REQUIRED`, `CATEGORY_FORBIDDEN`, `PRICE_OUT_OF_RANGE`, `PRODUCT_MODERATED`). `If-Match` com a `version` do rascunho (409 `PRODUCT_VERSION_CONFLICT`); `Idempotency-Key` obrigatória (toque duplo ou repetição por 3G publica uma vez só: mesma chave e mesmo corpo devolvem o mesmo produto). Grava `product_create_published` com `duration_s` e `via` (WB-379). Permissão da loja: `catalog`; não-membro 404 (SEC-020); loja não aprovada 409 `STORE_NOT_APPROVED`. A versão sobe uma vez (a transação é UMA edição de catálogo). **Foto ainda em processamento (R6 b):** `imageIds` cuja conclusão do upload ainda não terminou (original recodificado e variantes) = 422 `UPLOAD_NOT_READY` com `imageIds` pendentes em `errors`; é transitório: o app espera (poucos segundos) e repete com a MESMA `Idempotency-Key`, sem mostrar erro (nada foi gravado). **SEC-214 (só rascunho):** produto que já está `active` ou `paused` é 409 `QUICK_PUBLISH_NOT_APPLICABLE` e nada é gravado (edite pela ficha: `updateProduct`, `setProductImages`, `adjustVariantStock`); promoção que o rascunho já tem precisa continuar válida com o preço novo (422 `PROMOTION_INVALID`); `stock` menor que o reservado é 409 `STOCK_BELOW_RESERVED`. **Resposta perdida (R6 a):** repetir depois de o servidor ter publicado devolve 409 `QUICK_PUBLISH_NOT_APPLICABLE` (produto já ativo) ou 409 `PRODUCT_VERSION_CONFLICT` (a versão subiu) quando a chave não tem mais resposta guardada; o app, ao receber 409 nesta rota, reconsulta o produto (`getProduct`) e trata `status = active` com os mesmos dados como SUCESSO. **Medição (R6 c):** `duration_s` conta da criação do rascunho; a mediana da meta de 60 s usa só o cadastro contínuo (E-8, D11)."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
        - { $ref: '#/components/parameters/ProductIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
        - { $ref: '#/components/parameters/IfMatchVersion' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickPublishRequest' }
            example: { name: Camiseta básica preta, basePriceCents: 4990, imageIds: ['6c1f0a52-9d3e-4b87-a2f4-1e5d7c3b8a90'] }
      responses:
        '200':
          description: Produto publicado
          headers:
            ETag:
              description: 'Versão do produto entre aspas (`"7"`)'
              schema: { type: string, example: '"7"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProductVersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
