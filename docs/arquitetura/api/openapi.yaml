  /v1/stores/{storeId}/payment-account/connect:
    post:
      tags:
      - stores
      operationId: startPaymentAccountConnect
      summary: Iniciar a conexão OAuth
      description: Só o dono, com senha digitada há até 5 min (403 `REAUTH_REQUIRED`). `state` de 256 bits guardado no servidor (só o hash), ligado à sessão e à loja, uso único, 10 min; um `state` novo invalida o anterior. `redirect_uri` vem da configuração.
