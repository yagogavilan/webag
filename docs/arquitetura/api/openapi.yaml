      x-admin-profiles: [super_admin, operations, finance]
      summary: Acessos agregados por loja, produto ou origem (WB-363 C3, C6 a C8; base da WB-362)
      description: "Permissão `analytics:read` (super admin, operação e financeiro; **suporte 403**, WB-362 C6). Lê SÓ o agregado diário (nunca o bruto: nenhuma API nem tela lê o bruto e o papel do admin não tem leitura nessa tabela, C-ANA-04). Períodos fechados terminando ontem: 7, 30 ou 90 dias (o admin pode 90; o lojista só 7 e 30, R5). **Supressão no servidor (C-ANA-05, RN-A2):** célula com menos de 5 sessões NUNCA traz valor nem `n` (`suppressed: true`); todas as células suprimidas viram UMA linha \"Outras\" (`isOther: true`); se \"Outras\" nascer de uma só célula, absorve a menor visível; se ainda ficar < 5, a linha mostra \"menos de 5\" e **nenhum total da resposta é exato**: os totais vêm arredondados a múltiplo de 5 com `approximate: true` (\"cerca de\"). Total menos as partes publicadas nunca revela a célula suprimida (teste). Vendas e pedidos do banco ficam FORA desta resposta (seguem exatos em outro lugar). Flag `coleta_eventos` desligada: 409 `FEATURE_DISABLED` (staging: ligada). `generatedAt` e `cached` (cache de 5 min por parâmetros normalizados, com a permissão checada ANTES de ler o cache). Consulta com tempo limite de 5 s, 30 por minuto por admin."
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
        - { name: groupBy, in: query, required: true, schema: { type: string, enum: [store, product, origin] } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: storeId, in: query, description: 'Obrigatório com `groupBy=product` ou `origin`: a quebra é sempre de UMA loja', schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Relatório agregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsAccessReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    viewAsAuth:
      type: apiKey
      in: header
      name: X-View-As
      description: "Credencial `vas_` (43 caracteres base64url) de `openViewAs` (v1.1 R1, WB-352). NÃO autentica: só qualifica uma requisição já autenticada com o Bearer do admin que abriu a visão (por isso o `security` das rotas é `bearerAuth` E `viewAsAuth` juntos). Vale só nas rotas GET marcadas `x-view-as: true`, para a loja da abertura e na mesma sessão do admin, por até 30 min sem renovação. Códigos (threat model §15.2): cabeçalho VAZIO ou REPETIDO, ou presente em qualquer outra rota ou método: 403 `VIEW_AS_READ_ONLY`; formato inválido (fora de `^vas_[A-Za-z0-9_-]{43}$`), credencial vencida, encerrada, de outra loja, de outro admin ou de outra sessão: 403 `VIEW_AS_EXPIRED` (um código só, não diz qual parte falhou); sem Bearer: 401."
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor`
      schema: { type: string, maxLength: 200 }
    CartMode:
      name: mode
      in: query
      description: Como o cliente quer receber; define frete e bloqueios do resumo
      schema: { type: string, enum: [delivery, pickup], default: delivery }
    CartAddressId:
      name: addressId
      in: query
      description: "Endereço de entrega (de `/v1/me/addresses`); sem ele vale o padrão da conta. Endereço de outra conta responde 404"
      schema: { type: string, format: uuid }
    Lat:
      name: lat
      in: query
      required: true
      description: Latitude da posição do cliente (endereço salvo, CEP ou GPS)
      schema: { type: number, minimum: -90, maximum: 90 }
    Lng:
      name: lng
      in: query
      required: true
      description: Longitude da posição do cliente
      schema: { type: number, minimum: -180, maximum: 180 }
    Limit:
      name: limit
      in: query
      description: 'Itens por página (padrão 20, máximo 50). Fora de 1 a 50 ou não numérico: 400 VALIDATION_FAILED (BUG-027)'
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    StoreIdPath:
      name: storeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: "Opcional. Mesma chave e mesmo corpo devolvem a resposta guardada (24 h); corpo diferente: 422 `IDEMPOTENCY_KEY_REUSED`; em andamento: 409 `IDEMPOTENCY_IN_PROGRESS` com `Retry-After`"
      schema: { type: string, minLength: 8, maxLength: 80 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: "Obrigatória (o app repete a escrita em 3G). Mesma chave e mesmo corpo devolvem a resposta guardada (24 h); corpo diferente: 422 `IDEMPOTENCY_KEY_REUSED`; em andamento: 409 `IDEMPOTENCY_IN_PROGRESS` com `Retry-After`. Ausente: 400"
      schema: { type: string, minLength: 8, maxLength: 80 }
    IfMatchVersion:
      name: If-Match
      in: header
      description: "Opcional. `version` do produto que o app tem, como entity-tag entre aspas (RFC 9110): `If-Match: \"7\"`; o mesmo valor vem no cabeçalho `ETag` de `getProduct` e `getAdminStoreProduct`. Diferente da atual: 409 `PRODUCT_VERSION_CONFLICT` com a versão atual e nada é gravado (rascunho aberto em 2 aparelhos, edição em linha, WB-371 C4). Ausente: grava sem conferir, mas a versão sobe (compatível com o app 1.0). Valor fora do formato: 400 `VALIDATION_FAILED`"
      schema: { type: string, pattern: '^"[1-9][0-9]{0,9}"$', example: '"7"' }
  responses:
    ValidationError:
      description: Entrada inválida (campo desconhecido, formato ou tamanho). `errors[]` lista os campos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Não autenticado, token inválido ou sessão encerrada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 'Sem permissão (ou `REAUTH_REQUIRED`, `MFA_REQUIRED`, `EMAIL_VERIFICATION_REQUIRED`; com `X-View-As`: `VIEW_AS_READ_ONLY` para método, rota fora da lista ou cabeçalho vazio ou repetido; `VIEW_AS_EXPIRED` para credencial malformada, vencida, encerrada ou de outra loja, admin ou sessão)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Não encontrado (também para recurso de outro usuário, sem revelar existência)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito de estado ou duplicidade
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Convite inválido, usado, revogado ou vencido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Regra de negócio violada (senha fraca, fora da faixa...)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de tentativas. Header `Retry-After` em segundos.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: "Indisponibilidade momentânea sob saturação (pool do banco esgotado ou consulta cancelada por tempo, BUG-035): `code` `SERVICE_UNAVAILABLE`, `Retry-After` em segundos, sem pilha nem SQL. O app tenta de novo depois do prazo. Não é erro do pedido"
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Corpo acima do limite da rota (`code` `PAYLOAD_TOO_LARGE`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProductVersionConflict:
      description: "`PRODUCT_VERSION_CONFLICT`: o produto mudou depois da versão informada (\"O lojista alterou este produto agora\"); traz a versão atual em `current` (só neste `code`). Também cobre as demais regras de conflito da rota (`STOCK_BELOW_RESERVED`, `STORE_NOT_APPROVED`, `OPEN_ORDERS`, `IDEMPOTENCY_IN_PROGRESS`), que mantêm o corpo antigo do `Problem` (sem `current`); por isso `current` é opcional no schema (tech-lead I1)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProductVersionConflictProblem' }
    BulkVersionConflict:
      description: "409 das ações em massa: `BULK_VERSION_CONFLICT` (algum item mudou depois da prévia: `conflicts` com a versão atual; nada é aplicado), além de `STORE_NOT_APPROVED` e `IDEMPOTENCY_IN_PROGRESS` com o corpo antigo do `Problem`"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/BulkVersionConflictProblem' }
    DraftLimitUnprocessable:
      description: "422 do lote de rascunhos: validação (`VALIDATION_FAILED`) ou `DRAFT_LIMIT_REACHED` com `limit`, `draftCount` e `slotsAvailable` (`DraftLimitProblem`)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/DraftLimitProblem' }
  schemas:
    HealthIndicator:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        message:
          type: string
    HealthStatus:
      type: object
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
        info:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthIndicator'
    Money:
      type: object
      additionalProperties: false
      description: Valor monetário em centavos.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Centavos
          example: 1990
        currency:
          type: string
          enum: [BRL]
    Problem:
      type: object
      description: Erro no formato RFC 9457.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável; o cliente decide a ação por ele.
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LegalDocumentType:
      type: string
      enum: [customer_terms, merchant_terms, privacy, exchange_policy]
    DocumentRef:
      type: object
      required: [type, version]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: integer, minimum: 1 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string, description: JWT HS256 de 15 min }
        refreshToken: { type: string, description: 'Token opaco de 256 bits, rotativo' }
        expiresIn: { type: integer, description: Segundos de validade do access token, example: 900 }
        tokenType: { type: string, enum: [Bearer] }
    UserSummary:
      type: object
      required: [id, email, emailVerified, name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
    AuthResult:
      type: object
      required: [user, tokens, mfaSetupRequired]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        mfaSetupRequired: { type: boolean, description: Admin sem TOTP configurado (ou que usou código de recuperação). Só a configuração do TOTP fica liberada. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, adultDeclaration, acceptedDocuments]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, description: 'Celular brasileiro, ex.: (11) 99999-9999' }
        password: { type: string, description: '8 a 128 caracteres, fora da lista de senhas comuns (422 WEAK_PASSWORD)' }
        adultDeclaration: { type: boolean, enum: [true], description: Declaração de ter 18 anos ou mais }
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          description: Versões exibidas ao usuário. Devem ser as vigentes de customer_terms e privacy (409 TERMS_OUTDATED).
          items: { $ref: '#/components/schemas/DocumentRef' }
    EmailExistsRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailExistsResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$', description: Step-up por e-mail }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 200 }
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    CorrectEmailRequest:
      type: object
      additionalProperties: false
      required: [newEmail, password]
      properties:
        newEmail: { type: string, format: email }
        password: { type: string }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string }
    ResetPasswordResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          oneOf:
            - { $ref: '#/components/schemas/TokenPair' }
            - { type: 'null' }
        mfaRequired: { type: boolean, enum: [true], description: 'Admin com TOTP: falta o 2º fator (use `resetTicket`)' }
        resetTicket: { type: string, description: 'Ticket opaco de 256 bits, 10 min, uso único' }
        expiresIn: { type: integer, example: 600 }
    MfaChallenge:
      type: object
      required: [mfaRequired, mfaToken, expiresIn]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        mfaToken: { type: string, description: 'Token opaco de 256 bits, 5 min, uso único, 5 tentativas' }
        expiresIn: { type: integer, example: 300 }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string, minLength: 20, maxLength: 200 }
        code: { type: string, minLength: 6, maxLength: 32, description: TOTP de 6 dígitos ou código de recuperação }
    CompleteResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [resetTicket, totpCode, newPassword]
      properties:
        resetTicket: { type: string, minLength: 20, maxLength: 200 }
        totpCode: { type: string, minLength: 6, maxLength: 32, description: TOTP de 6 dígitos ou código de recuperação }
        newPassword: { type: string }
    ReauthRequest:
      type: object
      additionalProperties: false
      properties:
        password: { type: string }
        totpCode: { type: string, minLength: 6, maxLength: 32 }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password: { type: string }
    AcceptInvitationResponse:
      type: object
      required: [tokens, mfaSetupRequired]
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
        mfaSetupRequired: { type: boolean, enum: [true] }
    PendingTerm:
      type: object
      required: [type, documentId, version, title, reason]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        documentId: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        reason: { type: string, enum: [first, relevant_change] }
    PendingTermsResponse:
      type: object
      required: [pending]
      properties:
        pending:
          type: array
          items: { $ref: '#/components/schemas/PendingTerm' }
    Me:
      type: object
      required: [id, email, emailVerified, name, phone, roles, adminProfile, pendingTerms]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
        phone: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, enum: [customer, merchant] }
        adminProfile: { type: [string, 'null'], enum: [super_admin, operations, finance, support, null] }
        pendingTerms:
          type: array
          items: { $ref: '#/components/schemas/PendingTerm' }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    ChangePasswordResponse:
      type: object
      required: [tokens]
      properties:
        tokens: { $ref: '#/components/schemas/TokenPair' }
    MerchantRoleRequest:
      type: object
      additionalProperties: false
      required: [acceptedDocuments]
      properties:
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/DocumentRef' }
    SessionView:
      type: object
      required: [id, current, createdAt, lastUsedAt, userAgent, ip]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        userAgent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
    SessionList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SessionView' }
        nextCursor: { type: [string, 'null'] }
    AcceptTermsRequest:
      type: object
      additionalProperties: false
      required: [acceptedDocuments]
      properties:
        acceptedDocuments:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/DocumentRef' }
    ConsentPurpose:
      type: string
      enum: [marketing_push, marketing_email, precise_location, waitlist]
    ConsentsResponse:
      type: object
      required: [consents]
      properties:
        consents:
          type: object
          description: Estado atual por finalidade (desmarcado por padrão)
          required: [marketing_push, marketing_email, precise_location, waitlist]
          properties:
            marketing_push: { type: boolean }
            marketing_email: { type: boolean }
            precise_location: { type: boolean }
            waitlist: { type: boolean }
    SetConsentRequest:
      type: object
      additionalProperties: false
      required: [granted]
      properties:
        granted: { type: boolean }
    AdminProfile:
      type: string
      enum: [super_admin, operations, finance, support]
    AdminView:
      type: object
      required: [userId, name, email, profile, active, totpConfigured]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        profile: { $ref: '#/components/schemas/AdminProfile' }
        active: { type: boolean }
        totpConfigured: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time, description: Último login com sucesso }
    PendingAdminInvitation:
      type: object
      required: [id, name, email, profile, reactivation, expired, invitedByName, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid, description: 'ID do convite (revogar em DELETE /admin/admins/invitations/{invitationId})' }
        name: { type: string }
        email: { type: string, format: email }
        profile: { $ref: '#/components/schemas/AdminProfile' }
        reactivation: { type: boolean, description: 'Link de reativação (redefinição de acesso), não convite novo' }
        expired: { type: boolean }
        invitedByName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    TotpStatus:
      type: object
      required: [configured, recoveryCodesRemaining, recoveryCodesLow]
      properties:
        configured: { type: boolean }
        recoveryCodesRemaining: { type: integer }
        recoveryCodesLow: { type: boolean }
    AdminList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminView' }
        pendingInvitations:
          type: array
          items: { $ref: '#/components/schemas/PendingAdminInvitation' }
        nextCursor: { type: [string, 'null'] }
    InviteAdminRequest:
      type: object
      additionalProperties: false
      required: [name, email, profile]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        profile: { $ref: '#/components/schemas/AdminProfile' }
    InviteAdminResponse:
      type: object
      required: [invitationId, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    UpdateAdminRequest:
      type: object
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/AdminProfile' }
        active: { type: boolean }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo da mudança (vai à auditoria) }
    ResetAdminAccessRequest:
      type: object
      additionalProperties: false
      required: [reason, verifiedChannel]
      properties:
        reason: { type: string, minLength: 20, maxLength: 500 }
        verifiedChannel: { type: string, enum: [video_call, in_person, registered_phone], description: Canal em que a identidade foi conferida fora do sistema }
    TotpSetupResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Segredo base32 para digitar no app autenticador }
        otpauthUri: { type: string, description: URI para gerar o QR code }
    TotpConfirmRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    TotpConfirmResponse:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, description: 'Mostrado uma única vez; cada código vale uma vez' }
    Neighborhood:
      type: object
      required: [id, cityId, name, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        cityId: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    City:
      type: object
      required: [id, name, state, slug, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, example: SP }
        slug: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CityWithNeighborhoods:
      allOf:
        - { $ref: '#/components/schemas/City' }
        - type: object
          required: [neighborhoods]
          properties:
            neighborhoods:
