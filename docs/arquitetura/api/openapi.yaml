      tags: [admin-stores]
      operationId: openViewAs
      x-admin-permission: 'view-as:open'
      x-admin-profiles: [super_admin, operations, finance, support]
      summary: Abrir "Ver como o lojista" (somente leitura) (WB-352)
      description: "Permissão `view-as:open` (os 4 perfis). **Não é sessão do lojista nem permite escrita (C-ADM-02):** devolve a CREDENCIAL `vas_...`, mostrada uma só vez e guardada só como SHA-256, que o cliente envia no cabeçalho `X-View-As` JUNTO com o Bearer do admin (esquema `viewAsAuth`) nas 13 rotas de leitura `x-view-as: true`. Nível fixo \"visualizador\" (threat model §14), mesmo que o admin seja membro ou dono da loja. Validade `expiresAt` = o menor entre 30 min e o fim da sessão do admin, **sem renovação** (para continuar, abre outra, com novo motivo). **Uma visão ativa por admin:** abrir outra encerra a anterior (`replaced`). **Auditoria:** `view_as.open` (admin, sessão, loja, motivo, `expiresAt`) é gravada NA MESMA TRANSAÇÃO da credencial e antes de ela ser devolvida; se a gravação falhar, 500 sem credencial e sem linha órfã. Sem motivo: 422 `REASON_REQUIRED`. Limite de 10 aberturas por hora por admin (429) e alerta à operação acima de 20 lojas distintas por dia [HIPÓTESE]. 409 `VIEW_AS_OPEN_CONFLICT`: duas aberturas simultâneas do mesmo admin (a restrição de uma visão ativa por admin decide a corrida); repetir. Rota de admin: não aceita `X-View-As`. Resposta `Cache-Control: private, no-store`."
      parameters:
        - { $ref: '#/components/parameters/StoreIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenViewAsRequest' }
      responses:
        '201':
          description: Credencial de visualização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewAsSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/admin/view-as/{viewAsId}/end:
    post:
      tags: [admin-stores]
      operationId: endViewAs
      x-admin-permission: 'view-as:open'
