  /v1/me/coupons:
    get:
      tags: [cart]
      operationId: listMyCoupons
      summary: Meus cupons pessoais (compensação por atraso, WB-254)
      description: "Só os cupons PESSOAIS e intransferíveis da conta do token (hoje, a entrega grátis ou o desconto concedidos por atraso, RN-19 4c); cupons públicos e de loja não aparecem e o cupom de outra conta nunca é revelado. Mínimo de dados: sem pedido de origem e sem contagem de usos. Do mais novo ao mais antigo, paginado por cursor. `status`: `available` (padrão: vigente e ainda não usado), `used`, `expired` ou `all`. O cupom devolvido por pedido cancelado volta a `available`. Para usar, o app envia `code` em `PUT /v1/cart/coupon` (as regras de validade e de e-mail confirmado são as de lá). 429 se passar de 120 chamadas em 10 min."
