      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        image:
          type: object
          required: [urls]
          properties:
            urls: { type: object, additionalProperties: { type: string, format: uri }, description: 'Largura em pixels para a URL pública WebP' }
        destination: { $ref: '#/components/schemas/BannerDestination' }
        position: { type: integer }
    BannerList:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Banner' } }
        nextCursor: { type: 'null' }
    AdminBanner:
      allOf:
        - { $ref: '#/components/schemas/Banner' }
        - type: object
          required: [cityId, startsAt, endsAt, active, live]
          properties:
            cityId: { type: [string, 'null'], format: uuid, description: Nulo = todas as cidades }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            active: { type: boolean }
            live: { type: boolean }
            impressions: { type: integer }
            clicks: { type: integer }
            ctrPct: { type: [number, 'null'], description: 'Taxa de cliques em % (1 casa); nula sem impressão' }
    AdminBannerList:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminBanner' } }
        nextCursor: { type: 'null' }
    CreateBannerRequest:
      type: object
      additionalProperties: false
      required: [title, imageAssetId, destinationType, startsAt, endsAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        imageAssetId: { type: string, format: uuid }
        cityId: { type: [string, 'null'], format: uuid }
        destinationType: { type: string, enum: [store, category, product, coupon, none] }
        destinationId: { type: [string, 'null'], format: uuid }
        destinationCode: { type: [string, 'null'], minLength: 1, maxLength: 20 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        position: { type: integer, minimum: 0, maximum: 999 }
        active: { type: boolean }
    UpdateBannerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        imageAssetId: { type: string, format: uuid }
        cityId: { type: [string, 'null'], format: uuid }
        destinationType: { type: string, enum: [store, category, product, coupon, none] }
        destinationId: { type: [string, 'null'], format: uuid }
        destinationCode: { type: [string, 'null'], minLength: 1, maxLength: 20 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        position: { type: integer, minimum: 0, maximum: 999 }
        active: { type: boolean }
    Rating:
      type: object
      required: [average, count, isNew]
      properties:
        average: { type: [number, 'null'], description: 'Média com 1 casa; nula antes de `avaliacao_min_exibicao` (3) avaliações' }
        count: { type: integer }
        isNew: { type: boolean, description: 'Mostrar "Novo" no lugar da nota' }
    LogisticsPause:
      type: object
      additionalProperties: false
      required: [id, cityId, reason, pausedAt]
      properties:
        id: { type: string, format: uuid }
        cityId: { type: [string, 'null'], format: uuid }
        reason: { type: string }
        pausedAt: { type: string, format: date-time }
    CancelRequest:
      type: object
      additionalProperties: false
      required: [id, status, reason, requestedAt, respondBy, decidedAt, decidedBy, decisionNote]
      description: "BUG-015: pedido de cancelamento com o pedido em separação. `respondBy` = até quando a loja decide; passado, o admin decide."
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, refused, superseded], description: "`superseded` (SEC-175, só no cancelamento por atraso): o pedido ou a corrida mudou de estado (entregue, não entregue, cancelado) antes da resposta; nada foi aceito nem avisado. O app deve tratar como encerrado, sem mensagem de 'aceito'." }
        reason: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        respondBy: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], enum: [store, admin, system, null] }
        decisionNote: { type: [string, 'null'] }
    EtaRange:
      type: object
      additionalProperties: false
      required: [minMinutes, maxMinutes, fromAt, toAt]
      description: "DEC-053: faixa de chegada (preparo da loja + despacho + deslocamento, com folga de +-15 min), SEMPRE como faixa e nunca como número único. `fromAt`/`toAt` são o horário de relógio ('Chega entre 15:40 e 16:40'); `minMinutes`/`maxMinutes`, os minutos a partir de agora. Passando do teto `entrega_max_min` (120) NO FIM DA FAIXA (DEC-054: estimativa + folga) a loja não entrega para o endereço: `available=false` e `eta=null` ('fora da área')."
      properties:
        minMinutes: { type: integer }
        maxMinutes: { type: integer }
        fromAt: { type: string, format: date-time }
        toAt: { type: string, format: date-time }
    StoreDelivery:
      type: object
      required: [available, feeCents, freeShipping, freeAboveCents, minOrderCents, etaMinMinutes, etaMaxMinutes]
      properties:
        eta: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }], description: 'DEC-053: faixa calculada para a posição; nulo quando a loja não entrega aí.' }
        logisticsOpensAt: { type: [string, 'null'], format: date-time, description: 'BUG-016: com `available=false` por horário da logística, quando a entrega volta ("Entrega volta às HH:MM"); nulo em pausa do admin ou quando entrega normalmente.' }
        available: { type: boolean, description: 'Entrega na posição consultada (dentro do raio e de uma faixa)' }
        feeCents: { type: [integer, 'null'], description: Taxa para a posição, antes de "grátis acima de X" }
        freeShipping: { type: boolean, description: Taxa R$ 0 nessa posição }
        freeAboveCents: { type: integer, description: '0 = sem frete grátis por valor' }
        minOrderCents: { type: integer }
        etaMinMinutes: { type: integer }
        etaMaxMinutes: { type: integer }
    StoreCard:
      type: object
      required: [id, name, logo, mainCategoryId, open, opensAt, distanceM, rating, delivery, pickupEnabled, acceptsExchange]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logo:
          type: object
          required: [urls]
          properties:
            urls: { type: object, additionalProperties: { type: string, format: uri } }
        mainCategoryId: { type: [string, 'null'], format: uuid }
        open: { type: boolean }
        opensAt: { type: [string, 'null'], format: date-time, description: 'Próxima abertura (UTC) quando fechada; nulo se pausada sem prazo ou sem horário' }
        distanceM: { type: integer, description: Linha reta em metros }
        rating: { $ref: '#/components/schemas/Rating' }
        delivery: { $ref: '#/components/schemas/StoreDelivery' }
        pickupEnabled: { type: boolean }
        acceptsExchange: { type: boolean, description: Troca voluntária ativa (prazo maior que 0) }
    ProductCard:
      type: object
      required: [id, name, image, price, originalPrice, discountPercent, categoryId, store]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        image:
          type: object
          required: [urls]
          properties:
            urls: { type: object, additionalProperties: { type: string, format: uri } }
        price: { $ref: '#/components/schemas/Money' }
        originalPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Preço antes da promoção vigente }
        discountPercent: { type: [integer, 'null'] }
        categoryId: { type: [string, 'null'], format: uuid }
        store:
          type: object
          required: [id, name, open, opensAt, distanceM]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            open: { type: boolean }
            opensAt: { type: [string, 'null'], format: date-time }
            distanceM: { type: integer }
            etaMinMinutes: { type: integer, description: 'DEC-053' }
            etaMaxMinutes: { type: integer }
            eta: { $ref: '#/components/schemas/EtaRange' }
    Home:
      type: object
      required: [mode, empty, nearbyStores, newStores, offers, bestSellers, availableCategoryIds]
      properties:
        mode: { type: string, enum: [delivery, pickup] }
        empty: { type: boolean, description: Nenhuma loja visível na posição }
        highlightStores: { type: array, items: { $ref: '#/components/schemas/StoreCard' }, description: 'Destaques fixados pelo admin (WB-115 C4): vêm antes dos automáticos e só se a loja é visível neste ponto' }
        highlightProducts: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        nearbyStores: { type: array, items: { $ref: '#/components/schemas/StoreCard' }, maxItems: 10 }
        newStores: { type: array, items: { $ref: '#/components/schemas/StoreCard' }, maxItems: 10 }
        offers: { type: array, items: { $ref: '#/components/schemas/ProductCard' }, maxItems: 10 }
        bestSellers: { type: array, items: { $ref: '#/components/schemas/ProductCard' }, maxItems: 10 }
        availableCategoryIds: { type: array, items: { type: string, format: uuid } }
    StoreCardPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StoreCard' } }
        nextCursor: { type: [string, 'null'] }
    ProductCardPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        nextCursor: { type: [string, 'null'] }
    SuggestionItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    SearchSuggestions:
      type: object
      required: [products, stores, categories]
      properties:
        products: { type: array, items: { $ref: '#/components/schemas/SuggestionItem' } }
        stores: { type: array, items: { $ref: '#/components/schemas/SuggestionItem' } }
        categories: { type: array, items: { $ref: '#/components/schemas/SuggestionItem' } }
    ImageUrls:
      type: object
      required: [urls]
      properties:
        urls: { type: object, additionalProperties: { type: string, format: uri }, description: 'Largura em pixels para a URL WebP; vazio se sem imagem' }
    BrowseStore:
      type: object
      required: [id, name, description, logo, cover, mainCategoryId, rating, open, opensAt, hoursToday, delivery, pickup, exchangePolicy, supplier, sections]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        logo: { $ref: '#/components/schemas/ImageUrls' }
        cover: { $ref: '#/components/schemas/ImageUrls' }
        mainCategoryId: { type: [string, 'null'], format: uuid }
        rating: { $ref: '#/components/schemas/Rating' }
        open: { type: boolean }
        opensAt: { type: [string, 'null'], format: date-time }
        hoursToday:
          type: array
          items:
            type: object
            required: [start, end]
            properties:
              start: { type: string, example: '08:00' }
              end: { type: string, example: '18:00' }
        delivery:
          type: object
          required: [available, distanceM, feeCents, freeShipping, freeAboveCents, minOrderCents, etaMinMinutes, etaMaxMinutes, acceptsDelivery]
          properties:
            available: { type: [boolean, 'null'], description: 'Nulo sem posição' }
            distanceM: { type: [integer, 'null'] }
            feeCents: { type: [integer, 'null'] }
            freeShipping: { type: boolean }
            freeAboveCents: { type: integer }
            minOrderCents: { type: integer }
            etaMinMinutes: { type: integer, description: 'DEC-053: início da faixa calculada (sem posição, só preparo + despacho).' }
            etaMaxMinutes: { type: integer }
            eta: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }], description: 'DEC-053: com posição e dentro do teto; senão nulo.' }
            logisticsClosed: { type: boolean, description: 'BUG-016: logística fora do horário ou pausada para esta posição (só retirada)' }
            logisticsOpensAt: { type: [string, 'null'], format: date-time }
            acceptsDelivery: { type: boolean }
        pickup:
          type: object
          required: [enabled, offered, address, instructions, prepMinMinutes, prepMaxMinutes]
          properties:
            enabled: { type: boolean }
            offered: { type: boolean }
            address: { type: [string, 'null'] }
            instructions: { type: [string, 'null'] }
            prepMinMinutes: { type: integer }
            prepMaxMinutes: { type: integer }
        exchangePolicy:
          type: object
          required: [voluntaryDays, collectionFeeCents, version]
          properties:
            voluntaryDays: { type: integer, description: '0 = não aceita troca voluntária; arrependimento (7 dias) e defeito são piso legal fixo' }
            collectionFeeCents: { type: integer }
            version: { type: integer }
        supplier:
          type: object
          required: [name, documentType, documentMasked, address]
          properties:
            name: { type: string }
            documentType: { type: string, enum: [cpf, cnpj] }
            documentMasked: { type: string }
            address:
              type: object
              properties:
                street: { type: [string, 'null'] }
                number: { type: [string, 'null'] }
                neighborhood: { type: [string, 'null'] }
                city: { type: [string, 'null'] }
                state: { type: [string, 'null'] }
        sections:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    BrowseProductItem:
      type: object
      required: [id, name, sectionId, image, price, originalPrice, discountPercent, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sectionId: { type: [string, 'null'], format: uuid }
        image: { $ref: '#/components/schemas/ImageUrls' }
        price: { $ref: '#/components/schemas/Money' }
        originalPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discountPercent: { type: [integer, 'null'] }
        available: { type: boolean }
    BrowseProductPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BrowseProductItem' } }
        nextCursor: { type: [string, 'null'] }
    BrowseVariant:
      type: object
      required: [id, attributes, price, originalPrice, discountPercent, available, maxQuantity, lastUnits]
      properties:
        id: { type: string, format: uuid }
        attributes: { type: object, additionalProperties: { type: string }, example: { Tamanho: M } }
        price: { $ref: '#/components/schemas/Money' }
        originalPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discountPercent: { type: [integer, 'null'] }
        available: { type: boolean }
        maxQuantity: { type: integer, description: Teto da quantidade desta variação }
        lastUnits: { type: [integer, 'null'], description: "1 a 3 quando restam poucas ('Últimas X unidades')" }
    BrowseStoreSummary:
      type: object
      required: [id, name, open, opensAt, hoursToday]
      properties:
        delivery:
          oneOf:
            - type: 'null'
            - type: object
              required: [available, eta]
              description: 'DEC-053: só com `lat`/`lng` na consulta do produto.'
              properties:
                available: { type: boolean }
                eta: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }] }
        id: { type: string, format: uuid }
        name: { type: string }
        open: { type: boolean }
        opensAt: { type: [string, 'null'], format: date-time }
        hoursToday:
          type: array
          items:
            type: object
            properties:
              start: { type: string }
              end: { type: string }
    BrowseProduct:
      type: object
      required: [id, name, available, store]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        sizeChart: { type: [string, 'null'], description: 'Tabela de medidas do lojista (WB-246).' }
        acceptsVoluntaryExchange: { type: boolean, description: 'false = produto marcado sem troca voluntária (WB-244).' }
        categoryId: { type: [string, 'null'], format: uuid }
        available: { type: boolean }
        unavailableReason: { type: [string, 'null'], enum: [PAUSED, MODERATED, SOLD_OUT, null] }
        price: { $ref: '#/components/schemas/Money' }
        originalPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discountPercent: { type: [integer, 'null'] }
        variantAttributes: { type: array, items: { type: string } }
        variants: { type: array, items: { $ref: '#/components/schemas/BrowseVariant' } }
        images:
          type: array
          items:
            type: object
            required: [id, position, urls]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              urls: { type: object, additionalProperties: { type: string, format: uri } }
        rating: { $ref: '#/components/schemas/Rating' }
        store: { $ref: '#/components/schemas/BrowseStoreSummary' }
    Review:
      type: object
      required: [id, rating, comment, reviewer, verifiedPurchase, createdAt, storeReply, storeRepliedAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        fit: { type: [string, 'null'], enum: [small, ok, large, null], description: 'Como vestiu (WB-247): small = pequeno, ok = fiel ao tamanho, large = grande.' }
        reviewer: { type: string, description: "Primeiro nome e inicial do último ('Maria S.')" }
        verifiedPurchase: { type: boolean, description: "'Compra verificada'" }
        createdAt: { type: string, format: date-time }
        storeReply: { type: [string, 'null'] }
        storeRepliedAt: { type: [string, 'null'], format: date-time }
    ReviewPage:
      type: object
      required: [summary, data, nextCursor]
      properties:
        summary: { $ref: '#/components/schemas/Rating' }
        data: { type: array, items: { $ref: '#/components/schemas/Review' } }
        nextCursor: { type: [string, 'null'] }
    Favorite:
      type: object
      required: [kind, unavailable, favoritedAt, store, product]
      properties:
        kind: { type: string, enum: [store, product] }
        unavailable: { type: boolean }
        favoritedAt: { type: string, format: date-time }
        store:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, logo]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                logo: { $ref: '#/components/schemas/ImageUrls' }
        product:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, image, price, storeId, storeName]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                image: { $ref: '#/components/schemas/ImageUrls' }
                price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                storeId: { type: string, format: uuid }
                storeName: { type: string }
    FavoritePage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Favorite' } }
        nextCursor: { type: [string, 'null'] }
    SearchHistoryList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          maxItems: 10
          items:
            type: object
            required: [term, searchedAt]
            properties:
              term: { type: string }
              searchedAt: { type: string, format: date-time }
        nextCursor: { type: 'null' }
    RecordSearchTermRequest:
      type: object
      additionalProperties: false
      required: [term]
      properties:
        term: { type: string, minLength: 2, maxLength: 80 }
    CartWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [PRICE_CHANGED, QUANTITY_EXCEEDS_STOCK, OUT_OF_STOCK, UNAVAILABLE] }
        message: { type: string, description: Texto pt-BR sugerido }
        fromCents: { type: integer, description: Só em `PRICE_CHANGED`, preço que o cliente viu }
        toCents: { type: integer, description: Só em `PRICE_CHANGED`, preço vigente }
        requestedQuantity: { type: integer, description: Só em `QUANTITY_EXCEEDS_STOCK` }
        maxQuantity: { type: integer, description: Só em `QUANTITY_EXCEEDS_STOCK` }
    CartItem:
      type: object
      required: [id, variantId, productId, name, attributes, image, quantity, unitPrice, originalUnitPrice, lineTotal, available, maxQuantity, warnings]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        name: { type: string }
        attributes: { type: object, additionalProperties: { type: string }, example: { Tamanho: '42', Cor: Preto } }
        image: { $ref: '#/components/schemas/ImageUrls' }
        quantity: { type: integer, description: 'Quantidade que valerá no pedido (já limitada ao disponível); 0 se esgotado ou fora do ar' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        originalUnitPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Preço antes da promoção vigente }
        lineTotal: { $ref: '#/components/schemas/Money' }
        available: { type: boolean }
        maxQuantity: { type: integer }
        warnings: { type: array, items: { $ref: '#/components/schemas/CartWarning' } }
    CartNotice:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [CART_EXPIRED, QUANTITY_ADJUSTED, STORE_REPLACED, MERGE_KEPT_ACCOUNT_CART, MERGE_ITEM_SKIPPED] }
        message: { type: string }
        requestedQuantity: { type: integer }
        appliedQuantity: { type: integer }
        maxQuantity: { type: integer }
        variantId: { type: string, format: uuid }
    CartCoupon:
      type: object
      required: [code, kind, scope, applied, rejection]
      properties:
        code: { type: string }
        kind: { type: string, enum: [percent, fixed, free_shipping] }
        scope: { type: string, enum: [store, platform] }
        applied: { type: boolean }
        rejection: { type: [string, 'null'], description: 'Motivo quando `applied=false` (os mesmos `code` do 422 de `applyCartCoupon`)' }
    CartSummary:
      type: object
      required: [subtotal, delivery, deliveryEstimated, freeShipping, serviceFee, discount, total, minimumTotalApplied, platformDiscountCapped, missingForMinimum]
      description: "Total = subtotal - cupom + frete + taxa de serviço (RN-05, RN-10), em centavos. É a MESMA conta que o pedido usa."
      properties:
        subtotal: { $ref: '#/components/schemas/Money' }
        delivery: { $ref: '#/components/schemas/Money' }
        deliveryEstimated: { type: boolean, description: "'a partir de': sem endereço escolhido" }
        freeShipping: { type: boolean }
        serviceFee: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        minimumTotalApplied: { type: boolean, description: "Cupom que zeraria o total: mostrar 'Valor mínimo cobrado'" }
        platformDiscountCapped: { type: boolean, description: Desconto da plataforma cortado no teto da comissão }
        missingForMinimum: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: "'Faltam R$ X para o pedido mínimo'" }
    ExposureLimit:
      type: object
      required: [active, mode, maxOrder, endsAt, deliveredOrders, ordersToEnd]
      properties:
        active: { type: boolean, description: O teto vale agora }
        mode: { type: string, enum: [default, released, custom] }
        maxOrder: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Teto por pedido; null sem limite }
        endsAt: { type: [string, 'null'], format: date-time, description: Fim pelo prazo (aprovação + loja_nova_dias); null se liberada }
        deliveredOrders: { type: integer }
        ordersToEnd: { type: [integer, 'null'], description: Quantos pedidos entregues faltam para encerrar o limite }
    ExposureLimitInput:
      type: object
      required: [mode, reason]
      properties:
        mode: { type: string, enum: [default, released, custom] }
        maxOrderCents: { type: integer, minimum: 10000, maximum: 5000000, description: "Só com mode=custom" }
        reason: { type: string, minLength: 3, maxLength: 300 }
    CartCheckout:
      type: object
      required: [canCheckout, blockers, opensAt]
      properties:
        canCheckout: { type: boolean }
        blockers:
          type: array
          items: { type: string, enum: [EMPTY, ITEM_UNAVAILABLE, STORE_UNAVAILABLE, STORE_CLOSED, BELOW_MINIMUM, OUT_OF_RANGE, LOGISTICS_CLOSED, NEEDS_ADDRESS, PICKUP_UNAVAILABLE, ABOVE_MAX_ORDER, NEW_STORE_LIMIT] }
        opensAt: { type: [string, 'null'], format: date-time }
        newStoreMaxOrder: { $ref: '#/components/schemas/Money', description: Teto por pedido da loja nova, quando o limite está ativo (WB-225) }
    Cart:
      type: object
      required: [id, revision, store, items, coupon, delivery, summary, checkout, notices]
      properties:
        id: { type: [string, 'null'], format: uuid }
        revision: { type: integer, description: Sobe a cada mudança; o checkout confere para nunca cobrar valor que o cliente não viu }
        store:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, logo, open, opensAt, etaMinMinutes, etaMaxMinutes, minOrder]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                logo: { $ref: '#/components/schemas/ImageUrls' }
                open: { type: boolean }
                opensAt: { type: [string, 'null'], format: date-time }
                etaMinMinutes: { type: integer, description: 'DEC-053: calculado pelo endereço escolhido (sem endereço, só preparo + despacho).' }
                etaMaxMinutes: { type: integer }
                minOrder: { $ref: '#/components/schemas/Money' }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        coupon: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/CartCoupon' }] }
        delivery:
          type: object
          required: [mode, addressId, available, distanceM, feeFromCents, estimated]
          properties:
            logisticsOpensAt: { type: [string, 'null'], format: date-time, description: 'BUG-016/021: com o bloqueio `LOGISTICS_CLOSED` por horário (inclui o fim da faixa depois do fechamento), quando a entrega volta ("Entrega volta às HH:MM"); nulo em pausa do admin.' }
            eta: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }], description: 'DEC-053: faixa para o endereço da sacola; nulo sem endereço ou fora do alcance (então `available=false` e o bloqueio `OUT_OF_RANGE`). É a mesma conta gravada no pedido.' }
            mode: { type: string, enum: [delivery, pickup] }
            addressId: { type: [string, 'null'], format: uuid }
            available: { type: [boolean, 'null'], description: Entrega no endereço; nulo sem endereço ou na retirada }
            distanceM: { type: [integer, 'null'] }
            feeFromCents: { type: [integer, 'null'], description: "Menor frete da loja ('a partir de')" }
            estimated: { type: boolean }
        summary: { $ref: '#/components/schemas/CartSummary' }
        checkout: { $ref: '#/components/schemas/CartCheckout' }
        notices: { type: array, items: { $ref: '#/components/schemas/CartNotice' }, description: Avisos desta resposta (não persistem) }
    SetCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 999 }
        replaceStore: { type: boolean, description: "Confirma 'Esvaziar e continuar' ao trocar de loja (WB-021)" }
    ApplyCouponRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 30 }
    MergeCartRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 999 }
    CartStoreConflictProblem:
      type: object
      required: [type, title, status, code, currentStore, newStore, itemCount]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, enum: [409] }
        detail: { type: string }
        code: { type: string, enum: [CART_STORE_CONFLICT] }
        currentStore: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        newStore: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        itemCount: { type: integer }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    AdvanceOrderRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [in_preparation, ready_for_collection, ready_for_pickup, delivered] }
        pickupCode: { type: string, pattern: '^\d{4}$', description: 'Obrigatório ao concluir uma retirada: o código que o cliente informa' }
        volumes: { type: integer, minimum: 1, maximum: 99, description: 'Só em ready_for_collection (padrão 1).' }
        note: { type: string, maxLength: 100, description: 'Só em ready_for_collection: observação para o motoboy.' }
    StoreOrderAction:
      type: string
      enum: [accept, refuse, prepare, dispatch, ready, complete, cancel]
    StoreOrderSummary:
      type: object
      required: [id, number, status, mode, createdAt, paidAt, acceptDeadlineAt, customerFirstName, itemCount, firstItemName, total, allowedActions]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mode: { type: string, enum: [delivery, pickup] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        acceptDeadlineAt: { type: [string, 'null'], format: date-time, description: 'Só em `received`: a loja tem até aqui para aceitar' }
        customerFirstName: { type: string }
        itemCount: { type: integer }
        firstItemName: { type: string }
        total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Nulo sem a permissão `sales_values`' }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/StoreOrderAction' } }
    StoreOrderPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StoreOrderSummary' } }
        nextCursor: { type: [string, 'null'] }
    StoreOrderCounts:
      type: object
      required: [new, in_progress, history]
      properties:
        new: { type: integer }
        in_progress: { type: integer }
        history: { type: integer }
    StoreOrder:
      type: object
      required: [id, number, status, mode, createdAt, paidAt, acceptedAt, acceptDeadlineAt, customer, items, delivery, pickup, values, couponCode, timeline, cancellation, allowedActions]
      properties:
        cancelRequest: { oneOf: [{ $ref: '#/components/schemas/CancelRequest' }, { type: 'null' }], description: 'BUG-015: pedido de cancelamento do cliente (em separação) aguardando a loja, ou a decisão.' }
        logistics:
          description: 'Estado da corrida e o primeiro nome do motoboy (sem telefone). Nulo na retirada ou antes do pronto.'
          oneOf:
            - type: 'null'
            - type: object
              properties:
                status: { $ref: '#/components/schemas/DeliveryStatus' }
                courierFirstName: { type: [string, 'null'] }
                volumes: { type: integer }
        id: { type: string, format: uuid }
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mode: { type: string, enum: [delivery, pickup] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        acceptDeadlineAt: { type: [string, 'null'], format: date-time }
        customer:
          type: object
          required: [firstName, phone]
          properties:
            firstName: { type: string }
            phone: { type: [string, 'null'], description: 'Só enquanto o pedido de entrega está em andamento (LGPD: minimização)' }
        items:
          type: array
          items:
            type: object
            required: [name, attributes, image, quantity, unitPrice, lineTotal]
            properties:
              name: { type: string }
              attributes: { type: object, additionalProperties: { type: string } }
              image: { $ref: '#/components/schemas/ImageUrls' }
              quantity: { type: integer }
              unitPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
              lineTotal: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        delivery:
          oneOf:
            - type: 'null'
            - type: object
              required: [address, etaMinMinutes, etaMaxMinutes]
              properties:
                address: { type: object, additionalProperties: true }
                etaMinMinutes: { type: integer }
                etaMaxMinutes: { type: integer }
                eta: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }], description: 'DEC-053: faixa gravada no pedido; a espera do PIX não conta (reancora no pagamento) e só fica mais cedo com o motoboy a caminho. Nulo em pedido anterior à regra.' }
        pickup:
          oneOf:
            - type: 'null'
            - type: object
              required: [address, instructions, prepMinMinutes, prepMaxMinutes]
              properties:
                address: { type: string }
                instructions: { type: [string, 'null'] }
                prepMinMinutes: { type: integer }
                prepMaxMinutes: { type: integer }
        values:
          oneOf:
            - type: 'null'
            - type: object
              description: Só com `sales_values`. `netBeforeProviderFee` = bruto da loja - comissão (a tarifa do provedor sai depois).
              required: [subtotal, delivery, storeDiscount, total, commission, netBeforeProviderFee]
              properties:
                subtotal: { $ref: '#/components/schemas/Money' }
                delivery: { $ref: '#/components/schemas/Money' }
                storeDiscount: { $ref: '#/components/schemas/Money' }
                total: { $ref: '#/components/schemas/Money' }
                commission: { $ref: '#/components/schemas/Money' }
                netBeforeProviderFee: { $ref: '#/components/schemas/Money' }
        couponCode: { type: [string, 'null'] }
        timeline: { type: array, items: { $ref: '#/components/schemas/OrderTimelineEntry' } }
        cancellation:
          oneOf:
            - type: 'null'
            - type: object
              required: [by, reason, at]
              properties:
                by: { type: string, enum: [customer, store, system, admin] }
                reason: { type: [string, 'null'] }
                at: { type: string, format: date-time }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/StoreOrderAction' } }
    StoreOrderTicket:
      type: object
      required: [number, mode, createdAt, customerFirstName, destination, items]
      properties:
        number: { type: string }
        mode: { type: string, enum: [delivery, pickup] }
        createdAt: { type: string, format: date-time }
        customerFirstName: { type: string }
        destination: { type: string }
        items:
          type: array
          items:
            type: object
            required: [quantity, name, attributes]
            properties:
              quantity: { type: integer }
              name: { type: string }
              attributes: { type: object, additionalProperties: { type: string } }
    OrderStatus:
      type: string
      description: "Estados do pedido (RN-07). Transições validadas no servidor; o histórico guarda ator e hora de cada uma."
      enum: [awaiting_payment, received, accepted, in_preparation, ready_for_collection, out_for_delivery, ready_for_pickup, delivered, cancelled, refused, expired]
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [mode, cartRevision, expectedTotalCents, paymentMethod]
      properties:
        mode: { type: string, enum: [delivery, pickup] }
        addressId: { type: string, format: uuid, description: 'Obrigatório na entrega; deve ser do cliente (404 se de outra conta)' }
        cartRevision: { type: integer, description: '`revision` da sacola que o cliente viu' }
        expectedTotalCents: { type: integer, minimum: 0, description: 'Total (centavos) que o cliente viu (`summary.total` da sacola). OBRIGATÓRIO (SEC-147; 400 sem ele); se diferir do calculado pelo servidor (frete mudou, cupom esgotou): 409 CART_CHANGED com `DELIVERY_FEE_CHANGED` ou `DISCOUNT_CHANGED`' }
        paymentMethod: { type: string, enum: [pix, card] }
        card:
          type: object
          additionalProperties: false
          description: Obrigatório com `paymentMethod=card`. Só o TOKEN gerado pelo checkout do Mercado Pago no aparelho; nunca número de cartão.
          required: [token, installments]
          properties:
            token: { type: string, minLength: 8, maxLength: 200 }
            installments: { type: integer, minimum: 1, maximum: 3 }
            paymentMethodId: { type: string, maxLength: 40 }
            issuerId: { type: string, maxLength: 40 }
        payerDocument:
          type: string
          description: "CPF (11 dígitos) quando o provedor exigir (`PAYER_DOCUMENT_REQUIRED`). Vai só ao provedor; não é guardado pelo Webag além do necessário para a conciliação."
          pattern: '^\d{11}$'
    CheckoutChange:
      type: object
      required: [kind, variantId]
      properties:
        kind: { type: string, enum: [PRICE_CHANGED, QUANTITY_REDUCED, OUT_OF_STOCK, UNAVAILABLE, DELIVERY_FEE_CHANGED, DISCOUNT_CHANGED] }
        variantId: { type: string, format: uuid }
        name: { type: string }
        fromCents: { type: integer }
        toCents: { type: integer }
        fromQuantity: { type: integer }
        toQuantity: { type: integer }
    CheckoutConflictProblem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, enum: [409] }
        detail: { type: string }
        code: { type: string, enum: [CART_CHANGED, STORE_CLOSED, STOCK_CONFLICT, IDEMPOTENCY_KEY_REUSED] }
        changes: { type: array, items: { $ref: '#/components/schemas/CheckoutChange' }, description: 'Em `CART_CHANGED`: o que mudou e o novo total em `cart`' }
        cart: { $ref: '#/components/schemas/Cart' }
        opensAt: { type: [string, 'null'], format: date-time, description: 'Em `STORE_CLOSED`' }
    OrderItem:
      type: object
      description: Snapshot do item no momento do pedido (não muda se o produto mudar depois).
      required: [productId, variantId, name, attributes, image, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        name: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
        image: { $ref: '#/components/schemas/ImageUrls' }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
    PixPayment:
      type: object
      required: [copyPaste, qrCodeBase64, expiresAt]
      properties:
        copyPaste: { type: string, description: PIX copia e cola }
        qrCodeBase64: { type: [string, 'null'], description: 'Imagem PNG em base64; nulo se o provedor não devolveu' }
        expiresAt: { type: string, format: date-time }
    OrderPayment:
      type: object
      required: [method, status, amount, pix, installments, declineReason, updatedAt]
      properties:
        method: { type: string, enum: [pix, card] }
        status: { type: string, enum: [pending, pending_3ds, approved, declined, expired, cancelled, refunded], description: 'Estados do provedor expostos ao cliente; os internos (`creating`, `divergent`) aparecem como `pending`' }
        amount: { $ref: '#/components/schemas/Money' }
        pix: { oneOf: [{ $ref: '#/components/schemas/PixPayment' }, { type: 'null' }] }
        installments: { type: integer }
        threeDsUrl: { type: [string, 'null'], format: uri }
        declineReason: { type: [string, 'null'], description: Texto pt-BR seguro para mostrar }
        updatedAt: { type: string, format: date-time }
    OrderTimelineEntry:
      type: object
      required: [status, at, actor, reason]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }
        actor: { type: string, enum: [customer, store, system, admin] }
        reason: { type: [string, 'null'] }
    Order:
      type: object
      required: [id, number, status, mode, createdAt, updatedAt, store, items, summary, couponCode, delivery, pickup, payment, exchangePolicy, timeline, allowedActions, cancellation, tracking]
      properties:
        cancelRequest: { oneOf: [{ $ref: '#/components/schemas/CancelRequest' }, { type: 'null' }], description: 'BUG-015: pedido de cancelamento em separação e a decisão da loja; nulo se nunca houve.' }
        delay:
          description: 'WB-253: atraso da entrega, calculado no servidor (aparece ao reconectar). Nulo na retirada, sem faixa gravada ou fora da entrega ativa. `late`: passou do fim da faixa (aviso neutro + 1 push). `canCancelWithoutCost`: passou do fim + `entrega_atraso_tolerancia_min` (botão "Cancelar sem custo"; em saída "Pedir cancelamento"). `cancelMode`: immediate | request. `cancelRequest`: o pedido à operação com o pedido em saída (a loja não participa).'
          oneOf:
            - type: object
              additionalProperties: false
              required: [late, canCancelWithoutCost, cancelAvailableAt, cancelMode, cancelRequest]
              properties:
                late: { type: boolean }
                canCancelWithoutCost: { type: boolean }
                cancelAvailableAt: { type: string, format: date-time }
                cancelMode: { type: [string, 'null'], enum: [immediate, request, null] }
                cancelRequest: { oneOf: [{ $ref: '#/components/schemas/CancelRequest' }, { type: 'null' }] }
            - type: 'null'
        tracking:
          description: 'Acompanhamento da entrega Webag (WB-235): estado da corrida, SÓ o primeiro nome do motoboy e o código de entrega a partir de “saiu para entrega”. Nulo na retirada ou antes de o pedido ficar pronto.'
          oneOf:
            - type: 'null'
            - type: object
              required: [status, courierFirstName, attempts, failReason, deliveryCode, timeline]
              properties:
                status: { $ref: '#/components/schemas/DeliveryStatus' }
                courierFirstName: { type: [string, 'null'] }
                attempts: { type: integer }
                failReason: { type: [string, 'null'] }
                deliveryCode: { type: [string, 'null'], description: 'Código de 4 dígitos que o cliente informa ao motoboy; só em saiu para entrega e não entregue.' }
                timeline:
                  type: array
                  items:
                    type: object
                    required: [status, at]
                    properties:
                      status: { $ref: '#/components/schemas/DeliveryStatus' }
                      at: { type: string, format: date-time }
        id: { type: string, format: uuid }
        number: { type: string, description: 'Código curto legível para falar com a loja e o suporte', example: 'WB-4F7K2' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mode: { type: string, enum: [delivery, pickup] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        store:
          type: object
          required: [id, name, logo, whatsapp]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            logo: { $ref: '#/components/schemas/ImageUrls' }
            whatsapp: { type: [string, 'null'], description: 'Para "Falar com a loja" (WB-029)' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        summary: { $ref: '#/components/schemas/CartSummary' }
        couponCode: { type: [string, 'null'] }
        delivery:
          oneOf:
            - type: 'null'
            - type: object
              required: [address, etaMinMinutes, etaMaxMinutes]
              properties:
                address: { $ref: '#/components/schemas/Address' }
                etaMinMinutes: { type: integer }
                etaMaxMinutes: { type: integer }
                eta: { oneOf: [{ $ref: '#/components/schemas/EtaRange' }, { type: 'null' }], description: 'DEC-053: faixa gravada no pedido; a espera do PIX não conta (reancora no pagamento) e só fica mais cedo com o motoboy a caminho. Nulo em pedido anterior à regra.' }
        pickup:
          oneOf:
            - type: 'null'
            - type: object
              required: [address, instructions, code, prepMinMinutes, prepMaxMinutes]
              properties:
                address: { type: string }
                instructions: { type: [string, 'null'] }
                code: { type: [string, 'null'], description: 'Código de 4 dígitos; só depois de pago' }
                prepMinMinutes: { type: integer }
                prepMaxMinutes: { type: integer }
        payment:
          type: object
          required: [method, status]
          properties:
            method: { type: string, enum: [pix, card] }
            status: { type: string, enum: [pending, pending_3ds, approved, declined, expired, cancelled, refunded] }
        exchangePolicy:
          type: object
          required: [voluntaryDays, collectionFeeCents, version]
          description: Política vigente no pedido (snapshot, WB-059 C3)
          properties:
            voluntaryDays: { type: integer }
            collectionFeeCents: { type: integer }
            version: { type: integer }
        exchange:
          type: object
          description: "Prazos finais da troca já na entrada do pedido (B.1: 'Troca até 25/11'); tudo nulo se não foi entregue"
          properties:
            canRequest: { type: boolean }
            withdrawalUntil: { type: [string, 'null'], format: date-time }
            voluntaryUntil: { type: [string, 'null'], format: date-time }
            defectUntil: { type: [string, 'null'], format: date-time }
        timeline: { type: array, items: { $ref: '#/components/schemas/OrderTimelineEntry' } }
        allowedActions:
          type: array
          items: { type: string, enum: [cancel, request_cancel, contact_store, rate, report_not_received, request_exchange] }
        cancellation:
          oneOf:
            - type: 'null'
            - type: object
              required: [by, reason, at]
              properties:
                by: { type: string, enum: [customer, store, system, admin] }
                reason: { type: [string, 'null'] }
                at: { type: string, format: date-time }
    OrderSummary:
      type: object
      required: [id, number, status, mode, store, itemCount, firstItemName, firstItemImage, total, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mode: { type: string, enum: [delivery, pickup] }
        store:
          type: object
          required: [id, name, logo]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            logo: { $ref: '#/components/schemas/ImageUrls' }
        itemCount: { type: integer }
        firstItemName: { type: string }
        firstItemImage: { $ref: '#/components/schemas/ImageUrls' }
        total: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
    OrderPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        nextCursor: { type: [string, 'null'] }
    CancelOrderRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 200 }
    ExchangeType:
      type: string
      enum: [withdrawal, defect, size_color]
    ExchangeStatus:
      type: string
      enum: [requested, awaiting_fee, approved, item_received, completed, rejected, cancelled, expired, in_mediation]
    CreateExchangeRequest:
      type: object
      additionalProperties: false
      required: [orderItemId, type, method]
      properties:
        orderItemId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ExchangeType' }
        reasonCode: { type: string, enum: [size, color], description: 'Obrigatório em `size_color`.' }
        description: { type: string, maxLength: 500 }
        method: { type: string, enum: [pickup_at_home, drop_at_store] }
