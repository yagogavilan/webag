      description: "Permissão da loja: `orders` (dono ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Só pedidos já PAGOS. De `received` para `accepted`; cancela o prazo de aceite (`loja_aceite_timeout_min`). Idempotente: aceitar de novo devolve 200. Outro estado: 409 `INVALID_TRANSITION`."
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
