      description: "Permissão da loja: `catalog` (dono, ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Catálogo só com a loja aprovada (409 `STORE_NOT_APPROVED`). Até 8 fotos (422 `TOO_MANY_IMAGES`), cada uma um upload `product_image` concluído da mesma loja (`/uploads`). As variantes WebP redimensionadas vêm em `urls`. **v1.1 R1:** `If-Match` com a `version` do produto; o envio das fotos é em segundo plano e o produto não publica enquanto a capa não terminar de subir (o app espera; o servidor recusa publicar sem foto concluída: 422 `PRODUCT_INCOMPLETE`)."
