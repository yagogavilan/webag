      summary: Publicar produto
      description: "Permissão da loja: `catalog` (dono, ou funcionário com a permissão); não-membro recebe 404 (SEC-020). Catálogo só com a loja aprovada (409 `STORE_NOT_APPROVED`). Lista TODOS os campos que faltam num único 422 `PRODUCT_INCOMPLETE` (nome, categoria, preço, 1 foto, 1 variação). Palavra suspeita não bloqueia: o produto entra em `moderationStatus: review`. 403 `PRODUCT_MODERATED` se a moderação pausou ou removeu. **v1.1 R1:** categoria com `descriptionRequired` e descrição vazia ou menor que `descriptionMinChars`: 422 `DESCRIPTION_REQUIRED` (no campo `description`); `If-Match` com a `version`; grava `product_create_published` com `duration_s` e `via` (WB-379) e, se o produto vier de rascunho aberto em 2 aparelhos, 409 `PRODUCT_VERSION_CONFLICT`. Nada digitado se perde em nenhum erro."
