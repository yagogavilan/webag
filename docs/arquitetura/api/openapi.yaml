    post:
      tags: [auth]
      operationId: verifyMfa
      summary: 2º passo do login do admin (SEC-090)
      description: "Recebe o `mfaToken` do login (256 bits, 5 min, uso único, 5 tentativas) e o TOTP ou um código de recuperação. Token inexistente, vencido, usado ou código errado têm a MESMA resposta (401 `MFA_INVALID`). Erros somam no limite do 2º fator POR CONTA (429 `MFA_RATE_LIMITED`, SEC-091)."
