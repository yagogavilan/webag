<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56" width="120" height="56" role="img" aria-label="Selos Webag: oferta (inclinado) e adesivo (sombra dura)">
  <!-- Esquerda: selo de oferta. Retângulo raio 7 inclinado -8 graus, acento com texto noite 14/800 desinclinado (+8). Só para desconto real (preço antigo visível).
       Direita: adesivo. Raio 8, rotação -6 a +8 graus, sombra dura 3/3 em noite, sem desfoque. Só 1 adesivo por dobra. O texto é aplicado na interface, não no SVG. -->
  <g transform="translate(6 14) skewX(-8)">
    <rect width="48" height="26" rx="7" fill="#D6FF4A"/>
  </g>
  <g transform="translate(66 12) rotate(-6 24 14)">
    <rect x="3" y="3" width="48" height="28" rx="8" fill="#1C1721"/>
    <rect width="48" height="28" rx="8" fill="#D6FF4A"/>
  </g>
</svg>
