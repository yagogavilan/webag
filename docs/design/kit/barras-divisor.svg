<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 8" width="342" height="8" role="img" aria-label="Divisor de seção Webag">
  <!-- Divisor "barras": 3 pílulas inclinadas a -8 graus (a inclinação Webag) + fio. Proporção das barras derivada do símbolo v4a (23:49:34 arredondado para 18:40:10 por legibilidade em 6 px). -->
  <g transform="skewX(-8)">
    <rect x="1" y="1" width="18" height="6" rx="3" fill="#1C1721"/>
    <rect x="25" y="1" width="40" height="6" rx="3" fill="#C02EF0"/>
    <rect x="71" y="1" width="10" height="6" rx="3" fill="#1C1721"/>
  </g>
  <rect x="92" y="3.5" width="250" height="1" fill="#E8E3EB"/>
</svg>
