<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Sacola vazia">
  <!-- Estado vazio da sacola. Sacola parada (barras curtas e claras = sem movimento), boca aberta em noite, etiqueta solta no acento.
       Uso: fundo branco ou papel. Título ao lado em Bricolage: "Sua sacola está esperando". Sem rosto, sem mascote. -->
