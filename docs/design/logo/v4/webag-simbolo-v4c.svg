<?xml version="1.0" encoding="UTF-8"?>
<!-- Webag v4c "Sacola Dobra". Simbolo isolado, cor solida #C02EF0, sem gradiente. viewBox 0 0 160 104.
     Estrategias: (1) mesmo corpo em trapezio da v4a, (2) alca larga e baixa (a mesma da v4a), (4) DOBRA/aba: faixa diagonal em espaco negativo (traco 5, de 40,57 a 170,45)
     separa a aba do topo (18 de altura a esquerda, 10 a direita) do corpo, (5) "w" em espaco negativo dentro do corpo (traco 8, pontas redondas).
     Sem olhais. Mascara so no corpo; a alca e desenhada depois, sem mascara. Barras como na v4a. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 104" width="160" height="104" role="img" aria-labelledby="wb-v4c-t">
  <title id="wb-v4c-t">Webag</title>
  <defs>
    <mask id="wb-dobra-w" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="104">
      <rect x="0" y="0" width="160" height="104" fill="#FFFFFF"/>
      <line x1="40" y1="57" x2="170" y2="45" stroke="#000000" stroke-width="5"/>
      <polyline points="80,68 91,92 103,74 115,92 126,68" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g id="barras" fill="#C02EF0">
    <rect x="24" y="34" width="23" height="14" rx="7"/>
    <rect x="0" y="62" width="49" height="14" rx="7"/>
    <rect x="18" y="90" width="34" height="14" rx="7"/>
  </g>
  <g id="sacola" fill="#C02EF0">
    <polygon id="corpo" points="67,43 145,43 133,95 72,95" stroke="#C02EF0" stroke-width="18" stroke-linejoin="round" mask="url(#wb-dobra-w)"/>
    <path id="alca" d="M80 42 A26 30 0 0 1 132 42" fill="none" stroke="#C02EF0" stroke-width="14"/>
  </g>
</svg>
