<!-- ESBOCO de comparacao. Conceito C "Alvo": alca como ARGOLA (anel) com um ponto no centro, que lembra pin de localizacao e botao de clique;
     corpo reto (sem inclinacao), 3 barras de velocidade. Cor #C02EF0 solida.
     viewBox provisorio 0 0 460 126. Simbolo x 0..152, y 0..104. Anel: centro (104,24), raio 19, traco 10 (externo 24), ponto raio 6.
     Corpo x56..152 y40..104 rx18; o anel toca o corpo (sobreposicao de 8 unidades em y40..48), o furo do anel (raio 14) fica livre.
     Palavra: Fredoka 700 (continuidade com a logo original), size 96, x=176, y=104. Largura estimada ~2,9 x 96 = ~278.
     Risco: lembra etiqueta de preco pendurada; o pin conversa com "cobertura por endereco", que a DEC-040 tirou da mensagem. -->
