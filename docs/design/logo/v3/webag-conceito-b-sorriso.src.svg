<!-- ESBOCO de comparacao. Conceito B "Sorriso": silhueta compacta (quadrado de cantos generosos), alca como arco ESPACO NEGATIVO dentro do corpo
     (alca caida pela frente, que desenha um sorriso discreto), 2 barras de velocidade. Cor #C02EF0 solida.
     viewBox provisorio 0 0 460 112. Simbolo x 0..152, y 0..90 (corpo x44..152, rx30). Palavra: Sora 700, size 88, x=172, y=90 (base do corpo).
     Largura estimada da palavra: ~3,2 x 88 = ~280 (Sora e larga); o "g" desce ate ~y=110.
     Risco: sem alca saliente a leitura de "sacola" cai; parente do sorriso da Amazon (conferir). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 112" width="460" height="112" role="img" aria-labelledby="wb-b-t">
  <title id="wb-b-t">Webag, conceito B</title>
  <defs>
    <mask id="wb-b-recorte" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="90">
      <rect x="44" y="0" width="108" height="90" rx="30" fill="#FFFFFF"/>
      <path d="M74 32 A24 20 0 0 0 122 32" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    </mask>
  </defs>
  <g id="simbolo" fill="#C02EF0">
    <rect x="12" y="24" width="20" height="14" rx="7"/>
    <rect x="0" y="52" width="32" height="14" rx="7"/>
    <rect x="0" y="0" width="160" height="90" mask="url(#wb-b-recorte)"/>
  </g>
  <!--TEXT2PATH font="sora-latin-700-normal.woff2" text="webag" size="88" tracking="-2" x="172" y="90" fill="#C02EF0" id="wordmark"-->
</svg>
