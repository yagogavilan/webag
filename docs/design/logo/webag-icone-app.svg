     Fundo = marca #C44DD9 (id="fundo"). Simbolo branco (id="simbolo") escala 2,6: todo o desenho cabe no circulo de
     raio 313 px (zona segura do icone adaptativo do Android: 66 dp de 108 dp). Contraste branco sobre marca: 3,9:1 (grafico, passa 3:1).
     Para o icone adaptativo do Android: exportar camada de frente = so id="simbolo" (fundo transparente) e camada de fundo = cor #C44DD9.
     Camada monocromatica (Android 13): simbolo em uma cor, sem fundo.
     Guias (id="guias", ocultas): para ver, troque display="none" por display="inline". -->
