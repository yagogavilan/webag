<style>
:root{--roxo:#C02EF0;--acao:#A21FBE;--r7:#8618A3;--r3:#E198EC;--noite:#1C1721;--n8:#2C2632;--n7:#443C4C;--n6:#5F566A;--n5:#837A8A;--n4:#B3ABB9;--n3:#D6CFDB;--n2:#E8E3EB;--n1:#F3F0F5;--papel:#FAF8FB;--estudio:#EEEAF1;--acento:#D6FF4A;--ok:#1B6E3C;--okS:#E5F4EA;--al:#7A4E00;--alS:#FFF3D6;--alB:#E9B949;--bad:#B3261E;--badS:#FCEAE8;--info:#28569E;--infoS:#E8F0FB;
--c1:#A21FBE;--c2:#1C1721;--c3:#28569E;--c4:#1B6E3C;--c5:#B45F06;--c6:#5F566A;
--fd:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;--fu:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--lean:-8deg;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/24px var(--fu);color:var(--noite);background:var(--n2);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--r7)}ul,ol{list-style:none}
:focus-visible{outline:3px solid var(--acao);outline-offset:2px}
.ink :focus-visible,.proto :focus-visible,.faixa :focus-visible,.foot.ink :focus-visible{outline-color:var(--acento)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:300;background:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.skip:focus{left:16px}
.i{display:block;flex:none}
/* barra do protótipo */
.proto{background:var(--noite);color:var(--n3);font:600 14px/20px var(--fu);padding:6px 16px}
.proto summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#fff;font-weight:800}
.proto .pr{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:4px 0 10px}
.proto .g{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto button,.proto select{min-height:44px;padding:0 12px;border-radius:10px;background:var(--n8);color:#fff;font-weight:700}
.proto button[aria-pressed=true]{background:var(--acento);color:var(--noite)}

 const rows=BANDS.map(([n,tx,cu])=>{const S0=Math.max(min,80);let D=c.tipo==='fixo'?c.valor:c.tipo==='pct'?Math.min(r2(S0*c.valor/100),c.teto):tx;if(c.tipo==='frete')D=tx;const Dw=D-Math.round(D*lp)/100*0;const dw=r2(D-r2(D*lp/100));

  const Sref=Smin?Math.max(Smin,min):S0;const marg=r2(.15*Sref+tx-cu);return{n,Smin,dw,dl:r2(D*lp/100),marg,sobra:r2(marg-dw),Sref,tx,cu}});return{lp,rows,min}}

function tipoOk(M,dim){return{kpi:[1],line:dim==='t'?[1]:[0,'Linha precisa de “Tempo” como dimensão.'],bar:[1],donut:dim!=='t'&&M.agg==='sum'?[1]:[0,'Rosca é só para partes de um todo (somas), sem tempo.'],table:[1],stack:[0,'Barra empilhada precisa de 2 dimensões. Não está neste protótipo.']}}
V['/a/construtor']=()=>{if(!S.b)S.b=bNovo();const b=S.b;const M=MI(b.m);const T=tipoOk(M,b.d);
 const mets=Object.keys(MET).filter(k=>visM(MI(k)));const grp={geral:'Geral',oper:'Operacional',fin:'Financeira'};
 const ms=`<select class="inp" id="bm" data-i="bf" data-f="m">${Object.keys(grp).map(g=>{const l=mets.filter(k=>MI(k).sens===g);return l.length?`<optgroup label="${grp[g]}">${l.map(k=>`<option value="${k}" ${b.m===k?'selected':''}>${MET[k][0]}</option>`).join('')}</optgroup>`:''}).join('')}</select>`;
 const dims=Object.keys(DIM).map(k=>{const ok=M.dims.includes(k);return `<button type="button" class="chip" aria-pressed="${b.d===k}" ${ok?'':'aria-disabled="true"'} data-a="bset" data-d="d|${k}">${DIM[k]}</button>`}).join('');
 const dis=Object.keys(DIM).filter(k=>!M.dims.includes(k));
 const tn={kpi:'Número',line:'Linha',bar:'Barra',stack:'Barra empilhada',donut:'Rosca',table:'Tabela'};
 const tipos=Object.keys(tn).map(k=>`<button type="button" class="chip" aria-pressed="${b.type===k}" ${T[k][0]?'':'aria-disabled="true"'} data-a="bset" data-d="type|${k}">${tn[k]}</button>`).join('');
 const tdis=Object.keys(tn).filter(k=>!T[k][0]&&k!=='stack').map(k=>`${tn[k]}: ${T[k][1]}`);
 const mine=Object.keys(PAIN).filter(k=>!PAIN[k].sys);
 const body=`<div class="cols"><div class="stack"><div class="fld"><label class="lbl" for="bm">1. Métrica</label>${ms}<p class="help" id="bdef">${M.def} <span class="mut">(texto de exemplo; a definição final vem da RN-15)</span></p></div>
 <div><div class="lbl">2. Dimensão</div><div class="chips" role="group" aria-label="Dimensão">${dims}</div>${dis.length?`<p class="help">Indisponível para “${M.n}”: ${dis.map(k=>DIM[k]).join(', ')}.</p>`:''}</div>
 <div><div class="lbl">3. Tipo de gráfico</div><div class="chips" role="group" aria-label="Tipo de gráfico">${tipos}</div>${tdis.length?`<p class="help">${tdis.join(' ')}</p>`:''}</div>
 <div class="g2"><div class="fld"><label class="lbl" for="bp">4. Período</label><select class="inp" id="bp" data-i="bf" data-f="per">${[7,28,90,400,500].map(p=>`<option value="${p}" ${b.per===p?'selected':''}>${p===500?'500 dias (teste do limite)':'Últimos '+p+' dias'}</option>`).join('')}</select></div><div class="fld"><label class="lbl" for="bmo">Modo</label><select class="inp" id="bmo" data-i="bf" data-f="modo"><option value="">Entrega e retirada</option><option value="Entrega" ${b.modo==='Entrega'?'selected':''}>Só entrega</option><option value="Retirada" ${b.modo==='Retirada'?'selected':''}>Só retirada</option></select></div></div>
 <div class="g2"><div class="fld"><label class="lbl" for="bci">Cidade</label><select class="inp" id="bci" data-i="bf" data-f="cid"><option value="">Todas</option>${DIMV.ci.map(c=>`<option ${b.cid===c?'selected':''}>${c}</option>`).join('')}</select></div><label class="chk" style="align-self:end"><input type="checkbox" ${b.cmp?'checked':''} data-i="bf" data-f="cmp"> Comparar com o período anterior</label></div></div>
 <div><div class="card ink" style="margin-bottom:12px"><b>Prévia</b></div><div id="bprev"></div><div class="card" style="margin-top:12px"><div class="stack8"><div class="fld"><label class="lbl" for="bn">Nome do gráfico</label><input class="inp" id="bn" data-i="bf" data-f="nome" value="${esc(b.nome)}" placeholder="${esc(M.n+(b.type==='kpi'?'':' por '+DIM[b.d].toLowerCase()))}"></div><div class="fld"><label class="lbl" for="bd">Salvar em</label><select class="inp" id="bd" data-i="bf" data-f="dest">${mine.map(k=>`<option value="${k}" ${b.dest===k?'selected':''}>${PAIN[k].n} (${PAIN[k].w.length} de 12)</option>`).join('')}</select></div><button class="btn lg" data-a="bsave">Salvar no painel</button></div></div></div></div>`;
 return shellA('Novo gráfico','Construtor',body,'Painéis','#/a/paineis?p=quin')};
POST['/a/construtor']=()=>bprev();
function bprev(){const b=S.b,e=$('#bprev');if(!e)return;const M=MI(b.m);const f=Object.assign({},S.pf,{cid:b.cid,modo:b.modo});
 if(b.per>400){e.innerHTML=note('bad','alert','<b>Período máximo de 400 dias.</b> Escolha um período menor para ver o gráfico.');return}
 if(S.estado==='offline'){}
 const w={id:'prev',t:b.nome||(M.n+(b.type==='kpi'?'':' por '+DIM[b.d].toLowerCase())),m:b.m,d:b.d,type:b.type,per:b.per,f:{cid:b.cid,modo:b.modo},cmp:b.cmp};e.innerHTML=widget(w,f,{})||note('info','lock','Sem permissão para esta métrica.')}
Object.assign(IN,{bf(t){const f=t.dataset.f;const b=S.b;if(t.type==='checkbox')b[f]=t.checked;else b[f]=f==='per'?+t.value:t.value;
  if(f==='m'){const M=MI(b.m);if(!M.dims.includes(b.d))b.d=M.dims[0];const T=tipoOk(M,b.d);if(!T[b.type][0])b.type=b.d==='t'?'line':'bar';S.keep=1;render();return}
  if(f==='nome'){bprev();return}bprev()}});
A.bset=d=>{const [k,v]=d.split('|');const b=S.b,M=MI(b.m);if(k==='d'){if(!M.dims.includes(v)){toast('“'+M.n+'” não existe por '+DIM[v].toLowerCase()+'.');return}b.d=v;const T=tipoOk(M,b.d);if(!T[b.type][0])b.type=v==='t'?'line':'bar'}else{const T=tipoOk(M,b.d);if(!T[v][0]){toast(T[v][1]);return}b.type=v}render()};
A.bsave=()=>{const b=S.b,P0=PAIN[b.dest];if(b.per>400){toast('Período máximo de 400 dias.');return}if(P0.w.length>=12){toast('Limite de 12 gráficos por painel.');return}const M=MI(b.m);P0.w.push({id:'n'+Date.now(),t:b.nome||(M.n+(b.type==='kpi'?'':' por '+DIM[b.d].toLowerCase())),m:b.m,d:b.d,type:b.type,per:b.per,f:{cid:b.cid,modo:b.modo},cmp:b.cmp});toast('Gráfico salvo em “'+P0.n+'”.');go('#/a/paineis?p='+b.dest)};
/* ===== CLIENTE: SACOLA COM CUPOM ===== */
const ENTREGA=9,CUSTO=11;
const CUPONS={
PRIMEIRA8:{v:8,fonte:'auto',lab:'Desconto Webag',cond:'Primeira compra · pedido a partir de R$ 120,00',val:'Válido até 31/12'},
CASA10:{pct:10,teto:15,fonte:'loja',lab:'Desconto da loja',cond:'Só nesta loja · até R$ 15,00',val:'Válido até 31/12'},
FRETE0:{frete:1,fonte:'webag',lab:'Desconto Webag (frete)',cond:'Frete grátis em pedidos a partir de R$ 60,00',val:'Válido até 31/12',min:60},
VELHO:{exp:'31/10'},ACABOU:{esg:1},HOJE:{esgDia:1},OUTRA:{loja:'Casa Bela'},EMAIL:{email:1},USADO:{usado:1},PRIMCOMPRA:{prim:1},APARELHO:{sinal:1},MARGEM:{marg:1},BLOQ:{bloq:1}};
const ACT={'Continuar sem cupom':'csem','Tentar de novo':'cap'};
function sub(){return S.sc.items.reduce((a,i)=>a+i.pr*i.q,0)}
/* Textos = tabela "Mensagens ao cliente" do PRD de cupons (fonte única, DEC-137). Sem "confirmar celular", sem produto no "Faltam". */
function evalC(code){const c=CUPONS[code];
 if(S.estado==='offline')return{ok:0,msg:'Sem conexão. Não conseguimos aplicar o cupom agora',act:'Tentar de novo'};
 if(!c)return{ok:0,msg:'Cupom inválido',campo:1};
 if(c.bloq)return{ok:0,msg:'Muitas tentativas. Tente de novo em 1 hora'};if(c.exp)return{ok:0,msg:'Esse cupom expirou em '+c.exp,act:'Ver cupons'};if(c.esg)return{ok:0,msg:'Cupom esgotado',act:'Continuar sem cupom'};if(c.esgDia)return{ok:0,msg:'Cupom esgotado hoje. Volta amanhã',act:'Continuar sem cupom'};
 if(c.loja)return{ok:0,msg:'Esse cupom vale só na loja '+c.loja,act:'Ver a loja '+c.loja};if(c.email)return{ok:0,msg:'Confirme seu e-mail para usar este cupom',act:'Confirmar e-mail'};
 if(c.usado)return{ok:0,msg:'Você já usou este cupom'};if(c.prim)return{ok:0,msg:'Cupom válido só na primeira compra'};
 if(c.sinal)return{ok:0,msg:'Não foi possível aplicar este cupom a este pedido',act:'Falar com o suporte'};
 if(c.marg)return{ok:0,msg:'Cupom não disponível para este pedido',act:'Continuar sem cupom'};
 const s=sub();
 if(c.fonte==='auto'){const marg=.15*s+ENTREGA-CUSTO;const teto=Math.floor(marg*50)/100;if(marg<=0)return{ok:0,msg:'Cupom não disponível para este pedido',act:'Continuar sem cupom'};if(c.v>teto){const falta=r2(Math.ceil(((c.v/.5)+CUSTO-ENTREGA)/.15*100-1e-6)/100-s);return{ok:0,falta,meta:r2(s+falta),msg:'Faltam '+brl(falta)+' para usar o cupom'}}return{ok:1,d:c.v,lab:c.lab,c}}
 if(c.pct){return{ok:1,d:Math.min(r2(s*c.pct/100),c.teto),lab:c.lab,c}}
 if(c.frete){if(s<c.min)return{ok:0,falta:r2(c.min-s),meta:c.min,msg:'Faltam '+brl(c.min-s)+' para usar o cupom'};return{ok:1,d:ENTREGA,lab:c.lab,c}}}
V['/c/sacola']=()=>{if(!S.sc)S.sc={items:[{n:'Camiseta básica branca',pr:40,q:2,k:'camiseta',c:'#D9D4DE'}],code:'',applied:null,res:null,open:false};const sc=S.sc;
 if(sc.applied){const r=evalC(sc.applied);sc.res=r.ok?r:null;if(!r.ok){sc.msg=r;sc.applied=null}}
 const s=sub();const ap=sc.res;const d=ap?ap.d:0;const tot=r2(s+ENTREGA-d);
 const g=gate(empty('Sua sacola está vazia','Escolha produtos de uma loja perto de você.',`<button class="btn" data-a="fora">Ver lojas</button>`));
 const items=sc.items.map((i,x)=>`<li class="lrow">${thumb(i)}<div class="grow"><b>${i.n}</b><div class="cap mut">${brl(i.pr)}</div></div><div class="step" role="group" aria-label="Quantidade de ${i.n}"><button data-a="sq" data-d="${x}|-1" aria-label="Menos 1">${ic('minus',20)}</button><span class="b" style="min-width:28px;text-align:center" aria-live="polite">${i.q}</span><button data-a="sq" data-d="${x}|1" aria-label="Mais 1">${ic('plus',20)}</button></div></li>`).join('');
 const m=sc.msg;
 const cupomUi=ap?`<div class="note ok" role="status">${ic('ticket',20)}<div class="grow"><b>${sc.applied}</b> aplicado<br><span class="mut">${ap.lab}: ${brl(d)} a menos. ${ap.c.cond}.</span></div><button class="btn ghost sm" data-a="crem">Remover</button></div>`:
 `<div class="card soft">${sc.open?`<form data-a="cap" id="cf"><div class="fld"><label class="lbl" for="cod">Código do cupom</label><div class="row" style="flex-wrap:nowrap"><input class="inp" id="cod" value="${esc(sc.code)}" autocapitalize="characters" autocomplete="off" enterkeyhint="go" data-i="cod" ${m&&!m.ok?'aria-invalid="true" aria-describedby="cmsg"':''}><button type="submit" class="btn ink" style="flex:none">Aplicar</button></div></div></form>`:`<button class="rowbtn" style="background:transparent;padding:0;min-height:48px" data-a="copen" aria-expanded="false">${ic('ticket',24)}<span class="grow"><b>Tem cupom?</b><small>Você tem 1 cupom para esta loja</small></span><span class="lnk" style="min-height:0">Ver cupons</span></button>`}${m&&!m.ok?`<div id="cmsg" role="${m.campo?'alert':'status'}" style="margin-top:10px">${m.falta!=null?`<div class="note al">${ic('info',20)}<div class="grow"><b>${m.msg}</b><div class="pbar" style="margin:8px 0" aria-hidden="true"><i style="width:${Math.min(100,Math.round(s/m.meta*100))}%;background:var(--roxo)"></i></div><span>Seu pedido tem ${brl(s)}. O cupom vale a partir de ${brl(m.meta)}.</span><div class="row" style="margin-top:8px"><button class="btn ink sm" data-a="fora">Ver mais da loja</button></div></div></div>`:(m.campo?`<p class="err">${ic('alert',16)}<span>${m.msg}</span></p>`:`<div class="note info">${ic('info',20)}<div class="grow"><b>${m.msg}</b></div></div>`)+(m.act?`<button class="btn sec sm" data-a="${ACT[m.act]||'fora'}" style="margin-top:6px">${m.act}</button>`:'')}</div>`:''}</div>`;
 const resumo=`<dl class="stack8" style="margin-top:4px"><div class="row sb"><dt>Produtos</dt><dd class="b">${brl(s)}</dd></div><div class="row sb"><dt>Entrega</dt><dd class="b">${brl(ENTREGA)}</dd></div>${ap?`<div class="row sb up-ok"><dt>${ap.lab}</dt><dd class="b">− ${brl(d)}</dd></div>`:''}<div class="bdiv"><i></i><i></i><i></i></div><div class="row sb"><dt class="h3">Total</dt><dd class="price" aria-live="polite">${brl(tot)}</dd></div></dl>`;
 const body=g||`<div class="stack"><ul>${items}</ul><button class="btn ghost sm" data-a="sadd" style="align-self:flex-start">${ic('plus',18)}Só no protótipo: adicionar item de R$ 79,90</button>${cupomUi}<div class="card" id="resumo"><h2 class="h3">Resumo do pedido</h2>${resumo}${ap?`<p class="mini" style="margin-top:6px">Produtos e entrega têm o mesmo valor com ou sem cupom.</p>`:''}</div><div class="chips"><span class="mini" style="width:100%">Códigos para testar: PRIMEIRA8, CASA10, FRETE0, VELHO, ACABOU, HOJE, OUTRA, EMAIL, USADO, PRIMCOMPRA, APARELHO, MARGEM, BLOQ. Qualquer outro código responde "Cupom inválido".</span></div></div>`;
 const foot=`<div class="foot" style="margin:0;position:sticky"><button class="btn lg block" data-a="fora">Ir para o pagamento · ${brl(tot)}</button></div>`;
 return shellC('Sua sacola',body,g?'':foot)};
Object.assign(A,{copen(){S.sc.open=true;S.focus='cod';render()},
 csem(){S.sc.msg=null;S.sc.code='';S.sc.open=false;render()},
 cap(){const v=$('#cod').value.trim().toUpperCase();S.sc.code=v;if(!v){S.sc.msg={ok:0,msg:'Digite o código do cupom',campo:1};render();return}S.sc.msg=null;S.sc.res=null;const r=evalC(v);if(r.ok){S.sc.applied=v;S.sc.msg=null;render();toast(r.lab+': '+brl(r.d)+' a menos. Total '+brl(r2(sub()+ENTREGA-r.d))+'.')}else{S.sc.msg=r;S.sc.applied=null;S.focus='cod';render()}},
 crem(){S.sc.applied=null;S.sc.res=null;S.sc.code='';S.sc.msg=null;S.sc.open=false;render();toast('Cupom removido')},
 sq(d){const [x,s]=d.split('|');const i=S.sc.items[+x];i.q=Math.max(0,i.q+ +s);if(!i.q)S.sc.items.splice(+x,1);if(S.sc.code&&!S.sc.applied){const r=evalC(S.sc.code);S.sc.msg=r.ok?null:r;if(r.ok)S.sc.applied=S.sc.code}render()},
 sadd(){const it=S.sc.items.find(x=>x.n==='Bermuda jeans masculina');if(it)it.q++;else S.sc.items.push({n:'Bermuda jeans masculina',pr:79.9,q:1,k:'calca',c:'#3B5B8C'});if(S.sc.code){const r=evalC(S.sc.code);if(r.ok){S.sc.applied=S.sc.code;S.sc.msg=null}else S.sc.msg=r}render()}});
IN.cod=t=>{t.value=t.value.toUpperCase()};
/* ===== EVENTOS GLOBAIS ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='FORM')return;if(t.getAttribute('aria-disabled')==='true'&&!['cpativar','cpub','bset','publicar','ccriar'].includes(t.dataset.a)){return}const f=A[t.dataset.a];if(f){if(t.tagName==='BUTTON'&&t.getAttribute('type')==='submit')return;f(t.dataset.d,t,e)}});
document.addEventListener('submit',e=>{e.preventDefault();const t=e.target.closest('[data-a]');if(t){const f=A[t.dataset.a];f&&f()}});
function onIn(e){const t=e.target;const k=t.dataset&&t.dataset.i;if(!k||!IN[k])return;if(t.type==='file'&&e.type==='input')return;if(t.type!=='file'&&e.type==='change'&&t.tagName!=='SELECT'&&t.type!=='checkbox'&&t.type!=='radio')return;IN[k](t,e)}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea'))document.body.classList.remove('kb')},150));
if(window.matchMedia('(min-width:700px)').matches)$('#proto').open=true;
if(!location.hash)location.hash='#/l/produtos';
S.navd=false;render();
</script>
