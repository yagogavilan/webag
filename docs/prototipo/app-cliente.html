--wb-color-text-primary:#1C1721;--wb-color-text-secondary:#5F566A;--wb-color-text-brand:#8618A3;--wb-color-text-link:#8618A3;--wb-color-text-on-hero:#FFFFFF;--wb-color-text-inverse-action:#EDC2F4;--wb-color-text-success:#1B6E3C;--wb-color-text-warning:#7A4E00;--wb-color-text-danger:#B3261E;--wb-color-text-info:#28569E;
--wb-color-border-subtle:#E8E3EB;--wb-color-border-default:#D6CFDB;--wb-color-border-strong:#837A8A;--wb-color-border-focus:#A21FBE;--wb-color-border-danger:#B3261E;
--wb-color-action-primary:#A21FBE;--wb-color-action-primary-hover:#8618A3;--wb-color-action-primary-pressed:#6A1580;--wb-color-action-primary-subtle:#FBF1FD;--wb-color-action-primary-subtle-pressed:#F6E0FA;--wb-color-action-destructive:#B3261E;--wb-color-action-destructive-pressed:#8C1D18;--wb-color-action-disabled-fill:#E8E3EB;--wb-color-action-disabled-text:#837A8A;
--wb-color-overlay-scrim:rgba(28,23,33,.72);--wb-color-overlay-backdrop:rgba(28,23,33,.48);--wb-color-skeleton-base:#E8E3EB;--wb-color-skeleton-highlight:#F3F0F5;
--wb-font-family-web:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--wb-font-family-display:"Outfit","Figtree",ui-rounded,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
--wb-radius-sm:4px;--wb-radius-md:8px;--wb-radius-lg:16px;--wb-radius-xl:24px;--wb-radius-2xl:32px;--wb-radius-full:999px;
--wb-shadow-sm:0 1px 2px rgba(28,23,33,.08);--wb-shadow-md:0 4px 12px rgba(28,23,33,.10);--wb-shadow-lg:0 8px 24px rgba(28,23,33,.14);
--wb-motion-duration-fast:150ms;--wb-motion-duration-base:250ms;--wb-motion-duration-slow:400ms;
--wb-motion-easing-standard:cubic-bezier(.2,0,0,1);--wb-motion-easing-enter:cubic-bezier(0,0,0,1);--wb-motion-easing-exit:cubic-bezier(.3,0,1,1);
}
@media (prefers-reduced-motion:reduce){:root{--wb-motion-duration-fast:0ms;--wb-motion-duration-base:0ms;--wb-motion-duration-slow:0ms}}
/* Apelidos locais */
:root{--bg:var(--wb-color-surface-background);--card:var(--wb-color-surface-card);--sun:var(--wb-color-surface-sunken);--tx:var(--wb-color-text-primary);--tx2:var(--wb-color-text-secondary);--br:var(--wb-color-brand-600);--brt:var(--wb-color-text-brand);--ln:var(--wb-color-border-subtle);--bd:var(--wb-color-border-strong);--ez:var(--wb-motion-easing-standard);--en:var(--wb-motion-easing-enter)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--wb-font-family-web);font-size:16px;line-height:24px;color:var(--tx);background:var(--wb-color-neutral-200);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--wb-color-border-focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
/* Moldura */
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:48px}
#guide{display:none;width:268px;max-height:calc(100vh - 32px);overflow:auto;padding:20px;background:var(--card);border:1px solid var(--ln);border-radius:16px}
#guide h2{font-size:20px;line-height:28px;font-weight:700;margin-bottom:4px}
#guide h3{font-size:14px;line-height:20px;font-weight:600;color:var(--tx2);margin:16px 0 4px}
#guide p{font-size:14px;line-height:20px;color:var(--tx2)}
#guide a,#guide button{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 8px;margin:0 -8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--brt);width:calc(100% + 16px)}
#guide a:hover,#guide button:hover{background:var(--wb-color-brand-50)}
#guide .n{width:20px;font-variant-numeric:tabular-nums;color:var(--tx2)}
#guide .on{color:var(--tx)}
#phone{position:relative;width:100vw;height:100dvh;background:var(--bg);overflow:hidden}
@media (min-width:600px){#phone{width:410px;height:min(864px,calc(100vh - 16px));border-radius:44px;border:10px solid var(--wb-color-neutral-900);box-shadow:0 20px 50px rgba(28,23,33,.28)}}
@media (min-width:980px){#guide{display:block}}
#app{position:absolute;inset:0;overflow:hidden}
#screen{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#screen.enter .scr{animation:enter var(--wb-motion-duration-base) var(--en)}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* Tipografia */
.t1{font-size:24px;line-height:32px;font-weight:700}
.t2{font-size:20px;line-height:28px;font-weight:600}
.disp{font-size:32px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums}
.numeral{font-size:40px;line-height:48px;font-weight:700;font-variant-numeric:tabular-nums}
.bs{font-weight:600}
.cap{font-size:14px;line-height:20px;color:var(--tx2)}
.capb{font-size:14px;line-height:20px;font-weight:600}
.tx2{color:var(--tx2)}
.pr{font-size:20px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.p16{padding-left:16px;padding-right:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.flex{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
/* Header */
.hd{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px;background:var(--bg);position:relative;z-index:4;transition:box-shadow var(--wb-motion-duration-fast)}
.hd.sh{box-shadow:var(--wb-shadow-sm)}
.hd h1{flex:1;min-width:0;font-size:20px;line-height:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.hd.ov{position:absolute;left:0;right:0;top:0;background:transparent}
.hd.ov h1{opacity:0}
.hd.ov.solid{background:var(--bg);box-shadow:var(--wb-shadow-sm)}
.hd.ov.solid h1{opacity:1}
.hd.ov:not(.solid) .ib{background:rgba(255,255,255,.94);box-shadow:var(--wb-shadow-sm)}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;transition:background var(--wb-motion-duration-fast)}
.ib:active{background:rgba(28,23,33,.12)}
.cnt{position:absolute;top:4px;right:2px;min-width:20px;height:20px;border-radius:10px;background:var(--tx);color:#fff;font-size:12px;line-height:20px;font-weight:700;text-align:center;padding:0 5px}
.hd.home{padding:0 4px 0 16px}
.addr{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.addr .l2{display:flex;align-items:center;gap:2px;font-weight:600;min-width:0}
.addr .l2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offb{flex:none;display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--wb-color-feedback-warning-subtle);border-bottom:1px solid var(--wb-color-feedback-warning-border);color:var(--wb-color-text-warning);font-size:14px;line-height:20px;font-weight:600}
/* Rodapé fixo e barra de abas */
.ft{flex:none;padding:12px 16px;background:var(--card);border-top:1px solid var(--ln);box-shadow:0 -1px 2px rgba(28,23,33,.06);display:flex;flex-direction:column;gap:8px}
.ft .flex{gap:12px}
.tabs{flex:none;height:64px;display:flex;background:var(--card);border-top:1px solid var(--ln)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:16px;font-weight:600;color:var(--tx2);position:relative}
.tab[aria-current=page]{color:var(--brt)}
.tab:active{background:var(--sun)}
.tab .cnt{top:6px;right:calc(50% - 22px)}
/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;background:var(--wb-color-action-primary);color:#fff;font-weight:600;text-align:center;transition:transform var(--wb-motion-duration-fast) var(--ez),background var(--wb-motion-duration-fast)}
.btn:active{transform:scale(.98);background:var(--wb-color-action-primary-pressed)}
.btn.lg{min-height:56px;width:100%}
.btn.blk{width:100%}
.btn.sec{background:transparent;color:var(--brt);box-shadow:inset 0 0 0 2px var(--br)}
.btn.sec:active{background:var(--wb-color-action-primary-subtle)}
.btn.txt{background:transparent;color:var(--brt);padding:0 12px}
.btn.txt:active{background:var(--wb-color-action-primary-subtle)}
.btn.dng{background:var(--wb-color-action-destructive)}
.btn.dng:active{background:var(--wb-color-action-destructive-pressed)}
.btn.off{background:var(--wb-color-action-disabled-fill);color:var(--wb-color-action-disabled-text)}
.btn.load{pointer-events:none}
/* Carregando de marca: 3 linhas de velocidade que pulsam (herda a cor do texto do botão) */
.spin{display:inline-block;position:relative;flex:none;width:22px;height:4px;margin:7px 0;border-radius:2px;background:currentColor;animation:spl 1.2s var(--ez) infinite}
.spin::before,.spin::after{content:"";position:absolute;left:0;height:4px;border-radius:2px;background:currentColor;animation:spl 1.2s var(--ez) infinite}
.spin::before{top:-7px;width:14px;animation-delay:120ms}
.spin::after{top:7px;width:18px;animation-delay:240ms}
@keyframes spl{0%,100%{transform:translateX(-3px);opacity:.45}50%{transform:translateX(5px);opacity:1}}
.lnk{color:var(--brt);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:48px;display:inline-flex;align-items:center}
/* Selos */
.bg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.bg-ok{background:var(--wb-color-feedback-success-subtle);color:var(--wb-color-text-success)}
.bg-warn{background:var(--wb-color-feedback-warning-subtle);color:var(--wb-color-text-warning)}
.bg-err{background:var(--wb-color-feedback-danger-subtle);color:var(--wb-color-text-danger)}
.bg-info{background:var(--wb-color-feedback-info-subtle);color:var(--wb-color-text-info)}
.bg-brand{background:var(--wb-color-brand-50);color:var(--brt)}
.bg-mute{background:var(--sun);color:var(--tx2)}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
/* Chips */
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--sun);font-weight:600;white-space:nowrap;flex:none;transition:background var(--wb-motion-duration-fast)}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:active{background:var(--wb-color-neutral-200)}
.chip.on,.chip[aria-pressed=true]{background:var(--wb-color-brand-50);box-shadow:inset 0 0 0 2px var(--br);color:var(--brt)}
/* Busca */
.search{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 16px;padding:0 16px;border-radius:999px;background:var(--sun);color:var(--tx2)}
.sinput{flex:1;min-width:0;height:48px;border:0;background:transparent;outline:none;font-size:16px}
.sinput::placeholder{color:var(--tx2);opacity:1}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--br)}
/* Banners */
.bnr{scroll-snap-type:x mandatory;scroll-padding:0 16px;gap:12px}
.bn{position:relative;flex:none;width:calc(100% - 32px);aspect-ratio:2/1;border-radius:8px;overflow:hidden;scroll-snap-align:start;display:block}
.bn svg.bg2{position:absolute;inset:0;width:100%;height:100%}
.bn .bt{position:absolute;left:16px;top:16px;bottom:16px;width:52%;display:flex;flex-direction:column;justify-content:space-between}
.bn .bt b{font-size:20px;line-height:24px;font-weight:700}
.bn .bt span{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--brt)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--wb-color-neutral-300)}
.dots i.on{background:var(--br);width:20px;border-radius:4px}
/* Categorias */
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;font-size:14px;line-height:20px;font-weight:600}
.cc{width:64px;height:64px;border-radius:50%;background:var(--sun);display:grid;place-items:center;color:var(--tx);transition:transform var(--wb-motion-duration-fast)}
.cat:active .cc{transform:scale(.94)}
/* Seção */
.sh2{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin:32px 0 8px}
.sh2 h2{font-size:20px;line-height:28px;font-weight:600}
/* Linha de loja */
.srow{display:flex;gap:12px;padding:12px 16px;position:relative;transition:background var(--wb-motion-duration-fast)}
.srow:active{background:var(--sun)}
.srow+.srow::before{content:"";position:absolute;left:84px;right:16px;top:0;border-top:1px solid var(--ln)}
.logo{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;border:1px solid rgba(28,23,33,.08);letter-spacing:.02em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:14px;line-height:20px;color:var(--tx2)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.rt{display:inline-flex;align-items:center;gap:3px;color:var(--tx)}
.rt .ic{color:var(--wb-color-rating-star)}
/* Produto: cartões */
.art{display:block;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sun)}
.art svg{display:block;width:100%;height:100%}
.art .bg{position:absolute;left:8px;top:8px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .pc{width:144px;flex:none}
.pc{display:block;position:relative}
.aw{position:relative}
.pc:active .art{opacity:.88}
.pc-n{margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-p{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pc-p s{font-size:14px;color:var(--tx2)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;padding:0 16px}
.addb{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brt);box-shadow:var(--wb-shadow-md);display:grid;place-items:center}
.addb::after{content:"";position:absolute;inset:-4px}
.addb:active{background:var(--wb-color-brand-50)}
/* Mais vendidos */
.rank{display:flex;align-items:center;gap:12px;padding:8px 16px}
.rank .nm{width:28px;font-size:32px;line-height:40px;font-weight:700;color:var(--wb-color-neutral-500);font-variant-numeric:tabular-nums;text-align:center}
.rank .art{width:72px;flex:none}
/* Cartão de capa */
.cv{display:block;margin:0 16px 16px}
.cv .cvi{aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.cv .cvi svg{display:block;width:100%;height:100%}
.cv:active .cvi{opacity:.9}
/* Cartão, listas */
.cardb{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:16px;margin:0 16px}
.li{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;width:100%;position:relative;background:transparent;transition:background var(--wb-motion-duration-fast)}
.li:active{background:var(--sun)}
.li+.li::before{content:"";position:absolute;left:56px;right:0;top:0;border-top:1px solid var(--ln)}
.li .grow .cap{display:block}
.li.dg{color:var(--wb-color-text-danger)}
.li .ic.cr{color:var(--tx2)}
.hr{height:1px;background:var(--ln);margin:12px 0}
/* Estados */
.es{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 32px}
.es .esc{width:120px;height:120px;border-radius:50%;background:var(--sun);display:grid;place-items:center;color:var(--tx2);margin-bottom:8px}
.es p{color:var(--tx2);max-width:300px}
.es .btn{margin-top:12px}
.bnr2{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;border:1px solid;font-size:14px;line-height:20px;margin:0 16px}
.bnr2 b{font-weight:600}
.bnr2.info{background:var(--wb-color-feedback-info-subtle);border-color:var(--wb-color-feedback-info-border);color:var(--wb-color-text-info)}
.bnr2.warn{background:var(--wb-color-feedback-warning-subtle);border-color:var(--wb-color-feedback-warning-border);color:var(--wb-color-text-warning)}
.bnr2.err{background:var(--wb-color-feedback-danger-subtle);border-color:var(--wb-color-feedback-danger-border);color:var(--wb-color-text-danger)}
.bnr2.ok{background:var(--wb-color-feedback-success-subtle);border-color:var(--wb-color-feedback-success-border);color:var(--wb-color-text-success)}
.bnr2.brand{background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-200);color:var(--brt)}
.sk{background:linear-gradient(90deg,var(--wb-color-skeleton-base) 25%,var(--wb-color-skeleton-highlight) 50%,var(--wb-color-skeleton-base) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
/* Folha, diálogo, toast */
#ov{position:absolute;inset:0;z-index:20;pointer-events:none}
#ov>*{pointer-events:auto}
.bd{position:absolute;inset:0;background:var(--wb-color-overlay-backdrop);animation:fade var(--wb-motion-duration-base)}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--wb-shadow-lg);animation:up var(--wb-motion-duration-slow) var(--en)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--wb-color-neutral-300);margin:8px auto 0;flex:none}
.sheet .sh-h{display:flex;align-items:center;padding:4px 4px 0 16px;flex:none}
.sheet .sh-h h2{flex:1;font-size:20px;line-height:28px;font-weight:600;outline:none}
.sheet .sb{overflow:auto;padding:8px 16px 16px}
.sheet .sf{padding:12px 16px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:8px;flex:none}
.dlg{position:absolute;left:50%;top:50%;width:min(320px,calc(100% - 48px));transform:translate(-50%,-50%);background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--wb-shadow-lg);display:flex;flex-direction:column;gap:12px;animation:pop var(--wb-motion-duration-base) var(--en)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
[tabindex="-1"]:focus{outline:none}
#tt{position:absolute;left:16px;right:16px;bottom:96px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--wb-color-surface-inverse);color:#fff;border-radius:8px;padding:4px 4px 4px 16px;min-height:48px;display:flex;align-items:center;gap:8px;box-shadow:var(--wb-shadow-md);animation:up var(--wb-motion-duration-base) var(--en)}
.toast span{flex:1;padding:8px 0}
.toast button{color:var(--wb-color-text-inverse-action);font-weight:600;min-height:48px;padding:0 12px}
/* Formulários */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label,.lbl{font-size:14px;line-height:20px;font-weight:600}
.inp{height:48px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);width:100%;outline:none}
.inp:focus{border:2px solid var(--wb-color-border-focus);padding:0 11px}
.inp.bad{border:2px solid var(--wb-color-border-danger);padding:0 11px}
.inp[disabled]{background:var(--sun);color:var(--wb-color-action-disabled-text)}
.msg{font-size:14px;line-height:20px;display:flex;gap:6px;align-items:flex-start}
.msg.err{color:var(--wb-color-text-danger)}
.msg.ok{color:var(--wb-color-text-success)}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--br);flex:none}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;background:var(--card);border:1px solid var(--wb-color-border-default);border-radius:8px;width:100%;transition:background var(--wb-motion-duration-fast)}
.opt+.opt{margin-top:8px}
.opt .rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;color:#fff}
.opt[aria-checked=true]{border:2px solid var(--br);padding:11px 15px;background:var(--wb-color-brand-50)}
.opt[aria-checked=true] .rd{background:var(--br);border-color:var(--br)}
.opt[aria-disabled=true]{background:var(--sun);border-style:dashed}
.seg{display:flex;background:var(--sun);border-radius:8px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border-radius:6px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx2)}
.seg button[aria-selected=true]{background:var(--card);box-shadow:inset 0 0 0 2px var(--br);color:var(--brt)}
/* Stepper */
.qty{display:inline-flex;align-items:center;background:var(--sun);border-radius:8px;flex:none}
.qty button{width:48px;height:48px;display:grid;place-items:center;border-radius:8px}
.qty button:active{background:var(--wb-color-neutral-200)}
.qty button[disabled]{opacity:.38}
.qty output{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
/* Preço */
.sumr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.sumr.t{border-top:1px solid var(--ln);margin-top:8px;padding-top:12px;font-size:24px;line-height:32px;font-weight:700}
.good{color:var(--wb-color-text-success)}
.bar{height:8px;border-radius:4px;background:var(--wb-color-neutral-200);overflow:hidden}
.bar i{display:block;height:100%;background:var(--br);border-radius:4px;transition:width var(--wb-motion-duration-slow) var(--ez)}
/* Linha do tempo */
.tl{list-style:none;padding:0}
.tl li{position:relative;padding:0 0 28px 44px;min-height:52px}
.tl li::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--ln)}
.tl li::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--br);transform:scaleY(0);transform-origin:top;transition:transform 600ms var(--ez)}
.tl li.done::after{transform:scaleY(1)}
.tl li:last-child::before,.tl li:last-child::after{display:none}
.tl .nd{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);background:var(--card);display:grid;place-items:center;color:#fff;transition:background 300ms,border-color 300ms}
.tl li.done .nd{background:var(--br);border-color:var(--br)}
.tl li.cur .nd{border-color:var(--br);background:var(--card)}
.tl li.cur .nd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--br);animation:pulse 1.6s ease-in-out infinite}
.tl li.pop .nd{animation:popn 500ms var(--en)}
.tl li.bad .nd{background:var(--wb-color-action-destructive);border-color:var(--wb-color-action-destructive)}
.tl .tt{font-weight:600}
.tl li.fut .tt{color:var(--tx2);font-weight:400}
.tl .hh{font-size:14px;line-height:20px;color:var(--tx2)}
@keyframes pulse{50%{transform:scale(.5);opacity:.5}}
@keyframes popn{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tl li.cur .nd::after{animation:none}}
.nxt{margin:0 16px;padding:16px;border-radius:8px;background:var(--wb-color-brand-50);border:1px solid var(--wb-color-brand-200)}
.nxt .t2{color:var(--tx)}

.gal{position:relative}
.gal .gs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .gs::-webkit-scrollbar{display:none}
.gal .gs>div{flex:none;width:100%;aspect-ratio:1;scroll-snap-align:center}
.gal .gs svg{display:block;width:100%;height:100%}
.gal .ctr{position:absolute;right:12px;bottom:12px;background:rgba(28,23,33,.72);color:#fff;font-size:14px;line-height:20px;font-weight:600;padding:2px 10px;border-radius:999px}
.gal .dots{position:absolute;left:0;right:0;bottom:14px;margin:0}
.sz{position:relative;min-width:56px;height:48px;padding:0 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}

.sz.out{color:var(--wb-color-neutral-500);background:var(--sun);border-style:dashed;text-decoration:line-through}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;font-size:14px;line-height:20px;flex:none}
.sw i{width:48px;height:48px;border-radius:50%;border:1px solid rgba(28,23,33,.2);display:grid;place-items:center;position:relative;color:#fff}
.sw[aria-checked=true] i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--br)}
.sw[aria-checked=true]{font-weight:600;color:var(--brt)}
.sw.out i::after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:2px solid var(--bd);transform:rotate(-45deg)}
.sw.out{color:var(--tx2)}
.vg{padding:0 16px;margin-top:20px;scroll-margin-top:72px}
.vg .row{padding:0;margin-top:8px;flex-wrap:wrap;overflow:visible}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--ln)}
.tbl th{font-size:14px;color:var(--tx2);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.bars{display:grid;grid-template-columns:20px 1fr 28px;gap:6px 8px;align-items:center;font-size:14px}
.rv{padding:16px 0;border-top:1px solid var(--ln)}
.stars{display:inline-flex;color:var(--wb-color-rating-star)}
/* Sacola */
.item{display:flex;gap:12px;padding:12px 16px;align-items:flex-start}
.item .art{width:72px;flex:none}
.item+.item{border-top:1px solid var(--ln)}
/* PIX */
.qrw{background:#fff;padding:16px;border-radius:8px;border:1px solid var(--ln);width:272px;height:272px;margin:0 auto}
.qrw svg{display:block;width:100%;height:100%}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:20px;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--sun);border-radius:8px;padding:12px}
.cd.low{color:var(--wb-color-text-warning)}
.cd.dead{color:var(--tx2)}
.ck{width:96px;height:96px;margin:0 auto}
.ck circle{stroke-dasharray:252;stroke-dashoffset:252;animation:dr 600ms var(--ez) forwards}
.ck path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr 400ms 450ms var(--ez) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ck circle,.ck path{animation:none;stroke-dashoffset:0}}
.proto{margin:16px;padding:12px;border:1.5px dashed var(--bd);border-radius:8px;font-size:14px;line-height:20px;color:var(--tx2)}
.proto b{color:var(--tx)}
.proto .btn{margin-top:8px}
.ph{width:96px;height:96px;border-radius:8px;overflow:hidden;position:relative;flex:none}
.ph svg{display:block;width:100%;height:100%}
.ph button{position:absolute;right:0;top:0;width:48px;height:48px;display:grid;place-items:center;color:#fff}
.ph button i{width:28px;height:28px;border-radius:50%;background:rgba(28,23,33,.72);display:grid;place-items:center}
.unr{width:10px;height:10px;border-radius:50%;background:var(--br);flex:none}
.kpi{display:flex;gap:12px;align-items:center}

<style>
/* ===== Webag v2 (DEC-040/041): identidade, forma, ritmo e movimento. Sobrepõe as regras acima.
   Cor: magenta 500 só em área ampla; ação/foco 600; texto de marca 700; sol só em selo de oferta. ===== */
:root{--hero:var(--wb-color-brand-500);--pop:cubic-bezier(.34,1.56,.64,1)}
/* Tipografia: Outfit onde há emoção, Figtree onde há leitura e dinheiro */
.t1,.t2,.hd h1,.sh2 h2,.sheet .sh-h h2,.fk,.es h2{font-family:var(--wb-font-family-display)}
.t1{font-weight:600}
.t1.num{font-family:var(--wb-font-family-web);font-weight:700}
.fk{font-weight:700;font-variant-numeric:normal}
.disp{font-family:var(--wb-font-family-web)}
.sh2{margin:32px 0 12px}
.sh2 h2{font-size:22px;line-height:28px}
.sh2.big h2{font-size:24px;line-height:32px}
/* Entrada de tela: fade da tela e subida escalonada dos 6 primeiros blocos */
@keyframes enter{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#screen.enter .scr{animation:enter 150ms linear}
#screen.enter .scroll>*:nth-child(-n+6){animation:rise 300ms var(--en) both}
#screen.enter .scroll>:nth-child(2){animation-delay:40ms}
#screen.enter .scroll>:nth-child(3){animation-delay:80ms}
#screen.enter .scroll>:nth-child(4){animation-delay:120ms}
#screen.enter .scroll>:nth-child(5){animation-delay:160ms}
#screen.enter .scroll>:nth-child(6){animation-delay:200ms}
/* Botões, chips, campos: pílula e cantos generosos */
.btn{border-radius:999px;font-weight:700;transition:transform var(--wb-motion-duration-fast) var(--pop),background var(--wb-motion-duration-fast)}
.btn:active{transform:scale(.97)}
.chip.on,.chip[aria-pressed=true]{background:var(--br);box-shadow:none;color:#fff}
.chip.on:active,.chip[aria-pressed=true]:active{background:var(--wb-color-action-primary-pressed)}
.inp{border-radius:12px}
.opt{border-radius:16px}
.seg{border-radius:999px}
.seg button{border-radius:999px}
.seg button[aria-selected=true]{background:var(--br);box-shadow:none;color:#fff}
.qty{border-radius:999px}
.qty button{border-radius:999px}
.sz{border-radius:999px}
.sz[aria-checked=true]{background:var(--br);border-color:var(--br);color:#fff}
.cardb{border-radius:16px}
.sumb{background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-100);border-radius:24px;padding:20px}
.bnr2{border-radius:16px}
.dlg{border-radius:24px}
.toast{border-radius:16px}
.bar{height:12px;border-radius:6px}
.bar i{border-radius:6px;background:var(--hero)}
.art{border-radius:16px}
.art .bg{border-radius:8px}
.pgrid .art,.hs.of .art{aspect-ratio:4/5}
.addb{width:44px;height:44px;background:var(--br);color:#fff;transition:transform var(--wb-motion-duration-fast) var(--pop),background var(--wb-motion-duration-fast)}
.addb:active{background:var(--wb-color-action-primary-pressed);transform:scale(.92)}
.pc:active .art{opacity:1}
/* Selos */
.bg{border-radius:8px}
.bg-brand{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.bg-sol{background:var(--wb-color-accent-base);color:var(--wb-color-accent-on-base)}
.pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:#fff;color:var(--tx);font-size:13px;line-height:16px;font-weight:700;white-space:nowrap}
.pill.n{background:var(--sun);height:32px;padding:0 12px;font-size:14px;line-height:20px}
.pill .ic{color:var(--wb-color-brand-700)}
.pls2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cnt{background:var(--wb-color-brand-800)}
/* Cabeçalho da Início: faixa de marca com logo, endereço e sacola */
.hd.home{height:64px;background:var(--hero);padding:0 8px 0 16px;gap:10px}
.hd.home .sym{flex:none;display:block}
.hd.home .addr{flex:1;min-width:0;min-height:44px;background:#fff;border-radius:999px;padding:3px 16px;justify-content:center}
.hd.home .addr .cap{font-size:12px;line-height:14px}
.hd.home .addr .l2{font-size:14px;line-height:18px;color:var(--brt);font-weight:700}
.hd.home .ib{background:#fff;color:var(--brt)}
.hd.home .ib:active{background:var(--wb-color-brand-100)}
.hd.home .cnt{top:-2px;right:-2px}
.hd.home :focus-visible{outline-color:#fff}
.hd.home.sh{box-shadow:var(--wb-shadow-md)}
.hband{position:relative;overflow:hidden;background:var(--hero);border-radius:0 0 32px 32px;padding:4px 16px 24px}
.hband .hl{position:relative;z-index:1;max-width:58%;font-family:var(--wb-font-family-display);font-weight:700;font-size:26px;line-height:30px;color:#fff;outline:none}
.hband .hart{position:absolute;right:-6px;top:0;width:190px;height:130px}
.hband .search{position:relative;z-index:1;margin:18px 0 0;background:#fff;box-shadow:0 4px 12px rgba(74,19,86,.18)}
/* Banners em cor cheia, categorias em tiles coloridos */
.bn{border-radius:24px;aspect-ratio:2.1/1}
.bn .bt{left:16px;top:16px;bottom:16px;width:50%}
.bn .bt b{font-family:var(--wb-font-family-display);font-size:22px;line-height:26px;font-weight:600;color:var(--tx)}
.bn .bt span{align-self:flex-start;height:36px;padding:0 14px;border-radius:999px;background:var(--br);color:#fff;font-size:14px;font-weight:700}
.bn .bt span.sol{background:var(--wb-color-accent-base);color:var(--wb-color-accent-on-base);height:28px;padding:0 10px;font-size:13px}
.tiles{gap:12px;margin-top:20px}
.cat{min-width:80px;gap:8px;color:var(--tx)}
.cc{width:80px;height:80px;border-radius:16px;background:var(--t);color:var(--ti);transition:transform var(--wb-motion-duration-fast) var(--pop)}
.cat:active .cc{transform:scale(.93)}
/* Cartão de loja com capa (carrossel), faixa de ofertas, ranking, lojas novas */
.hs{gap:12px}
.sc{display:block;width:288px;flex:none;position:relative}
.sc .cvi{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--sun)}
.sc .cvi>svg{display:block;width:100%;height:100%}
.sc .pls{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
.sc:active .cvi{opacity:.92}
.band{background:var(--wb-color-brand-50);border-radius:24px 24px 0 0;margin-top:32px;padding:4px 0 28px}
.band .sh2{margin-top:24px}
.hs.of .pc{width:160px}
.rank{gap:14px;padding:10px 16px}
.rank .nm{width:52px;font-family:var(--wb-font-family-display);font-size:48px;line-height:48px;font-weight:700;color:var(--hero);font-variant-numeric:normal}
.rank .art{width:80px}
.nwc{display:flex;flex-direction:column;gap:12px;width:248px;flex:none;border-radius:24px;padding:16px;background:var(--t);color:var(--tx)}
.nwc .t2{display:block}
.nwc:active{transform:scale(.98)}
.logo.sq{border-radius:22px}
/* Barra de abas: indicador em pílula */
.tabs{background:#fff}
.ti{display:grid;place-items:center;width:60px;height:30px;border-radius:15px;transition:background var(--wb-motion-duration-fast)}
.tab[aria-current=page]{color:var(--wb-color-brand-800)}
.tab[aria-current=page] .ti{background:var(--wb-color-brand-100);animation:tpop 250ms var(--pop)}
@keyframes tpop{from{transform:scale(.86)}to{transform:none}}
.tab .cnt{top:4px;right:calc(50% - 30px)}
/* Loja e produto */
.lcv{aspect-ratio:16/10;background:var(--sun)}
.lcv svg{display:block;width:100%;height:100%}
.stabs{padding:4px 12px;gap:4px;border-bottom:0;box-shadow:0 1px 0 var(--ln)}
.stab{min-height:44px;border-radius:999px;margin:4px 0}
.stab[aria-selected=true]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.stab[aria-selected=true]::after{display:none}
.gal .gs>div{aspect-ratio:4/5}
.gal .ctr{bottom:36px}
.psh{position:relative;margin-top:-24px;background:var(--bg);border-radius:24px 24px 0 0;padding-top:8px}
.trc{display:flex;align-items:center;gap:12px;min-height:48px;margin:12px 16px 0;padding:0;color:var(--tx2);font-size:14px;line-height:20px;text-align:left;width:calc(100% - 32px)}
.trc .lk{color:var(--brt);font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* Sacola, PIX e pós-venda */
.item .art{width:80px}
.pxt{margin:0 16px;padding:20px 16px;border-radius:24px;background:var(--wb-color-brand-50);text-align:center}
.qrw{border-radius:24px}
.code{border-radius:12px}
.nxt{border-radius:24px;background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-100)}
/* Estados: vazio, erro e carregando com a marca */
.ill{position:relative;width:176px;height:114px;margin-bottom:12px}
.ill .sym{display:block;width:100%;height:100%}
.ill .ico{position:absolute;left:68%;top:67%;transform:translate(-50%,-50%);color:var(--wb-color-brand-800)}
.es{padding:40px 32px}
.ldr{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ldr i{display:block;height:8px;border-radius:4px;background:var(--c,var(--hero));animation:ldr 1.2s var(--ez) infinite}
.ldr i:nth-child(1){width:24px}
.ldr i:nth-child(2){width:40px;animation-delay:120ms}
.ldr i:nth-child(3){width:16px;animation-delay:240ms}
@keyframes ldr{0%,100%{transform:translateX(-8px);opacity:.4}50%{transform:translateX(16px);opacity:1}}
/* Entrada */
.ehero{position:relative;overflow:hidden;background:var(--hero);border-radius:0 0 32px 32px;padding:28px 20px 24px}
.ehero .elg{position:relative;z-index:1}
.ehero .etag{position:relative;z-index:1;margin-top:14px;max-width:300px;font-family:var(--wb-font-family-display);font-weight:700;font-size:24px;line-height:28px;color:#fff}
.ehero .eln{position:absolute;right:0;top:22px}
.ctiles{position:relative;z-index:1;display:flex;gap:12px;margin-top:22px;padding:0 4px}
.ctile{flex:1;aspect-ratio:1;max-width:104px;border-radius:24px;overflow:hidden;box-shadow:0 6px 16px rgba(74,19,86,.28)}
.ctile svg{display:block;width:100%;height:100%}
/* Splash e abertura: símbolo branco sobre magenta, as linhas entram da esquerda */
#splash{position:absolute;inset:0;z-index:50;background:var(--hero);display:grid;place-items:center;pointer-events:none;animation:splOut 300ms 700ms ease forwards}
#splash .sp{animation:splIn 600ms var(--pop) both}
@keyframes splIn{from{opacity:0;transform:translateX(-56px) scale(.96)}to{opacity:1;transform:none}}
@keyframes splOut{to{opacity:0;visibility:hidden}}
/* Microinteração ao adicionar: a sacola pula e uma linha de velocidade passa */
.bump{animation:bump 450ms var(--pop)}
@keyframes bump{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.25) rotate(-12deg)}60%{transform:scale(.94) rotate(7deg)}100%{transform:scale(1) rotate(0)}}
.bump .cnt{animation:cntp 400ms var(--pop)}
@keyframes cntp{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.swish{position:absolute;left:0;right:0;height:28px;overflow:hidden;pointer-events:none;z-index:25}
.swish i{position:absolute;height:6px;border-radius:3px;background:var(--hero);left:-160px;animation:swish 520ms var(--ez) forwards}
.swish i:nth-child(1){top:2px;width:120px}
.swish i:nth-child(2){top:11px;width:64px;animation-delay:50ms}
.swish i:nth-child(3){top:20px;width:92px;animation-delay:100ms}
@keyframes swish{from{transform:translateX(0);opacity:.9}to{transform:translateX(620px);opacity:0}}
/* Pedido confirmado: a tela inunda de magenta, 3 linhas varrem, o check se desenha, a manchete sobe */
.scr.okscr{background:var(--hero)}
.okscr .scroll{display:flex;flex-direction:column;padding-bottom:0;background:var(--hero)}
.okhero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:44px 24px 36px}
.okhero>*:not(.oklines){position:relative;z-index:1}
.oklines i{position:absolute;left:-180px;height:8px;border-radius:4px;background:rgba(255,255,255,.24);animation:sweep 700ms var(--ez) both}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(640px)}}
.okck{display:block;width:112px;height:112px;margin:0 auto}
.okck circle{stroke-dasharray:252;stroke-dashoffset:252;animation:dr 400ms 300ms var(--ez) forwards}
.okck path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr 300ms 600ms var(--ez) forwards}
.okh{margin-top:16px;font-family:var(--wb-font-family-display);font-weight:700;font-size:36px;line-height:40px;outline:none;opacity:0;animation:rise 500ms 700ms var(--en) forwards}
.oks{margin-top:4px;font-family:var(--wb-font-family-display);font-weight:700;font-size:20px;line-height:28px;opacity:0;animation:rise 500ms 800ms var(--en) forwards}
.okn{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:20px;font-family:var(--wb-font-family-display);font-weight:700;opacity:0;animation:rise 500ms 900ms var(--en) forwards}
.okn span{font-size:20px;line-height:28px}
.okn b{font-size:40px;line-height:44px}
.oksheet{flex:1;background:var(--bg);border-radius:32px 32px 0 0;padding:24px 0}
/* Acompanhamento: cartão de status de sangria, na cor da marca */
.stc{position:relative;overflow:hidden;margin:8px 16px 0;padding:20px 20px 16px;border-radius:32px;background:var(--hero);color:#fff}
.stc-top{position:relative;display:flex;align-items:center;gap:14px}
.stc .rl{position:absolute;left:-20px;top:50%;width:84px;margin-top:-30px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.stc .rl i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.24)}
.stc .rl i:nth-child(1){width:84px}.stc .rl i:nth-child(2){width:46px}.stc .rl i:nth-child(3){width:67px}.stc .rl i:nth-child(4){width:29px}
.stc.moving .rl i{animation:run 1.6s linear infinite}
.stc.moving .rl i:nth-child(2){animation-delay:200ms}.stc.moving .rl i:nth-child(3){animation-delay:400ms}.stc.moving .rl i:nth-child(4){animation-delay:600ms}
@keyframes run{0%{transform:translateX(-28px);opacity:0}35%{opacity:1}100%{transform:translateX(18px);opacity:0}}
.stc-ico{position:relative;flex:none;width:72px;height:72px;margin-left:32px;border-radius:24px;background:#fff;color:var(--wb-color-brand-700);display:grid;place-items:center}
.stc-k{font-family:var(--wb-font-family-display);font-weight:700;font-size:20px;line-height:24px}
.stc-h{font-family:var(--wb-font-family-display);font-weight:700;font-size:26px;line-height:30px}
.stc-eta{position:relative;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:16px;font-family:var(--wb-font-family-display);font-weight:700}
.stc-eta span{font-size:20px;line-height:28px}
.stc-eta b{font-size:32px;line-height:40px}
.stc-in{position:relative;margin-top:16px;padding:14px 16px;border-radius:20px;background:#fff;color:var(--tx)}
.stc-in p{margin:0}
.pill .rt .ic{color:var(--wb-color-rating-star)}
.pill .rt{gap:3px}
.hband .search:active{background:var(--wb-color-neutral-100)}
.lnk{font-family:var(--wb-font-family-web)}
/* Movimento reduzido: tudo chega ao estado final sem animar */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
