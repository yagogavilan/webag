<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webag · Painéis (protótipo)</title>
<style>
/* Tokens inlinados de packages/tokens/css/tokens.css (fonte única: tokens.json) */
:root{color-scheme:light;
--wb-color-brand-50:#E6F3F3;--wb-color-brand-100:#CBE6E6;--wb-color-brand-200:#9FD0D1;--wb-color-brand-400:#3A9DA2;--wb-color-brand-600:#00696F;--wb-color-brand-700:#005A5F;--wb-color-brand-800:#004A4F;
--wb-color-neutral-0:#FFFFFF;--wb-color-neutral-50:#F7F5F2;--wb-color-neutral-100:#EFEBE6;--wb-color-neutral-200:#E2DDD6;--wb-color-neutral-300:#CFC9C0;--wb-color-neutral-400:#A8A199;--wb-color-neutral-500:#7D766E;--wb-color-neutral-600:#5E5851;--wb-color-neutral-700:#433E39;--wb-color-neutral-900:#1A1816;
--wb-color-success:#1B6E3C;--wb-color-success-subtle:#E5F4EA;--wb-color-success-border:#9ED1AE;
--wb-color-warning:#7A4E00;--wb-color-warning-subtle:#FFF3D6;--wb-color-warning-border:#E9B949;
--wb-color-danger:#B3261E;--wb-color-danger-subtle:#FCEAE8;--wb-color-danger-border:#E8A29D;--wb-color-danger-pressed:#8C1D18;
--wb-color-info:#28569E;--wb-color-info-subtle:#E8F0FB;--wb-color-info-border:#9DB8E3;
--wb-color-star:#B76E00;--wb-color-inverse-action:#9FD0D1;
--wb-color-scrim:rgba(26,24,22,.48);
--wb-font-family-web:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--wb-radius-sm:4px;--wb-radius-md:8px;--wb-radius-lg:16px;--wb-radius-xl:24px;--wb-radius-full:999px;
--wb-shadow-sm:0 1px 2px rgba(26,24,22,.08);--wb-shadow-md:0 4px 12px rgba(26,24,22,.10);--wb-shadow-lg:0 8px 24px rgba(26,24,22,.14);
--wb-motion-fast:150ms;--wb-motion-base:250ms;--wb-ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-reduced-motion:reduce){:root{--wb-motion-fast:0ms;--wb-motion-base:0ms}.pulse{animation:none!important}.spin{animation:none!important}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--wb-font-family-web);font-size:16px;line-height:24px;color:var(--wb-color-neutral-900);background:var(--wb-color-neutral-50);font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wb-color-brand-600);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 16px;border-radius:8px;z-index:100;border:2px solid var(--wb-color-brand-600)}.skip:focus{top:8px}
.ic{flex:none;vertical-align:middle}
a{color:var(--wb-color-brand-700)}
/* tipografia */
.t-num{font-size:40px;line-height:48px;font-weight:700}
.t-disp{font-size:32px;line-height:40px;font-weight:700}
.t1{font-size:24px;line-height:32px;font-weight:700}
.t2{font-size:20px;line-height:28px;font-weight:600}
.cap{font-size:14px;line-height:20px}.capb{font-size:14px;line-height:20px;font-weight:600}
.mut{color:var(--wb-color-neutral-600)}.b{font-weight:600}.bb{font-weight:700}
.ok-t{color:var(--wb-color-success)}.bad-t{color:var(--wb-color-danger)}.warn-t{color:var(--wb-color-warning)}.brand-t{color:var(--wb-color-brand-700)}
.strike{text-decoration:line-through;color:var(--wb-color-neutral-600)}
.right{text-align:right}.nowrap{white-space:nowrap}
/* estrutura */
.proto{background:var(--wb-color-neutral-900);color:#fff;font-size:14px;line-height:20px;padding:6px 16px;display:flex;gap:12px;align-items:center;justify-content:center;text-align:center}
.proto button{background:none;border:0;color:var(--wb-color-inverse-action);text-decoration:underline;min-height:32px;padding:0 4px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--wb-color-neutral-200);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--wb-color-brand-600);text-decoration:none}
.seg{display:inline-flex;background:var(--wb-color-neutral-100);border-radius:8px;padding:4px;gap:4px}
.seg button{border:1px solid transparent;background:none;border-radius:6px;min-height:40px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);display:inline-flex;align-items:center;gap:8px;transition:background var(--wb-motion-fast) var(--wb-ease)}
.seg button[aria-pressed=true]{background:#fff;border-color:var(--wb-color-neutral-300);color:var(--wb-color-brand-700)}
.spacer{flex:1}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--wb-color-neutral-100);display:grid;place-items:center;font-weight:700;color:var(--wb-color-neutral-700);font-size:14px;border:1px solid var(--wb-color-neutral-200)}
.who{line-height:18px;text-align:right}.who small{display:block;color:var(--wb-color-neutral-600);font-size:12px}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 100px)}
.side{position:sticky;top:56px;width:248px;flex:none;height:calc(100vh - 56px);overflow:auto;padding:16px 12px;background:#fff;border-right:1px solid var(--wb-color-neutral-200)}
.side h2{font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-600);padding:16px 12px 4px;letter-spacing:.02em}
.side h2:first-child{padding-top:0}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--wb-color-neutral-700);font-weight:500;border:0;background:none;text-align:left;transition:background var(--wb-motion-fast) var(--wb-ease)}
.nav a:hover,.nav button:hover{background:var(--wb-color-neutral-100)}
.nav a[aria-current=page]{background:var(--wb-color-brand-50);color:var(--wb-color-brand-700);font-weight:600;box-shadow:inset 3px 0 0 var(--wb-color-brand-600)}
.nav .n{margin-left:auto;background:var(--wb-color-brand-600);color:#fff;border-radius:999px;font-size:12px;line-height:16px;font-weight:700;min-width:22px;text-align:center;padding:2px 6px}
.nav .n.w{background:var(--wb-color-warning)}
.side .demo{margin:16px 4px 0;padding:12px;border:1px dashed var(--wb-color-neutral-400);border-radius:8px;font-size:14px;line-height:20px;color:var(--wb-color-neutral-600)}
main{flex:1;min-width:0;padding:24px 32px 64px;max-width:1240px;margin:0 auto;outline:none}
.bnav{display:none}
@media (max-width:900px){
 .side{display:none}
 main{padding:16px 16px 96px}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--wb-color-neutral-200);z-index:20;box-shadow:var(--wb-shadow-sm)}
 .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-700);text-decoration:none;border:0;background:none;position:relative;min-height:48px}
 .bnav [aria-current=page]{color:var(--wb-color-brand-700);box-shadow:inset 0 3px 0 var(--wb-color-brand-600)}
 .bnav .n{position:absolute;top:4px;left:calc(50% + 6px);background:var(--wb-color-danger);color:#fff;border-radius:999px;font-size:11px;line-height:14px;padding:1px 5px;font-weight:700}
 .top .who,.top .hide-m{display:none}
 .logo span{display:none}
}
@media (max-width:420px){.seg button{padding:0 10px}.proto{font-size:12px}}
/* componentes */
.card{background:#fff;border:1px solid var(--wb-color-neutral-200);border-radius:8px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.card.sunk{background:var(--wb-color-neutral-100);border-color:transparent}
.card h2,.sect h2{font-size:20px;line-height:28px;font-weight:600}
.sect{margin-top:32px}.sect>h2{margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack>*+*{margin-top:12px}.stack8>*+*{margin-top:8px}.stack16>*+*{margin-top:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.dash{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.dash2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:1000px){.dash,.dash2,.split{grid-template-columns:minmax(0,1fr)}}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:28px;line-height:36px;font-weight:700}
.phead p{color:var(--wb-color-neutral-600);margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--wb-color-brand-700);text-decoration:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;text-decoration:none;white-space:nowrap;transition:background var(--wb-motion-fast) var(--wb-ease),transform var(--wb-motion-fast) var(--wb-ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--wb-color-brand-600);color:#fff}.btn.primary:hover{background:var(--wb-color-brand-700)}.btn.primary:active{background:var(--wb-color-brand-800)}
.btn.secondary{background:#fff;border-color:var(--wb-color-brand-600);color:var(--wb-color-brand-700)}.btn.secondary:hover{background:var(--wb-color-brand-50)}
.btn.ghost{background:none;color:var(--wb-color-brand-700)}.btn.ghost:hover{background:var(--wb-color-brand-50)}
.btn.danger{background:#fff;border-color:var(--wb-color-danger);color:var(--wb-color-danger)}.btn.danger:hover{background:var(--wb-color-danger-subtle)}
.btn.dangerfill{background:var(--wb-color-danger);color:#fff}.btn.dangerfill:hover{background:var(--wb-color-danger-pressed)}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{background:var(--wb-color-neutral-200);color:var(--wb-color-neutral-500);border-color:transparent;cursor:not-allowed}
.btn.load{pointer-events:none;opacity:.85}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:600;min-height:22px;white-space:nowrap}
.t-ok{background:var(--wb-color-success-subtle);color:var(--wb-color-success)}
.t-warn{background:var(--wb-color-warning-subtle);color:var(--wb-color-warning)}
.t-bad{background:var(--wb-color-danger-subtle);color:var(--wb-color-danger)}
.t-info{background:var(--wb-color-info-subtle);color:var(--wb-color-info)}
.t-neu{background:var(--wb-color-neutral-100);color:var(--wb-color-neutral-700)}
.t-brand{background:var(--wb-color-brand-50);color:var(--wb-color-brand-700)}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;border:1px solid;font-size:14px;line-height:20px}
.note .ic{margin-top:1px}
.note.ok{background:var(--wb-color-success-subtle);border-color:var(--wb-color-success-border);color:#12532b}
.note.warn{background:var(--wb-color-warning-subtle);border-color:var(--wb-color-warning-border);color:var(--wb-color-warning)}
.note.bad{background:var(--wb-color-danger-subtle);border-color:var(--wb-color-danger-border);color:var(--wb-color-danger)}
.note.info{background:var(--wb-color-info-subtle);border-color:var(--wb-color-info-border);color:var(--wb-color-info)}
.note.brand{background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-200);color:var(--wb-color-brand-800)}
.note .grow{flex:1}.note p+p{margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--wb-color-neutral-200);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;min-height:48px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected=true]{color:var(--wb-color-brand-700);border-bottom-color:var(--wb-color-brand-600)}
.tabs .c{background:var(--wb-color-neutral-100);color:var(--wb-color-neutral-700);border-radius:999px;font-size:12px;line-height:16px;padding:2px 8px;font-weight:700}
.tabs [aria-selected=true] .c{background:var(--wb-color-brand-600);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--wb-color-neutral-300);background:#fff;border-radius:999px;min-height:40px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-600);color:var(--wb-color-brand-700)}
/* formulários */
.fld{display:grid;gap:4px;align-content:start}
.fld>label,.lbl{font-weight:600}
.inp{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--wb-color-neutral-500);border-radius:8px;background:#fff}
textarea.inp{padding:12px;min-height:96px;resize:vertical}
.inp:hover{border-color:var(--wb-color-neutral-700)}
.inp[aria-invalid=true]{border:2px solid var(--wb-color-danger)}
.inp::placeholder{color:var(--wb-color-neutral-600)}
.help{font-size:14px;line-height:20px;color:var(--wb-color-neutral-600)}
.err{font-size:14px;line-height:20px;color:var(--wb-color-danger);display:flex;gap:4px;align-items:flex-start;font-weight:500}
.err[hidden]{display:none}
.pre{position:relative}.pre>span{position:absolute;left:12px;top:12px;font-weight:600;color:var(--wb-color-neutral-600)}.pre .inp{padding-left:44px}
.sw{position:relative;width:52px;height:32px;flex:none;border-radius:999px;border:2px solid var(--wb-color-neutral-500);background:#fff;padding:0;transition:background var(--wb-motion-fast) var(--wb-ease)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--wb-color-neutral-500);transition:transform var(--wb-motion-fast) var(--wb-ease)}
.sw[aria-checked=true]{background:var(--wb-color-brand-600);border-color:var(--wb-color-brand-600)}
.sw[aria-checked=true] i{background:#fff;transform:translateX(20px)}
.swrow{display:flex;align-items:center;gap:12px;min-height:44px}
.chk{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:8px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--wb-color-brand-600);flex:none}
.radio{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:1px solid var(--wb-color-neutral-300);border-radius:8px;cursor:pointer;background:#fff}
.radio input{width:20px;height:20px;accent-color:var(--wb-color-brand-600)}
.radio:has(input:checked){border-color:var(--wb-color-brand-600);background:var(--wb-color-brand-50)}
.step{display:inline-flex;align-items:center;border:1px solid var(--wb-color-neutral-500);border-radius:8px;background:#fff;overflow:hidden}
.step button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--wb-color-brand-700)}
.step button:hover{background:var(--wb-color-brand-50)}
.step input{width:56px;height:40px;border:0;text-align:center;font-weight:600;background:none}
/* barras e gráficos */
.bar{height:8px;background:var(--wb-color-neutral-200);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--wb-color-brand-600);border-radius:999px;transition:width var(--wb-motion-base) var(--wb-ease)}
.bar.warn>i{background:var(--wb-color-warning)}.bar.bad>i{background:var(--wb-color-danger)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.chart .col b{font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-700);white-space:nowrap}
.chart .col i{display:block;width:100%;max-width:44px;background:var(--wb-color-brand-400);border-radius:4px 4px 0 0;min-height:4px}
.chart .col.now i{background:var(--wb-color-brand-700)}
.chart .col span{font-size:12px;line-height:16px;color:var(--wb-color-neutral-600)}
.stars{color:var(--wb-color-star);display:inline-flex;gap:2px}
/* tabelas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:14px;line-height:20px;font-weight:600;color:var(--wb-color-neutral-600);padding:10px 12px;border-bottom:1px solid var(--wb-color-neutral-200);background:var(--wb-color-neutral-50);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--wb-color-neutral-200);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--wb-color-neutral-50)}
.tbl tr.sel td{background:var(--wb-color-brand-50)}
.tbl .num{text-align:right;white-space:nowrap}
.thumb{width:48px;height:48px;border-radius:8px;background:var(--wb-color-neutral-100);display:grid;place-items:center;color:var(--wb-color-neutral-500);flex:none}
.thumb.lg{width:96px;height:96px}
.tscroll{overflow-x:auto}
@media (max-width:760px){
 .rt thead{display:none}
 .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
 .rt tr{border-bottom:1px solid var(--wb-color-neutral-200);padding:12px}
 .rt td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:right}
 .rt td[data-l]::before{content:attr(data-l);font-size:14px;color:var(--wb-color-neutral-600);text-align:left;flex:none}
 .rt td.first{justify-content:flex-start;text-align:left}.rt td.first::before{display:none}
 .rt td.chkc{position:absolute;right:8px}
 .rt tr{position:relative}
}
/* pedidos */
.ord{background:#fff;border:1px solid var(--wb-color-neutral-200);border-radius:8px;padding:16px}
.ord.novo{border:2px solid var(--wb-color-brand-600);padding:20px}
.ord.flash{animation:fl 1.6s var(--wb-ease) 2}
@keyframes fl{0%,100%{box-shadow:0 0 0 0 rgba(0,105,111,0)}50%{box-shadow:0 0 0 6px rgba(0,105,111,.25)}}
.cdbox{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--wb-color-neutral-100)}
.cdbox .tm{font-size:28px;line-height:32px;font-weight:700}
.cdbox.urgent{background:var(--wb-color-danger-subtle);color:var(--wb-color-danger)}
.cdbox.urgent .bar>i{background:var(--wb-color-danger)}
.items li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--wb-color-neutral-300)}
.items li:last-child{border:0}
.recebe{background:var(--wb-color-success-subtle);border:1px solid var(--wb-color-success-border);border-radius:8px;padding:12px 16px;color:#12532b}
.recebe b{font-size:24px;line-height:32px;color:var(--wb-color-success)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}.kv dt{color:var(--wb-color-neutral-600)}.kv dd{margin:0;font-weight:600;text-align:right}
.tl{position:relative;padding-left:28px}
.tl li{position:relative;padding-bottom:20px}
.tl li::before{content:"";position:absolute;left:-20px;top:22px;bottom:-2px;width:2px;background:var(--wb-color-neutral-300)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:-28px;top:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--wb-color-neutral-500);background:#fff;display:grid;place-items:center;color:#fff}
.tl li.done .dot{background:var(--wb-color-brand-600);border-color:var(--wb-color-brand-600)}
.tl li.done::before{background:var(--wb-color-brand-600)}
.tl li.cur .dot{border-color:var(--wb-color-brand-600);border-width:5px}
.empty{text-align:center;padding:40px 16px;color:var(--wb-color-neutral-600)}
.empty .ring{width:80px;height:80px;border-radius:50%;background:var(--wb-color-neutral-100);display:grid;place-items:center;margin:0 auto 16px;color:var(--wb-color-neutral-600)}
.empty h2{color:var(--wb-color-neutral-900);margin-bottom:4px}
.bulk{position:sticky;bottom:72px;z-index:15;background:var(--wb-color-neutral-900);color:#fff;border-radius:8px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--wb-shadow-md);margin-top:12px}

.drop{border:2px dashed var(--wb-color-neutral-400);border-radius:8px;padding:32px 16px;text-align:center;background:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{aspect-ratio:1;border-radius:8px;background:var(--wb-color-neutral-100);border:1px solid var(--wb-color-neutral-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--wb-color-neutral-600);position:relative;font-size:12px;line-height:16px;text-align:center;padding:4px}
.ph.add{border:2px dashed var(--wb-color-neutral-500);background:#fff;color:var(--wb-color-brand-700);font-weight:600;font-size:14px}
.ph .x{position:absolute;top:2px;right:2px;width:32px;height:32px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:var(--wb-shadow-sm)}
.ph .cv{position:absolute;left:4px;bottom:4px;background:var(--wb-color-brand-600);color:#fff;border-radius:4px;padding:0 6px;font-weight:600}
.sticky{position:sticky;top:72px}
.hr{height:1px;background:var(--wb-color-neutral-200);border:0;margin:16px 0}
.dl{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.dl.tot{border-top:1px solid var(--wb-color-neutral-300);margin-top:6px;padding-top:12px;font-weight:700}
/* modal e toast */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .scrim{position:absolute;inset:0;background:var(--wb-color-scrim)}
.dlg{position:relative;background:#fff;border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:var(--wb-shadow-lg);animation:up var(--wb-motion-base) var(--wb-ease)}
.dlg.wide{width:min(760px,100%)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dlg h2{font-size:22px;line-height:30px;font-weight:700;margin-bottom:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
@media (max-width:720px){#modal{align-items:end;padding:0}.dlg{border-radius:24px 24px 0 0;width:100%;max-height:92vh}.dlg .acts .btn{flex:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;display:grid;gap:8px;width:min(480px,calc(100% - 32px));pointer-events:none}
@media (max-width:900px){#toast{bottom:80px}}
.toast{pointer-events:auto;background:var(--wb-color-neutral-900);color:#fff;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--wb-shadow-md);animation:up var(--wb-motion-base) var(--wb-ease)}
.toast button{background:none;border:0;color:var(--wb-color-inverse-action);font-weight:600;min-height:36px;padding:0 8px;margin-left:auto}
.comanda{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:20px;background:#fff;border:1px dashed var(--wb-color-neutral-500);padding:16px;max-width:340px;margin:0 auto;color:#000}
.comanda h3{font-size:18px;text-align:center}.comanda hr{border:0;border-top:1px dashed #000;margin:8px 0}
.comanda .l{display:flex;justify-content:space-between;gap:8px}
.wa{white-space:pre-wrap;background:var(--wb-color-neutral-100);border-radius:8px;padding:12px;font-size:14px;line-height:20px;border-left:4px solid var(--wb-color-brand-600)}
.pulse{animation:fl 1.6s var(--wb-ease) infinite}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}.comanda{border:0;max-width:none}}
.skel{background:linear-gradient(90deg,var(--wb-color-neutral-200),var(--wb-color-neutral-100),var(--wb-color-neutral-200));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:8px;height:20px}
@keyframes sk{to{background-position:-200% 0}}
</style>

function ic(n,s){s=s||20;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+(ICONS[n]||ICONS.info)+'</svg>';}
const LOGO='<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 11h20l-1.6 17.5a1 1 0 0 1-1 .9H8.6a1 1 0 0 1-1-.9z" fill="#00696F"/><path d="M11.5 11V9.5a4.5 4.5 0 0 1 9 0V11" fill="none" stroke="#00696F" stroke-width="2.4" stroke-linecap="round"/><path d="M10.5 16.5l2.3 7.5 3.2-5.2 3.2 5.2 2.3-7.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const brl=n=>(n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=s=>{const v=parseFloat(String(s==null?'':s).replace(/\./g,'').replace(',','.'));return isNaN(v)?0:v};
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hhmm=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const MIN=60000,HOUR=3600000;
const NOW0=Date.now();
function since(ts){const m=Math.floor((Date.now()-ts)/MIN);if(m<1)return 'agora';if(m<60)return m+' min';const h=Math.floor(m/60);return h+' h '+String(m%60).padStart(2,'0')+' min'}
function left24(ts){const ms=ts+24*HOUR-Date.now();if(ms<=0)return 'vencido';const h=Math.floor(ms/HOUR);return h+' h '+String(Math.floor(ms%HOUR/MIN)).padStart(2,'0')+' min'}
const tag=(tone,icon,text)=>'<span class="tag t-'+tone+'">'+(icon?ic(icon,14):'')+text+'</span>';
const btn=(label,a,o)=>{o=o||{};return '<button type="button" class="btn '+(o.k||'primary')+' '+(o.sz||'')+'" data-a="'+a+'"'+(o.d!=null?' data-d="'+esc(o.d)+'"':'')+(o.dis?' disabled':'')+(o.label?' aria-label="'+esc(o.label)+'"':'')+'>'+(o.i?ic(o.i,20):'')+label+'</button>'};
const sw=(on,a,d,label)=>'<button type="button" role="switch" class="sw" aria-checked="'+(!!on)+'" aria-label="'+esc(label)+'" data-a="'+a+'" data-d="'+esc(d)+'"><i></i></button>';
const tabs=(items,cur,a)=>'<div class="tabs" role="tablist">'+items.map(i=>'<button type="button" role="tab" aria-selected="'+(i[0]===cur)+'" data-a="'+a+'" data-d="'+i[0]+'">'+i[1]+(i[2]!=null?' <span class="c">'+i[2]+'</span>':'')+'</button>').join('')+'</div>';
const head=(t,sub,acts)=>'<div class="phead"><div><h1 tabindex="-1">'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(acts?'<div class="row">'+acts+'</div>':'')+'</div>';

const empty=(icon,t,sub,act)=>'<div class="empty"><div class="ring">'+ic(icon,40)+'</div><h2>'+t+'</h2><p>'+sub+'</p>'+(act?'<div style="margin-top:16px">'+act+'</div>':'')+'</div>';
const stars=n=>'<span class="stars" aria-hidden="true">'+[1,2,3,4,5].map(i=>i<=Math.round(n)?ic('star',16):'<span style="opacity:.3">'+ic('star',16)+'</span>').join('')+'</span>';

/* caminho em objeto (data-bind) */
function getP(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function setP(path,v){const k=path.split('.');const last=k.pop();const o=k.reduce((a,b)=>a[b],S);o[last]=v}
function field(path,label,o){o=o||{};const id='f_'+path.replace(/\W/g,'_');const v=getP(path);const er=S.err[path];
 let c;
 if(o.sel)c='<select class="inp" id="'+id+'" data-bind="'+path+'" aria-invalid="'+!!er+'"'+(er?' aria-describedby="e_'+id+'"':'')+'>'+o.sel.map(x=>'<option'+(String(x)===String(v)?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
 else if(o.ta)c='<textarea class="inp" id="'+id+'" data-bind="'+path+'" rows="3" placeholder="'+esc(o.ph||'')+'" aria-invalid="'+!!er+'"'+(er?' aria-describedby="e_'+id+'"':'')+'>'+esc(v)+'</textarea>';
 else c='<input class="inp" id="'+id+'" data-bind="'+path+'" type="'+(o.type||'text')+'" inputmode="'+(o.mode||'text')+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'" autocomplete="off" aria-invalid="'+!!er+'" aria-describedby="'+(er?'e_'+id+' ':'')+(o.help?'h_'+id:'')+'">';
 if(o.pre)c='<div class="pre"><span aria-hidden="true">'+o.pre+'</span>'+c+'</div>';
 return '<div class="fld"'+(o.cls?' style="'+o.cls+'"':'')+'><label for="'+id+'">'+label+'</label>'+c+(o.help?'<p class="help" id="h_'+id+'">'+o.help+'</p>':'')+'<p class="err" id="e_'+id+'" '+(er?'':'hidden')+'>'+ic('warn',16)+'<span>'+esc(er||'')+'</span></p></div>'}

const S={role:'lojista',last:{lojista:'painel',admin:'painel'},sound:false,err:{},ordTab:'novos',ordSeq:1046,entSeq:2031,

 nPedidos:S.orders.filter(o=>o.st==='novo').length,

/* ===== RENDER ===== */
function chrome(r){
 const c=counts();const nav=NAV[r.role];const lo=r.role==='lojista';
 const side=nav.map(g=>'<h2>'+g.g+'</h2>'+g.i.map(x=>{const n=x[3]?c[x[3]]:0;return '<a href="#/'+r.role+'/'+x[0]+'" '+(r.page===x[0]?'aria-current="page"':'')+'>'+ic(x[2],22)+'<span>'+x[1]+'</span>'+(n?'<span class="n'+(x[3]==='nLog'?' w':'')+'" aria-label="'+n+' pendentes">'+n+'</span>':'')+'</a>'}).join('')).join('');
 const demo=lo?'<div class="demo"><p class="capb" style="color:var(--wb-color-neutral-900)">Atalhos do protótipo</p><p style="margin-bottom:8px">Veja o cadastro de uma loja nova.</p><button type="button" class="btn secondary sm block" data-a="verOnb">Ver cadastro guiado</button></div>':'';
 const first=BN[r.role].map(k=>{const it=nav.flatMap(g=>g.i).find(x=>x[0]===k);const n=it[3]?c[it[3]]:0;return '<a href="#/'+r.role+'/'+k+'" '+(r.page===k?'aria-current="page"':'')+'>'+ic(it[2],24)+'<span>'+it[1].replace('Aprovação de lojas','Lojas').replace('Trocas e disputas','Disputas')+'</span>'+(n?'<span class="n">'+n+'</span>':'')+'</a>'}).join('');
 const more='<button type="button" data-a="more" aria-haspopup="dialog">'+ic('menu',24)+'<span>Mais</span></button>';
 const snd=lo?'<button type="button" class="btn '+(S.sound?'secondary':'ghost')+' sm" data-a="sound" aria-pressed="'+S.sound+'" aria-label="'+(S.sound?'Sons ativados. Tocar para desligar':'Ativar sons de pedido novo')+'">'+ic(S.sound?'sound':'mute',20)+'<span class="hide-m">'+(S.sound?'Sons ativados':'Ativar sons')+'</span></button>':'';
 return (S.hideProto?'':'<div class="proto"><span>Protótipo navegável com dados fictícios. Nada é salvo.</span><button type="button" data-a="hideProto">Dispensar</button></div>')+
 '<header class="top"><a class="logo" href="#/'+r.role+'/painel" aria-label="Webag, início">'+LOGO+'<span>webag</span></a>'+
 '<div class="seg" role="group" aria-label="Escolher painel"><button type="button" data-a="role" data-d="lojista" aria-pressed="'+lo+'">'+ic('store',20)+'Lojista</button><button type="button" data-a="role" data-d="admin" aria-pressed="'+!lo+'">'+ic('shield',20)+'Admin</button></div>'+
 '<div class="spacer"></div>'+snd+
 '<div class="who hide-m"><span class="b">'+(lo?'Fátima Souza':'Operação Webag')+'</span><small>'+(lo?S.loja.nome+' · Francisco Morato':'Super admin')+'</small></div><div class="avatar" aria-hidden="true">'+(lo?'FS':'OW')+'</div></header>'+
 '<div class="shell"><nav class="side nav" aria-label="Menu principal">'+side+demo+'</nav><main id="main" tabindex="-1">@@MAIN@@</main></div>'+
 '<nav class="bnav nav" aria-label="Menu principal">'+first+more+'</nav>';
}
let lastKey='';
