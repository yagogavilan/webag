}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--wb-font-family-web);font-size:16px;line-height:24px;color:var(--wb-color-neutral-900);background:var(--wb-color-neutral-50);font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wb-color-brand-600);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 16px;border-radius:8px;z-index:100;border:2px solid var(--wb-color-brand-600)}.skip:focus{top:8px}
.ic{flex:none;vertical-align:middle}
a{color:var(--wb-color-brand-700)}
/* tipografia */
.t-num{font-size:40px;line-height:48px;font-weight:700}
.t-disp{font-size:32px;line-height:40px;font-weight:700}
.t1{font-size:24px;line-height:32px;font-weight:700}
.t2{font-size:20px;line-height:28px;font-weight:600}
.cap{font-size:14px;line-height:20px}.capb{font-size:14px;line-height:20px;font-weight:600}
.mut{color:var(--wb-color-neutral-600)}.b{font-weight:600}.bb{font-weight:700}
.ok-t{color:var(--wb-color-success)}.bad-t{color:var(--wb-color-danger)}.warn-t{color:var(--wb-color-warning)}.brand-t{color:var(--wb-color-brand-700)}
.strike{text-decoration:line-through;color:var(--wb-color-neutral-600)}
.right{text-align:right}.nowrap{white-space:nowrap}
/* estrutura */
.proto{background:var(--wb-color-neutral-900);color:#fff;font-size:14px;line-height:20px;padding:6px 16px;display:flex;gap:12px;align-items:center;justify-content:center;text-align:center}
.proto button{background:none;border:0;color:var(--wb-color-inverse-action);text-decoration:underline;min-height:32px;padding:0 4px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--wb-color-neutral-200);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--wb-color-brand-600);text-decoration:none}
.seg{display:inline-flex;background:var(--wb-color-neutral-100);border-radius:8px;padding:4px;gap:4px}
.seg button{border:1px solid transparent;background:none;border-radius:6px;min-height:40px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);display:inline-flex;align-items:center;gap:8px;transition:background var(--wb-motion-fast) var(--wb-ease)}
.seg button[aria-pressed=true]{background:#fff;border-color:var(--wb-color-neutral-300);color:var(--wb-color-brand-700)}
.spacer{flex:1}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--wb-color-neutral-100);display:grid;place-items:center;font-weight:700;color:var(--wb-color-neutral-700);font-size:14px;border:1px solid var(--wb-color-neutral-200)}
.who{line-height:18px;text-align:right}.who small{display:block;color:var(--wb-color-neutral-600);font-size:12px}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 100px)}
.side{position:sticky;top:56px;width:248px;flex:none;height:calc(100vh - 56px);overflow:auto;padding:16px 12px;background:#fff;border-right:1px solid var(--wb-color-neutral-200)}
.side h2{font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-600);padding:16px 12px 4px;letter-spacing:.02em}
.side h2:first-child{padding-top:0}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--wb-color-neutral-700);font-weight:500;border:0;background:none;text-align:left;transition:background var(--wb-motion-fast) var(--wb-ease)}
.nav a:hover,.nav button:hover{background:var(--wb-color-neutral-100)}
.nav a[aria-current=page]{background:var(--wb-color-brand-50);color:var(--wb-color-brand-700);font-weight:600;box-shadow:inset 3px 0 0 var(--wb-color-brand-600)}
.nav .n{margin-left:auto;background:var(--wb-color-brand-600);color:#fff;border-radius:999px;font-size:12px;line-height:16px;font-weight:700;min-width:22px;text-align:center;padding:2px 6px}
.nav .n.w{background:var(--wb-color-warning)}
.side .demo{margin:16px 4px 0;padding:12px;border:1px dashed var(--wb-color-neutral-400);border-radius:8px;font-size:14px;line-height:20px;color:var(--wb-color-neutral-600)}
main{flex:1;min-width:0;padding:24px 32px 64px;max-width:1240px;margin:0 auto;outline:none}
.bnav{display:none}
@media (max-width:900px){
 .side{display:none}
 main{padding:16px 16px 96px}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--wb-color-neutral-200);z-index:20;box-shadow:var(--wb-shadow-sm)}
 .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-700);text-decoration:none;border:0;background:none;position:relative;min-height:48px}
 .bnav [aria-current=page]{color:var(--wb-color-brand-700);box-shadow:inset 0 3px 0 var(--wb-color-brand-600)}
 .bnav .n{position:absolute;top:4px;left:calc(50% + 6px);background:var(--wb-color-danger);color:#fff;border-radius:999px;font-size:11px;line-height:14px;padding:1px 5px;font-weight:700}
 .top .who,.top .hide-m{display:none}
 .logo span{display:none}
}
@media (max-width:520px){.avatar{display:none}.seg button{padding:0 12px}.top{gap:8px;padding:0 12px}}
@media (max-width:420px){.seg button svg{display:none}.proto{font-size:12px}}
@media (max-width:900px){.bulk{bottom:76px}}
/* componentes */
.card{background:#fff;border:1px solid var(--wb-color-neutral-200);border-radius:8px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.card.sunk{background:var(--wb-color-neutral-100);border-color:transparent}
.card h2,.sect h2{font-size:20px;line-height:28px;font-weight:600}
.sect{margin-top:32px}.sect>h2{margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack>*+*{margin-top:12px}.stack8>*+*{margin-top:8px}.stack16>*+*{margin-top:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.dash{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.dash2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.split2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.dash,.dash2,.split,.split2{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:28px;line-height:36px;font-weight:700}
.phead p{color:var(--wb-color-neutral-600);margin-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--wb-color-brand-700);text-decoration:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;text-decoration:none;white-space:nowrap;transition:background var(--wb-motion-fast) var(--wb-ease),transform var(--wb-motion-fast) var(--wb-ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--wb-color-brand-600);color:#fff}.btn.primary:hover{background:var(--wb-color-brand-700)}.btn.primary:active{background:var(--wb-color-brand-800)}
.btn.secondary{background:#fff;border-color:var(--wb-color-brand-600);color:var(--wb-color-brand-700)}.btn.secondary:hover{background:var(--wb-color-brand-50)}
.btn.ghost{background:none;color:var(--wb-color-brand-700)}.btn.ghost:hover{background:var(--wb-color-brand-50)}
.btn.danger{background:#fff;border-color:var(--wb-color-danger);color:var(--wb-color-danger)}.btn.danger:hover{background:var(--wb-color-danger-subtle)}
.btn.dangerfill{background:var(--wb-color-danger);color:#fff}.btn.dangerfill:hover{background:var(--wb-color-danger-pressed)}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{background:var(--wb-color-neutral-200);color:var(--wb-color-neutral-500);border-color:transparent;cursor:not-allowed}
.btn.load{pointer-events:none;opacity:.85}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:600;min-height:22px;white-space:nowrap}
.t-ok{background:var(--wb-color-success-subtle);color:var(--wb-color-success)}
.t-warn{background:var(--wb-color-warning-subtle);color:var(--wb-color-warning)}
.t-bad{background:var(--wb-color-danger-subtle);color:var(--wb-color-danger)}
.t-info{background:var(--wb-color-info-subtle);color:var(--wb-color-info)}
.t-neu{background:var(--wb-color-neutral-100);color:var(--wb-color-neutral-700)}
.t-brand{background:var(--wb-color-brand-50);color:var(--wb-color-brand-700)}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;border:1px solid;font-size:14px;line-height:20px}
.note .ic{margin-top:1px}
.note.ok{background:var(--wb-color-success-subtle);border-color:var(--wb-color-success-border);color:#12532b}
.note.warn{background:var(--wb-color-warning-subtle);border-color:var(--wb-color-warning-border);color:var(--wb-color-warning)}
.note.bad{background:var(--wb-color-danger-subtle);border-color:var(--wb-color-danger-border);color:var(--wb-color-danger)}
.note.info{background:var(--wb-color-info-subtle);border-color:var(--wb-color-info-border);color:var(--wb-color-info)}
.note.brand{background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-200);color:var(--wb-color-brand-800)}
.note .grow{flex:1}.note p+p{margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--wb-color-neutral-200);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;min-height:48px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected=true]{color:var(--wb-color-brand-700);border-bottom-color:var(--wb-color-brand-600)}
.tabs .c{background:var(--wb-color-neutral-100);color:var(--wb-color-neutral-700);border-radius:999px;font-size:12px;line-height:16px;padding:2px 8px;font-weight:700}
.tabs [aria-selected=true] .c{background:var(--wb-color-brand-600);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--wb-color-neutral-300);background:#fff;border-radius:999px;min-height:40px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--wb-color-brand-50);border-color:var(--wb-color-brand-600);color:var(--wb-color-brand-700)}
/* formulários */
.fld{display:grid;gap:4px;align-content:start}
.fld>label,.lbl{font-weight:600}
.inp{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--wb-color-neutral-500);border-radius:8px;background:#fff}
textarea.inp{padding:12px;min-height:96px;resize:vertical}
.inp:hover{border-color:var(--wb-color-neutral-700)}
.inp[aria-invalid=true]{border:2px solid var(--wb-color-danger)}
.inp::placeholder{color:var(--wb-color-neutral-600)}
.help{font-size:14px;line-height:20px;color:var(--wb-color-neutral-600)}
.err{font-size:14px;line-height:20px;color:var(--wb-color-danger);display:flex;gap:4px;align-items:flex-start;font-weight:500}
.err[hidden]{display:none}
.pre{position:relative}.pre>span{position:absolute;left:12px;top:12px;font-weight:600;color:var(--wb-color-neutral-600)}.pre .inp{padding-left:44px}
.sw{position:relative;width:52px;height:32px;flex:none;border-radius:999px;border:2px solid var(--wb-color-neutral-500);background:#fff;padding:0;transition:background var(--wb-motion-fast) var(--wb-ease)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--wb-color-neutral-500);transition:transform var(--wb-motion-fast) var(--wb-ease)}
.sw[aria-checked=true]{background:var(--wb-color-brand-600);border-color:var(--wb-color-brand-600)}
.sw[aria-checked=true] i{background:#fff;transform:translateX(20px)}
.swrow{display:flex;align-items:center;gap:12px;min-height:44px}
.chk{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:8px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--wb-color-brand-600);flex:none}
.radio{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:1px solid var(--wb-color-neutral-300);border-radius:8px;cursor:pointer;background:#fff}
.radio input{width:20px;height:20px;accent-color:var(--wb-color-brand-600)}
.radio:has(input:checked){border-color:var(--wb-color-brand-600);background:var(--wb-color-brand-50)}
.step{display:inline-flex;align-items:center;border:1px solid var(--wb-color-neutral-500);border-radius:8px;background:#fff;overflow:hidden}
.step button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--wb-color-brand-700)}
.step button:hover{background:var(--wb-color-brand-50)}
.step input{width:56px;height:40px;border:0;text-align:center;font-weight:600;background:none}
/* barras e gráficos */
.bar{height:8px;background:var(--wb-color-neutral-200);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--wb-color-brand-600);border-radius:999px;transition:width var(--wb-motion-base) var(--wb-ease)}
.bar.warn>i{background:var(--wb-color-warning)}.bar.bad>i{background:var(--wb-color-danger)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.chart .col b{font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-700);white-space:nowrap}
.chart .col i{display:block;width:100%;max-width:44px;background:var(--wb-color-brand-400);border-radius:4px 4px 0 0;min-height:4px}
.chart .col.now i{background:var(--wb-color-brand-700)}
.chart .col span{font-size:12px;line-height:16px;color:var(--wb-color-neutral-600)}
.stars{color:var(--wb-color-star);display:inline-flex;gap:2px}
/* tabelas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:14px;line-height:20px;font-weight:600;color:var(--wb-color-neutral-600);padding:10px 12px;border-bottom:1px solid var(--wb-color-neutral-200);background:var(--wb-color-neutral-50);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--wb-color-neutral-200);vertical-align:middle}

.tbl tr.sel td{background:var(--wb-color-brand-50)}
.tbl .num{text-align:right;white-space:nowrap}
.thumb{width:48px;height:48px;border-radius:8px;background:var(--wb-color-neutral-100);display:grid;place-items:center;color:var(--wb-color-neutral-500);flex:none}
.thumb.lg{width:96px;height:96px}
.tscroll{overflow-x:auto}
@media (max-width:760px){
 .rt thead{display:none}

.cdbox .tm{font-size:28px;line-height:32px;font-weight:700}

.items li:last-child{border:0}
.recebe{background:var(--wb-color-success-subtle);border:1px solid var(--wb-color-success-border);border-radius:8px;padding:12px 16px;color:#12532b}
.recebe b{font-size:24px;line-height:32px;color:var(--wb-color-success)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}.kv dt{color:var(--wb-color-neutral-600)}.kv dd{margin:0;font-weight:600;text-align:right}
.tl{position:relative;padding-left:28px}

.empty{text-align:center;padding:40px 16px;color:var(--wb-color-neutral-600)}

.drop{border:2px dashed var(--wb-color-neutral-400);border-radius:8px;padding:32px 16px;text-align:center;background:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{aspect-ratio:1;border-radius:8px;background:var(--wb-color-neutral-100);border:1px solid var(--wb-color-neutral-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--wb-color-neutral-600);position:relative;font-size:12px;line-height:16px;text-align:center;padding:4px}
.ph.add{border:2px dashed var(--wb-color-neutral-500);background:#fff;color:var(--wb-color-brand-700);font-weight:600;font-size:14px}
.ph .x{position:absolute;top:2px;right:2px;width:32px;height:32px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:var(--wb-shadow-sm)}
.ph .cv{position:absolute;left:4px;bottom:4px;background:var(--wb-color-brand-600);color:#fff;border-radius:4px;padding:0 6px;font-weight:600}
.sticky{position:sticky;top:72px}
.hr{height:1px;background:var(--wb-color-neutral-200);border:0;margin:16px 0}
.dl{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.dl.tot{border-top:1px solid var(--wb-color-neutral-300);margin-top:6px;padding-top:12px;font-weight:700}
/* modal e toast */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .scrim{position:absolute;inset:0;background:var(--wb-color-scrim)}
.dlg{position:relative;background:#fff;border-radius:24px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:var(--wb-shadow-lg);animation:up var(--wb-motion-base) var(--wb-ease)}
.dlg.wide{width:min(760px,100%)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dlg h2{font-size:22px;line-height:30px;font-weight:700;margin-bottom:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
@media (max-width:720px){#modal{align-items:end;padding:0}.dlg{border-radius:24px 24px 0 0;width:100%;max-height:92vh}.dlg .acts .btn{flex:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;display:grid;gap:8px;width:min(480px,calc(100% - 32px));pointer-events:none}
@media (max-width:900px){#toast{bottom:80px}}
.toast{pointer-events:auto;background:var(--wb-color-neutral-900);color:#fff;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--wb-shadow-md);animation:up var(--wb-motion-base) var(--wb-ease)}
.toast button{background:none;border:0;color:var(--wb-color-inverse-action);font-weight:600;min-height:36px;padding:0 8px;margin-left:auto}
.comanda{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:20px;background:#fff;border:1px dashed var(--wb-color-neutral-500);padding:16px;max-width:340px;margin:0 auto;color:#000}
.comanda h3{font-size:18px;text-align:center}.comanda hr{border:0;border-top:1px dashed #000;margin:8px 0}
.comanda .l{display:flex;justify-content:space-between;gap:8px}
.wa{white-space:pre-wrap;background:var(--wb-color-neutral-100);border-radius:8px;padding:12px;font-size:14px;line-height:20px;border-left:4px solid var(--wb-color-brand-600)}
.pulse{animation:fl 1.6s var(--wb-ease) infinite}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}.comanda{border:0;max-width:none}}
.skel{background:var(--wb-color-neutral-200);animation:skp 1.2s ease-in-out infinite;border-radius:8px;height:20px}

/* ===== IDENTIDADE V2 (DEC-040) =====
   Outfit: títulos e números de destaque. Figtree: tudo que se lê e se calcula.
   Magenta 500 só em áreas amplas; ação em 600; sol (acento) no máx. 3%, sempre com texto escuro.
   Dial: sóbrio em dados e dinheiro; vivo no cabeçalho, início, vazios e celebrações. Só transform/opacity. */
@keyframes slin{from{opacity:0;transform:translateX(-24px)}}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:40}}
@keyframes settle{from{transform:translateY(-8px)}}
@keyframes skp{50%{opacity:.5}}
/* tipografia */
.phead h1{font-family:var(--wb-font-family-display);font-size:32px;line-height:40px;font-weight:700}
.t1,.t-disp,.t-num,h1.t2,h2.t2,h3.t2,.card h2,.sect h2{font-family:var(--wb-font-family-display)}
.t-num{font-size:clamp(36px,6vw,48px);line-height:1.1}
.t-num.fin{font-family:var(--wb-font-family-web);font-size:40px;line-height:48px}
.card h2.capb{font-family:var(--wb-font-family-web);font-size:14px;line-height:20px;font-weight:600}
.dlg h2{font-family:var(--wb-font-family-display);font-weight:600}
.sr{clip-path:inset(50%)}
/* foco visível em fundo escuro ou magenta: anel duplo (branco por fora, ameixa por dentro) */
.top :focus-visible,.side :focus-visible,.hero :focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 2px var(--wb-color-brand-800)}
.proto :focus-visible,.toast :focus-visible,.bulk :focus-visible{outline-color:#fff}
/* cabeçalho: faixa magenta com a logo branca e linhas de velocidade */
.top{height:72px;padding:0 20px;gap:16px;background:var(--wb-color-brand-500);border-bottom:0}
.logo{height:100%;flex:none;color:#fff}
.logo svg{display:block}
.logo .lg-full{width:124px;height:33px}
.logo .lg-sym{display:none;width:48px;height:31px}
.sl{display:block;height:auto}
.sl .ln{fill:#fff;fill-opacity:.24}
.hd-sl{display:flex;align-items:center;min-width:0;overflow:hidden;height:100%}
.hd-sl .sl{width:96px;flex:none}
.hdfirst .ln{animation:slin 600ms var(--wb-ease-enter) backwards}
.ln:nth-child(2){animation-delay:60ms}.ln:nth-child(3){animation-delay:120ms}.ln:nth-child(4){animation-delay:180ms}
.seg{background:#fff;border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;border-radius:999px;min-height:44px;padding:0 18px;color:var(--wb-color-neutral-700);transition:background var(--wb-motion-fast) var(--wb-ease),color var(--wb-motion-fast) var(--wb-ease),transform var(--wb-motion-fast) var(--wb-ease)}
.seg button:hover{background:var(--wb-color-brand-50)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed=true]{background:var(--wb-color-brand-600);color:#fff;border:0}
.top .btn{min-height:44px}
.top .btn.ghost,.top .btn.secondary{background:#fff;color:var(--wb-color-brand-800);border:2px solid transparent}
.top .btn.secondary{border-color:var(--wb-color-brand-800)}
.top .btn.ghost:hover,.top .btn.secondary:hover{background:var(--wb-color-brand-50)}
.me{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:4px 4px 4px 16px}
.avatar{background:var(--wb-color-brand-100);border:0;color:var(--wb-color-brand-800);font-family:var(--wb-font-family-display);font-weight:600}
/* barra lateral: ameixa profunda, item ativo em pílula clara, contador em sol */
.side{top:72px;height:calc(100vh - 72px);background:var(--wb-color-brand-800);border-right:0;border-radius:0 24px 0 0;padding:20px 12px 16px;display:flex;flex-direction:column}
.side h2{color:var(--wb-color-brand-200)}
.side.nav a,.side.nav button{color:#fff;border-radius:999px;font-weight:600;min-height:46px;transition:background var(--wb-motion-fast) var(--wb-ease),color var(--wb-motion-fast) var(--wb-ease)}
.side.nav a:hover,.side.nav button:hover{background:rgba(255,255,255,.14)}
.side.nav a[aria-current=page]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800);box-shadow:none}
.side .n{background:var(--wb-accent);color:var(--wb-on-accent)}
.side .n.w{background:#fff;color:var(--wb-color-warning)}
.side .demo{border:1px dashed rgba(255,255,255,.55);border-radius:16px;color:var(--wb-color-brand-100)}
.side .demo .capb{color:#fff}
.side-sl{margin-top:auto;padding:24px 8px 0}
.side-sl .sl{width:88px}
.side-sl .ln{fill-opacity:.2}
.sticky{top:88px}
/* faixa de destaque (início, painel geral, celebrações) */
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--wb-color-brand-500);color:#fff;border-radius:24px 24px 24px 6px;padding:28px 28px 28px 148px;margin-bottom:20px;min-height:132px}
.hero-sl{position:absolute;left:0;top:50%;transform:translateY(-50%);width:120px;z-index:-1;pointer-events:none}
.hero-sl .sl{width:100%}
.enter .hero .ln{animation:slin 600ms var(--wb-ease-enter) backwards}
.hero-body{display:grid;gap:10px;justify-items:start;min-width:0}
.hero-t{font-family:var(--wb-font-family-display);font-size:40px;line-height:48px;font-weight:700;color:#fff;margin:0}
.hchip{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border-radius:999px;background:#fff;color:var(--wb-color-brand-800);font-size:14px;line-height:20px;font-weight:600}
.hero-act .swrow{background:#fff;color:var(--wb-color-neutral-900);border-radius:999px;padding:2px 8px 2px 18px}
.hero .tabs{background:#fff;border:0;border-radius:999px;padding:4px;gap:4px;margin:0;overflow:visible}
.hero .tabs button{border-radius:999px;min-height:44px;border:0;padding:0 18px;color:var(--wb-color-neutral-700)}
.hero .tabs [aria-selected=true]{background:var(--wb-color-brand-600);color:#fff}
.hero .tabs [aria-selected=true] .c{background:#fff;color:var(--wb-color-brand-800)}
.celeb-ck{display:block;width:56px;height:56px;animation:pop 400ms var(--wb-ease-enter) 300ms backwards}
.celeb-ck .ck{stroke-dasharray:40;animation:draw 450ms var(--wb-ease) 450ms backwards}
.celeb .hero-sl .ln{animation:slin 600ms var(--wb-ease-enter) backwards}
.celeb-sub{color:var(--wb-color-neutral-600);margin:-4px 0 20px}
/* cartões: formas variadas (cantos 24 com um canto 6, como a alça da sacola) e tiles pastel só em KPI */
.card{border-radius:16px}
.card.sunk{border-radius:16px 16px 16px 6px}
a.card{transition:transform var(--wb-motion-fast) var(--wb-ease),box-shadow var(--wb-motion-fast) var(--wb-ease)}
a.card:hover{transform:translateY(-2px);box-shadow:var(--wb-shadow-md)}
.kt{border-color:transparent}
.kt1{background:var(--wb-color-tile-1);border-radius:24px 24px 24px 6px}
.kt2{background:var(--wb-color-tile-2);border-radius:24px 6px 24px 24px}
.kt3{background:var(--wb-color-tile-3);border-radius:6px 24px 24px 24px}
.kt4{background:var(--wb-color-tile-4);border-radius:24px 24px 6px 24px}
.kt5{background:var(--wb-color-tile-5);border-radius:24px 6px 24px 24px}
.kt1 .ic{color:var(--wb-color-tile-ink-1)}.kt2 .ic{color:var(--wb-color-tile-ink-2)}.kt3 .ic{color:var(--wb-color-tile-ink-3)}.kt4 .ic{color:var(--wb-color-tile-ink-4)}
.kt .bar{background:rgba(255,255,255,.75)}
.rank{display:flex;align-items:center;gap:14px}
.rk{font-family:var(--wb-font-family-display);font-weight:700;font-size:40px;line-height:40px;color:var(--wb-color-brand-500);min-width:30px;text-align:center}
.rk-b{flex:1;min-width:0}
/* controles em pílula; campos em 12 */
.btn{border-radius:999px;transition:background var(--wb-motion-fast) var(--wb-ease),border-color var(--wb-motion-fast) var(--wb-ease),color var(--wb-motion-fast) var(--wb-ease),transform var(--wb-motion-fast) var(--wb-ease)}
.btn:active{transform:scale(.97)}
.tag{border-radius:999px;padding:2px 10px}
.t-brand{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.inp,.radio,.thumb,.ph{border-radius:12px}
.inp{transition:border-color var(--wb-motion-fast) var(--wb-ease)}
.chip{transition:background var(--wb-motion-fast) var(--wb-ease),border-color var(--wb-motion-fast) var(--wb-ease)}
.chip[aria-pressed=true]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.step{border-radius:999px}
.sw::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.note,.ord,.cdbox,.recebe,.drop,.bulk,.toast{border-radius:16px}
.ord.novo{border-radius:24px 24px 24px 8px}
.tabs{border-bottom:0;gap:8px;padding-bottom:4px}
.tabs button{border-bottom:0;border-radius:999px;min-height:44px;transition:background var(--wb-motion-fast) var(--wb-ease)}
.tabs button:hover{background:var(--wb-color-neutral-100)}
.tabs button[aria-selected=true]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.hero .tabs button:hover{background:var(--wb-color-brand-50)}
.hero .tabs button[aria-selected=true]:hover{background:var(--wb-color-brand-600)}
.chart .col i{border-radius:8px 8px 0 0}
.nav a,.nav button{transition:background var(--wb-motion-fast) var(--wb-ease)}
.tbl tr.click td{transition:background var(--wb-motion-fast) var(--wb-ease)}
.skel{background:var(--wb-color-neutral-200);animation:skp 1.2s ease-in-out infinite}
/* estados vazios: sacola com linhas de velocidade */
.empty{padding:32px 16px 40px}
.empty .ill{display:block;width:200px;max-width:70%;height:auto;margin:0 auto 12px}
.empty h2{font-family:var(--wb-font-family-display);font-size:24px;line-height:32px;font-weight:600}
.ill .ln{fill:var(--wb-color-brand-200);fill-opacity:1;animation:slin 600ms var(--wb-ease-enter) backwards}
.ill .bag{animation:settle 400ms var(--wb-ease-enter) 200ms backwards}
/* entrada de tela: sobe 16px e aparece; escalonada nos 6 primeiros blocos */
.enter>*{animation:enter var(--wb-motion-base) var(--wb-ease-enter) backwards}
.enter>*:nth-child(2){animation-delay:40ms}.enter>*:nth-child(3){animation-delay:80ms}.enter>*:nth-child(4){animation-delay:120ms}.enter>*:nth-child(5){animation-delay:160ms}.enter>*:nth-child(6){animation-delay:200ms}
.enter>*:nth-child(n+7){animation:none}
/* celebração em toast (pedido aceito, loja aprovada, corrida atribuída) */
.toast.cel{position:relative;overflow:hidden;background:var(--wb-color-brand-800);min-height:60px;padding:10px 16px 10px 44px}
.toast.cel .sl{position:absolute;left:-6px;top:50%;width:60px;transform:translateY(-50%)}
.toast.cel .sl .ln{animation:slin 500ms var(--wb-ease-enter) backwards}
.toast.cel .cb{position:relative;z-index:1;flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--wb-color-brand-800);display:grid;place-items:center;animation:pop 400ms var(--wb-ease-enter) 120ms backwards}
.toast.cel>span:not(.cb){position:relative;z-index:1;font-weight:600}
/* mobile: alvos de 44px, cabeçalho compacto com o símbolo */
@media (max-width:900px){
 .top{height:64px;padding:0 14px;border-radius:0 0 20px 20px}
 .logo .lg-full{display:none}.logo .lg-sym{display:block}
 .hd-sl .sl{display:none}
 .me{padding:4px}
 .bnav{border-radius:20px 20px 0 0}
 .bnav a,.bnav button{margin:6px 4px;border-radius:16px}
 .bnav [aria-current=page]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800);box-shadow:none}
 .bnav .n{background:var(--wb-accent);color:var(--wb-on-accent);border:1px solid var(--wb-color-brand-800)}
 .sticky{top:80px}
 .btn.sm,.chip{min-height:44px}
 .step button{width:44px;height:44px}.step input{height:44px}
 .ph .x{width:44px;height:44px}
 .proto button{min-height:44px}
}
@media (max-width:700px){
 .hero{padding:20px;border-radius:24px 24px 24px 6px}
 .hero-sl{display:none}
 .hero-t,.phead h1{font-size:32px;line-height:40px}
}
@media (max-width:520px){.me{display:none}.seg button{padding:0 14px}}
/* movimento reduzido: troca direta, sem deslocamento */
@media (prefers-reduced-motion:reduce){
 .enter>*,.ln,.ill .bag,.celeb-ck,.celeb-ck .ck,.cb,.toast,.dlg,.skel,.ord.flash{animation:none!important}
 .btn,.btn:active,.seg button,.seg button:active,a.card,a.card:hover,.chip,.tabs button,.nav a,.inp{transition:none!important;transform:none!important}
}
.side .demo .btn,.side .demo .btn.secondary{background:#fff;color:var(--wb-color-brand-800);border-color:#fff}.side .demo .btn:hover{background:var(--wb-color-brand-50)}
</style>

const hhmm=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const MIN=60000,HOUR=3600000;
const NOW0=Date.now();
function since(ts){const m=Math.floor((Date.now()-ts)/MIN);if(m<1)return 'agora';if(m<60)return m+' min';const h=Math.floor(m/60);return h+' h '+String(m%60).padStart(2,'0')+' min'}
function left24(ts){const ms=ts+24*HOUR-Date.now();if(ms<=0)return 'vencido';const h=Math.floor(ms/HOUR);return h+' h '+String(Math.floor(ms%HOUR/MIN)).padStart(2,'0')+' min'}

const sw=(on,a,d,label)=>'<button type="button" role="switch" class="sw" aria-checked="'+(!!on)+'" aria-label="'+esc(label)+'" data-a="'+a+'" data-d="'+esc(d)+'"><i></i></button>';
const tabs=(items,cur,a)=>'<div class="tabs" role="tablist">'+items.map(i=>'<button type="button" role="tab" aria-selected="'+(i[0]===cur)+'" data-a="'+a+'" data-d="'+i[0]+'">'+i[1]+(i[2]!=null?' <span class="c">'+i[2]+'</span>':'')+'</button>').join('')+'</div>';
const head=(t,sub,acts)=>'<div class="phead"><div><h1 tabindex="-1">'+t+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(acts?'<div class="row">'+acts+'</div>':'')+'</div>';

/* caminho em objeto (data-bind) */
function getP(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function setP(path,v){const k=path.split('.');const last=k.pop();const o=k.reduce((a,b)=>a[b],S);o[last]=v}
function field(path,label,o){o=o||{};const id='f_'+path.replace(/\W/g,'_');const v=getP(path);const er=S.err[path];
 let c;
 if(o.sel)c='<select class="inp" id="'+id+'" data-bind="'+path+'" aria-invalid="'+!!er+'"'+(er?' aria-describedby="e_'+id+'"':'')+'>'+o.sel.map(x=>'<option'+(String(x)===String(v)?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';
 else if(o.ta)c='<textarea class="inp" id="'+id+'" data-bind="'+path+'" rows="3" placeholder="'+esc(o.ph||'')+'" aria-invalid="'+!!er+'"'+(er?' aria-describedby="e_'+id+'"':'')+'>'+esc(v)+'</textarea>';
 else c='<input class="inp" id="'+id+'" data-bind="'+path+'" type="'+(o.type||'text')+'" inputmode="'+(o.mode||'text')+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'" autocomplete="off" aria-invalid="'+!!er+'" aria-describedby="'+(er?'e_'+id+' ':'')+(o.help?'h_'+id:'')+'">';
 if(o.pre)c='<div class="pre"><span aria-hidden="true">'+o.pre+'</span>'+c+'</div>';
 return '<div class="fld"'+(o.cls?' style="'+o.cls+'"':'')+'><label for="'+id+'">'+label+'</label>'+c+(o.help?'<p class="help" id="h_'+id+'">'+o.help+'</p>':'')+'<p class="err" id="e_'+id+'" '+(er?'':'hidden')+'>'+ic('warn',16)+'<span>'+esc(er||'')+'</span></p></div>'}

/* ===== ESTADO ===== */
const S={role:'lojista',last:{lojista:'painel',admin:'painel'},sound:false,err:{},ordTab:'novos',ordSeq:1046,entSeq:2031,
 loja:{nome:'Moda Morato',status:'ativa',aberta:true,comissao:15,aprovada:false},
 sel:{},filtro:'todos',busca:'',flash:null,hideProto:false,
 audit:[]};
function audit(ator,acao,alvo){S.audit.unshift({t:Date.now(),a:ator,ac:acao,al:alvo})}
function R(){const p=(location.hash||'#/lojista/painel').replace(/^#\/?/,'').split('/');return {role:p[0]==='admin'?'admin':'lojista',page:p[1]||'painel',arg:p[2]||''}}
function go(path){if(location.hash==='#/'+path)render();else location.hash='#/'+path}
const V={lojista:{},admin:{}};
const NAV={
 lojista:[
  {g:'Dia a dia',i:[['painel','Início','house'],['pedidos','Pedidos','receipt','nPedidos'],['catalogo','Catálogo','package'],['trocas','Trocas','swap','nTrocas']]},
  {g:'Minha loja',i:[['financeiro','Financeiro','wallet'],['loja','Configurações da loja','store']]}],
 admin:[
  {g:'Operação',i:[['painel','Painel geral','chart'],['aprovacao','Aprovação de lojas','shield','nAprov'],['logistica','Logística','truck','nLog'],['disputas','Trocas e disputas','swap','nDisp']]},
  {g:'Dinheiro',i:[['comissoes','Comissões','percent'],['frete','Frete e taxas','tag']]},
  {g:'Conteúdo',i:[['regioes','Regiões atendidas','pin'],['banners','Banners e cupons','mega']]},
  {g:'Sistema',i:[['usuarios','Usuários e perfis','users'],['flags','Feature flags','flag'],['auditoria','Log de auditoria','log']]}]
};
const BN={lojista:['painel','pedidos','catalogo','trocas'],admin:['painel','aprovacao','logistica','disputas']};
function counts(){return {
 nPedidos:S.orders.filter(o=>o.st==='novo').length,
 nTrocas:S.trocas.filter(t=>t.st==='pend').length,
 nAprov:S.ad.fila.filter(l=>l.st==='pend').length,
 nLog:S.ad.ent.filter(e=>e.st==='aguardando').length,
 nDisp:S.ad.disp.filter(d=>d.st==='aberta').length}}

/* ===== RENDER ===== */
function chrome(r){
 const c=counts();const nav=NAV[r.role];const lo=r.role==='lojista';const hd=hdOnce;hdOnce=false;
 const side=nav.map(g=>'<h2>'+g.g+'</h2>'+g.i.map(x=>{const n=x[3]?c[x[3]]:0;return '<a href="#/'+r.role+'/'+x[0]+'" '+(r.page===x[0]?'aria-current="page"':'')+'>'+ic(x[2],22)+'<span>'+x[1]+'</span>'+(n?'<span class="n'+(x[3]==='nLog'?' w':'')+'" aria-label="'+n+' pendentes">'+n+'</span>':'')+'</a>'}).join('')).join('');
 const demo=lo?'<div class="demo"><p class="capb">Atalhos do protótipo</p><p style="margin-bottom:8px">Veja o cadastro de uma loja nova.</p><button type="button" class="btn secondary sm block" data-a="verOnb">Ver cadastro guiado</button></div>':'';
 const first=BN[r.role].map(k=>{const it=nav.flatMap(g=>g.i).find(x=>x[0]===k);const n=it[3]?c[it[3]]:0;return '<a href="#/'+r.role+'/'+k+'" '+(r.page===k?'aria-current="page"':'')+'>'+ic(it[2],24)+'<span>'+it[1].replace('Aprovação de lojas','Lojas').replace('Trocas e disputas','Disputas')+'</span>'+(n?'<span class="n">'+n+'</span>':'')+'</a>'}).join('');
 const more='<button type="button" data-a="more" aria-haspopup="dialog">'+ic('menu',24)+'<span>Mais</span></button>';
 const snd=lo?'<button type="button" class="btn '+(S.sound?'secondary':'ghost')+' sm" data-a="sound" aria-pressed="'+S.sound+'" aria-label="'+(S.sound?'Sons ativados. Tocar para desligar':'Ativar sons de pedido novo')+'">'+ic(S.sound?'sound':'mute',20)+'<span class="hide-m">'+(S.sound?'Sons ativados':'Ativar sons')+'</span></button>':'';
 return (S.hideProto?'':'<div class="proto"><span>Protótipo navegável com dados fictícios. Nada é salvo.</span><button type="button" data-a="hideProto">Dispensar</button></div>')+
 '<header class="top"><a class="logo" href="#/'+r.role+'/painel" aria-label="Webag, início">'+LOGO+'</a>'+
 '<div class="seg" role="group" aria-label="Escolher painel"><button type="button" data-a="role" data-d="lojista" aria-pressed="'+lo+'">'+ic('store',20)+'Lojista</button><button type="button" data-a="role" data-d="admin" aria-pressed="'+!lo+'">'+ic('shield',20)+'Admin</button></div>'+
 '<div class="spacer hd-sl'+(hd?' hdfirst':'')+'" aria-hidden="true">'+SL4+'</div>'+snd+
 '<div class="me"><div class="who hide-m"><span class="b">'+(lo?'Fátima Souza':'Operação Webag')+'</span><small>'+(lo?esc(S.loja.nome):'Super admin')+'</small></div><div class="avatar" aria-hidden="true">'+(lo?'FS':'OW')+'</div></div></header>'+
 '<div class="shell"><nav class="side nav" aria-label="Menu principal">'+side+demo+'<div class="side-sl" aria-hidden="true">'+SL4+'</div></nav><main id="main" tabindex="-1">@@MAIN@@</main></div>'+
 '<nav class="bnav" aria-label="Menu principal">'+first+more+'</nav>';
}
let lastKey='';
function render(top){
 const r=R();S.role=r.role;let page=r.page;
 if(r.role==='lojista'&&S.loja.status!=='ativa'){const free=S.loja.status==='analise'?['cadastro','catalogo','loja']:['cadastro'];if(free.indexOf(page)<0){page='cadastro'}}
 S.page=page;S.arg=r.arg;
 S.last[r.role]=page;
 const fn=V[r.role][page];let body;
 try{body=fn?fn(r.arg):empty('info','Tela fora do ar','Esta área ainda não foi desenhada no protótipo.')}
 catch(e){console.error(e);body=empty('warn','Não conseguimos montar esta tela','Veja o console do navegador. Seus dados de demonstração continuam salvos.','<button class="btn secondary" data-a="go" data-d="'+r.role+'/painel">Voltar ao início</button>')}
 const y=window.scrollY;
 $('#app').innerHTML=chrome(r).replace('@@MAIN@@',function(){return body});
 const key=r.role+'/'+page+'/'+r.arg;
 if(top||key!==lastKey){window.scrollTo(0,0);const h=$('#main h1');if(h&&lastKey)h.focus({preventScroll:true})}else window.scrollTo(0,y);
 if(key!==lastKey){const mn=$('#main');if(mn)mn.classList.add('enter')}
 lastKey=key;
 document.title=(counts().nPedidos&&r.role==='lojista'?'('+counts().nPedidos+') ':'')+'Webag · '+(r.role==='admin'?'Admin':'Lojista');
}
window.addEventListener('hashchange',()=>{S.err={};if(!$('#modal').hidden)closeModal();render(true)});

/* ===== INTERAÇÃO ===== */
const A={};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(!f)return;if(!/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)&&!(el.tagName==='A'&&el.getAttribute('href')))e.preventDefault();f(el.dataset.d,el,e)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();e.target.click()}
 if(e.key==='Tab'&&!$('#modal').hidden){const f=$$('#modal button:not([disabled]),#modal input,#modal select,#modal textarea,#modal a[href]');if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
function onBind(e){const t=e.target;const p=t.dataset&&t.dataset.bind;if(!p)return;
 let v=t.type==='checkbox'?t.checked:t.value;setP(p,v);
 if(S.err[p]){delete S.err[p];const er=$('#e_'+t.id);if(er)er.hidden=true;t.setAttribute('aria-invalid','false')}
 if(t.dataset.re&&e.type==='change')render();
 if(typeof A.calc==='function')A.calc(p);}
document.addEventListener('input',onBind);document.addEventListener('change',onBind);
A.go=d=>go(d);
A.role=d=>go(d+'/'+(S.last[d]||'painel'));

 return pageA('Comissões','Percentual que a Webag retém de cada venda. Vale a regra mais específica: loja, depois categoria, depois o padrão.',btn('Salvar comissões','comSalvar',{i:'check'}))+
 '<div class="dash"><div class="stack16"><section class="card stack16"><h2>Padrão geral</h2><div style="max-width:240px">'+field('ad.com.padrao','Comissão padrão (%)',{mode:'decimal',help:'Vale para toda loja sem regra própria.'})+'</div></section>'+
 '<section class="card pad0"><h2 style="padding:16px 16px 0">Por categoria</h2><div class="tscroll"><table class="tbl rt"><thead><tr><th>Categoria</th><th style="width:180px">Comissão (%)</th></tr></thead><tbody>'+c.cat.map((x,i)=>'<tr><td class="first b">'+x[0]+'</td><td data-l="Comissão (%)">'+field('ad.com.cat.'+i+'.1','Comissão de '+x[0]).replace('<label','<label class="sr"')+'</td></tr>').join('')+'</tbody></table></div></section>'+
 '<section class="card pad0"><h2 style="padding:16px 16px 0">Exceções por loja</h2><p class="help" style="padding:0 16px">Deixe vazio para usar a categoria. Exceção exige um motivo, que vai para a auditoria.</p><div class="tscroll"><table class="tbl rt"><thead><tr><th>Loja</th><th style="width:150px">Comissão (%)</th><th>Motivo</th><th class="num">Vale</th></tr></thead><tbody>'+c.lojas.map((l,i)=>'<tr><td class="first"><p class="b">'+l.n+'</p><p class="cap mut">'+l.cat+'</p></td><td data-l="Comissão (%)">'+field('ad.com.lojas.'+i+'.v','Comissão de '+l.n,{ph:'Usar categoria'}).replace('<label','<label class="sr"')+'</td><td data-l="Motivo">'+field('ad.com.lojas.'+i+'.motivo','Motivo da exceção de '+l.n,{ph:'Obrigatório se houver exceção'}).replace('<label','<label class="sr"')+'</td><td data-l="Vale" class="num b" id="ef'+i+'">'+comEf(l).toString().replace('.',',')+'%</td></tr>').join('')+'</tbody></table></div></section></div>'+

function simHtml(){const l=S.ad.com.lojas.find(x=>x.n===S.ad.simL)||S.ad.com.lojas[0];const p=num(S.ad.simP),pc=comEf(l),w=r2(p*pc/100);

const _c2=A.calc;A.calc=function(p){if(p&&p.indexOf('ad.sim')===0){const e=$('#sim');if(e)e.innerHTML=simHtml();return}

 if(t==='usuarios')b='<div class="card pad0 tscroll"><table class="tbl rt"><thead><tr><th>Pessoa</th><th>Perfil</th><th>2º fator</th><th>Último acesso</th><th>Acesso</th></tr></thead><tbody>'+S.ad.usr.map((u,i)=>'<tr><td class="first"><p class="b">'+u.n+'</p><p class="cap mut">'+u.e+'</p></td><td data-l="Perfil">'+tag('brand','user',u.p)+'</td><td data-l="2º fator">'+(u.f?tag('ok','shield','Ativo'):tag('warn','warn','Pendente'))+'</td><td data-l="Último acesso">'+u.u+'</td><td data-l="Acesso"><div class="swrow">'+sw(u.on,'usSw',i,'Acesso de '+u.n)+'<span class="cap">'+(u.on?'Ativo':'Bloqueado')+'</span></div></td></tr>').join('')+'</tbody></table></div>';
 else{const P=['Super admin','Operação','Logística','Financeiro','Suporte'];const M=[['Aprovar lojas',[1,1,0,0,0]],['Ver documentos das lojas',[1,1,0,0,0]],['Logística e motoboys',[1,1,1,0,0]],['Decidir disputas e estornos',[1,1,0,1,0]],['Comissões, frete e taxas',[1,0,0,1,0]],['Banners e cupons',[1,1,0,0,0]],['Usuários e perfis',[1,0,0,0,0]],['Feature flags',[1,0,0,0,0]],['Ver log de auditoria',[1,0,0,1,1]]];
  b='<div class="card pad0 tscroll"><table class="tbl"><caption class="sr">Permissões por perfil</caption><thead><tr><th>Permissão</th>'+P.map(p=>'<th style="text-align:center">'+p+'</th>').join('')+'</tr></thead><tbody>'+M.map(m=>'<tr><td class="b">'+m[0]+'</td>'+m[1].map((v,i)=>'<td style="text-align:center">'+(v?'<span class="ok-t">'+ic('check',20)+'</span><span class="sr">Pode</span>':'<span class="mut">'+ic('minus',20)+'</span><span class="sr">Não pode</span>')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="help" style="margin-top:12px">Todo perfil usa senha mais código do aplicativo autenticador (2º fator).</p>'}
 return pageA('Usuários e perfis','Quem acessa o painel e o que cada pessoa pode fazer.',t==='usuarios'?btn('Convidar pessoa','usNovo',{i:'plus'}):'')+tabs([['usuarios','Usuários',S.ad.usr.length],['perfis','Perfis e permissões']],t,'usTab')+'<div role="tabpanel">'+b+'</div>'};
A.usSw=i=>{const u=S.ad.usr[+i];if(i==0){toast('Você não pode bloquear o seu próprio acesso.',{icon:'lock'});return}u.on=!u.on;audit('Operação Webag',u.on?'Desbloqueou usuário':'Bloqueou usuário',u.n);toast(u.n+(u.on?' desbloqueado.':' bloqueado. As sessões dele foram encerradas.'));render()};
A.usNovo=()=>{S.ad.nu={e:'',p:'Operação'};S.err={};modal('<h2>Convidar pessoa</h2><div class="stack16">'+field('ad.nu.e','E-mail',{type:'email',mode:'email',ph:'nome@webag.example'})+field('ad.nu.p','Perfil',{sel:['Operação','Logística','Financeiro','Suporte','Super admin']})+'<p class="help">O convite vale por 48 horas e exige a configuração do 2º fator no primeiro acesso.</p></div><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn('Enviar convite','usOk')+'</div>',{label:'Convidar pessoa'})};
A.usOk=()=>{const u=S.ad.nu;if(!/^\S+@\S+\.\S+$/.test(u.e))return errModal('ad.nu.e','Digite um e-mail válido, como nome@webag.example.');S.ad.usr.push({n:u.e.split('@')[0],e:u.e,p:u.p,f:false,u:'convite enviado',on:true});audit('Operação Webag','Convidou usuário',u.e+' · '+u.p);closeModal();toast('Convite enviado para '+esc(u.e)+'.');render()};

/* ===== ADMIN: FEATURE FLAGS ===== */
V.admin.flags=function(){return pageA('Feature flags','Liga e desliga recursos sem publicar uma versão nova do app.')+
 note('warn','warn','<p class="b">Cuidado com Produção.</p><p>Mudar uma flag de Produção afeta clientes reais na hora. Pedimos confirmação.</p>')+'<div style="height:16px"></div>'+
 '<div class="card pad0"><ul>'+S.ad.flags.map((f,i)=>'<li class="row sb" style="padding:12px 16px;border-bottom:1px solid var(--wb-color-neutral-200);flex-wrap:nowrap"><div><p class="b" style="font-family:ui-monospace,Menlo,monospace;font-size:15px">'+f.k+'</p><p class="cap mut">'+f.d+' · alterada em '+f.t+'</p></div><div class="row" style="flex-wrap:nowrap">'+tag(f.env==='Produção'?'warn':'neu',f.env==='Produção'?'warn':'',f.env)+'<div class="swrow">'+sw(f.on,'flagSw',i,f.k)+'<span class="cap" style="width:68px">'+(f.on?'Ligada':'Desligada')+'</span></div></div></li>').join('')+'</ul></div>'};
A.flagSw=i=>{const f=S.ad.flags[+i];if(f.env==='Produção'){modal('<h2>'+(f.on?'Desligar':'Ligar')+' "'+f.k+'" em Produção?</h2><p class="mut">'+f.d+'. A mudança vale na hora para todos os clientes.</p><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn(f.on?'Desligar flag':'Ligar flag','flagOk',{d:i,k:f.on?'dangerfill':'primary'})+'</div>',{label:'Confirmar flag'});return}A.flagOk(i)};
A.flagOk=i=>{const f=S.ad.flags[+i];f.on=!f.on;f.t='hoje';audit('Operação Webag',f.on?'Ligou feature flag':'Desligou feature flag',f.k+' ('+f.env+')');closeModal();toast(f.k+(f.on?' ligada.':' desligada.'));render()};

/* ===== ADMIN: LOG DE AUDITORIA ===== */
V.admin.auditoria=function(){const a=S.ad;const atores=['Todos'].concat(Array.from(new Set(S.audit.map(x=>x.a))));
 return pageA('Log de auditoria','Tudo o que muda dinheiro, acesso ou dado de loja fica registrado. Ninguém edita este log.',btn('Exportar CSV','toast1',{d:'auditoria.csv exportado e registrado.',k:'secondary',i:'download'}))+
 '<div class="row" style="margin-bottom:12px"><div class="pre" style="flex:1;min-width:220px"><span aria-hidden="true">'+ic('search',20)+'</span><input class="inp" data-bind="ad.audBusca" type="search" placeholder="Buscar ação ou alvo" aria-label="Buscar no log" value="'+esc(a.audBusca)+'"></div><div style="min-width:200px"><select class="inp" data-bind="ad.audFiltro" aria-label="Filtrar por quem fez" data-re="1">'+atores.map(x=>'<option'+(x===a.audFiltro?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+
 '<div class="card pad0 tscroll"><table class="tbl rt"><thead><tr><th>Quando</th><th>Quem</th><th>O que fez</th><th>Alvo</th></tr></thead><tbody id="aud-body">'+audRows()+'</tbody></table></div><p class="help" style="margin-top:12px">Dica: aprove uma loja, atribua um motoboy ou decida uma disputa e volte aqui. A ação aparece no topo.</p>'};
function audRows(){const a=S.ad,q=a.audBusca.toLowerCase();const L=S.audit.filter(x=>(a.audFiltro==='Todos'||x.a===a.audFiltro)&&(!q||(x.ac+' '+x.al).toLowerCase().indexOf(q)>=0));
 return L.length?L.map(x=>'<tr><td class="first nowrap">'+fdt(x.t)+'</td><td data-l="Quem">'+esc(x.a)+'</td><td data-l="O que fez" class="b">'+esc(x.ac)+'</td><td data-l="Alvo">'+esc(x.al)+'</td></tr>').join(''):'<tr><td colspan="4">'+empty('search','Nada neste filtro','Tente outra palavra ou escolha "Todos".')+'</td></tr>'}
const _c3=A.calc;A.calc=function(p){if(p==='ad.audBusca'){const b=$('#aud-body');if(b)b.innerHTML=audRows();return}return _c3(p)};
</script>
