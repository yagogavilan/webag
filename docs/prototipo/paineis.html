:root{color-scheme:light;

--wb-color-success:#1B6E3C;--wb-color-success-subtle:#E5F4EA;--wb-color-success-border:#9ED1AE;

--wb-color-danger:#B3261E;--wb-color-danger-subtle:#FCEAE8;--wb-color-danger-border:#E8A29D;--wb-color-danger-pressed:#8C1D18;

--wb-font-family-display:"Fredoka","Figtree",ui-rounded,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
--wb-radius-sm:4px;--wb-radius-md:8px;--wb-radius-lg:16px;--wb-radius-xl:24px;--wb-radius-2xl:32px;--wb-radius-full:999px;

}
@media (prefers-reduced-motion:reduce){:root{--wb-motion-fast:0ms;--wb-motion-base:0ms}.pulse{animation:none!important}.spin{animation:none!important}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--wb-font-family-web);font-size:16px;line-height:24px;color:var(--wb-color-neutral-900);background:var(--wb-color-neutral-50);font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wb-color-brand-600);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 16px;border-radius:8px;z-index:100;border:2px solid var(--wb-color-brand-600)}.skip:focus{top:8px}
.ic{flex:none;vertical-align:middle}
a{color:var(--wb-color-brand-700)}
/* tipografia */
.t-num{font-size:40px;line-height:48px;font-weight:700}
.t-disp{font-size:32px;line-height:40px;font-weight:700}
.t1{font-size:24px;line-height:32px;font-weight:700}
.t2{font-size:20px;line-height:28px;font-weight:600}
.cap{font-size:14px;line-height:20px}.capb{font-size:14px;line-height:20px;font-weight:600}
.mut{color:var(--wb-color-neutral-600)}.b{font-weight:600}.bb{font-weight:700}
.ok-t{color:var(--wb-color-success)}.bad-t{color:var(--wb-color-danger)}.warn-t{color:var(--wb-color-warning)}.brand-t{color:var(--wb-color-brand-700)}
.strike{text-decoration:line-through;color:var(--wb-color-neutral-600)}
.right{text-align:right}.nowrap{white-space:nowrap}
/* estrutura */
.proto{background:var(--wb-color-neutral-900);color:#fff;font-size:14px;line-height:20px;padding:6px 16px;display:flex;gap:12px;align-items:center;justify-content:center;text-align:center}
.proto button{background:none;border:0;color:var(--wb-color-inverse-action);text-decoration:underline;min-height:32px;padding:0 4px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--wb-color-neutral-200);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--wb-color-brand-600);text-decoration:none}
.seg{display:inline-flex;background:var(--wb-color-neutral-100);border-radius:8px;padding:4px;gap:4px}
.seg button{border:1px solid transparent;background:none;border-radius:6px;min-height:40px;padding:0 16px;font-weight:600;color:var(--wb-color-neutral-700);display:inline-flex;align-items:center;gap:8px;transition:background var(--wb-motion-fast) var(--wb-ease)}
.seg button[aria-pressed=true]{background:#fff;border-color:var(--wb-color-neutral-300);color:var(--wb-color-brand-700)}
.spacer{flex:1}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--wb-color-neutral-100);display:grid;place-items:center;font-weight:700;color:var(--wb-color-neutral-700);font-size:14px;border:1px solid var(--wb-color-neutral-200)}
.who{line-height:18px;text-align:right}.who small{display:block;color:var(--wb-color-neutral-600);font-size:12px}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 100px)}
.side{position:sticky;top:56px;width:248px;flex:none;height:calc(100vh - 56px);overflow:auto;padding:16px 12px;background:#fff;border-right:1px solid var(--wb-color-neutral-200)}
.side h2{font-size:12px;line-height:16px;font-weight:600;color:var(--wb-color-neutral-600);padding:16px 12px 4px;letter-spacing:.02em}
.side h2:first-child{padding-top:0}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--wb-color-neutral-700);font-weight:500;border:0;background:none;text-align:left;transition:background var(--wb-motion-fast) var(--wb-ease)}
.nav a:hover,.nav button:hover{background:var(--wb-color-neutral-100)}
.nav a[aria-current=page]{background:var(--wb-color-brand-50);color:var(--wb-color-brand-700);font-weight:600;box-shadow:inset 3px 0 0 var(--wb-color-brand-600)}
.nav .n{margin-left:auto;background:var(--wb-color-brand-600);color:#fff;border-radius:999px;font-size:12px;line-height:16px;font-weight:700;min-width:22px;text-align:center;padding:2px 6px}
.nav .n.w{background:var(--wb-color-warning)}
.side .demo{margin:16px 4px 0;padding:12px;border:1px dashed var(--wb-color-neutral-400);border-radius:8px;font-size:14px;line-height:20px;color:var(--wb-color-neutral-600)}
main{flex:1;min-width:0;padding:24px 32px 64px;max-width:1240px;margin:0 auto;outline:none}
.bnav{display:none}
@media (max-width:900px){
 .side{display:none}
 main{padding:16px 16px 96px}

.top .btn.ghost:hover,.top .btn.secondary:hover{background:var(--wb-color-brand-50)}
.me{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:4px 4px 4px 16px}
.avatar{background:var(--wb-color-brand-100);border:0;color:var(--wb-color-brand-800);font-family:var(--wb-font-family-display);font-weight:600}
/* barra lateral: ameixa profunda, item ativo em pílula clara, contador em sol */
.side{top:72px;height:calc(100vh - 72px);background:var(--wb-color-brand-800);border-right:0;border-radius:0 24px 0 0;padding:20px 12px 16px;display:flex;flex-direction:column}
.side h2{color:var(--wb-color-brand-200)}
.side.nav a,.side.nav button{color:#fff;border-radius:999px;font-weight:600;min-height:46px;transition:background var(--wb-motion-fast) var(--wb-ease),color var(--wb-motion-fast) var(--wb-ease)}
.side.nav a:hover,.side.nav button:hover{background:rgba(255,255,255,.14)}
.side.nav a[aria-current=page]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800);box-shadow:none}
.side .n{background:var(--wb-accent);color:var(--wb-on-accent)}
.side .n.w{background:#fff;color:var(--wb-color-warning)}
.side .demo{border:1px dashed rgba(255,255,255,.55);border-radius:16px;color:var(--wb-color-brand-100)}
.side .demo .capb{color:#fff}
.side-sl{margin-top:auto;padding:24px 8px 0}
.side-sl .sl{width:88px}
.side-sl .ln{fill-opacity:.2}
.sticky{top:88px}
/* faixa de destaque (início, painel geral, celebrações) */
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--wb-color-brand-500);color:#fff;border-radius:24px 24px 24px 6px;padding:28px 28px 28px 148px;margin-bottom:20px;min-height:132px}
.hero-sl{position:absolute;left:0;top:50%;transform:translateY(-50%);width:120px;z-index:-1;pointer-events:none}
.hero-sl .sl{width:100%}
.enter .hero .ln{animation:slin 600ms var(--wb-ease-enter) backwards}
.hero-body{display:grid;gap:10px;justify-items:start;min-width:0}
.hero-t{font-family:var(--wb-font-family-display);font-size:40px;line-height:48px;font-weight:700;color:#fff;margin:0}
.hchip{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border-radius:999px;background:#fff;color:var(--wb-color-brand-800);font-size:14px;line-height:20px;font-weight:600}
.hero-act .swrow{background:#fff;color:var(--wb-color-neutral-900);border-radius:999px;padding:2px 8px 2px 18px}
.hero .tabs{background:#fff;border:0;border-radius:999px;padding:4px;gap:4px;margin:0;overflow:visible}
.hero .tabs button{border-radius:999px;min-height:44px;border:0;padding:0 18px;color:var(--wb-color-neutral-700)}
.hero .tabs [aria-selected=true]{background:var(--wb-color-brand-600);color:#fff}
.hero .tabs [aria-selected=true] .c{background:#fff;color:var(--wb-color-brand-800)}
.celeb-ck{display:block;width:56px;height:56px;animation:pop 400ms var(--wb-ease-enter) 300ms backwards}
.celeb-ck .ck{stroke-dasharray:40;animation:draw 450ms var(--wb-ease) 450ms backwards}
.celeb .hero-sl .ln{animation:slin 600ms var(--wb-ease-enter) backwards}
.celeb-sub{color:var(--wb-color-neutral-600);margin:-4px 0 20px}
/* cartões: formas variadas (cantos 24 com um canto 6, como a alça da sacola) e tiles pastel só em KPI */
.card{border-radius:16px}
.card.sunk{border-radius:16px 16px 16px 6px}
a.card{transition:transform var(--wb-motion-fast) var(--wb-ease),box-shadow var(--wb-motion-fast) var(--wb-ease)}
a.card:hover{transform:translateY(-2px);box-shadow:var(--wb-shadow-md)}
.kt{border-color:transparent}
.kt1{background:var(--wb-color-tile-1);border-radius:24px 24px 24px 6px}
.kt2{background:var(--wb-color-tile-2);border-radius:24px 6px 24px 24px}
.kt3{background:var(--wb-color-tile-3);border-radius:6px 24px 24px 24px}
.kt4{background:var(--wb-color-tile-4);border-radius:24px 24px 6px 24px}
.kt5{background:var(--wb-color-tile-5);border-radius:24px 6px 24px 24px}
.kt1 .ic{color:var(--wb-color-tile-ink-1)}.kt2 .ic{color:var(--wb-color-tile-ink-2)}.kt3 .ic{color:var(--wb-color-tile-ink-3)}.kt4 .ic{color:var(--wb-color-tile-ink-4)}
.kt .bar{background:rgba(255,255,255,.75)}
.rank{display:flex;align-items:center;gap:14px}
.rk{font-family:var(--wb-font-family-display);font-weight:700;font-size:40px;line-height:40px;color:var(--wb-color-brand-500);min-width:30px;text-align:center}
.rk-b{flex:1;min-width:0}
/* controles em pílula; campos em 12 */
.btn{border-radius:999px;transition:background var(--wb-motion-fast) var(--wb-ease),border-color var(--wb-motion-fast) var(--wb-ease),color var(--wb-motion-fast) var(--wb-ease),transform var(--wb-motion-fast) var(--wb-ease)}
.btn:active{transform:scale(.97)}
.tag{border-radius:999px;padding:2px 10px}
.t-brand{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.inp,.radio,.thumb,.ph{border-radius:12px}
.inp{transition:border-color var(--wb-motion-fast) var(--wb-ease)}
.chip{transition:background var(--wb-motion-fast) var(--wb-ease),border-color var(--wb-motion-fast) var(--wb-ease)}
.chip[aria-pressed=true]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.step{border-radius:999px}
.sw::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.note,.ord,.cdbox,.recebe,.drop,.bulk,.toast{border-radius:16px}
.ord.novo{border-radius:24px 24px 24px 8px}
.tabs{border-bottom:0;gap:8px;padding-bottom:4px}
.tabs button{border-bottom:0;border-radius:999px;min-height:44px;transition:background var(--wb-motion-fast) var(--wb-ease)}
.tabs button:hover{background:var(--wb-color-neutral-100)}
.tabs button[aria-selected=true]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800)}
.hero .tabs button:hover{background:var(--wb-color-brand-50)}
.hero .tabs button[aria-selected=true]:hover{background:var(--wb-color-brand-600)}
.chart .col i{border-radius:8px 8px 0 0}
.nav a,.nav button{transition:background var(--wb-motion-fast) var(--wb-ease)}
.tbl tr.click td{transition:background var(--wb-motion-fast) var(--wb-ease)}
.skel{background:var(--wb-color-neutral-200);animation:skp 1.2s ease-in-out infinite}
/* estados vazios: sacola com linhas de velocidade */
.empty{padding:32px 16px 40px}
.empty .ill{display:block;width:200px;max-width:70%;height:auto;margin:0 auto 12px}
.empty h2{font-family:var(--wb-font-family-display);font-size:24px;line-height:32px;font-weight:600}
.ill .ln{fill:var(--wb-color-brand-200);fill-opacity:1;animation:slin 600ms var(--wb-ease-enter) backwards}
.ill .bag{animation:settle 400ms var(--wb-ease-enter) 200ms backwards}
/* entrada de tela: sobe 16px e aparece; escalonada nos 6 primeiros blocos */
.enter>*{animation:enter var(--wb-motion-base) var(--wb-ease-enter) backwards}
.enter>*:nth-child(2){animation-delay:40ms}.enter>*:nth-child(3){animation-delay:80ms}.enter>*:nth-child(4){animation-delay:120ms}.enter>*:nth-child(5){animation-delay:160ms}.enter>*:nth-child(6){animation-delay:200ms}
.enter>*:nth-child(n+7){animation:none}
/* celebração em toast (pedido aceito, loja aprovada, corrida atribuída) */
.toast.cel{position:relative;overflow:hidden;background:var(--wb-color-brand-800);min-height:60px;padding:10px 16px 10px 44px}
.toast.cel .sl{position:absolute;left:-6px;top:50%;width:60px;transform:translateY(-50%)}
.toast.cel .sl .ln{animation:slin 500ms var(--wb-ease-enter) backwards}
.toast.cel .cb{position:relative;z-index:1;flex:none;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--wb-color-brand-800);display:grid;place-items:center;animation:pop 400ms var(--wb-ease-enter) 120ms backwards}
.toast.cel>span:not(.cb){position:relative;z-index:1;font-weight:600}
/* mobile: alvos de 44px, cabeçalho compacto com o símbolo */
@media (max-width:900px){
 .top{height:64px;padding:0 14px;border-radius:0 0 20px 20px}
 .logo .lg-full{display:none}.logo .lg-sym{display:block}
 .hd-sl .sl{display:none}
 .me{padding:4px}
 .bnav{border-radius:20px 20px 0 0}
 .bnav a,.bnav button{margin:6px 4px;border-radius:16px}
 .bnav [aria-current=page]{background:var(--wb-color-brand-100);color:var(--wb-color-brand-800);box-shadow:none}
 .bnav .n{background:var(--wb-accent);color:var(--wb-on-accent);border:1px solid var(--wb-color-brand-800)}
 .sticky{top:80px}
 .btn.sm,.chip{min-height:44px}
 .step button{width:44px;height:44px}.step input{height:44px}
 .ph .x{width:44px;height:44px}
 .proto button{min-height:44px}
}
@media (max-width:700px){
 .hero{padding:20px;border-radius:24px 24px 24px 6px}
 .hero-sl{display:none}
 .hero-t,.phead h1{font-size:32px;line-height:40px}
}
@media (max-width:520px){.me{display:none}.seg button{padding:0 14px}}
/* movimento reduzido: troca direta, sem deslocamento */
@media (prefers-reduced-motion:reduce){
 .enter>*,.ln,.ill .bag,.celeb-ck,.celeb-ck .ck,.cb,.toast,.dlg,.skel,.ord.flash{animation:none!important}
 .btn,.btn:active,.seg button,.seg button:active,a.card,a.card:hover,.chip,.tabs button,.nav a,.inp{transition:none!important;transform:none!important}
}
</style>

 '<section class="card stack16"><h2>Regras de pedido</h2>'+field('ad.minimo','Pedido mínimo',{pre:'R$',mode:'decimal',help:'Abaixo disso, o cliente vê "Faltam R$ X para o pedido mínimo".'})+field('ad.gratisAcima','Frete grátis acima de',{pre:'R$',mode:'decimal',help:'A Webag absorve o frete nessas compras.'})+'</section></div>'};

A.freteAdd=()=>{S.ad.frete.push({reg:'Nova região',faixa:'Até 5 km',cobra:'9,90',custo:'8,00'});render()};
A.freteSalvar=()=>{const e={};S.ad.frete.forEach((f,i)=>{if(!(num(f.cobra)>=0)||String(f.cobra).trim()==='')e['ad.frete.'+i+'.cobra']='Informe o valor. Use 0 para frete grátis.';if(String(f.custo).trim()==='')e['ad.frete.'+i+'.custo']='Informe o custo.'});S.err=e;
 if(Object.keys(e).length){render();const f=$('[aria-invalid="true"]');if(f)f.focus();toast('Corrija os campos marcados.',{icon:'warn'});return}
 audit('Operação Webag','Salvou tabela de frete e taxas','');toast('Tabela de frete e taxas salva. Vale para novos pedidos.')};

/* ===== ADMIN: REGIÕES ===== */
V.admin.regioes=function(){const R=S.ad.reg;const esp=R.reduce((s,r)=>s+r.espera,0);
 return pageA('Regiões atendidas','Onde a Webag entrega hoje e onde há gente esperando.',btn('Nova região','regNova',{i:'plus'}))+
 (esp?note('brand','pin','<p><b>'+esp+' pessoas pediram aviso quando chegarmos</b> em regiões fora da área. Ativar uma região avisa todas elas.</p>')+'<div style="height:16px"></div>':'')+
 '<div class="card pad0 tscroll"><table class="tbl rt"><thead><tr><th>Região</th><th class="num">Lojas ativas</th><th class="num">Pedidos na semana</th><th class="num">Lista de espera</th><th>Atendida</th></tr></thead><tbody>'+R.map((r,i)=>'<tr><td class="first"><p class="b">'+r.n+'</p><p class="cap mut">'+r.sub+'</p></td><td data-l="Lojas ativas" class="num">'+r.lojas+'</td><td data-l="Pedidos na semana" class="num">'+r.ped+'</td><td data-l="Lista de espera" class="num">'+(r.espera?'<b>'+r.espera+'</b>':'—')+'</td><td data-l="Atendida"><div class="swrow">'+sw(r.on,'regSw',i,'Atender '+r.n)+'<span class="cap">'+(r.on?'Atendida':'Fora da área')+'</span></div></td></tr>').join('')+'</tbody></table></div><p class="help" style="margin-top:12px">Região sem loja ativa mostra "Ainda não entregamos aqui" ao cliente e oferece o aviso.</p>'};
A.regSw=i=>{const r=S.ad.reg[+i];if(!r.on&&r.lojas===0){modal('<h2>Ativar '+r.n+'?</h2><p class="mut">Ainda não há loja ativa em '+r.n+'. Os clientes veriam uma lista vazia. '+(r.espera?'As '+r.espera+' pessoas na lista de espera serão avisadas.':'')+'</p><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn('Ativar região','regOk',{d:i})+'</div>',{label:'Ativar região'});return}
 r.on=!r.on;audit('Operação Webag',r.on?'Ativou região':'Desativou região',r.n);toast(r.n+(r.on?' ativada.':' desativada. Pedidos novos não são aceitos lá.'));render()};
A.regOk=i=>{const r=S.ad.reg[+i];r.on=true;audit('Operação Webag','Ativou região',r.n);closeModal();toast(r.n+' ativada. '+r.espera+' pessoas serão avisadas.',{icon:'bell'});r.espera=0;render()};
A.regNova=()=>{S.ad.nr={n:'',sub:''};S.err={};modal('<h2>Nova região</h2><div class="stack16">'+field('ad.nr.n','Cidade ou bairro')+field('ad.nr.sub','Descrição',{ph:'Ex.: Centro e Vila Nova'})+'</div><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn('Adicionar região','regAdd')+'</div>',{label:'Nova região'})};
A.regAdd=()=>{const n=S.ad.nr;if(n.n.trim().length<3){const el=$('[data-bind="ad.nr.n"]');el.setAttribute('aria-invalid','true');const er=$('#e_'+el.id);er.hidden=false;$('span',er).textContent='Informe o nome da região.';el.focus();return}S.ad.reg.push({n:n.n.trim(),sub:n.sub||'Sem descrição',on:false,lojas:0,ped:0,espera:0});audit('Operação Webag','Criou região',n.n);closeModal();toast(esc(n.n)+' adicionada, ainda inativa.');render()};

/* ===== ADMIN: BANNERS E CUPONS ===== */
A.bnTab=d=>{S.ad.tabBn=d;render()};
V.admin.banners=function(){const t=S.ad.tabBn;let b='';
 if(t==='banners')b='<div class="row sb" style="margin-bottom:12px"><p class="mut">Aparecem no topo da Home do app, na ordem abaixo. Imagem 2:1, 1200 x 600.</p>'+btn('Novo banner','bnNovo',{i:'plus'})+'</div><div class="g2">'+S.ad.ban.map(x=>'<article class="card pad0"><div style="aspect-ratio:2/1;background:var(--wb-color-neutral-700);display:flex;align-items:flex-end;padding:16px;position:relative"><div style="position:absolute;top:12px;right:12px;color:var(--wb-color-neutral-400)">'+ic('image',28)+'</div><p class="t2" style="color:#fff">'+esc(x.t)+'</p></div><div style="padding:12px 16px"><div class="row sb"><div><p class="b">'+esc(x.t)+'</p><p class="cap mut">'+x.reg+' · até '+x.ate+' · '+x.cl+' toques</p></div><div class="swrow">'+sw(x.on,'bnSw',x.id,'Banner '+x.t+' no ar')+'<span class="cap">'+(x.on?'No ar':'Pausado')+'</span></div></div></div></article>').join('')+'</div>';
 else b='<div class="row sb" style="margin-bottom:12px"><p class="mut">O desconto do cupom da plataforma é pago pela Webag e nunca passa do valor da comissão do pedido.</p>'+btn('Novo cupom','cpNovo',{i:'plus'})+'</div><div class="card pad0 tscroll"><table class="tbl rt"><thead><tr><th>Código</th><th>Desconto</th><th class="num">Pedido mínimo</th><th class="num">Usos</th><th>Validade</th><th>Situação</th></tr></thead><tbody>'+S.ad.cup.map((c,i)=>'<tr><td class="first b" style="font-family:ui-monospace,Menlo,monospace">'+c.c+'</td><td data-l="Desconto">'+(c.tipo==='R$'?brl(c.v):c.v+'%')+'</td><td data-l="Pedido mínimo" class="num">'+(c.min?brl(c.min):'Sem mínimo')+'</td><td data-l="Usos" class="num">'+c.usos+' de '+c.max+'</td><td data-l="Validade">até '+c.ate+'</td><td data-l="Situação"><div class="swrow">'+sw(c.on,'cpSw',i,'Cupom '+c.c+' ativo')+'<span class="cap">'+(c.on?'Ativo':'Desligado')+'</span></div></td></tr>').join('')+'</tbody></table></div>';
 return pageA('Banners e cupons','Vitrine e promoções da plataforma.')+tabs([['banners','Banners',S.ad.ban.length],['cupons','Cupons',S.ad.cup.length]],t,'bnTab')+'<div role="tabpanel">'+b+'</div>'};
A.bnSw=id=>{const x=S.ad.ban.find(b=>b.id==id);x.on=!x.on;audit('Operação Webag',x.on?'Publicou banner':'Pausou banner',x.t);toast('Banner "'+esc(x.t)+'"'+(x.on?' no ar.':' pausado.'));render()};
A.cpSw=i=>{const c=S.ad.cup[+i];c.on=!c.on;audit('Operação Webag',c.on?'Ativou cupom':'Desligou cupom',c.c);toast('Cupom '+c.c+(c.on?' ativo.':' desligado.'));render()};
A.bnNovo=()=>{S.ad.nb={t:'',reg:'Todas as regiões',ate:'2026-12-31'};S.err={};modal('<h2>Novo banner</h2><div class="stack16">'+field('ad.nb.t','Título (até 6 palavras)',{help:'Texto curto sobre a imagem. Sem promessa de prazo ou desconto que a Webag não controla.'})+field('ad.nb.reg','Região',{sel:['Todas as regiões','Francisco Morato','Franco da Rocha','Caieiras','Cajamar']})+field('ad.nb.ate','No ar até',{type:'date'})+'<div class="ph" style="aspect-ratio:2/1">'+ic('upload',28)+'<span>Imagem 2:1 (1200 x 600): arraste ou escolha</span></div></div><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn('Publicar banner','bnOk')+'</div>',{label:'Novo banner'})};
function errModal(k,msg){const el=$('[data-bind="'+k+'"]');if(!el)return;el.setAttribute('aria-invalid','true');const er=$('#e_'+el.id);if(er){er.hidden=false;$('span',er).textContent=msg}el.focus()}
A.bnOk=()=>{const b=S.ad.nb;const w=b.t.trim().split(/\s+/).filter(Boolean).length;if(!w)return errModal('ad.nb.t','Escreva o título do banner.');if(w>6)return errModal('ad.nb.t','Use até 6 palavras. Agora tem '+w+'.');
 S.ad.ban.unshift({id:Date.now(),t:b.t.trim(),reg:b.reg,ate:b.ate.split('-').reverse().slice(0,2).join('/'),on:true,cl:0});audit('Operação Webag','Criou banner',b.t);closeModal();toast('Banner publicado.');render()};
A.cpNovo=()=>{S.ad.nc={c:'',tipo:'R$',v:'',min:'',max:'500',ate:'2026-12-31'};S.err={};modal('<h2>Novo cupom</h2><div class="stack16">'+field('ad.nc.c','Código',{ph:'EX: NATAL10',help:'Sem espaços. O cliente digita no checkout.'})+'<div class="g2">'+field('ad.nc.tipo','Tipo',{sel:['R$','%']})+field('ad.nc.v','Valor do desconto',{mode:'decimal'})+'</div><div class="g2">'+field('ad.nc.min','Pedido mínimo',{pre:'R$',mode:'decimal',ph:'0,00'})+field('ad.nc.max','Limite de usos',{mode:'numeric'})+'</div>'+field('ad.nc.ate','Vale até',{type:'date'})+note('info','info','<p>Na hora do pedido, o desconto é limitado ao valor da comissão. O que passar disso não é aplicado.</p>')+'</div><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn('Criar cupom','cpOk')+'</div>',{label:'Novo cupom'})};
A.cpOk=()=>{const c=S.ad.nc;const code=c.c.trim().toUpperCase();if(!/^[A-Z0-9]{4,16}$/.test(code))return errModal('ad.nc.c','Use de 4 a 16 letras ou números, sem espaços.');
 if(S.ad.cup.some(x=>x.c===code))return errModal('ad.nc.c','Já existe um cupom com esse código.');if(!(num(c.v)>0))return errModal('ad.nc.v','Informe o valor do desconto.');
 S.ad.cup.unshift({c:code,tipo:c.tipo,v:num(c.v),min:num(c.min),usos:0,max:parseInt(c.max,10)||0,ate:c.ate.split('-').reverse().slice(0,2).join('/'),on:true});audit('Operação Webag','Criou cupom',code);closeModal();toast('Cupom '+code+' criado.');S.ad.tabBn='cupons';render()};

/* ===== ADMIN: USUÁRIOS E PERFIS ===== */
A.usTab=d=>{S.ad.tabUs=d;render()};
V.admin.usuarios=function(){const t=S.ad.tabUs;let b='';
 if(t==='usuarios')b='<div class="card pad0 tscroll"><table class="tbl rt"><thead><tr><th>Pessoa</th><th>Perfil</th><th>2º fator</th><th>Último acesso</th><th>Acesso</th></tr></thead><tbody>'+S.ad.usr.map((u,i)=>'<tr><td class="first"><p class="b">'+u.n+'</p><p class="cap mut">'+u.e+'</p></td><td data-l="Perfil">'+tag('brand','user',u.p)+'</td><td data-l="2º fator">'+(u.f?tag('ok','shield','Ativo'):tag('warn','warn','Pendente'))+'</td><td data-l="Último acesso">'+u.u+'</td><td data-l="Acesso"><div class="swrow">'+sw(u.on,'usSw',i,'Acesso de '+u.n)+'<span class="cap">'+(u.on?'Ativo':'Bloqueado')+'</span></div></td></tr>').join('')+'</tbody></table></div>';
 else{const P=['Super admin','Operação','Logística','Financeiro','Suporte'];const M=[['Aprovar lojas',[1,1,0,0,0]],['Ver documentos das lojas',[1,1,0,0,0]],['Logística e motoboys',[1,1,1,0,0]],['Decidir disputas e estornos',[1,1,0,1,0]],['Comissões, frete e taxas',[1,0,0,1,0]],['Banners e cupons',[1,1,0,0,0]],['Usuários e perfis',[1,0,0,0,0]],['Feature flags',[1,0,0,0,0]],['Ver log de auditoria',[1,0,0,1,1]]];
  b='<div class="card pad0 tscroll"><table class="tbl"><caption class="sr">Permissões por perfil</caption><thead><tr><th>Permissão</th>'+P.map(p=>'<th style="text-align:center">'+p+'</th>').join('')+'</tr></thead><tbody>'+M.map(m=>'<tr><td class="b">'+m[0]+'</td>'+m[1].map((v,i)=>'<td style="text-align:center">'+(v?'<span class="ok-t">'+ic('check',20)+'</span><span class="sr">Pode</span>':'<span class="mut">'+ic('minus',20)+'</span><span class="sr">Não pode</span>')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="help" style="margin-top:12px">Todo perfil usa senha mais código do aplicativo autenticador (2º fator).</p>'}
 return pageA('Usuários e perfis','Quem acessa o painel e o que cada pessoa pode fazer.',t==='usuarios'?btn('Convidar pessoa','usNovo',{i:'plus'}):'')+tabs([['usuarios','Usuários',S.ad.usr.length],['perfis','Perfis e permissões']],t,'usTab')+'<div role="tabpanel">'+b+'</div>'};
A.usSw=i=>{const u=S.ad.usr[+i];if(i==0){toast('Você não pode bloquear o seu próprio acesso.',{icon:'lock'});return}u.on=!u.on;audit('Operação Webag',u.on?'Desbloqueou usuário':'Bloqueou usuário',u.n);toast(u.n+(u.on?' desbloqueado.':' bloqueado. As sessões dele foram encerradas.'));render()};
A.usNovo=()=>{S.ad.nu={e:'',p:'Operação'};S.err={};modal('<h2>Convidar pessoa</h2><div class="stack16">'+field('ad.nu.e','E-mail',{type:'email',mode:'email',ph:'nome@webag.example'})+field('ad.nu.p','Perfil',{sel:['Operação','Logística','Financeiro','Suporte','Super admin']})+'<p class="help">O convite vale por 48 horas e exige a configuração do 2º fator no primeiro acesso.</p></div><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn('Enviar convite','usOk')+'</div>',{label:'Convidar pessoa'})};
A.usOk=()=>{const u=S.ad.nu;if(!/^\S+@\S+\.\S+$/.test(u.e))return errModal('ad.nu.e','Digite um e-mail válido, como nome@webag.example.');S.ad.usr.push({n:u.e.split('@')[0],e:u.e,p:u.p,f:false,u:'convite enviado',on:true});audit('Operação Webag','Convidou usuário',u.e+' · '+u.p);closeModal();toast('Convite enviado para '+esc(u.e)+'.');render()};

/* ===== ADMIN: FEATURE FLAGS ===== */
V.admin.flags=function(){return pageA('Feature flags','Liga e desliga recursos sem publicar uma versão nova do app.')+
 note('warn','warn','<p class="b">Cuidado com Produção.</p><p>Mudar uma flag de Produção afeta clientes reais na hora. Pedimos confirmação.</p>')+'<div style="height:16px"></div>'+
 '<div class="card pad0"><ul>'+S.ad.flags.map((f,i)=>'<li class="row sb" style="padding:12px 16px;border-bottom:1px solid var(--wb-color-neutral-200);flex-wrap:nowrap"><div><p class="b" style="font-family:ui-monospace,Menlo,monospace;font-size:15px">'+f.k+'</p><p class="cap mut">'+f.d+' · alterada em '+f.t+'</p></div><div class="row" style="flex-wrap:nowrap">'+tag(f.env==='Produção'?'warn':'neu',f.env==='Produção'?'warn':'',f.env)+'<div class="swrow">'+sw(f.on,'flagSw',i,f.k)+'<span class="cap" style="width:68px">'+(f.on?'Ligada':'Desligada')+'</span></div></div></li>').join('')+'</ul></div>'};
A.flagSw=i=>{const f=S.ad.flags[+i];if(f.env==='Produção'){modal('<h2>'+(f.on?'Desligar':'Ligar')+' "'+f.k+'" em Produção?</h2><p class="mut">'+f.d+'. A mudança vale na hora para todos os clientes.</p><div class="acts">'+btn('Cancelar','closeModal',{k:'ghost'})+btn(f.on?'Desligar flag':'Ligar flag','flagOk',{d:i,k:f.on?'dangerfill':'primary'})+'</div>',{label:'Confirmar flag'});return}A.flagOk(i)};
A.flagOk=i=>{const f=S.ad.flags[+i];f.on=!f.on;f.t='hoje';audit('Operação Webag',f.on?'Ligou feature flag':'Desligou feature flag',f.k+' ('+f.env+')');closeModal();toast(f.k+(f.on?' ligada.':' desligada.'));render()};

/* ===== ADMIN: LOG DE AUDITORIA ===== */
V.admin.auditoria=function(){const a=S.ad;const atores=['Todos'].concat(Array.from(new Set(S.audit.map(x=>x.a))));
 return pageA('Log de auditoria','Tudo o que muda dinheiro, acesso ou dado de loja fica registrado. Ninguém edita este log.',btn('Exportar CSV','toast1',{d:'auditoria.csv exportado e registrado.',k:'secondary',i:'download'}))+
 '<div class="row" style="margin-bottom:12px"><div class="pre" style="flex:1;min-width:220px"><span aria-hidden="true">'+ic('search',20)+'</span><input class="inp" data-bind="ad.audBusca" type="search" placeholder="Buscar ação ou alvo" aria-label="Buscar no log" value="'+esc(a.audBusca)+'"></div><div style="min-width:200px"><select class="inp" data-bind="ad.audFiltro" aria-label="Filtrar por quem fez" data-re="1">'+atores.map(x=>'<option'+(x===a.audFiltro?' selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+
 '<div class="card pad0 tscroll"><table class="tbl rt"><thead><tr><th>Quando</th><th>Quem</th><th>O que fez</th><th>Alvo</th></tr></thead><tbody id="aud-body">'+audRows()+'</tbody></table></div><p class="help" style="margin-top:12px">Dica: aprove uma loja, atribua um motoboy ou decida uma disputa e volte aqui. A ação aparece no topo.</p>'};
function audRows(){const a=S.ad,q=a.audBusca.toLowerCase();const L=S.audit.filter(x=>(a.audFiltro==='Todos'||x.a===a.audFiltro)&&(!q||(x.ac+' '+x.al).toLowerCase().indexOf(q)>=0));
 return L.length?L.map(x=>'<tr><td class="first nowrap">'+fdt(x.t)+'</td><td data-l="Quem">'+esc(x.a)+'</td><td data-l="O que fez" class="b">'+esc(x.ac)+'</td><td data-l="Alvo">'+esc(x.al)+'</td></tr>').join(''):'<tr><td colspan="4">'+empty('search','Nada neste filtro','Tente outra palavra ou escolha "Todos".')+'</td></tr>'}
const _c3=A.calc;A.calc=function(p){if(p==='ad.audBusca'){const b=$('#aud-body');if(b)b.innerHTML=audRows();return}return _c3(p)};
</script>
