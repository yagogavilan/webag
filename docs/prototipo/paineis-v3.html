<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webag · Painéis v3 (protótipo)</title>
<!--
  Painéis do lojista e do admin na direção v3 (docs/design/direcao-v3.md; specs: docs/design/telas/onda-7-paineis-v3.md
  e onda-7-navegacao-paineis.md). Mesmas telas e dados de paineis.html, mais: Logística com faixa de chegada, lote por área
  e alerta de atraso (WB-255, 256), Parâmetros de entrega com prévia (WB-258), preparo da loja (WB-257), Avaliações e Equipe.
  Rotas: #/lojista/painel | pedidos | catalogo | catalogo/1 | catalogo/importar | trocas | avaliacoes | financeiro | loja | equipe
         #/admin/painel | logistica | aprovacao | aprovacao/L-8812 | disputas | disputas/D-61 | comissoes | frete | parametros
         | regioes | banners | cupons | usuarios | flags | auditoria (as demais áreas do menu real mostram "fora deste protótipo").
  Parâmetros: ?perfil=dono|func (lojista) e super|operacao|financeiro|suporte (admin) · ?mais=1 abre a folha "Mais" no celular
  · ?estatico=1 sem animação · ?limpo=1 sem a faixa do protótipo · ?lote=1 (Logística com 2 corridas já marcadas para lote)
  · ?aba=<aba> abre a aba (ex.: #/lojista/loja?aba=entrega, #/admin/logistica?aba=andamento).
  Fontes: Bricolage Grotesque 600/700/800 e Figtree 400/600/700/800 entre os marcadores (inject_fonts.py).
-->
<!--WEBAG-FONTS--><!--/WEBAG-FONTS-->
<style>
:root{
 --roxo:#C02EF0;--acao:#A21FBE;--r7:#8618A3;--r8:#6A1580;--r3:#E198EC;
 --noite:#1C1721;--n8:#2C2632;--n7:#443C4C;--n6:#5F566A;--n5:#837A8A;--n4:#B3ABB9;--n3:#D6CFDB;--n2:#E8E3EB;--n1:#F3F0F5;--papel:#FAF8FB;--estudio:#EEEAF1;
 --acento:#D6FF4A;--ok:#1B6E3C;--okS:#E5F4EA;--al:#7A4E00;--alS:#FFF3D6;--alB:#E9B949;--bad:#B3261E;--badS:#FCEAE8;--info:#28569E;--infoS:#E8F0FB;
 --fd:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
 --fu:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --lean:-8deg;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--side:248px
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/24px var(--fu);color:var(--noite);background:var(--papel);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--r7);-webkit-tap-highlight-color:transparent}
ul,ol{list-style:none}
:focus-visible{outline:3px solid var(--acao);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:300;background:#fff;color:var(--noite);padding:10px 14px;border-radius:12px;font-weight:800}
.skip:focus{left:16px}
.i{display:block;flex:none}.du{opacity:.45}
.ic2{color:#fff}.ic2 .du{opacity:1;fill:var(--acento)}
.icb{color:var(--acao)}.icb .du{opacity:1;fill:var(--r3)}

/* ---------- Moldura: faixa do protótipo, cabeçalho de marca, folha clara ---------- */
.proto{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 24px;background:var(--noite);color:var(--n3);font:600 13px/18px var(--fu)}
.proto b{color:#fff;font-weight:800}
.proto button{min-height:32px;padding:0 10px;border-radius:8px;color:#fff;background:var(--n8);font-weight:700}
.proto button[aria-pressed=true]{background:var(--acento);color:var(--noite)}
.proto .sp{flex:1}
html.clean .proto{display:none}
.hd{position:relative;color:#fff;padding-bottom:84px}
.hd::before{content:"";position:absolute;inset:0;background:var(--roxo);clip-path:polygon(0 0,100% 0,100% calc(100% - 64px),0 100%);z-index:-1}
.hd{isolation:isolate}
.hd-row{display:flex;align-items:center;gap:12px;height:76px;padding:0 24px;max-width:1440px;margin:0 auto}
.logo{display:flex;align-items:center;color:#fff}
.logo .sym{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--noite);color:#fff;font:700 15px/1 var(--fu);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--acento)}
.pill .dot.off{background:var(--n5)}
.pill small{font:600 13px/1 var(--fu);color:var(--n3)}
.seg2{display:flex;padding:4px;border-radius:14px;background:var(--noite)}
.seg2 button{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;color:var(--n3);font:700 14px/1 var(--fu)}
.seg2 button[aria-pressed=true]{background:#fff;color:var(--noite)}
.hsp{flex:1}
.hib{position:relative;display:inline-flex;align-items:center;gap:8px;min-width:44px;height:44px;padding:0 10px;justify-content:center;border-radius:14px;background:var(--noite);color:#fff;font:700 14px/1 var(--fu);text-decoration:none}
.hib.on .i{color:var(--acento)}
.avatar{width:44px;height:44px;border-radius:14px;background:#fff;color:var(--r7);font:800 16px/44px var(--fd);text-align:center;letter-spacing:-.02em;flex:none}
.hd-t{max-width:1440px;margin:0 auto;padding:10px 24px 0 calc(48px + var(--side))}
.hd-t .k{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:10px;background:var(--noite);color:#fff;font:700 13px/1 var(--fu);margin-bottom:10px;text-decoration:none}
.hd-t h1{font:800 50px/1 var(--fd);letter-spacing:-.05em;max-width:900px}
.hd-t h1:focus{outline:none}
.shell{position:relative;z-index:2;max-width:1440px;margin:-64px auto 0;padding:0 24px 64px;display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px;background:#fff;border-radius:24px;padding:10px;box-shadow:0 0 0 1px var(--n2)}
.side h2{font:800 12px/16px var(--fu);letter-spacing:.08em;text-transform:uppercase;color:var(--n6);padding:14px 12px 6px}
.side a{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:14px;color:var(--n7);font:600 15px/20px var(--fu);text-decoration:none}
.side a:hover{background:var(--n1)}
.side a[aria-current=page]{background:var(--noite);color:#fff;font-weight:800}
.side a[aria-current=page] .i{color:var(--acento)}
.side .bars{display:flex;flex-direction:column;gap:7px;padding:22px 14px 10px}
.side .bars i{display:block;height:9px;border-radius:5px;background:var(--n2)}
.side .bars i:nth-child(1){width:34px;margin-left:14px}.side .bars i:nth-child(2){width:72px;background:var(--r3)}.side .bars i:nth-child(3){width:50px;margin-left:10px}
.n{margin-left:auto;min-width:24px;height:24px;border-radius:12px;background:var(--acento);color:var(--noite);font:800 12px/24px var(--fu);text-align:center;padding:0 7px}
.sheet{background:#fff;border-radius:30px;padding:32px;min-height:72vh;box-shadow:0 0 0 1px var(--n2);min-width:0}
.sheet.enter{animation:rise .45s var(--ease) both}
.lead{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:24px}
.lead>p{font:16px/24px var(--fu);color:var(--n6);max-width:620px}
.lead .row{margin-left:auto}

/* Barra inferior e folha "Mais" (celular e tablet) */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(72px + env(safe-area-inset-bottom));padding:4px 6px env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--n2);grid-template-columns:repeat(5,1fr)}
.bnav a,.bnav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;font:600 12px/16px var(--fu);color:var(--n6);text-decoration:none;text-align:center}
.bnav [aria-current=page]{color:var(--noite);font-weight:800}
.bnav [aria-current=page]::before{content:"";position:absolute;top:2px;width:24px;height:5px;border-radius:3px;background:var(--roxo);transform:skewX(var(--lean))}
.bnav [aria-current=page] .i{color:var(--acao)}
.bnav .bd{position:absolute;top:5px;left:calc(50% + 5px);min-width:20px;height:20px;border-radius:10px;background:var(--acento);color:var(--noite);font:800 11px/20px var(--fu);padding:0 5px;text-align:center}
.bnav .bd.dot{min-width:12px;width:12px;height:12px;padding:0;top:8px;left:calc(50% + 8px);box-shadow:0 0 0 2px #fff}
.mgrp{font:800 12px/16px var(--fu);letter-spacing:.08em;text-transform:uppercase;color:var(--n6);padding:18px 4px 4px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 4px;border-bottom:1px solid var(--n2);text-decoration:none;color:var(--noite);font:700 16px/22px var(--fu)}
.mrow .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--n1);display:grid;place-items:center}
.mrow[aria-current=page] .ic{background:var(--noite);color:var(--acento)}
.mrow .grow{flex:1}
.mrow small{display:block;font:500 13px/18px var(--fu);color:var(--n6)}
.mrow.out{color:var(--bad)}
.msearch{position:sticky;top:-12px;background:#fff;padding:6px 0 8px;z-index:2}

@media (max-width:1023px){
 .proto{display:none}
 .hd{padding-bottom:48px}
 .hd::before{clip-path:polygon(0 0,100% 0,100% calc(100% - 36px),0 100%)}
 .hd-row{height:64px;padding:0 16px;gap:8px}
 .logo .full{display:none}.logo .sym{display:block}
 .hd-t{padding:2px 16px 0}
 .hd-t h1{font-size:38px;line-height:1.02}
 .hide-m{display:none!important}
 .shell{grid-template-columns:minmax(0,1fr);margin-top:-36px;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
 .side{display:none}
 .sheet{border-radius:30px 30px 0 0;padding:24px 16px 32px;box-shadow:none;min-height:calc(100vh - 160px)}
 .bnav{display:grid}
 .lead .row{margin-left:0}
}
@media (min-width:1024px){.hide-d{display:none!important}}

/* ---------- Componentes ---------- */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.stack8{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.right{text-align:right}
.cap{font:14px/20px var(--fu)}
.mut{color:var(--n6)}
.b{font-weight:700}
.nowrap{white-space:nowrap}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.al-t{color:var(--al)}
.h2{font:800 26px/1.08 var(--fd);letter-spacing:-.035em}
.h3{font:800 20px/1.15 var(--fd);letter-spacing:-.025em}
.kick{font:800 12px/16px var(--fu);letter-spacing:.08em;text-transform:uppercase;color:var(--n6)}
.big{font:800 52px/1 var(--fd);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.big.md{font-size:40px}
.price{display:inline-flex;align-items:flex-start;font-family:var(--fd);font-weight:800;letter-spacing:-.035em;line-height:.9;font-variant-numeric:tabular-nums}
.price .c{font-size:.4em;letter-spacing:0;margin:.14em .14em 0 0}
.price .d{font-size:.5em;margin-top:.06em;letter-spacing:-.02em}
.price.xl{font-size:56px}.price.lg{font-size:40px}.price.md{font-size:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;background:var(--acao);color:#fff;font:800 15px/20px var(--fu);white-space:nowrap;text-decoration:none;transition:transform .12s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--noite);box-shadow:inset 0 0 0 2px var(--noite)}
.btn.ghost{background:var(--n1);color:var(--noite)}
.btn.ink{background:var(--noite);color:#fff}
.btn.lime{background:var(--acento);color:var(--noite)}
.btn.wline{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.btn.bad{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.btn.badf{background:var(--bad);color:#fff}
.btn.sm{min-height:44px;padding:0 14px;border-radius:14px;font-size:14px}
.btn.lg{min-height:56px;font-size:16px;padding:0 22px}
.btn.block{width:100%}
.btn[disabled]{background:var(--n2);color:var(--n6);box-shadow:none;cursor:not-allowed}
.lnk{display:inline-flex;align-items:center;gap:4px;min-height:44px;font:700 15px/20px var(--fu);color:var(--r7);text-decoration:none}
.lnk.w{color:var(--acento)}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 9px;border-radius:9px;font:700 13px/18px var(--fu);background:var(--n1);color:var(--n7);white-space:nowrap}
.t-ok{background:var(--okS);color:var(--ok)}.t-al{background:var(--alS);color:var(--al)}.t-bad{background:var(--badS);color:var(--bad)}.t-info{background:var(--infoS);color:var(--info)}
.t-ink{background:var(--noite);color:#fff}.t-ink .i{color:var(--acento)}
.t-badf{background:var(--bad);color:#fff}
.card{display:block;background:#fff;border-radius:22px;box-shadow:inset 0 0 0 1px var(--n2);padding:20px;color:inherit;text-decoration:none}
.card.soft{background:var(--n1);box-shadow:none}
.card.ink{background:var(--noite);color:#fff;box-shadow:none}
.card.ink .mut{color:var(--n3)}
.card.p0{padding:0;overflow:hidden}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:44px}.price.xl{font-size:48px}}
.sect{margin-top:32px}
.sect>h2{margin-bottom:14px}
.bdiv{display:flex;gap:6px;align-items:center;margin:20px 0}
.bdiv i{height:6px;border-radius:3px;background:var(--noite);transform:skewX(var(--lean))}
.bdiv i:nth-child(1){width:18px}.bdiv i:nth-child(2){width:40px;background:var(--roxo)}.bdiv i:nth-child(3){width:10px}
.bdiv::after{content:"";flex:1;height:1px;background:var(--n2)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--n2);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;display:flex;align-items:center;gap:8px;min-height:50px;font:700 16px/20px var(--fu);color:var(--n6);white-space:nowrap}
.tabs [aria-selected=true]{color:var(--noite);font-weight:800}
.tabs [aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:5px;border-radius:2px;background:var(--roxo);transform:skewX(var(--lean))}
.tabs .c{min-width:24px;height:24px;border-radius:12px;background:var(--n1);color:var(--noite);font:800 12px/24px var(--fu);text-align:center;padding:0 7px}
.tabs [aria-selected=true] .c{background:var(--noite);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--n1);font:700 14px/1 var(--fu);color:var(--n7)}
.chip[aria-pressed=true]{background:var(--noite);color:#fff}
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:16px;background:var(--n3);transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--spring),background .2s}
.sw[aria-checked=true]{background:var(--noite)}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--acento)}
.swrow{display:flex;align-items:center;gap:12px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--n1);font:15px/22px var(--fu)}
.note .i{margin-top:1px}
.note.al{background:var(--alS);color:var(--al)}.note.al b,.note.al p{color:#3D2700}
.note.bad{background:var(--badS)}.note.bad>.i{color:var(--bad)}
.note.ok{background:var(--okS)}.note.ok>.i{color:var(--ok)}
.note.ink{background:var(--noite);color:#fff}.note.ink>.i{color:var(--acento)}
.note p+p{margin-top:2px}
.bar{height:10px;border-radius:5px;background:var(--n1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--noite)}
.bar.r i{background:var(--roxo)}
.card.ink .bar{background:var(--n7)}.card.ink .bar i{background:var(--acento)}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;margin-top:22px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.chart i{display:block;width:100%;max-width:46px;border-radius:12px 12px 5px 5px;background:var(--n2);transform-origin:bottom;animation:grow .6s var(--ease) both}
.chart .now i{background:var(--roxo)}
.chart b{font:700 12px/16px var(--fu);white-space:nowrap}
.chart span{font:12px/16px var(--fu);color:var(--n6);white-space:nowrap}
.rank{display:flex;align-items:center;gap:14px;min-height:72px;border-bottom:1px solid var(--n2)}
.rank:last-child{border-bottom:0}
.rank .rk{flex:none;width:34px;font:800 46px/.8 var(--fd);color:var(--roxo);letter-spacing:-.07em;text-align:right}
.th{position:relative;flex:none;width:56px;height:64px;border-radius:14px;background:var(--estudio);overflow:hidden}
.th.lg{width:72px;height:84px;border-radius:18px}
.th .art{position:absolute;width:122%;height:122%;left:-11%;top:-6%}
.mono{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sc,#2F4A6B);color:#fff;font:800 16px/44px var(--fd);text-align:center;letter-spacing:-.03em}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:800 12px/16px var(--fu);letter-spacing:.06em;text-transform:uppercase;color:var(--n6);text-align:left;padding:12px 14px;border-bottom:2px solid var(--noite);white-space:nowrap}
.tbl td{padding:14px;border-bottom:1px solid var(--n2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--papel)}
.tscroll{overflow-x:auto}
@media (max-width:760px){
 .rt thead{display:none}
 .rt tr{display:block;padding:12px 0;border-bottom:1px solid var(--n2)}
 .rt tr:last-child{border-bottom:0}
 .rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border:0;text-align:right}
 .rt td[data-l]::before{content:attr(data-l);font:14px/20px var(--fu);color:var(--n6);text-align:left}
 .rt td.first{display:block;text-align:left;padding-bottom:6px}
 .card.p0 .rt{padding:0 16px}
}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font:15px/22px var(--fu)}
.kv dt{color:var(--n6)}.kv dd{font-weight:700;text-align:right}
.fld{display:flex;flex-direction:column}
.lbl{display:block;font:700 14px/20px var(--fu);margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--n3)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--noite) 50%),linear-gradient(135deg,var(--noite) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{outline:none;box-shadow:inset 0 0 0 2px var(--acao)}
.inp[aria-invalid=true]{box-shadow:inset 0 0 0 2px var(--bad)}
.pre{position:relative}
.pre>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--n6);font-weight:700;pointer-events:none}
.pre .inp{padding-left:44px}
.suf{position:relative}.suf>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--n6);font-weight:700;pointer-events:none}
.help{font:14px/20px var(--fu);color:var(--n6);margin-top:6px}
.err{display:flex;gap:6px;align-items:center;font:700 14px/20px var(--fu);color:var(--bad);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:44px;font:15px/22px var(--fu)}
.chk input,.radio input{width:22px;height:22px;accent-color:var(--noite);flex:none;margin-top:1px}
.radio{display:flex;gap:12px;align-items:center;min-height:52px;padding:0 14px;border-radius:14px;background:var(--n1);font:600 15px/20px var(--fu);cursor:pointer}
.radio:has(input:checked){background:var(--noite);color:#fff}
.radio:has(input:checked) .mut{color:var(--n3)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px}
.empty svg.e{width:150px;height:110px;overflow:visible;margin-bottom:6px}
.empty h2{font:800 26px/1.05 var(--fd);letter-spacing:-.035em;margin-top:8px}
.empty p{color:var(--n6);margin-top:6px;max-width:420px}
.empty .btn{margin-top:16px}
.cd{font:800 40px/1 var(--fd);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--acento);white-space:nowrap}
.pbar{height:8px;border-radius:4px;background:var(--n7);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--acento);border-radius:4px;transform:skewX(var(--lean));transform-origin:left;transition:width 1s linear}
.bulk{position:sticky;bottom:16px;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 12px 12px 18px;border-radius:20px;background:var(--noite);color:#fff;animation:rise .3s var(--ease) both}
.bulk b{font:800 18px/22px var(--fd)}
.bulk .grow span{display:block;font:14px/20px var(--fu);color:var(--n3)}
@media (max-width:1023px){.bulk{bottom:calc(84px + env(safe-area-inset-bottom))}}
.drop{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px;border-radius:24px;box-shadow:inset 0 0 0 2px var(--n3);background:var(--papel)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.ph{position:relative;aspect-ratio:4/5;border-radius:18px;background:var(--estudio);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px/18px var(--fu);color:var(--n6)}
.ph .art{position:absolute;inset:6%;width:88%;height:88%}
.ph .cv{position:absolute;left:8px;top:8px;background:var(--acento);color:var(--noite);font:800 12px/1 var(--fu);padding:6px 8px;border-radius:7px;transform:skewX(var(--lean))}
.ph .cv span{display:block;transform:skewX(8deg)}
.ph .x{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--noite)}
.ph.add{background:#fff;box-shadow:inset 0 0 0 2px var(--n3);color:var(--r7);font-weight:800;cursor:pointer}
.step{display:inline-flex;align-items:center;height:44px;border-radius:14px;background:var(--n1)}
.step button{width:44px;height:44px;display:grid;place-items:center}
.step input{width:48px;border:0;background:transparent;text-align:center;font:800 16px/1 var(--fu)}
.recebe{padding:16px;border-radius:18px;background:var(--noite);color:#fff}
.recebe .price{color:var(--acento)}
.recebe p.cap{color:var(--n3)}
.wa{white-space:pre-wrap;padding:14px 16px;border-radius:18px 18px 18px 6px;background:#E7F8DE;color:#0F2A12;font:15px/22px var(--fu)}
.stars{display:inline-flex;gap:2px;color:#B7791F}
.stars .off{color:var(--n3)}
.rv{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}

/* Pedidos */
.ord{padding:20px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--n2);background:#fff}
.ord.new{background:var(--noite);color:#fff;box-shadow:none}
.ord.new .mut,.ord.new .cap.mut{color:var(--n3)}
.ord.flash{animation:pop .5s var(--spring)}
.items{margin-top:12px;border-top:1px solid var(--n2)}
.ord.new .items{border-color:var(--n7)}
.items li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--n2)}
.ord.new .items li{border-color:var(--n7)}
.items li:last-child{border-bottom:0}
.youget{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--n1)}
.ord.new .youget{background:var(--n8)}
.ord.new .youget b{color:var(--acento)}
.prazo{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--n1);font:700 14px/20px var(--fu)}
.prazo.late{background:var(--alS);color:var(--al)}
.comanda{font:14px/20px ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#111;padding:14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--n3)}
.comanda .l{display:flex;justify-content:space-between;gap:8px}
.comanda hr{border:0;border-top:1px dashed #999;margin:8px 0}
/* Abertura da loja */
.open{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--n1)}
.open .ic{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
/* Alerta em bloco noite */
.alert{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px;border-radius:24px;background:var(--noite);color:#fff}
.alert .ic{flex:none;width:56px;height:56px;border-radius:16px;background:var(--acento);color:var(--noite);display:grid;place-items:center}
.alert .grow p{color:var(--n3);font:15px/22px var(--fu)}
.alert .h2{color:#fff}

/* Logística: prazo restante, lote, atraso */
.lg{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--n2);background:#fff}
.lg.late{box-shadow:inset 0 0 0 2px var(--bad)}
.lg.risk{box-shadow:inset 0 0 0 2px var(--alB)}
.lg.sel{box-shadow:inset 0 0 0 3px var(--noite)}
.pz{border-radius:18px;padding:12px 14px;background:var(--n1);min-height:96px;display:flex;flex-direction:column;justify-content:center}
.pz b{font:800 40px/1 var(--fd);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pz span{font:700 13px/17px var(--fu);margin-top:4px}
.lg.risk .pz{background:var(--alS);color:var(--al)}
.lg.late .pz{background:var(--bad);color:#fff}
.lg .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font:14px/20px var(--fu);color:var(--n6);margin-top:4px}
.lg .route{font:800 19px/24px var(--fd);letter-spacing:-.02em;margin-top:6px}
.lg .acts{display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:170px}
.lotchk{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;border-radius:14px;background:var(--n1);font:700 14px/1 var(--fu);cursor:pointer}
.lotchk input{width:22px;height:22px;accent-color:var(--noite)}
@media (max-width:760px){.lg{grid-template-columns:minmax(0,1fr)}.pz{flex-direction:row;align-items:baseline;gap:10px;min-height:0}.pz b{font-size:32px}.lg .acts{flex-direction:row;flex-wrap:wrap;min-width:0}.lg .acts>*{flex:1}}
.kpi{padding:18px;border-radius:22px;background:var(--n1)}
.kpi p{font:700 14px/20px var(--fu);color:var(--n6)}
.kpi b{display:block;font:800 46px/1 var(--fd);letter-spacing:-.05em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.al{background:var(--alS)}.kpi.al p,.kpi.al b{color:var(--al)}
.kpi.bad{background:var(--bad)}.kpi.bad p,.kpi.bad b{color:#fff}
.kpi.ink{background:var(--noite)}.kpi.ink p{color:var(--n3)}.kpi.ink b{color:#fff}
/* Parâmetros: prévia da faixa */
.eq{display:flex;height:48px;border-radius:14px;overflow:hidden;margin-top:12px}
.eq i{display:flex;align-items:center;justify-content:center;font:800 13px/16px var(--fu);font-style:normal;color:#fff;white-space:nowrap;overflow:hidden;min-width:0;padding:0 6px}
.eq .p1{background:var(--noite)}.eq .p2{background:var(--n7)}.eq .p3{background:var(--r7)}
.trackw{position:relative;height:74px;margin-top:18px}
.track{position:absolute;left:0;right:0;top:26px;height:12px;border-radius:6px;background:var(--n1)}
.track .rg{position:absolute;top:-6px;height:24px;border-radius:7px;background:var(--roxo);transform:skewX(var(--lean))}
.track .cap{position:absolute;top:30px;font:700 13px/16px var(--fu);white-space:nowrap;transform:translateX(-50%)}
.track .teto{position:absolute;top:-16px;bottom:-16px;width:3px;border-radius:2px;background:var(--bad)}
.track .teto span{position:absolute;bottom:100%;right:-2px;font:800 12px/16px var(--fu);color:var(--bad);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:13px/18px var(--fu);color:var(--n6);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* Modal (folha no celular), toast */
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;z-index:90;background:rgba(28,23,33,.55);animation:fadeIn .2s both}
.dlg{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:30px;padding:24px;animation:dlgIn .3s var(--ease) both}
.dlg.wide{width:min(720px,calc(100vw - 32px))}
.dlg h2.t{font:800 30px/1.02 var(--fd);letter-spacing:-.04em;margin-bottom:8px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
@media (max-width:1023px){
 .dlg{left:0;right:0;top:auto;bottom:0;transform:none;width:100%!important;max-height:88vh;border-radius:30px 30px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .35s var(--ease) both}
 .dlg::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--n3);margin:0 auto 14px}
 .dlg .acts{flex-direction:column-reverse}.dlg .acts .btn{width:100%}
}
#toast{position:fixed;z-index:120;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(480px,calc(100vw - 32px));pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 10px 8px 16px;border-radius:16px;background:var(--noite);color:#fff;font:600 15px/20px var(--fu);pointer-events:auto;animation:toastIn .4s var(--spring) both}
.toast>.i{color:var(--acento)}
.toast span{flex:1}
.toast button{min-height:44px;padding:0 10px;color:var(--acento);font:800 15px/20px var(--fu)}
@media (max-width:1023px){#toast{bottom:calc(88px + env(safe-area-inset-bottom))}}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-46%)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.96)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.01)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html.static *,html.static *::before,html.static *::after{animation:none!important;transition:none!important}
@media print{body>*{display:none!important}#print{display:block!important}}
#print{display:none}
