<style>
:root{
  --roxo:#C02EF0;--acao:#A21FBE;--r7:#8618A3;--r8:#6A1580;--r1:#F6E0FA;--r3:#E198EC;
  --noite:#1C1721;--n8:#2C2632;--n7:#443C4C;--n6:#5F566A;--n5:#837A8A;--n4:#B3ABB9;--n3:#D6CFDB;--n2:#E8E3EB;--n1:#F3F0F5;--papel:#FAF8FB;--estudio:#EEEAF1;
  --acento:#D6FF4A;--ok:#1B6E3C;--alerta:#7A4E00;
  --fd:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
  --fu:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --lean:-8deg;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
.acento-sol{--acento:#FFC93C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fu);font-size:16px;line-height:24px;color:var(--noite);background:#DCD5E0;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acao);outline-offset:2px}

/* Aparelho (só no desktop) */
#device{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#fff;box-shadow:0 0 0 11px #1C1721,0 40px 90px rgba(28,23,33,.35)}
#app{position:absolute;inset:0;overflow:hidden}
#dnav{position:fixed;left:28px;top:28px;display:flex;flex-direction:column;gap:6px;font:600 14px/20px var(--fu)}
#dnav b{font:800 20px/1 var(--fd);margin-bottom:8px}
#dnav a,#dnav button{padding:6px 10px;border-radius:10px;background:#fff;text-align:left}
#dnav a.on{background:var(--noite);color:#fff}
@media (max-width:820px){#dnav{display:none}}
@media (max-width:500px){body{display:block}#device{width:100vw;height:100vh;border-radius:0;box-shadow:none}}

/* Base de tela */
.scr{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.scr.in{animation:scrIn .34s var(--ease) both}
.scr.in-back{animation:scrInB .34s var(--ease) both}
.scr.in-fade{animation:fadeIn .2s linear both}
.scr.out{animation:scrOut .3s var(--ease) both;pointer-events:none}
.rv{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 60ms)}

.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:2px 26px 0 34px;font:700 15px/1 var(--fu);z-index:40;pointer-events:none;color:var(--noite);transition:color .2s}
.sb.dk{color:#fff}

/* Ícones */
.i{display:block;flex:none}
.du{opacity:.45}
.ic2{color:#fff}.ic2 .du{opacity:1;fill:var(--acento)}
.icb{color:var(--acao)}.icb .du{opacity:1;fill:var(--r3)}
.icl{color:var(--acento)}

/* Botões */
.ib{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--noite);flex:none;transition:transform .12s var(--ease)}
.ib:active,.btn:active,.add:active,.rc:active,.pc:active .pl,.stc:active .cov{transform:scale(.95)}
.ib.soft{background:var(--n1)}
.ib.dk2{background:var(--n8);color:#fff}
.ib.ink{background:var(--noite);color:#fff}
.btn{height:56px;border-radius:16px;background:var(--acao);color:#fff;font:800 16px/1 var(--fu);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px;transition:transform .12s var(--ease),background .2s}
.btn .bp{font:800 17px/1 var(--fd);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.btn.full{width:100%}
.btn.white{background:#fff;color:var(--noite);justify-content:center}
.btn.done{background:var(--noite)}
.btn.done span:first-child{display:flex;align-items:center;gap:8px;color:var(--acento)}
.txtbtn{min-height:44px;font:700 15px/20px var(--fu);color:var(--n6);padding:0 4px}
.txtbtn.w{color:#fff}
.lnk{font:700 15px/20px var(--fu);color:var(--r7);min-height:44px;display:inline-flex;align-items:center}
.lnk.dk{color:var(--acento)}

/* Preço: R$ pequeno, inteiro grande, centavos elevados */
.price{display:inline-flex;align-items:flex-start;font-family:var(--fd);font-weight:800;letter-spacing:-.035em;line-height:.9;font-variant-numeric:tabular-nums}
.price .c{font-size:.4em;letter-spacing:0;margin:.14em .14em 0 0}
.price .d{font-size:.5em;margin-top:.06em;letter-spacing:-.02em}
.pp{font-size:24px;display:flex;align-items:baseline;gap:8px}
.pp s,.old{font:500 13px/18px var(--fu);color:var(--n6);letter-spacing:0}

/* Elementos de marca */
.off{position:absolute;z-index:2;top:10px;left:10px;background:var(--acento);color:var(--noite);border-radius:7px;padding:6px 9px;transform:skewX(var(--lean));font:800 14px/1 var(--fu)}
.off>span{display:block;transform:skewX(8deg)}
.stk{position:absolute;z-index:3;background:var(--acento);color:var(--noite);font:800 13px/1 var(--fu);padding:8px 11px;border-radius:8px;box-shadow:3px 3px 0 var(--noite);white-space:nowrap}
.bdiv{display:flex;gap:6px;align-items:center;margin:20px 0}
.bdiv i{height:6px;border-radius:3px;background:var(--noite);transform:skewX(var(--lean))}
.bdiv i:nth-child(1){width:18px}.bdiv i:nth-child(2){width:40px;background:var(--roxo)}.bdiv i:nth-child(3){width:10px}
.bdiv::after{content:"";flex:1;height:1px;background:var(--n2)}
.mono-s{width:32px;height:32px;border-radius:10px;background:var(--sc,#2F4A6B);color:#fff;font:800 13px/32px var(--fd);text-align:center;flex:none;letter-spacing:-.02em}
.art{display:block;width:100%;height:100%;overflow:visible;--g:rgba(28,23,33,.16);--x:#C02EF0}
.art.crop{position:absolute;width:116%;height:116%;left:-8%;top:-8%}

/* ---------- INÍCIO ---------- */
.mini{position:absolute;top:0;left:0;right:0;height:100px;padding:48px 16px 0;display:flex;align-items:center;gap:10px;z-index:30;background:var(--roxo);transform:translateY(-102%);transition:transform .28s var(--ease)}
.mini.on{transform:none}
.mini .addr{margin:0;flex:1;height:44px}
.mini.light{background:#fff;border-bottom:1px solid var(--n2)}
.mini-t{flex:1;font:800 20px/1 var(--fd);letter-spacing:-.03em}
.hh{position:relative;padding:50px 20px 0;height:398px;color:#fff;flex:none}
.hh-bg{position:absolute;left:0;right:0;top:0;bottom:30px;background:var(--roxo);clip-path:polygon(0 0,100% 0,100% calc(100% - 64px),0 100%)}
.hh-top{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;height:52px}
.badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--acento);color:var(--noite);font:800 12px/22px var(--fu);text-align:center;padding:0 6px}
.badge.bump,.bb-i b.bump{animation:bump .45s var(--spring)}
.addr{position:relative;z-index:4;display:inline-flex;align-items:center;gap:8px;height:44px;margin-top:12px;padding:0 12px 0 10px;border-radius:14px;background:var(--noite);color:#fff;font:700 15px/1 var(--fu);white-space:nowrap}
.hh h1{position:relative;z-index:4;margin-top:22px;font:800 46px/.97 var(--fd);letter-spacing:-.045em;max-width:236px}
.hl{position:relative;display:inline-block;color:var(--noite);padding:0 7px 3px 5px;margin-left:-3px;isolation:isolate}
.hl::before{content:"";position:absolute;inset:7px 0 0;background:var(--acento);border-radius:6px;transform:skewX(var(--lean));z-index:-1;transform-origin:left;animation:hlIn .5s var(--ease) .45s both}
/* Herói: sacola atrás, tênis inteiro na frente (zona livre à direita do título), selo sobre a sacola, nunca sobre o produto */
.hh-art{position:absolute;inset:0;z-index:3;pointer-events:none}
.ha-bag{position:absolute;left:240px;top:118px;width:140px;transform:rotate(6deg);animation:fadeIn .4s .1s both}
.ha-shoe{position:absolute;left:198px;top:150px;width:192px;height:192px;transform:rotate(-8deg);animation:shoeIn .8s var(--spring) .15s both}
.ha-shoe .art{--g:rgba(28,23,33,.3)}
.ha-tag{left:300px;top:116px;transform:rotate(8deg);animation:stkIn .5s var(--spring) .7s both}
.search{position:absolute;z-index:5;left:20px;right:20px;bottom:0;height:60px;border-radius:18px;background:var(--noite);color:var(--n3);display:flex;align-items:center;gap:12px;padding:0 18px;font:500 16px/1 var(--fu)}
/* Faixa de categorias: objeto + nome; destaque maior em noite; formatos variados (quadrado, círculo, trapézio da sacola) */
.cats{display:flex;align-items:flex-end;gap:14px;overflow-x:auto;padding:34px 20px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{position:relative;flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:8px;font:700 14px/18px var(--fu);color:var(--noite);text-align:center}
.cat .tile{display:block;width:88px;height:88px;border-radius:24px;background:var(--estudio);transition:transform .12s var(--ease)}
.cat.ci .tile{border-radius:50%}
.cat.tz .tile{border-radius:20px 20px 28px 28px;transform:perspective(160px) rotateX(-16deg)}
.cat:not(.tz):active .tile{transform:scale(.95)}
.cat .art{position:absolute;left:2px;top:-16px;width:84px;height:84px;pointer-events:none}
.cat.big{width:148px}
.cat.big .tile{width:148px;height:114px;border-radius:26px;background:var(--noite)}
.cat.big .art{--g:rgba(0,0,0,.45)}
.cat.big .c1{left:50px;top:-20px;width:100px;height:100px;transform:rotate(7deg)}
.cat.big .c2{left:4px;top:-12px;width:76px;height:76px;transform:rotate(-8deg)}
.cat.big b{position:absolute;left:14px;bottom:12px;font:800 24px/1 var(--fd);letter-spacing:-.03em;color:#fff}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 20px;margin:40px 0 4px}
.sh h2{font:800 30px/1 var(--fd);letter-spacing:-.04em}
.hs{display:flex;gap:14px;overflow-x:auto;padding:22px 20px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.stc{flex:none;width:236px;scroll-snap-align:start;display:block}
.stc.big{width:300px}
.cov{position:relative;height:172px;border-radius:24px;background:var(--sc);transition:transform .12s var(--ease)}
.cov .ca{position:absolute}
.cov .eta{position:absolute;z-index:3;left:12px;top:12px;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 8px;border-radius:10px;background:#fff;color:var(--noite);font:800 14px/1 var(--fu)}
.mono{position:absolute;z-index:3;left:14px;bottom:-20px;width:52px;height:52px;border-radius:15px;background:#fff;color:var(--sc);font:800 19px/52px var(--fd);text-align:center;letter-spacing:-.03em;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--noite)}
.stc h3{font:700 20px/24px var(--fd);letter-spacing:-.025em;margin-top:30px}
.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font:14px/20px var(--fu);color:var(--n6);margin-top:3px}
.meta b{color:var(--noite)}
.meta .i{color:var(--acao)}
.band{position:relative;background:var(--noite);color:#fff;margin-top:76px;padding:4px 0 34px}
.band::before{content:"";position:absolute;left:0;right:0;top:-47px;height:48px;background:var(--noite);clip-path:polygon(0 100%,100% 0,100% 100%)}
.band .sh{margin-top:0}
.band-sub{padding:6px 20px 18px;font:15px/22px var(--fu);color:var(--n3)}
.bento{display:grid;grid-template-columns:1.12fr 1fr;gap:12px;padding:0 20px}
.oc{position:relative;display:block}
.oc.big{grid-row:span 2}
.oc .pl{position:relative;border-radius:20px;background:var(--n8);overflow:hidden;height:96px}
.oc.big .pl{height:236px}
.oc .pl .art{position:absolute;inset:auto}
.band .art{--g:rgba(0,0,0,.4)}
.oc .onm{font:600 14px/19px var(--fu);margin-top:9px;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc .pp{font-size:22px;margin-top:3px;color:#fff}
.oc .pp s{color:var(--n4)}
.rk{padding:4px 0 184px}
.rki{display:flex;align-items:center;gap:14px;padding:8px 20px;min-height:112px}
.rki .n{flex:none;width:56px;font:800 92px/.78 var(--fd);color:var(--roxo);letter-spacing:-.08em;text-align:right;position:relative;z-index:2;margin-right:-30px}
.rki .pl{flex:none;width:84px;height:100px;border-radius:18px;background:var(--estudio);overflow:hidden;position:relative}
.rki .tx{flex:1;min-width:0}
.rki b{display:block;font:600 16px/22px var(--fu)}
.rki .st{font:14px/20px var(--fu);color:var(--n6)}
.rki .pp{font-size:21px;margin-top:5px}
.tab{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px 16px;border-top:1px solid var(--n2);z-index:20}
.tab a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px/16px var(--fu);color:var(--n6)}
.tab a.on{color:var(--noite);font-weight:800}
.tab a.on::before{content:"";position:absolute;top:2px;width:22px;height:5px;border-radius:3px;background:var(--roxo);transform:skewX(var(--lean))}
.tab a.on .i{color:var(--acao)}
.tab a.on .du{opacity:1;fill:var(--r3)}
.bagbar{position:absolute;z-index:19;left:12px;right:12px;bottom:90px;height:64px;border-radius:20px;background:var(--noite);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px 0 9px;animation:barUp .5s var(--spring) .35s both;transition:transform .12s}
.s-loja .bagbar{bottom:18px}
.bb-i{position:relative;width:46px;height:46px;border-radius:14px;background:var(--roxo);display:grid;place-items:center;color:#fff}
.bb-i b{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--acento);color:var(--noite);font:800 12px/22px var(--fu);text-align:center;padding:0 5px}
.bb-t{flex:1;display:flex;flex-direction:column;text-align:left}
.bb-t b{font:800 16px/20px var(--fu)}
.bb-t span{font:13px/18px var(--fu);color:var(--n3)}
.bb-p{font-size:22px}

/* ---------- LOJA ---------- */
.topbtns{position:absolute;top:50px;left:16px;right:16px;display:flex;gap:8px;z-index:26;transition:opacity .2s}
.topbtns .sp{flex:1}
.topbtns.hide{opacity:0;pointer-events:none}
.fav .i:last-child{display:none}
.fav[aria-pressed=true]{color:var(--acao)}
.fav[aria-pressed=true] .i:first-child{display:none}
.fav[aria-pressed=true] .i:last-child{display:block;animation:bump .4s var(--spring)}
.cover{position:relative;height:184px;flex:none}
.cover .bg{position:absolute;inset:0 0 12px;background:var(--sc);clip-path:polygon(0 0,100% 0,100% 66%,0 100%)}
.cover .ca{position:absolute;animation:rise .7s var(--ease) both}
.cover .art{--g:rgba(0,0,0,.28)}
.sid{position:relative;z-index:3;padding:0 20px;margin-top:-54px}
.slogo{width:64px;height:64px;border-radius:18px;background:#fff;color:var(--sc);font:800 24px/64px var(--fd);letter-spacing:-.04em;text-align:center;transform:rotate(-6deg);box-shadow:4px 4px 0 var(--noite);animation:stkIn .55s var(--spring) .2s both}
.sid h1{font:800 36px/1 var(--fd);letter-spacing:-.045em;margin-top:12px}
.sid .sub{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;font:14px/22px var(--fu);color:var(--n6);margin-top:4px}
.opn{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ok)}
.opn i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin:14px 20px 0;border-top:2px solid var(--noite);border-bottom:1px solid var(--n2)}
.stats>div{padding:10px 0 10px 12px;border-left:1px solid var(--n2)}
.stats>div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:800 24px/1 var(--fd);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:4px;font:13px/18px var(--fu);color:var(--n6);margin-top:4px}
/* Cupons e vantagens (bilhete com recortes laterais) */
.tix{display:flex;gap:10px;overflow-x:auto;padding:14px 20px 2px;scrollbar-width:none}
.tix::-webkit-scrollbar{display:none}
.tk{position:relative;flex:none;display:flex;align-items:center;gap:10px;height:62px;padding:0 16px 0 14px;border-radius:14px;background:var(--n1);transition:transform .12s var(--ease)}
.tk:active{transform:scale(.96)}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff}
.tk::before{left:-6px}.tk::after{right:-6px}
.tk>span{display:flex;flex-direction:column;text-align:left}
.tk b{font:800 16px/20px var(--fu);white-space:nowrap}
.tk>span>span{font:13px/18px var(--fu);color:var(--n6);white-space:nowrap}
/* Destaques: foto grande, preço, preço riscado e selo */
.dst-h{font:800 24px/1 var(--fd);letter-spacing:-.035em;padding:24px 20px 0}
.dst{display:flex;gap:12px;overflow-x:auto;padding:12px 20px 2px;scrollbar-width:none}
.dst::-webkit-scrollbar{display:none}
.dcard{position:relative;flex:none;width:132px;cursor:pointer}
.dcard .pl{position:relative;height:136px;border-radius:20px;background:var(--estudio);overflow:hidden;transition:transform .12s var(--ease)}
.dcard:active .pl{transform:scale(.96)}
.dcard .stk{top:10px;left:8px;transform:rotate(-6deg);font-size:12px;padding:6px 8px;box-shadow:2px 2px 0 var(--noite)}
.dcard .pp{font-size:20px;margin-top:8px;gap:6px}
.dcard .pn{font:600 14px/18px var(--fu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span .i{color:var(--acao)}
.irow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 20px;min-height:68px}
.irow .ic{width:44px;height:44px;border-radius:14px;background:var(--n1);display:grid;place-items:center;flex:none}
.irow .t{flex:1;display:flex;flex-direction:column}
.irow b{font:700 16px/22px var(--fu)}
.irow .t span{font:14px/20px var(--fu);color:var(--n6)}
.irow>.i:last-child{color:var(--n5)}
.stabs{position:sticky;top:99px;z-index:15;background:#fff;display:flex;gap:24px;padding:0 20px;height:52px;margin-top:14px;border-bottom:1px solid var(--n2);overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stabs a{position:relative;display:flex;align-items:center;white-space:nowrap;font:700 16px/1 var(--fu);color:var(--n6);transition:color .2s}
.stabs a.on{color:var(--noite)}
.stabs .ind{position:absolute;bottom:-1px;left:20px;height:5px;width:90px;border-radius:2px;background:var(--roxo);transform:skewX(var(--lean));transition:left .3s var(--ease),width .3s var(--ease)}
.psec{padding-top:26px}
.psec>h2{font:800 26px/1 var(--fd);letter-spacing:-.035em;padding:0 20px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:26px;padding:0 20px 44px}
.grid>.pc:nth-child(2n){translate:0 40px}
.pc{position:relative;cursor:pointer}
.pc .pl{position:relative;height:206px;border-radius:22px;background:var(--estudio);overflow:hidden;transition:transform .12s var(--ease)}
.add{position:absolute;z-index:3;right:10px;top:183px;width:46px;height:46px;border-radius:15px;background:var(--noite);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff;transition:transform .12s var(--ease),background .2s,color .2s}
.add.ok{background:var(--acento);color:var(--noite);animation:bump .4s var(--spring)}
.pc .pn{font:600 15px/20px var(--fu);margin-top:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pp{margin-top:6px}

/* ---------- PRODUTO ---------- */
.stage{position:relative;height:360px;background:var(--papel);overflow:hidden;flex:none}
.st-shape{position:absolute;left:52px;top:62px;width:290px;transform:rotate(-6deg);animation:shapeIn .7s var(--ease) both}
.st-bars{position:absolute;left:-10px;top:196px;display:flex;flex-direction:column;gap:12px;z-index:1}
.st-bars i{display:block;height:14px;border-radius:7px;background:var(--noite);transform-origin:right;animation:barsIn .5s var(--ease) both}
.st-bars i:nth-child(1){width:34px;margin-left:24px;animation-delay:.25s}.st-bars i:nth-child(2){width:66px;animation-delay:.3s}.st-bars i:nth-child(3){width:46px;margin-left:16px;animation-delay:.35s}
.prod{position:absolute;left:60px;top:56px;width:270px;height:270px;z-index:2;transform:rotate(-4deg);transition:opacity .2s}
.prod .art{--g:rgba(28,23,33,.22)}
.prod.sw{animation:swapIn .35s var(--spring)}
.stage .stk{right:14px;top:234px;transform:rotate(-5deg);animation:stkIn .5s var(--spring) .5s both}
.dots{position:absolute;left:22px;bottom:44px;display:flex;gap:6px;z-index:3}
.dots i{width:12px;height:6px;border-radius:3px;background:var(--n3);transform:skewX(var(--lean))}
.dots i.on{width:32px;background:var(--noite)}
.psheet{position:relative;z-index:4;margin-top:-32px;background:#fff;border-radius:30px 30px 0 0;padding:20px 20px 150px}
.smini{display:inline-flex;align-items:center;gap:10px;min-height:44px;font:14px/20px var(--fu);color:var(--n6)}
.smini b{color:var(--noite);font-weight:700}
.smini .i{color:var(--n5)}
.pt{font:800 32px/1 var(--fd);letter-spacing:-.045em;margin-top:6px}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.price.xl{font-size:60px}
.rate{display:flex;flex-direction:column;align-items:flex-end;font:14px/20px var(--fu);color:var(--n6);padding-bottom:6px}
.rate b{display:flex;align-items:center;gap:4px;font:800 18px/22px var(--fu);color:var(--noite)}
.rate b .i{color:var(--acao)}
/* Grupos de opção (variação obrigatória) */
.og{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px -20px 0;padding:12px 20px;background:var(--n1)}
.og b{display:block;font:700 16px/22px var(--fu)}
.og>div>span{font:13px/18px var(--fu);color:var(--n6)}
.req{flex:none;font:800 11px/1 var(--fu);letter-spacing:.06em;text-transform:uppercase;background:var(--noite);color:#fff;padding:7px 8px;border-radius:6px}
.okc{display:inline-flex;align-items:center;gap:6px;font:700 14px/20px var(--fu);color:var(--ok)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

.cols .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;background:var(--acento);color:var(--noite);display:grid;place-items:center}

.sz{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.sz button{position:relative;height:54px;border-radius:15px;background:var(--n1);font:700 17px/1 var(--fu);overflow:hidden;transition:background .2s,color .2s,transform .12s}
.sz button.on{background:var(--noite);color:#fff;animation:bump .3s var(--spring)}
.sz button.out{background:#fff;color:var(--n6);box-shadow:inset 0 0 0 1px var(--n2)}
.sz button.out::after{content:"";position:absolute;left:50%;top:-20%;width:2px;height:140%;background:var(--n4);transform:rotate(50deg)}
.stock{display:flex;align-items:center;gap:8px;margin-top:12px;font:700 14px/20px var(--fu);color:var(--alerta);min-height:20px}
.stock i{width:8px;height:8px;border-radius:2px;background:#D89A00;transform:skewX(var(--lean))}
.facts{margin-top:18px;border-top:1px solid var(--n2)}
.fact{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--n2)}
.fact .ic{width:44px;height:44px;border-radius:14px;background:var(--n1);display:grid;place-items:center;flex:none}
.fact b{display:block;font:700 16px/22px var(--fu)}
.fact span{font:14px/20px var(--fu);color:var(--n6)}
.desc h2{font:800 22px/1.1 var(--fd);letter-spacing:-.03em;margin:24px 0 8px}
.desc p{color:var(--n7)}
.pbar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#fff;padding:12px 16px 24px;display:flex;gap:10px;border-top:1px solid var(--n2)}
.pbar .btn{flex:1}
.btn.off{background:var(--n2);color:var(--n6)}
.step{display:flex;align-items:center;background:var(--n1);border-radius:16px;height:56px;flex:none}
.step button{width:46px;height:56px;display:grid;place-items:center}

.flyer{position:absolute;z-index:80;pointer-events:none}
.shake{animation:shake .35s}

/* ---------- SACOLA ---------- */
.sac-top{display:flex;align-items:center;justify-content:space-between;padding:50px 16px 0}

.items{padding:6px 20px 0}
.it{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--n2);overflow:hidden;transition:max-height .3s var(--ease),opacity .25s,padding .3s;max-height:160px}
.it.gone{max-height:0;opacity:0;padding:0;border:0}

.it .ipr{font-size:22px}
.stp{display:flex;align-items:center;height:44px;border-radius:14px;background:var(--n1)}

.h3{font:800 24px/1 var(--fd);letter-spacing:-.035em;padding:20px 20px 12px}
.h3row{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}

.sug{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 4px;scrollbar-width:none}

.sg .pp{font-size:18px;margin-top:4px}
.recv{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.rc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:132px;padding:14px;border-radius:20px;background:var(--n1);transition:background .25s,color .25s,transform .12s}
.rc .i{margin-bottom:10px}
.rc b{font:700 15px/20px var(--fu)}
.rc span{font:14px/20px var(--fu);color:var(--n6)}
.rc .v{margin-top:auto;font:800 20px/24px var(--fd);letter-spacing:-.02em;color:var(--noite)}
.rc .ck{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:9px;background:var(--acento);color:var(--noite);display:none;place-items:center}
.rc.on{background:var(--noite);color:#fff}
.rc.on span{color:var(--n3)}
.rc.on .v{color:#fff}
.rc.on .ck{display:grid;color:var(--noite);animation:bump .35s var(--spring)}
.rc .ck .i{margin:0}
.rc.on .icb{color:#fff}.rc.on .icb .du{fill:var(--acento)}
.coupon{margin-top:8px}
.coupon .ic{background:var(--r1)}
.sum{margin:10px 20px 0;padding-top:14px;border-top:2px solid var(--noite)}
.sum .r{display:flex;justify-content:space-between;align-items:center;min-height:34px;font:15px/22px var(--fu);color:var(--n7)}
.sum .r>span:last-child{font-variant-numeric:tabular-nums;color:var(--noite);font-weight:600}
.info{width:24px;height:24px;border-radius:8px;background:var(--n1);font:800 13px/24px var(--fu);text-align:center;margin-left:6px;color:var(--n7);position:relative}
.info::after{content:"";position:absolute;inset:-10px}
.tot{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 0 6px}
.tot b{font:800 20px/1 var(--fd);letter-spacing:-.02em;padding-bottom:6px}
.price.xl2{font-size:52px}
.fine{display:flex;gap:8px;align-items:center;padding:14px 20px 150px;font:14px/20px var(--fu);color:var(--n6)}

/* ---------- PEDIDO CONFIRMADO ---------- */
.s-ok{background:var(--roxo);color:#fff}

.ok-bars i:nth-child(1){width:108px;margin-left:52px;animation-delay:.3s}
.ok-bars i:nth-child(2){width:178px;animation-delay:.36s}
.ok-bars i:nth-child(3){width:128px;margin-left:26px;animation-delay:.42s}
.ok-bag{position:absolute;left:220px;top:2px;width:136px;animation:bagDrop .75s var(--spring) .05s both}
.ok-check{position:absolute;left:310px;top:94px;width:54px;height:54px;border-radius:50%;background:var(--acento);color:var(--noite);display:grid;place-items:center;box-shadow:0 0 0 6px var(--roxo);animation:pop .5s var(--spring) .55s both}
.dc{position:absolute;display:block;animation:pop .5s var(--spring) both}
.ok-txt{position:absolute;left:20px;right:20px;top:268px;z-index:2}
.ok-txt h1{font:800 56px/.92 var(--fd);letter-spacing:-.055em;animation:rise .5s var(--ease) .2s both}

.ok-txt .eta-l{font:700 19px/24px var(--fu);margin-top:22px;animation:rise .5s var(--ease) .36s both}
.ok-txt .eta{font:800 52px/1 var(--fd);letter-spacing:-.05em;white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:2px;animation:rise .5s var(--ease) .42s both}
.ok-panel{position:absolute;z-index:3;left:0;right:0;bottom:0;background:var(--noite);border-radius:30px 30px 0 0;padding:20px 20px 26px;display:flex;flex-direction:column;gap:14px;animation:panelUp .55s var(--ease) .5s both}
.op-card{background:var(--n8);border-radius:20px;padding:4px 14px}
.op-row{display:flex;align-items:center;gap:12px;min-height:68px}
.op-row+.op-row{border-top:1px solid var(--n7)}
.op-row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.op-row b{display:block;font:700 16px/22px var(--fu)}
.op-row .t span{font:14px/20px var(--fu);color:var(--n3)}
.op-push{cursor:pointer}
.op-th{position:relative;flex:none;width:44px;height:44px}
.op-th i{position:absolute;width:30px;height:36px;border-radius:9px;background:var(--estudio);overflow:hidden;box-shadow:0 0 0 2px var(--n8)}
.op-th i:first-child{left:0;top:0}.op-th i:last-child{left:14px;top:8px}
.op-ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--n7);display:grid;place-items:center}
.txtbtn.ctr{align-self:center;padding:0 16px}
.btn.ctr{justify-content:center}
.swi{flex:none;position:relative;width:52px;height:32px;border-radius:16px;background:var(--n7);transition:background .2s}
.swi::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--spring),background .2s}
.swi[aria-checked=true]{background:var(--acento)}
.swi[aria-checked=true]::after{transform:translateX(20px);background:var(--noite)}
.cf{position:absolute;z-index:4;left:var(--x);top:var(--y);width:var(--w);height:var(--h);margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);background:var(--c);border-radius:var(--r);pointer-events:none;animation:cf 1.5s cubic-bezier(.12,.7,.35,1) var(--d) both}
.cf.tz{clip-path:polygon(0 0,100% 0,84% 100%,10% 100%)}

/* ---------- ACOMPANHAMENTO ---------- */
.trk{position:relative;padding:50px 20px 0;height:480px;color:#fff;flex:none}
.trk-bg{position:absolute;inset:0;background:var(--noite);clip-path:polygon(0 0,100% 0,100% calc(100% - 60px),0 100%)}
.trk>*:not(.trk-bg){position:relative}
.trk-top{display:flex;align-items:center;gap:12px;height:52px;z-index:2}
.trk-top b{flex:1;font:700 16px/1 var(--fu)}
.agora{display:flex;align-items:center;gap:10px;margin-top:18px;font:800 13px/16px var(--fu);letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
.pulse{position:relative;width:10px;height:10px;border-radius:50%;background:var(--acento)}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--acento);animation:pulse 1.6s ease-out infinite}
.trk h1{font:800 34px/1 var(--fd);letter-spacing:-.045em;margin-top:10px;max-width:220px;min-height:102px;z-index:2}
.trk-ill{position:absolute!important;right:6px;top:104px;width:172px;height:172px;z-index:1}
.trk-ill svg{width:100%;height:100%;overflow:visible}
.trk-ill.sw{animation:swapIn .45s var(--spring)}
.bob{animation:bob 2.4s ease-in-out infinite}
.seg{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:7px;margin-top:26px}
.seg i{position:relative;height:12px;border-radius:4px;background:var(--n5);transform:skewX(var(--lean));overflow:hidden;transition:background .3s}
.seg i.done{background:var(--roxo)}
.seg i.now{background:var(--acento)}
.seg i.now::after{content:"";position:absolute;top:0;bottom:0;left:0;width:7px;background:var(--noite);animation:slide 1.1s linear infinite}
.seg-l{display:flex;align-items:center;gap:8px;font:600 15px/22px var(--fu);color:var(--n3);margin-top:10px;white-space:nowrap}
.seg-l.r{justify-content:flex-end}
.seg-l::before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--acento);transform:skewX(var(--lean))}
.seg-l b{font:800 16px/22px var(--fu);color:#fff}
.tl li.now span{color:var(--r7);font-weight:700}
.trk .eta-l{font:600 16px/22px var(--fu);color:var(--n3);margin-top:16px}
.trk .eta{font:800 54px/1 var(--fd);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.code{margin:24px 20px 0;padding:18px;border-radius:24px;background:var(--n1)}
.code h2{font:800 22px/1.1 var(--fd);letter-spacing:-.03em}
.code p{font:14px/20px var(--fu);color:var(--n6);margin-top:4px}
.digits{display:flex;gap:8px;margin-top:14px}
.digits span{position:relative;flex:1;height:70px;border-radius:15px;background:#fff;font:800 40px/70px var(--fd);text-align:center;letter-spacing:-.03em}
.digits span::after{content:"";position:absolute;left:34%;right:34%;bottom:9px;height:4px;border-radius:2px;background:var(--roxo);transform:skewX(var(--lean))}
.tl-h{font:800 24px/1 var(--fd);letter-spacing:-.035em;padding:30px 20px 14px}
.tl{list-style:none;padding:0 20px}
.tl li{position:relative;display:flex;gap:16px;min-height:62px}
.tl li::before{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--n2)}
.tl li:last-child::before{display:none}
.tl li>i{position:relative;z-index:1;flex:none;width:26px;height:26px;border-radius:9px;background:var(--n2);display:grid;place-items:center;color:#fff;margin-top:1px}
.tl li.done>i{background:var(--roxo)}
.tl li.done::before{background:var(--roxo)}
.tl li.now>i{background:var(--noite);box-shadow:0 0 0 4px var(--acento)}
.tl b{display:block;font:700 16px/22px var(--fu)}
.tl span{font:14px/20px var(--fu);color:var(--n6)}
.tl li:not(.done):not(.now) b{color:var(--n6);font-weight:600}
.cardc{display:flex;align-items:center;gap:12px;margin:14px 20px 0;padding:16px;border-radius:22px;border:1px solid var(--n2)}
.cardc .t{flex:1;min-width:0}
.cardc b{display:block;font:700 16px/22px var(--fu)}
.cardc .t span{font:14px/20px var(--fu);color:var(--n6)}
.btn.wa{flex:none;height:48px;padding:0 14px;border-radius:14px;background:var(--noite);font-size:15px;justify-content:center}
.sim{display:block;margin:18px auto 44px;min-height:44px;font:600 14px/20px var(--fu);color:var(--n6);text-decoration:underline}

/* ---------- PEDIDOS ---------- */
.ped-h{font:800 52px/.92 var(--fd);letter-spacing:-.05em;padding:64px 20px 0}
.live{display:block;margin:20px 20px 0;padding:18px;border-radius:24px;background:var(--noite);color:#fff}
.lv-top{display:flex;align-items:center;gap:10px;font:700 15px/20px var(--fu)}
.lv-top b{flex:1}
.agora.sm{margin:0;font-size:12px;gap:8px}
.lv-h{display:block;font:800 26px/1.02 var(--fd);letter-spacing:-.035em;margin-top:14px}
.live .seg{margin-top:14px}.live .seg i{height:8px}
.lv-b{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}
.lv-l{display:block;font:13px/18px var(--fu);color:var(--n3)}
.lv-b b{display:block;font:800 24px/1 var(--fd);letter-spacing:-.03em;white-space:nowrap;margin-top:2px}
.btn.sm{height:44px;padding:0 16px;border-radius:14px;font-size:15px}
.ped-sec{font:800 26px/1 var(--fd);letter-spacing:-.035em;padding:32px 20px 0}
.ped-d{font:600 14px/20px var(--fu);color:var(--n6);padding:16px 20px 8px}
.oc2{margin:0 20px;border:1px solid var(--n2);border-radius:22px;overflow:hidden}
.oc2-h{display:flex;align-items:center;gap:12px;padding:16px 16px 0}
.oc2-h .t{flex:1;display:flex;flex-direction:column}
.oc2-h b{font:700 16px/22px var(--fu)}
.oc2-i{display:flex;align-items:center;gap:14px;padding:12px 16px 16px;font:14px/20px var(--fu);color:var(--n6)}
.oc2-i b{display:block;color:var(--noite);font:800 18px/24px var(--fu)}
.oc2-th{display:flex;flex:none}
.oc2-th i{position:relative;width:52px;height:60px;border-radius:14px;background:var(--estudio);overflow:hidden;box-shadow:0 0 0 3px #fff}
.oc2-th i+i{margin-left:-14px}
.oc2-a{display:grid;grid-template-columns:1fr 1.3fr;border-top:1px solid var(--n2)}
.oc2-a button{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px/20px var(--fu);color:var(--n7)}
.oc2-a .rp{border-left:1px solid var(--n2);color:var(--r7);font-weight:800}
.endpad{height:176px}

/* ---------- FOLHA "Seu endereço está certo?" ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(28,23,33,.55);animation:fadeIn .2s both}
.sheet{position:absolute;z-index:61;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:12px 20px 26px;display:flex;flex-direction:column;gap:12px;animation:panelUp .4s var(--ease) both}
.sheet:focus{outline:none}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--n3)}
.sheet h2{font:800 30px/1.02 var(--fd);letter-spacing:-.04em;margin-top:8px}
.sheet p{font:16px/24px var(--fu);color:var(--n7)}
.adc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:2px solid var(--noite);margin:4px 0}
.adc>span{display:flex;flex-direction:column}
.adc b{font:700 16px/22px var(--fu)}
.adc>span>span{font:14px/20px var(--fu);color:var(--n6)}

/* ---------- CARREGANDO (skeleton espelha o layout de cada tela) ---------- */
.sk{display:block;flex:none;background:var(--n2);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:rgba(255,255,255,.55);transform:translateX(-130%) skewX(var(--lean));animation:skw 1.3s var(--ease) infinite}
.sk.d{background:var(--n8)}.sk.d::after{background:rgba(255,255,255,.06)}
.sk.w{background:rgba(255,255,255,.22)}
.sk-cats{display:flex;gap:14px;align-items:flex-end;padding:34px 20px 6px;overflow:hidden}
.sk-col{display:flex;flex-direction:column;gap:8px;flex:none}
.sk-col.c{align-items:center}
.sk-row{display:flex;gap:14px;padding:20px 20px 0;overflow:hidden}
.sk-sh{display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px;margin-top:40px}
.sk-l{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.sk-g{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
.ld{display:flex;flex-direction:column;gap:9px;color:#fff}
.ld i{display:block;height:13px;border-radius:7px;background:currentColor;transform-origin:left;animation:ldb .9s var(--ease) infinite alternate}
.ld i:nth-child(1){width:34px;margin-left:18px}.ld i:nth-child(2){width:72px;animation-delay:.12s}.ld i:nth-child(3){width:50px;margin-left:12px;animation-delay:.24s}
.ok-load{position:absolute;left:20px;right:20px;top:300px}
.ok-load h1{font:800 44px/.98 var(--fd);letter-spacing:-.045em;margin-top:28px}
.ok-load p{font:600 17px/24px var(--fu);margin-top:12px;max-width:290px}

/* ---------- OBJETOS (folha de revisão do sistema de ilustração) ---------- */
.obj-h{font:800 46px/.95 var(--fd);letter-spacing:-.045em;padding:16px 20px 0}
.obj-p{font:15px/22px var(--fu);color:var(--n6);padding:8px 20px 0}
.obj-s{font:800 22px/1 var(--fd);letter-spacing:-.03em;padding:26px 20px 12px}
.obj-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:0 20px}
.obj-g figure{display:flex;flex-direction:column;gap:6px;font:600 13px/18px var(--fu);color:var(--n7)}
.obj-g .pl{position:relative;display:block;aspect-ratio:1/1;border-radius:18px;background:var(--bg,var(--estudio))}
.obj-g .pl .art{position:absolute;left:6%;top:6%;width:88%;height:88%}
.obj-g .dk .art{--g:rgba(0,0,0,.42)}

/* Toast */
.toast{position:absolute;z-index:90;left:16px;right:16px;bottom:100px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 8px 6px 16px;border-radius:16px;background:var(--noite);color:#fff;font:600 15px/20px var(--fu);animation:toastIn .4s var(--spring) both}
.toast button{min-height:44px;padding:0 10px;color:var(--acento);font:800 15px/20px var(--fu)}
.toast.out{animation:toastOut .3s var(--ease) both}

/* Movimento */
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes scrIn{from{opacity:0;transform:translateX(36px)}}
@keyframes scrInB{from{opacity:0;transform:translateX(-36px)}}
@keyframes scrOut{to{opacity:0;transform:translateX(-24px)}}
@keyframes shoeIn{from{opacity:0;transform:translate(110px,-40px) rotate(12deg)}}
@keyframes shapeIn{from{opacity:0;transform:translateY(30px) rotate(-14deg) scale(.9)}}
@keyframes swapIn{from{opacity:.2;transform:rotate(-4deg) scale(.9)}}
@keyframes stkIn{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
@keyframes hlIn{from{transform:skewX(var(--lean)) scaleX(0)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.28)}}
@keyframes barsIn{from{transform:scaleX(0)}}
@keyframes bagDrop{from{opacity:0;transform:translateY(-50px) rotate(-10deg)}}
@keyframes panelUp{from{transform:translateY(100%)}}
@keyframes barUp{from{transform:translateY(160%)}}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.8);opacity:0}}
@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(80px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(14px)}}
@keyframes skw{to{transform:translateX(330%) skewX(var(--lean))}}
@keyframes ldb{from{transform:scaleX(.25)}}
@keyframes cf{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.3)}8%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html.static *,html.static *::before,html.static *::after{animation:none!important;transition:none!important}

/* Modo de revisão: tela inteira, sem rolagem interna */
html.long body{display:block;padding:24px 0}
html.long #device{height:auto;margin:0 auto}
html.long #app,html.long .scr{position:relative;inset:auto}
html.long .scr{display:block;min-height:844px}
html.long .scroll{overflow:visible}
html.long .tab,html.long .bagbar,html.long .pbar{position:sticky}
html.long .bagbar{width:calc(100% - 24px);margin-left:12px}
html.long .rk{padding-bottom:28px}
html.long .endpad{height:28px}
html.long .s-ok{height:844px}

function tween(el,to,dur=450,fmt){if(!el)return;const from=parseFloat(el.dataset.v)||0;el.dataset.v=to;const f=fmt||priceIn;if(RM||Math.abs(from-to)<.001){el.innerHTML=f(to);return}const t0=performance.now();(function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.innerHTML=f(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else el.innerHTML=f(to)})(t0)}

produto:()=>`<section class="scr s-prod" data-r="produto" aria-busy="true">${sb(false)}
<div class="topbtns"><button class="ib" aria-label="Voltar" onclick="back('loja')">${ic('left',24)}</button></div>
<div class="scroll"><div class="stage"><i class="sk" style="position:absolute;left:70px;top:70px;width:250px;height:250px;border-radius:40px;transform:rotate(-6deg)"></i></div>
 <div class="psheet"><div class="sk-l" style="padding:0;gap:12px">${sk('150px',20,6)}${sk('300px',30,8)}${sk('200px',30,8)}${sk('160px',54,10)}</div>
 <div class="og"><div class="sk-l" style="padding:0;gap:6px">${sk('60px',16,6)}${sk('110px',12,6)}</div></div>
 <div class="cols">${sk('100%',100,18)}${sk('100%',100,18)}${sk('100%',100,18)}</div></div>
</div><div class="pbar"><div class="step" style="width:138px"></div><span class="btn off" style="flex:1"><span>Carregando</span></span></div>${SKL}</section>`,
sacola:()=>`<section class="scr s-sac" data-r="sacola" aria-busy="true">${sb(false)}<div class="scroll">
 <div class="sac-top"><button class="ib soft" aria-label="Voltar" onclick="back('inicio')">${ic('left',24)}</button></div>
 <h1>Sua sacola</h1>
 <div class="sk-l" style="margin-top:18px">${sk('170px',20,6)}</div>
 ${[0,1].map(()=>`<div class="sk-row" style="padding-top:18px">${sk('90px',112,18)}<span class="sk-col" style="flex:1;gap:10px">${sk('80%',18,6)}${sk('40%',14,6)}<span style="flex:1"></span>${sk('100%',44,14)}</span></div>`).join('')}
 <div class="sk-l" style="margin-top:30px">${sk('160px',24,8)}</div>
 <div class="sk-row" style="padding-top:12px">${sk(W2,132,20)}${sk(W2,132,20)}</div>
</div><div class="pbar"><span class="btn full off"><span>Calculando o total</span></span></div>${SKL}</section>`,
confirmado:()=>`<section class="scr s-ok" data-r="confirmado" aria-busy="true">${sb(true)}
<div class="ok-load" role="status"><div class="ld" aria-hidden="true"><i></i><i></i><i></i></div><h1>Confirmando seu pagamento</h1><p>Leva poucos segundos. Se fechar o app, o pedido continua valendo.</p></div></section>`,
acompanha:()=>`<section class="scr s-trk" data-r="acompanha" aria-busy="true">${sb(true,'18:15')}<div class="scroll">
 <header class="trk"><div class="trk-bg"></div><div class="trk-top"><button class="ib dk2" aria-label="Voltar" onclick="back('inicio')">${ic('left',24)}</button><b>Pedido #4821</b></div>
 <div class="sk-l" style="padding:0;margin-top:22px;gap:12px">${sk('110px',14,6,'d')}${sk('200px',34,8,'d')}${sk('160px',34,8,'d')}</div>
 <div class="seg">${'<i></i>'.repeat(5)}</div>
 <div class="sk-l" style="padding:0;margin-top:14px;gap:12px">${sk('180px',16,6,'d')}${sk('120px',16,6,'d')}${sk('290px',50,10,'d')}</div></header>
 <div class="code">${sk('170px',22,8,'w')}<div class="digits">${'<span></span>'.repeat(4)}</div></div>
</div>${SKL}</section>`,
pedidos:()=>`<section class="scr s-ped" data-r="pedidos" aria-busy="true">${sb(false)}<div class="scroll"><h1 class="ped-h">Pedidos</h1>
 <div class="sk-l" style="margin-top:20px">${sk('100%',178,24)}</div>
 <div class="sk-l" style="margin-top:32px">${sk('150px',26,8)}</div>
 ${[0,1].map(()=>`<div class="sk-l" style="margin-top:18px">${sk('120px',14,6)}${sk('100%',190,22)}</div>`).join('')}
</div>${SKL}${tabbar('pedidos')}</section>`
};

/* ---------- ESTADO DA INÍCIO: "Seu endereço está certo?" (?endereco=1) ----------
 Aparece quando o endereço salvo fica longe da localização atual do aparelho (> 1 km). Uma vez por sessão. */
function addrSheet(host){if(!host||$('#sheet'))return;host.insertAdjacentHTML('beforeend',`<div class="scrim" id="scrim" onclick="closeSheet()"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" tabindex="-1"><i class="grab" aria-hidden="true"></i><h2 id="shT">Seu endereço está certo?</h2><p>Você está a 3,2 km deste endereço agora. Confira antes de pedir para a entrega chegar no lugar certo.</p><div class="adc">${ic('pin',28,'icb')}<span><b>Rua das Palmeiras, 120</b><span>Jardim Silvia, Francisco Morato · Casa</span></span></div><button class="btn full ctr" onclick="closeSheet();toast('Abre a lista de endereços salvos')">Trocar endereço</button><button class="txtbtn ctr" onclick="closeSheet()">Continuar com este</button></div>`);$('#sheet').focus({preventScroll:true})}
function closeSheet(){['#scrim','#sheet'].forEach(s=>{const e=$(s);if(e)e.remove()})}

/* ---------- Roteador e transições ---------- */
const R={inicio,loja,produto,sacola,confirmado,acompanha,pedidos,objetos};
const LOAD=Q.has('carregando');
const AFTER={};
let HIST=[];
function go(r){if(location.hash.slice(1)===r)show();else location.hash=r}
function back(f){if(HIST.length>1){history.back()}else go(f)}
function show(){
 const r=(location.hash.slice(1)||'inicio');if(!R[r])return;
 CART=CART.filter(Boolean);
 const isBack=HIST.length>1&&HIST[HIST.length-2]===r;
 if(isBack)HIST.pop();else if(HIST[HIST.length-1]!==r)HIST.push(r);
 const app=$('#app'),old=app.querySelector('.scr:not(.out)');
 const sk0=LOAD&&SK[r];
 const tmp=document.createElement('div');tmp.innerHTML=sk0?SK[r]():R[r]();const el=tmp.firstElementChild;
 if(old)el.classList.add(FLIP?'in-fade':isBack?'in-back':'in');
 app.appendChild(el);
 if(old){old.classList.add('out');setTimeout(()=>old.remove(),(RM||LONG)?0:340)}
 document.querySelectorAll('#dnav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+r));
 if(sk0)return;
 (AFTER[r]||(()=>{}))(el);
 if(r==='inicio'&&Q.has('endereco')&&!SEEN_ADDR){SEEN_ADDR=true;addrSheet(el)}
}
let SEEN_ADDR=false;
window.addEventListener('hashchange',show);

function onMini(el,th,light){const sc=el.querySelector('.scroll'),mini=el.querySelector('.mini'),tb=el.querySelector('.topbtns'),sbar=el.querySelector('.sb');if(!sc||!mini)return;sc.addEventListener('scroll',()=>{const on=sc.scrollTop>th;mini.classList.toggle('on',on);if(tb)tb.classList.toggle('hide',on);if(light&&sbar)sbar.classList.toggle('dk',!on)},{passive:true})}

/* Início */
AFTER.inicio=el=>onMini(el,250,false);

/* Loja */
AFTER.loja=el=>{
 onMini(el,250,true);
 const nav=el.querySelector('#stabs'),sc=el.querySelector('.scroll');
 const place=()=>{const a=nav.querySelector('a.on'),ind=nav.querySelector('.ind');ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px'};
 requestAnimationFrame(place);
 nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const t=el.querySelector('#'+a.dataset.t);sc.scrollTo({top:t.offsetTop-150,behavior:RM?'auto':'smooth'});nav.querySelectorAll('a').forEach(b=>b.classList.toggle('on',b===a));place();hap(8)}));
 sc.addEventListener('scroll',()=>{let cur=null;nav.querySelectorAll('a').forEach(a=>{const t=el.querySelector('#'+a.dataset.t);if(t.offsetTop-170<=sc.scrollTop)cur=a});if(cur&&!cur.classList.contains('on')){nav.querySelectorAll('a').forEach(b=>b.classList.toggle('on',b===cur));place()}},{passive:true});
 const st=el.querySelector('#stR');if(!RM)st.textContent='0,0';st.dataset.v=0;setTimeout(()=>tween(st,4.7,700,v=>v.toFixed(1).replace('.',',')),RM?0:350);
};
function toProd(card){const pl=card.querySelector('.pl');if(pl&&!RM){const r=pl.getBoundingClientRect();FLIP={l:r.left,t:r.top,w:r.width,h:r.height}}go('produto')}
function quickAdd(btn,id){if(NEEDS_VAR[PR[id].k]){toProd(btn.closest('.pc'));return}hap(10);btn.classList.add('ok');btn.innerHTML=ic('check',22);btn.setAttribute('aria-label','Adicionado');const ex=CART.find(x=>x.id===id);ex?ex.q++:CART.push({id,v:id==='p18'?'Caramelo':'Tamanho único',q:1});const bar=$('#bagbar');if(bar){const b=bar.querySelector('#bbN');b.textContent=count();b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');bar.querySelector('.bb-t span').textContent='Moda Prima · '+count()+' itens';tween(bar.querySelector('#bbP'),subt())}toast(PR[id].n+' na sacola',['Desfazer',()=>{const x=CART.find(y=>y.id===id);if(x){x.q--;if(!x.q)CART.splice(CART.indexOf(x),1)}btn.classList.remove('ok');btn.innerHTML=ic('plus',22);const b=$('#bbN');if(b)b.textContent=count();tween($('#bbP'),subt())}])}
function fav(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);hap(on?12:6);if(on)toast('Salvo nos favoritos')}

/* Produto */
AFTER.produto=el=>{const a=el.querySelector('#prodArt');if(!FLIP||RM){FLIP=null;return}const s=FLIP;FLIP=null;const t=a.getBoundingClientRect();a.style.transformOrigin='0 0';a.style.transition='none';a.style.transform=`translate(${s.l-t.left}px,${s.t-t.top}px) scale(${s.w/t.width},${s.h/t.height})`;requestAnimationFrame(()=>requestAnimationFrame(()=>{a.style.transition='transform .45s cubic-bezier(.2,.8,.2,1)';a.style.transform='';setTimeout(()=>{a.style.transformOrigin='';a.style.transition=''},500)}))};
function setColor(i){PS.c=i;const outs=P1.out[P1.colors[i][0]];if(PS.s>=0&&outs.includes(P1.sizes[PS.s])){PS.s=-1;toast('O tamanho escolhido acabou nesta cor. Escolha outro.')}$('#opts').innerHTML=prodOpts();addBtnState();const a=$('#prodArt');a.innerHTML=art('tee',P1.colors[i][1]);a.setAttribute('aria-label','Foto 1 de 3: camiseta '+P1.colors[i][0].toLowerCase()+', frente');a.classList.remove('sw');void a.offsetWidth;a.classList.add('sw');hap(8)}
function setSize(i,out){if(out){toast('Esse tamanho acabou nesta cor. Veja outra cor ou tamanho.');const z=$('#sz');z.classList.remove('shake');void z.offsetWidth;z.classList.add('shake');hap(30);return}PS.s=i;$('#opts').innerHTML=prodOpts();addBtnState();hap(8)}
function needSize(){const sc=$('#sc'),g=$('#ogS');if(sc&&g)sc.scrollTo({top:g.offsetTop+g.offsetParent.offsetTop-120,behavior:RM?'auto':'smooth'});const z=$('#sz');z.classList.remove('shake');void z.offsetWidth;z.classList.add('shake');hap(30);toast('Escolha um tamanho para adicionar à sacola.')}
function pq(d){PS.q=Math.max(1,Math.min(9,PS.q+d));$('#pqv').textContent=PS.q;tween($('#addP'),PR.p1.p*PS.q,350,money);hap(6)}
function addToBag(btn){if(btn.classList.contains('done')){go('sacola');return}if(PS.s<0){needSize();return}hap(15);const art0=$('#prodArt'),bag=$('#bagBtn');fly(art0,bag);setTimeout(()=>{const v=P1.colors[PS.c][0]+' · '+P1.sizes[PS.s];const ex=CART.find(x=>x.id==='p1'&&x.v===v);ex?ex.q+=PS.q:CART.unshift({id:'p1',v,q:PS.q});const b=bag.querySelector('.badge');b.textContent=count();b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');bag.setAttribute('aria-label','Sacola: '+count()+' itens')},RM?0:520);btn.classList.add('done');btn.innerHTML=`<span>${ic('check',20)}Na sacola</span><span class="bp">Ver sacola ${ic('right',18)}</span>`}
function fly(src,dst){if(RM||!src||!dst)return;const app=$('#app').getBoundingClientRect(),a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();const c=document.createElement('div');c.className='flyer';c.innerHTML=src.innerHTML;Object.assign(c.style,{left:(a.left-app.left)+'px',top:(a.top-app.top)+'px',width:a.width+'px',height:a.height+'px'});$('#app').appendChild(c);const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);c.animate([{transform:'translate(0,0) scale(1) rotate(-4deg)',opacity:1},{transform:`translate(${dx*.55}px,${dy*.35-50}px) scale(.42) rotate(-12deg)`,opacity:1,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(.06) rotate(-24deg)`,opacity:.3}],{duration:560,easing:'cubic-bezier(.45,0,.65,1)'}).onfinish=()=>c.remove()}

/* Sacola */
function updTotals(){tween($('#sTot'),total());tween($('#ctaT'),total(),450,money);$('#sSub').textContent=money(subt());$('#sFee').textContent=RECV==='entrega'?money(FEE):'Grátis';$('#sacN').textContent='· '+count()+' itens';$('#sSubL').textContent='Subtotal ('+count()+' itens)'}
function sugAdd(btn,id){const p=PR[id];if(NEEDS_VAR[p.k]){toast('Escolha o tamanho de '+p.n+' na ficha do produto.');return}hap(10);CART=CART.filter(Boolean);const ex=CART.find(x=>x.id===id);ex?ex.q++:CART.push({id,v:'Tamanho único',q:1});$('#items').innerHTML=CART.map(itemRow).join('');updTotals();btn.classList.add('ok');btn.innerHTML=ic('check',20);btn.setAttribute('aria-label','Adicionado');toast(p.n+' na sacola',['Desfazer',()=>{const x=CART.find(y=>y.id===id);if(x){x.q--;if(!x.q)CART.splice(CART.indexOf(x),1)}$('#items').innerHTML=CART.map(itemRow).join('');updTotals();btn.classList.remove('ok');btn.innerHTML=ic('plus',20)}])}
function iq(i,d){const x=CART[i];if(!x)return;hap(6);if(x.q+d<=0){const row=$('#it'+i),removed=CART[i];row.classList.add('gone');CART[i]=null;setTimeout(()=>{updTotalsSafe()},10);toast(PR[removed.id].n+' saiu da sacola',['Desfazer',()=>{CART[i]=removed;row.classList.remove('gone');updTotalsSafe()}]);return}x.q+=d;const row=$('#it'+i);row.outerHTML=itemRow(x,i);updTotalsSafe()}
function updTotalsSafe(){const keep=CART;CART=keep.filter(Boolean);updTotals();CART=keep}
function setRecv(m){if(RECV===m)return;RECV=m;hap(8);document.querySelectorAll('.rc').forEach((b,i)=>{const on=(i===0)===(m==='entrega');b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});updTotalsSafe()}

/* Confirmado */
AFTER.confirmado=el=>{hap(20);if(RM)return;setTimeout(()=>confetti(el.querySelector('#cfx'),337,213),520)};
function confetti(host,ox,oy){const cols=['#FFFFFF','var(--acento)','#1C1721','#E198EC'];let h='';for(let i=0;i<30;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.7,d=120+Math.random()*190;const tx=Math.cos(a)*d,ty=Math.sin(a)*d+200+Math.random()*160;const t=i%3;const w=t===0?24:t===1?11:16,hh=t===0?8:t===1?11:12;const rad=t===0?'4px':t===1?'50%':'2px';h+=`<i class="cf ${t===2?'tz':''}" style="--x:${ox}px;--y:${oy}px;--w:${w}px;--h:${hh}px;--r:${rad};--c:${cols[i%4]};--tx:${tx|0}px;--ty:${ty|0}px;--rot:${(Math.random()*600-300)|0}deg;--d:${(Math.random()*140)|0}ms"></i>`}host.innerHTML=h;setTimeout(()=>host.innerHTML='',1900)}
function pushT(){const s=$('#swi');const on=s.getAttribute('aria-checked')!=='true';s.setAttribute('aria-checked',on);hap(10);$('#pushS').textContent=on?'Pronto. A gente avisa a cada etapa.':'Só sobre este pedido. Sem propaganda.'}

/* Acompanhamento */
function nextStage(){STAGE=STAGE>=4?1:STAGE+1;const s=STAGES[STAGE];hap(12);$('#tH').textContent=s.h;$('#tNow').textContent='Agora · '+s.now;$('#tL').outerHTML=segL();const sg=$('#seg');sg.innerHTML=segHtml();sg.setAttribute('aria-label',`Etapa ${STAGE+1} de 5: ${s.l}`);const ill=$('#tI');ill.innerHTML=ILL[s.ill];ill.classList.remove('sw');void ill.offsetWidth;ill.classList.add('sw');$('#tl').innerHTML=tlHtml()}

/* Toast */
function toast(msg,act){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span>${msg}</span>${act?`<button>${act[0]}</button>`:''}`;if(act)t.querySelector('button').onclick=()=>{act[1]();t.remove()};$('#app').appendChild(t);setTimeout(()=>t.classList.add('out'),3200);setTimeout(()=>t.remove(),3550)}

/* CSS da duotone com acento dentro das ilustrações */
const fx=document.createElement('style');fx.textContent='.fa{fill:var(--acento)}';document.head.appendChild(fx);
show();
</script>
</body>
