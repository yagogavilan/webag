<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: vídeo Stories 15 s para LOJISTA (1080 x 1920, 30 fps), v2.2 "Só retirando, tá?"</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="social.css">
<link rel="stylesheet" href="video.css">
<style>
/* Contrato com o render: palco 1080x1920, window.__duration = 15, window.__fps = 30, window.setTime(t) devolve Promise (video-engine.js).
   Um público (quem tem loja), uma ideia ("Venda além da sua rua."), uma ação ("Chame no direct.").
   v2.2: as cenas 3 e 4 mostram o CLIPE REAL do painel (src/clips/painel-pedido-novo.mp4, 1920x1080, 4 s) recortado no alerta "Pedido novo".
   Por que recorte e não o 16:9 inteiro: a 912 px de largura o painel inteiro sai a 0,475x (texto de 16 px vira 8 px). O alerta ocupa 440 x 464 pt do painel
   e some o resto do fundo (que traz "Pago no app" e códigos de outros pedidos).
   RECORTE (clipe 1920x1080; o painel foi gravado em 1440x810 pt a 4/3; alerta centrado na tela): alerta em x 667 a 1253, y 231 a 849 do clipe.
   Recorte x 673 a 1247, y 241 a 839 (574 x 598), janela 836 x 871 (k = 836/574 = 1,4564): vídeo 2796,4 x 1573 px, left -980,2, top -351,0.
   Moldura interna de 6 px (--bd) esconde 1 a 2 px de erro do recorte. A faixa branca .strip (33 px) cobre a ponta do "Recusar" que vaza do alerta real (bug do painel).
   Cronologia do clipe (calculada do script clip-painel.mjs): 0 a 1,0 s fila (NÃO usada: mostra "Pago no app"); alerta em 1,0 s; cursor parte em 2,2 s e chega ao
   "Aceitar" em 3,1 s; aperta em 3,3 a 3,55 s; depois do clique o alerta fecha e aparece a fila de novo (NÃO usada). Cena 3 = clipe 1,07 a 2,57 s; cena 4 = 2,57 s em diante.
   Em 6,93 s (clipe 3,5 s) um painel lima com "Pedido aceito." cobre a janela inteira: é tipografia desenhada no lugar da fila.
   Margens seguras do Stories: topo 250 px, base 340 px, laterais 84 px. Todo texto fica entre y=290 e y=1500.
   Larguras (Bricolage 800, 0,53 em/car.): "Só retirando," a 112 px = 772 + padding; "sua rua." a 210 px = 890; "além da" a 210 px = 838; "Chegou"/"pedido." a 190 px <= 760;
   "Aceita com" a 150 px = 795; "separa." a 210 px = 779; "O Webag" a 210 px = 779; "Tem loja?" a 180 px = 858; "Chame no" a 150 px = 636. Todas <= 912. */
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }

#b1 { left: 84px; top: 400px; font-size: 76px; transform-origin: 0 100%; }
#b2 { left: 84px; top: 600px; font-size: 76px; transform-origin: 0 100%; }
#b3 { right: 84px; top: 960px; font-size: 112px; transform-origin: 100% 100%; }
#h2 { top: 520px; font-size: 210px; }
#h3 { top: 290px; font-size: 190px; }
#h4 { top: 290px; font-size: 150px; }
#c3, #c4 { left: 84px; top: 690px; width: 836px; height: 871px; --sh: var(--lima); --bd: var(--noite); }
#slot3 video, #slot4 video { width: 2796.4px; height: 1573px; left: -980.2px; top: -351px; }
#h5 { top: 300px; font-size: 210px; }
#h6 { top: 300px; font-size: 210px; }
#tw5 { position: absolute; left: 84px; top: 900px; width: 480px; height: 480px; transform: rotate(-4deg); }
#t5 { left: 0; top: 0; width: 480px; height: 480px; box-shadow: 14px 14px 0 var(--roxo); }
#t6 { left: 84px; top: 860px; width: 600px; height: 600px; }
#logo7 { position: absolute; left: 84px; top: 300px; width: 560px; height: 154px; }
#h7 { top: 520px; font-size: 180px; }
#cta7 { top: 800px; }
#cta7 p { font-size: 150px; }
#esc7 { top: 1250px; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1  0,0 a 3,0 s  GANCHO: a conversa que o lojista já viveu. Quadro 0 já tem "Tem no 38?" (84 px de margem, 76 px de texto). As outras bolhas aparecem em 0,35 s e 0,85 s. -->
  <section class="sc bgn" id="s1">
    <div class="bub in" id="b1">Tem no 38?</div>
    <div class="bub in" id="b2">Moro longe.<br>Dá pra entregar?</div>
    <div class="bub out" id="b3">Só retirando,<br>tá?</div>
  </section>

  <!-- 2  3,0 a 4,5 s  A PROMESSA (antes dos 4 s) -->
  <section class="sc bgl" id="s2">
    <h2 class="d vh" id="h2">
      <span class="ln" id="l2a">Venda</span>
      <span class="ln" id="l2b"><span class="mk inv"><span>além</span></span> da</span>
      <span class="ln" id="l2c">sua rua.</span>
    </h2>
  </section>

  <!-- 3  4,5 a 6,0 s  PEDIDO NOVO: o alerta REAL do painel (clipe 1,07 a 2,57 s) sobe e vibra (o painel apitou). Camiseta + bermuda, R$ 135,80, "Responda em ..." e "Aceitar". -->
  <section class="sc bgr" id="s3">
    <h2 class="d vh" id="h3"><span class="ln" id="l3a">Chegou</span><span class="ln" id="l3b">pedido.</span></h2>
    <div class="win" id="c3" aria-hidden="true"><div class="vslot" id="slot3"></div><div class="strip"></div></div>
  </section>

  <!-- 4  6,0 a 8,0 s  ACEITA: continua o mesmo clipe (2,57 s em diante): o cursor real vai ao "Aceitar", aperta (6,73 a 6,98 s). Em 6,93 s entra o painel lima "Pedido aceito." -->
  <section class="sc bgr" id="s4">
    <h2 class="d vh" id="h4"><span class="ln" id="l4a">Aceita com</span><span class="ln" id="l4b">um toque.</span></h2>
    <div class="win" id="c4" aria-hidden="true"><div class="vslot" id="slot4"></div><div class="strip"></div><div class="acc" id="acc4"><span>Pedido<br>aceito.</span></div></div>
  </section>

  <!-- 5  8,0 a 9,5 s  VOCÊ SEPARA (a loja separando: etapa do kit) -->
  <section class="sc bgl" id="s5">
    <h2 class="d vh" id="h5"><span class="ln" id="l5a">Você</span><span class="ln" id="l5b">separa.</span></h2>
    <div id="tw5"><div class="tile" id="t5"><img src="assets/etapa-separando.svg" alt=""></div></div>
  </section>

  <!-- 6  9,5 a 11,5 s  O WEBAG LEVA (depende do parecer J8: pendencias IJ1) -->
  <section class="sc bgn" id="s6">
    <h2 class="d vh l" id="h6"><span class="ln" id="l6a">O Webag</span><span class="ln" id="l6b">leva.</span></h2>
    <div class="tile" id="t6"><img src="assets/etapa-a-caminho.svg" alt=""></div>
  </section>

  <!-- 7  11,5 a 15,0 s  CTA ÚNICO: "Chame no direct." (em 12,0 s). "Em breve", sem data. -->
  <section class="sc bgr" id="s7">
    <img id="logo7" src="assets/webag-logo-branca.svg" alt="Webag">
    <h2 class="d vh" id="h7"><span class="ln" id="l7a">Tem loja?</span></h2>
    <div class="cta-box" id="cta7"><p><span>Chame no</span><span>direct.</span></p></div>
    <p class="esc" id="esc7">Cadastro de lojas em breve.<br>Francisco Morato e região.</p>
  </section>

</div>

<script src="video-engine.js"></script>
<script>
WBVideo({
  duration: 15,
  fps: 30,
  // cortes em múltiplos de 0,5 s (120 BPM, 1 batida = 0,5 s). Para casar com outra trilha, mude só estes valores.
  cuts: [0, 3, 4.5, 6, 8, 9.5, 11.5, 15],
  // clipe real do painel (src/clips/painel-pedido-novo.mp4). inn = segundo do clipe no 1º quadro da cena. Cortes visíveis: 6 de cena + o alerta que abre + o
  // "Pedido aceito." que cobre a janela = 8.
  clips: [
    { slot: 'slot3', scene: 3, base: 'clips/painel-pedido-novo', inn: 1.07 },
    { slot: 'slot4', scene: 4, base: 'clips/painel-pedido-novo', inn: 2.57 }
  ],
  tracks: function (h) {
    var tr = h.tr, snap = h.snap, rise = h.rise, bump = h.bump, pop = h.pop;
    // 1: bolha 1 já no quadro 0; as outras entram (opacidade + escala a partir de 88% e 80%)
    snap('b1', 0.00, 10, 0.10);
    pop('b2', 0.35, 0.22, 0.88);
    pop('b3', 0.85, 0.28, 0.80);
    // 2: título já no corte; "além da" salta de 92% a 100%
    snap('l2a', 3.0, 10); snap('l2b', 3.0, 10); snap('l2c', 3.0, 10);
    bump('l2b', 3.0, 0.20, 0.92);
    // 3: o cartão sobe 90 px em 0,2 s e vibra por 0,2 s (5 deslocamentos de 0,04 s): o painel apitou
    snap('l3a', 4.5, 10); snap('l3b', 4.5, 10);
    tr('c3', 'y', 4.50, 0.20, 90, 0, 'out5');
    tr('c3', 'x', 4.70, 0.04, 0, -14, 'lin');
    tr('c3', 'x', 4.74, 0.04, -14, 12, 'lin');
    tr('c3', 'x', 4.78, 0.04, 12, -8, 'lin');
    tr('c3', 'x', 4.82, 0.04, -8, 5, 'lin');
    tr('c3', 'x', 4.86, 0.04, 5, 0, 'lin');
    // 4: o título muda no corte; a janela NÃO se move (é o mesmo alerta da cena 3). O toque é o cursor real do clipe.
    //    O painel lima "Pedido aceito." cobre a janela em 6,93 s (clipe 3,5 s), antes do alerta fechar no clipe (3,55 s), e fica até 8,0 s.
    snap('l4a', 6.0, 10); snap('l4b', 6.0, 10);
    tr('acc4', 'o', 6.93, 0.04, 0, 1, 'lin');
    // 5: título no corte; a ilustração salta de 85%
    snap('l5a', 8.0, 10); snap('l5b', 8.0, 10);
    bump('t5', 8.0, 0.25, 0.85);
    // 6: título no corte; a moto entra da esquerda em 0,35 s (é o "leva")
    snap('l6a', 9.5, 10); snap('l6b', 9.5, 10);
    tr('t6', 'x', 9.5, 0.35, -140, 0, 'out5');
    // 7: logo e "Tem loja?" no corte; o CTA sobe em 12,0 s (opaco em 12,13 s, legível por 2,9 s); escopo em 12,4 s
    snap('logo7', 11.5, 8);
    bump('l7a', 11.5, 0.18, 0.92);
    rise('cta7', 12.0, 60, 0.22);
    rise('esc7', 12.4, 14, 0.14);
  }
});
</script>
</body>
</html>
