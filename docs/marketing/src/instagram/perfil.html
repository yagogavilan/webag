<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: foto de perfil (1080 x 1080), v2</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../social.css">
<style>
/* v2: símbolo MAIOR (escala 5,5 em vez de 4,4: 880 x 572 px, ~81% da largura) para sobreviver a 40 px.
   A 40 px a barra do meio tem ~2,9 px de espessura (14 u x 5,5 / 1080 x 40) e a sacola ocupa ~32 x 21 px.
   Mesmo desenho e mesma cor do ícone do app (branco sobre roxo): perfil e loja de apps se reconhecem.
   O Instagram corta em círculo (raio 540). Ponto mais distante do centro: ~435 px (extremo esquerdo da barra do meio), dentro do raio.
   Centro ótico: a massa da sacola fica no terço de baixo do símbolo, então o desenho sobe ~26 px em relação ao centro geométrico da caixa. */
html, body { width: 1080px; height: 1080px; overflow: hidden; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
</style>
</head>
<body>
<main class="avatar perfil" role="img" aria-label="Webag: símbolo da sacola em branco sobre fundo roxo">
  <svg viewBox="0 0 1080 1080" aria-hidden="true">
    <defs>
      <mask id="wb-ol" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="104">
        <rect width="160" height="104" fill="#FFFFFF"/>
        <circle cx="80" cy="52" r="4.5" fill="#000000"/>
        <circle cx="132" cy="52" r="4.5" fill="#000000"/>
      </mask>
      <symbol id="s-sym" viewBox="0 0 160 104" fill="#FFFFFF">
        <rect x="24" y="34" width="23" height="14" rx="7"/>
        <rect x="0" y="62" width="49" height="14" rx="7"/>
        <rect x="18" y="90" width="34" height="14" rx="7"/>
        <g mask="url(#wb-ol)">
          <polygon points="67,43 145,43 133,95 72,95" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
          <path d="M80 42 A26 30 0 0 1 132 42" fill="none" stroke="#FFFFFF" stroke-width="14"/>
        </g>
      </symbol>
    </defs>
    <use href="#s-sym" x="108" y="214" width="880" height="572"/>
  </svg>
</main>
</body>
</html>
