<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: post 2 (cliente) "Não deu pra passar na loja?" (1080 x 1350), v2.2 com captura real</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../social.css">
<style>
html, body { width: 1080px; height: 1350px; overflow: hidden; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }

/* v2.2: a prova é a CAPTURA REAL do acompanhamento (src/capturas/app-acompanhamento.png, 1170x2532), montada em 3 faixas da mesma imagem.
   Escala s = 849/1170 = 0,7256 (largura 849 px). Faixas (y da captura -> altura no post):
     A  y 252 a 650   (398 px -> 289): topo do cartão escuro: "Etapa 4 de 5 . A caminho", "Saiu para entrega", moto
     B1 y 1152 a 1297 (145 px -> 105): barra de progresso e a base do cartão
     B2 y 1808 a 2270 (462 px -> 335): linha do tempo, 3 últimas etapas (Aguardando motoboy, Saiu para entrega, Entregue)
   O que ficou de fora de propósito: a faixa "Chega entre 22:11 - 22:34" (y 650 a 1152, entre A e B1; é horário previsto, regra 7 da direção criativa), o número do pedido (cabeçalho)
   e as 2 primeiras etapas. O fundo do cartão é chapado, então a emenda A/B1 não aparece. Área: 849 x 729 = 619 mil px = 42% do post. Texto da UI: 34 px (linha do tempo) a 58 px ("Saiu para entrega").
   Eixo vertical: eyebrow 128 a 192; título 204 a 410; imagem 432 a 1161 (sombra até 1173); bloco final 1196 a ~1304. */
.p2 .eyebrow { position: absolute; left: 72px; top: 128px; font: 800 56px/64px var(--texto); color: var(--lima); }
.p2 h1 { position: absolute; left: 72px; top: 204px; font-size: 112px; }
.p2 .shot { position: absolute; left: 159px; top: 432px; width: 849px; height: 729px; border-radius: 28px; overflow: hidden; background: var(--papel); box-shadow: 12px 12px 0 var(--noite); }
.p2 .shot .sl { position: absolute; left: 0; width: 849px; overflow: hidden; }
.p2 .shot .sl img { position: absolute; left: 0; width: 849px; height: 1837.3px; max-width: none; }
.p2 .shot #sa { top: 0; height: 289px; }
.p2 .shot #sa img { top: -182.9px; }
.p2 .shot #sb { top: 289px; height: 105px; }
.p2 .shot #sb img { top: -835.9px; }
.p2 .shot #sc { top: 394px; height: 335px; }
.p2 .shot #sc img { top: -1311.9px; }
.p2 .fecho { position: absolute; left: 72px; top: 1196px; }
.p2 .fecho .sub { font: 800 52px/1.1 var(--texto); color: var(--branco); }
.p2 .fecho .cta { position: static; margin-top: 4px; font-size: 44px; color: var(--lima); }
</style>
</head>
<body>
<main class="post roxo p2" role="img" aria-label="Voltando do trabalho. Não deu pra passar na loja? Captura do app Webag com o acompanhamento de um pedido: Saiu para entrega, etapa 4 de 5, e a linha do tempo com Aguardando motoboy, Saiu para entrega e Entregue. Peça sem sair do lugar. Siga para saber quando abrir. Webag, em breve.">

  <!-- Ideia: a pergunta na voz do cliente, sem hora; a resposta é pedir sem sair do lugar e acompanhar. Prova: captura real do app (loja de moda do seed), recortada.
       Sem faixa de horário, sem número do pedido, sem comida. "Saiu para entrega" / "A caminho" dependem do parecer J8 (pendencias IJ1). -->
  <img class="logo" src="../assets/webag-logo-branca.svg" alt="Webag">
  <div class="emb">Em breve</div>

  <p class="eyebrow">Voltando do trabalho.</p>
  <h1 class="d"><span>Não deu pra</span><span>passar na loja?</span></h1>

  <div class="shot" aria-hidden="true">
    <div class="sl" id="sa"><img src="../capturas/app-acompanhamento.png" alt=""></div>
    <div class="sl" id="sb"><img src="../capturas/app-acompanhamento.png" alt=""></div>
    <div class="sl" id="sc"><img src="../capturas/app-acompanhamento.png" alt=""></div>
  </div>

  <div class="fecho">
    <p class="sub">Peça sem sair do lugar.</p>
    <p class="cta">Siga para saber quando abrir.</p>
  </div>

</main>
</body>
</html>
