<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: post 2, o que vem no app (1080 x 1350)</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../social.css">
<style>
html, body { width: 1080px; height: 1350px; overflow: hidden; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }
/* Os 3 aparelhos sobem para a direita seguindo o corte diagonal do painel (-8 graus): grade defasada de 47 px.
   Borda do painel em x: y = 640 - 0,1407 * x. Topo do aparelho = borda no centro da coluna - 60 px (cruza o corte). */
.p2 .i1 { left: 72px;  top: 551px; }
.p2 .i2 { left: 405px; top: 504px; }
.p2 .i3 { left: 738px; top: 457px; }
</style>
</head>
<body>
<main class="post papel p2" role="img" aria-label="Post 2 de 3. O que vem no app. 1: escolha a loja, na tela de uma loja. 2: pague com PIX, na tela do PIX. 3: acompanhe o pedido, na tela de acompanhamento. Telas do app em teste.">

  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <mask id="wb-ol" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="104">
        <rect width="160" height="104" fill="#FFFFFF"/>
        <circle cx="80" cy="52" r="4.5" fill="#000000"/>
        <circle cx="132" cy="52" r="4.5" fill="#000000"/>
      </mask>
      <symbol id="s-sym" viewBox="0 0 160 104" fill="currentColor">
        <rect x="24" y="34" width="23" height="14" rx="7"/>
        <rect x="0" y="62" width="49" height="14" rx="7"/>
        <rect x="18" y="90" width="34" height="14" rx="7"/>
        <g mask="url(#wb-ol)">
          <polygon points="67,43 145,43 133,95 72,95" stroke="currentColor" stroke-width="18" stroke-linejoin="round"/>
          <path d="M80 42 A26 30 0 0 1 132 42" fill="none" stroke="currentColor" stroke-width="14"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <div class="painel"></div>

  <div class="rail">
    <svg class="sym" viewBox="0 0 160 104" aria-hidden="true"><use href="#s-sym" width="160" height="104"/></svg>
    <div class="serie"><div class="segs" aria-hidden="true"><i class="seg on"></i><i class="seg on"></i><i class="seg"></i></div><span>2 de 3</span></div>
  </div>

  <h1 class="d">
    <span>O que vem</span>
    <span>no <span class="mk"><span>app.</span></span></span>
  </h1>

  <!-- capturas reais: docs/telas/04-app-loja.png, 09-app-pix.png, 11-app-acompanhamento.png (390x844, reduzidas a 64%: nítidas) -->
  <div class="item i1">
    <div class="phone" aria-hidden="true"><div class="tela"><img src="../assets-social/04-app-loja.png" alt=""></div></div>
    <div class="rot"><b>1</b><span>Escolha<br>a loja</span></div>
  </div>
  <div class="item i2">
    <div class="phone" aria-hidden="true"><div class="tela"><img src="../assets-social/09-app-pix.png" alt=""><div class="cobre">Código copia e cola</div></div></div>
    <div class="rot"><b>2</b><span>Pague com<br>PIX</span></div>
  </div>
  <div class="item i3">
    <div class="phone" aria-hidden="true"><div class="tela"><img src="../assets-social/11-app-acompanhamento.png" alt=""></div></div>
    <div class="rot"><b>3</b><span>Acompanhe<br>o pedido</span></div>
  </div>

  <p class="nota">Telas do app em teste.</p>

</main>
</body>
</html>
