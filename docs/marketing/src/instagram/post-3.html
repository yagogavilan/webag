<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: post 3, convite (1080 x 1350)</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../social.css">
<style>
html, body { width: 1080px; height: 1350px; overflow: hidden; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }
</style>
</head>
<body>
<main class="post roxo p3" role="img" aria-label="Post 3 de 3. Vai abrir. Quer saber primeiro? 1: siga esta página. 2: ative as notificações. 3: avisamos quando abrir. Em breve.">

  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <mask id="wb-ol" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="104">
        <rect width="160" height="104" fill="#FFFFFF"/>
        <circle cx="80" cy="52" r="4.5" fill="#000000"/>
        <circle cx="132" cy="52" r="4.5" fill="#000000"/>
      </mask>
      <symbol id="s-sym" viewBox="0 0 160 104" fill="currentColor">
        <rect x="24" y="34" width="23" height="14" rx="7"/>
        <rect x="0" y="62" width="49" height="14" rx="7"/>
        <rect x="18" y="90" width="34" height="14" rx="7"/>
        <g mask="url(#wb-ol)">
          <polygon points="67,43 145,43 133,95 72,95" stroke="currentColor" stroke-width="18" stroke-linejoin="round"/>
          <path d="M80 42 A26 30 0 0 1 132 42" fill="none" stroke="currentColor" stroke-width="14"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <div class="painel"></div>

  <div class="rail">
    <svg class="sym" viewBox="0 0 160 104" aria-hidden="true"><use href="#s-sym" width="160" height="104"/></svg>
    <div class="serie"><div class="segs" aria-hidden="true"><i class="seg on"></i><i class="seg on"></i><i class="seg on"></i></div><span>3 de 3</span></div>
  </div>

  <h1 class="d">Vai abrir.</h1>
  <p class="sub d">
    <span>Quer saber</span>
    <span>primeiro?</span>
  </p>

  <div class="sticker-pos"><span class="sticker">Em breve</span></div>

  <!-- o símbolo cruza o corte entre o roxo e o painel noite; os olhais mostram o fundo -->
  <svg class="simbolo" viewBox="0 0 160 104" aria-hidden="true"><use href="#s-sym" width="160" height="104"/></svg>

  <ol class="passos">
    <li class="passo"><b>1</b><span>Siga esta página.</span></li>
    <li class="passo"><b>2</b><span>Ative as notificações.</span></li>
    <li class="passo"><b>3</b><span>Avisamos quando abrir.</span></li>
  </ol>

</main>
</body>
</html>
