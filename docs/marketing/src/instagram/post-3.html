<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: post 3 (lojista) "Tem loja? Venda além da sua rua." (1080 x 1350), v2.1</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../social.css">
<style>
html, body { width: 1080px; height: 1350px; overflow: hidden; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }

/* Título a 140 px (0,53 em/car.): "da sua rua." 11 car = 816; "Venda além" 10 car = 742 (<= 936). 3 linhas = 387 px, de y=124 a ~511.
   Nenhum adesivo: nada encosta no título. Cartão a 42 px: ~13,8 em = ~580 px, de y=540 a ~1120 (sombra até ~1130). CTA de 2 linhas a 52 px em y=1172. */
.p3 .emb { color: var(--noite); }
.p3 h1 { position: absolute; left: 72px; top: 124px; font-size: 140px; }
.p3 .ui { left: 72px; top: 540px; width: 936px; font-size: 42px; }
.p3 .cta { top: 1172px; }
</style>
</head>
<body>
<main class="post lima p3" role="img" aria-label="Tem loja? Venda além da sua rua. Tela ilustrativa do painel da loja: pedido novo de outro bairro, camiseta básica M R$ 60,00, boné preto R$ 40,00, total R$ 100,00, com os botões Aceitar pedido e Recusar. Chame no direct para entrar na lista. Webag, cadastro em breve.">

  <!-- Ideia: para o lojista, a prova é o pedido chegando. Fundo lima (diferente do feed), título que chama pelo nome ("Tem loja?"), cartão de pedido DESENHADO:
       loja de moda, valores redondos, sem código de pedido, sem "Pago no app", sem horário, sem dado de seed.
       Sem o adesivo "O motoboy leva.": a peça não depende do parecer J8 (nada promete entrega). Substitui o post "Ativa o sininho." (descartado). -->
  <img class="logo" src="../assets/webag-logo.svg" alt="Webag">
  <div class="emb">Cadastro em breve</div>

  <h1 class="d"><span>Tem loja?</span><span>Venda além</span><span>da sua rua.</span></h1>

  <div class="ui dark pedido" style="--sh:var(--roxo)" aria-hidden="true">
    <div class="ph"><b>Pedido novo</b><span class="chip">Outro bairro</span></div>
    <ul>
      <li><span>Camiseta básica M</span><span>R$ 60,00</span></li>
      <li><span>Boné preto</span><span>R$ 40,00</span></li>
    </ul>
    <div class="tot"><span>Total</span><b>R$ 100,00</b></div>
    <div class="bt"><span class="ok">Aceitar pedido</span><span class="nao">Recusar</span></div>
    <p class="cp">Tela ilustrativa.</p>
  </div>

  <p class="cta">Chame no direct<br>para entrar na lista.</p>

</main>
</body>
</html>
