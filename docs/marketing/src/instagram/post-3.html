/* v2.2: a prova é a CAPTURA REAL do painel (src/capturas/painel-pedido-novo-alerta.png, 2880x1800): o alerta "Pedido novo" recortado.

   Ponta do botão "Recusar" que vaza na borda esquerda do alerta (bug do painel): coberta pela faixa branca .strip (31 px); o texto do alerta começa a 37 px.
   Itens: camiseta e bermuda (moda), R$ 135,80. "Entrega" aparece no chip do alerta (depende do parecer J8; ver revisao-social-v2.md).
