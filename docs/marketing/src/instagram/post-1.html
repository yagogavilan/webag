<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: post 1 (lojista) "Só retirando, tá? Quantas vendas essa frase já custou?" (1080 x 1350), v2.1</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../social.css">
<style>
html, body { width: 1080px; height: 1350px; overflow: hidden; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }

/* Larguras: balão cinza a 60 px (Figtree 600, ~0,5 em/car.): "Dá pra entregar?" 16 car = 480 + 84 de padding = 564.
   Balão lima a 108 px (Bricolage 800, 0,53 em/car.): "Só retirando," 13 car = 744 + 99 = 843 (<= 936, ancorado à direita).
   Pergunta a 110 px: "Quantas vendas" 14 car = 816; "essa frase" 10; "já custou?" 10 + marca-texto. */
.p1 .b1 { left: 72px; top: 150px; font-size: 60px; }
.p1 .b2 { left: 72px; top: 290px; font-size: 60px; }
.p1 .b3 { right: 72px; top: 514px; font-size: 108px; }
.p1 h1 { position: absolute; left: 72px; top: 850px; font-size: 110px; }
.p1 .cta { top: 1200px; color: var(--branco); }
</style>
</head>
<body>
<main class="post noite p1" role="img" aria-label="Conversa de mensagens. Cliente: Tem no 38? Moro longe. Dá pra entregar? Resposta da loja, em destaque: Só retirando, tá? Pergunta ao lojista: Quantas vendas essa frase já custou? Tem loja? Chame no direct. Webag, em breve.">

  <!-- Ideia: a frase que o lojista já disse (e perdeu venda). Cena do slide 2 da apresentação do lojista. Um público (quem tem loja), uma ação (chamar no direct).
       Não promete entrega nem prazo: não depende do parecer J8. Sem tela do app, sem dado de seed. -->
  <img class="logo" src="../assets/webag-logo-branca.svg" alt="Webag">
  <div class="emb">Em breve</div>

  <div class="bub in b1">Tem no 38?</div>
  <div class="bub in b2">Moro longe.<br>Dá pra entregar?</div>
  <div class="bub out b3">Só retirando,<br>tá?</div>

  <h1 class="d">
    <span>Quantas vendas</span>
    <span>essa frase</span>
    <span><span class="mk"><span>já custou?</span></span></span>
  </h1>

  <p class="cta">Tem loja? Chame no direct.</p>

</main>
</body>
</html>
