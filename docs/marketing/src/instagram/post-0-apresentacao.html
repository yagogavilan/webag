<body>
<main class="post roxo p0" role="img" aria-label="Webag, em breve. Aquela loja que você gosta agora entrega. A última palavra da frase é o banner real do app: Entrega pelo Webag.">

  <!-- Ideia: a frase termina na tela real. "Aquela loja que você gosta agora" + o banner do app "Entrega pelo Webag" no lugar do verbo.
       Linhas de 160 px: a maior ("você gosta", 10 caracteres) tem ~800 px de 936 disponíveis. -->
  <img class="logo" src="../assets/webag-logo-branca.svg" alt="Webag">
  <div class="emb">Em breve</div>

  <h1 class="d">
    <span>Aquela</span>
    <span>loja que</span>
    <span>você gosta</span>
    <span><span class="mk"><span>agora</span></span></span>
  </h1>

  <!-- captura real docs/telas/01-app-inicio.png (390 x 844): recorte x 10..380, y 191..398 (só o banner e os pontos do carrossel).
       Escala 936/370 = 2,5297: largura da imagem 986,6; esquerda -25,3; topo -483,2; caixa 936 x 524. Texto do banner ~40 px na peça final. -->
  <div class="shot" aria-hidden="true"><img src="../assets-social/01-app-inicio.png" alt="" style="width:986.6px;left:-25.3px;top:-483.2px"></div>

</main>
