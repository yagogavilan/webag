/* Larguras (0,53 em por caractere, Bricolage 800 a 148 px): "Aquela loja" 11 car = 863; "Não Agora" 9 car = 706; "entrega." 8 car = 627 + marca-texto. Todas <= 936. */

/* a virada: loja que não entrega -> loja + moto. Duas ilustrações do kit (sem foto de terceiros, sem tela, sem botão) */

<main class="post roxo p0" role="img" aria-label="Webag, em breve. Aquela loja que você adora. Não entrega. A palavra Não está riscada e no lugar vem Agora: Agora entrega. Ilustração: de uma loja de bairro para uma moto com a sacola do Webag. Siga e ative o sininho.">

  <!-- Ideia: a MESMA frase vira. "Aquela loja que você adora. ~~Não~~ Agora entrega." A palavra que importa (entrega.) é a mesma nos dois estados e fica em lima.

       CTA na arte: "Siga e ative o sininho." em 52 px (lima sobre roxo = 3,9:1, texto grande em negrito). -->

    <span><span class="mk"><span>entrega.</span></span></span>
