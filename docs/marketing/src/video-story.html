<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: vídeo Stories 15 s (1080 x 1920, 30 fps)</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="social.css">
<style>
/* Contrato com o render: palco 1080x1920, window.__duration = 15, window.setTime(t) posiciona TUDO no instante t (qualquer ordem).
   Nenhuma CSS animation/transition, nenhum requestAnimationFrame, Date.now ou Math.random. Um único timeline em JS puro (abaixo).
   Margens seguras do Stories: topo 250 px e base 340 px livres; laterais 84 px. Todo texto fica entre y=270 e y=1575. */
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }

html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--noite); transform-origin: 0 0; }
.sc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden; }
.bgn { background: var(--noite); color: var(--branco); }
.bgr { background: var(--roxo);  color: var(--branco); }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* cena A: gancho */
#sA .hook { position: absolute; left: 84px; top: 300px; font-size: 224px; }
#sA .hook .l { color: var(--lima); }

/* cena B: marca */
#logoB { position: absolute; left: 140px; top: 640px; width: 800px; height: 220px; color: var(--branco); fill: currentColor; overflow: visible; }
#bB1 { transform-origin: 24px 41px; }
#bB2 { transform-origin: 0px 69px; }
#bB3 { transform-origin: 18px 97px; }
#bBag { transform-origin: 106px 69px; }
#sB .tag { position: absolute; left: 84px; top: 960px; font-size: 104px; }

/* cenas C, D, E: passo a passo com a tela real */
.num { position: absolute; left: 56px; top: 585px; font-family: var(--display); font-weight: 800; font-size: 640px; line-height: 0.74; letter-spacing: -0.06em; color: var(--lima); white-space: nowrap; }
.ttl { position: absolute; left: 84px; top: 270px; font-size: 128px; }
.vph { left: 552px; top: 590px; width: 444px; height: 926px; --rf: 56px; --b: 12px; }
.stk { position: absolute; left: 84px; top: 1160px; transform-origin: 0 50%; }
.stk .sticker { font-size: 42px; }
#sNota .nota { position: absolute; left: 84px; top: 1534px; background: var(--noite); color: var(--branco); font: 600 32px/1 var(--texto); padding: 10px 18px 12px; border-radius: 10px; }

/* cena G: fecho */
#logoG { position: absolute; left: 84px; top: 300px; width: 420px; height: 116px; color: var(--branco); fill: currentColor; }
#sG .big { position: absolute; left: 84px; top: 470px; font-size: 300px; }
#gT2 { transform-origin: 0 50%; }
#sG .cta { position: absolute; left: 84px; top: 1140px; width: 912px; background: var(--noite); border-radius: 28px; padding: 52px 56px 64px; }
#sG .cta p { font-family: var(--display); font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; }
#sG .cta p span { display: block; }
#sG .cta .l { color: var(--lima); }
#sG .ul { position: absolute; left: 56px; bottom: 40px; width: 548px; height: 12px; border-radius: 6px; background: var(--lima); transform-origin: 0 50%; }

/* pré-visualização manual (só com ?preview): régua para arrastar o tempo. Não usada pelo render. */
#prev { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: #111; color: #fff; font: 14px/1 var(--texto); z-index: 9; display: flex; gap: 12px; align-items: center; }
#prev input { flex: 1; }
</style>
</head>

12.08000000000004 96.416 409.20000000000005 91.136Q406.32000000000005 85.856 406.32000000000005 79.424Q406.32000000000005 72.896 409.20000000000005 67.664Q412.08000000000004 62.432 417.072 59.408Q422.064 56.384 428.49600000000004 56.384Q433.29600000000005 56.384 437.0880000000001 58.16Q440.88000000000005 59.936 443.232 63.152Q445.584 66.368 445.872 70.592V88.352Q445.584 92.48 443.232 95.696Q440.88000000000005 98.912 437.0400000000001 100.736Q433.20000000000005 102.56 428.49600000000004 102.56ZM431.28000000000003 89.504Q434.35200000000003 89.504 436.60800000000006 88.16Q438.86400000000003 86.816 440.064 84.56Q441.264 82.304 441.264 79.424Q441.264 76.544 440.064 74.24000000000001Q438.86400000000003 71.936 436.60800000000006 70.592Q434.35200000000003 69.24799999999999 431.28000000000003 69.24799999999999Q428.30400000000003 69.24799999999999 426.0 70.592Q423.696 71.936 422.44800000000004 74.24000000000001Q421.20000000000005 76.544 421.20000000000005 79.424Q421.20000000000005 82.112 422.44800000000004 84.464Q423.696 86.816 425.952 88.16Q428.208 89.504 431.28000000000003 89.504Z"/></g>
    </defs>
  </svg>

  <!-- A  0,0 a 2,0 s  GANCHO. As duas primeiras linhas já estão em cena no quadro 0 (miniatura e autoplay mudo). -->

<script>
(function () {
  'use strict';

  var DURATION = 15;          // s
  var FPS = 30;

  // Tempos de corte (s). Compasso de 2,0 s = 4/4 a 120 BPM. Para casar com outra trilha, mude só estes valores.
  var T = { A: 0, B: 2, C: 4, D: 6, E: 8, G: 10, FIM: DURATION };

  // Curvas curtas e intencionais. Nada de flutuar: toda animação termina em <= 0,30 s.
  var EASE = {
    lin:  function (x) { return x; },
    out3: function (x) { var u = 1 - x; return 1 - u * u * u; },
    out5: function (x) { var u = 1 - x; return 1 - u * u * u * u * u; },
    back: function (x) { var c = 1.2, u = x - 1; return 1 + (c + 1) * u * u * u + c * u * u; }
  };

  var $ = function (id) { return document.getElementById(id); };
  var n = function (v) { return Math.round(v * 1000) / 1000; };

  // ---------- cenas: visíveis só em [t0, t1) ----------
  var SCENES = [
    { id: 'sA', t0: T.A, t1: T.B },
    { id: 'sB', t0: T.B, t1: T.C },
    { id: 'sC', t0: T.C, t1: T.D },
    { id: 'sD', t0: T.D, t1: T.E },
    { id: 'sE', t0: T.E, t1: T.G },
    { id: 'sG', t0: T.G, t1: T.FIM + 1 },
    { id: 'sNota', t0: T.C, t1: T.G }
  ];

  // ---------- trilhas: elemento, propriedade, início, duração, de, para, curva ----------
  var TR = {};
  function tr(id, prop, t, d, from, to, ease) {
    if (!TR[id]) TR[id] = {};
    if (!TR[id][prop]) TR[id][prop] = [];
    TR[id][prop].push({ t: t, d: d, from: from, to: to, e: EASE[ease || 'out3'] });
  }
  // entrada seca: sobe dy px e aparece
  function rise(id, t, dy, d, ease) {
    tr(id, 'o', t, d * 0.6, 0, 1, 'lin');
    tr(id, 'y', t, d, dy, 0, ease || 'out3');
  }
  // sobressalto curto (adesivo, selo)
  function pop(id, t, d, s0) {
    tr(id, 'o', t, d * 0.4, 0, 1, 'lin');
    tr(id, 'sx', t, d, s0, 1, 'back');
    tr(id, 'sy', t, d, s0, 1, 'back');
  }

  // A  gancho: linhas 1 e 2 no quadro 0; as outras entram em colcheias (0,25 s)
  rise('aL3', 0.25, 34, 0.14);
  rise('aL4', 0.50, 34, 0.14);
  rise('aL5', 0.75, 34, 0.14);

  // B  barras crescem da esquerda (60 ms entre elas), sacola salta, palavra entra, frase em 2 tempos
  tr('bB1', 'sx', T.B + 0.00, 0.18, 0, 1, 'out3');
  tr('bB2', 'sx', T.B + 0.06, 0.18, 0, 1, 'out3');
  tr('bB3', 'sx', T.B + 0.12, 0.18, 0, 1, 'out3');
  pop('bBag', T.B + 0.10, 0.20, 0.8);
  tr('bWord', 'x', T.B + 0.24, 0.18, 36, 0, 'out3');
  tr('bWord', 'o', T.B + 0.24, 0.10, 0, 1, 'lin');
  rise('bT1', T.B + 0.50, 30, 0.16);
  rise('bT2', T.B + 1.00, 30, 0.16);

  // C, D, E  numeral, título em 2 linhas, aparelho sobe, adesivo no tempo 3 do compasso
  function passo(s, p) {
    rise(p + 'Num', s + 0.00, 50, 0.16);
    rise(p + 'T1',  s + 0.08, 36, 0.16);
    rise(p + 'T2',  s + 0.16, 36, 0.16);
    tr(p + 'Ph', 'o', s + 0.12, 0.08, 0, 1, 'lin');
    tr(p + 'Ph', 'y', s + 0.12, 0.28, 300, 0, 'out5');
    pop(p + 'St', s + 1.00, 0.20, 0.6);
  }
  passo(T.C, 'c');
  passo(T.D, 'd');
  passo(T.E, 'e');

  // G  "Em breve." no corte; chamada única em 12,0 s; sublinhado desenha em 12,45 s
  rise('gT1', T.G + 0.00, 40, 0.14);
  tr('gT2', 'o', T.G + 0.04, 0.06, 0, 1, 'lin');
  tr('gT2', 'sx', T.G + 0.04, 0.18, 0.9, 1, 'back');
  tr('gT2', 'sy', T.G + 0.04, 0.18, 0.9, 1, 'back');
  rise('gCta', T.G + 2.00, 60, 0.22, 'out5');
  tr('gUl', 'sx', T.G + 2.45, 0.30, 0, 1, 'out3');

  // ---------- motor: valor de cada propriedade em t (puro, sem estado, sem ordem) ----------
  var SC = [], ANIM = [], i, id, prop;
  for (i = 0; i < SCENES.length; i++) SC.push({ el: $(SCENES[i].id), t0: SCENES[i].t0, t1: SCENES[i].t1 });
  for (id in TR) {
    for (prop in TR[id]) TR[id][prop].sort(function (a, b) { return a.t - b.t; });
    ANIM.push({ el: $(id), p: TR[id] });
  }

  function val(segs, t, def) {
    if (!segs) return def;
    var v = segs[0].from, k, s;
    for (k = 0; k < segs.length; k++) {
      s = segs[k];
      if (t < s.t) break;
      if (t >= s.t + s.d) { v = s.to; continue; }
      v = s.from + (s.to - s.from) * s.e((t - s.t) / s.d);
      break;
    }
    return v;
  }

  function setTime(t) {
    t = Number(t);
    if (!isFinite(t)) t = 0;
    if (t < 0) t = 0;
    if (t > DURATION) t = DURATION;
    var k, a, p, o;
    for (k = 0; k < SC.length; k++) {
      SC[k].el.style.visibility = (t >= SC[k].t0 && t < SC[k].t1) ? 'visible' : 'hidden';
    }
    for (k = 0; k < ANIM.length; k++) {
      a = ANIM[k]; p = a.p;
      a.el.style.transform =
        'translate(' + n(val(p.x, t, 0)) + 'px,' + n(val(p.y, t, 0)) + 'px) ' +
        'scale(' + n(val(p.sx, t, 1)) + ',' + n(val(p.sy, t, 1)) + ')';
      o = val(p.o, t, 1);
      a.el.style.opacity = n(o);
    }
  }

  window.__duration = DURATION;
  window.__fps = FPS;
  window.setTime = setTime;
  setTime(0);

  // fontes carregadas antes do primeiro quadro (o render pode aguardar window.__ready)
  if (document.fonts && document.fonts.load) {
    var imgs = Array.prototype.slice.call(document.images).map(function (im) {
      return im.decode ? im.decode().catch(function () { return null; }) : Promise.resolve(null);
    });
    window.__ready = Promise.all([
      document.fonts.load('800 100px "Bricolage Grotesque"'),
      document.fonts.load('600 32px "Figtree"'),
      document.fonts.load('700 32px "Figtree"'),
      document.fonts.load('800 32px "Figtree"')
    ].concat(imgs)).then(function () { setTime(0); return true; });
  } else {
    window.__ready = Promise.resolve(true);
  }

  // régua de pré-visualização manual (?preview): arrasta o tempo; setas = 1 quadro. Sem timers.
  if (/[?&]preview/.test(location.search)) {
    var stage = $('stage'), bar = document.createElement('div'), r = document.createElement('input'), lab = document.createElement('span');
    var fit = function () { stage.style.transform = 'scale(' + n((window.innerHeight - 48) / 1920) + ')'; };
    bar.id = 'prev'; r.type = 'range'; r.min = 0; r.max = DURATION; r.step = 1 / FPS; r.value = 0;
    r.addEventListener('input', function () { setTime(r.value); lab.textContent = Number(r.value).toFixed(2) + ' s'; });
    document.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      r.value = Math.min(DURATION, Math.max(0, Number(r.value) + d / FPS));
      r.dispatchEvent(new Event('input'));
    });
    lab.textContent = '0.00 s'; bar.appendChild(r); bar.appendChild(lab); document.body.appendChild(bar);
    window.addEventListener('resize', fit); fit();
  }
})();
</script>
</body>
