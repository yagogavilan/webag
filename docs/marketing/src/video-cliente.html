<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webag: vídeo Stories 15 s para CLIENTE (1080 x 1920, 30 fps), v2.2 "Aquela loja que você adora. Agora entrega."</title>

<link rel="stylesheet" href="social.css">

<style>
/* Contrato com o render: palco 1080x1920, window.__duration = 15, window.__fps = 30, window.setTime(t) devolve Promise (video-engine.js).
   Um público (quem compra), uma ideia ("Aquela loja que você adora. Agora entrega."), uma ação ("Siga e ative o sininho.").
   v2.2: as cenas 2, 3 e 4 mostram CLIPES REAIS do app (src/clips/, ver README de lá) em janelas .win recortadas; nada mais de cartão desenhado.
   Margens seguras do Stories: topo 250 px, base 340 px, laterais 84 px. Todo texto fica entre y=290 e y=1500; as janelas terminam em y<=1560.

   RECORTES (clipe 1170x2532; k = 912/1170 = 0,7795 para as janelas de 912 px; px do clipe -> px do palco)
   - Cena 2 (app-loja, a partir de 2,5 s): recorte y=130 a 1413 do clipe (vitrine, toque na camiseta, página do produto com preço). k*130 = 101,3. Janela 912 x 1000.
     Por que 2,5 s: antes disso o tempo previsto de chegada da loja ("22:38 – 23:08") ainda está na tela rolando. Em 2,45 s a linha já saiu do recorte (conta em revisao-social-v2.md).
   - Cena 3 (app-sacola, 0,3 a 1,8 s): recorte y=1430 a 2532 (chips de número, botão Adicionar, aviso "Adicionado à sacola" no rodapé). k*1430 = 1114,7. Janela 912 x 858.
     Para antes da sacola abrir (2,08 s), onde aparece "Chega entre 22:50 e 23:20".
   - Cena 4 (app-acompanhar, 0 a 4 s): recorte y=1135 a 2328 (barra de progresso, linha do tempo). k*1135 = 884,7. Janela 912 x 930.
     O recorte começa abaixo da faixa "Chega entre ..." do cartão escuro (que mede até y~1105 no estado mais alto). Cada etapa nova aparece na linha do tempo.
   Larguras (Bricolage 800, 0,53 em/car.): "Aquela loja" a 150 px = 875; "Não Agora" = 715; "entrega." = 636 + marca-texto; "Escolha" a 130 px = 482; "Acompanhe" a 130 px = 620; "cada etapa." a 130 px = 758;
   "Peça." a 230 px = 280; "Em breve." a 180 px = 858; "Siga e ative" a 120 px = 763. Todas <= 912. */
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url("../../design/recursos/fontes/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: block; src: url("../../design/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: block; src: url("../../design/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-display: block; src: url("../../design/fonts/figtree-latin-800-normal.woff2") format("woff2"); }

#h1 { top: 290px; font-size: 150px; }
#tf1 { left: 84px; top: 1080px; width: 400px; height: 300px; box-shadow: 10px 10px 0 var(--noite); }
#sa1 { left: 492px; top: 1194px; }
#tm1 { left: 596px; top: 1080px; width: 400px; height: 300px; box-shadow: 10px 10px 0 var(--noite); }

#h2 { top: 290px; font-size: 130px; }
#c2 { left: 84px; top: 556px; width: 912px; height: 1000px; --sh: var(--lima); }
#slot2 video { width: 912px; height: 1973.6px; top: -101.3px; }

#h3 { top: 290px; font-size: 230px; }
#v3 { top: 530px; }
#c3 { left: 84px; top: 650px; width: 912px; height: 858px; --sh: var(--noite); }
#slot3 video { width: 912px; height: 1973.6px; top: -1114.7px; }

#h4 { top: 290px; font-size: 130px; }
#c4 { left: 84px; top: 556px; width: 912px; height: 930px; --sh: var(--lima); }
#slot4 video { width: 912px; height: 1973.6px; top: -884.7px; }

#logo5 { position: absolute; left: 84px; top: 300px; width: 560px; height: 154px; }
#h5 { top: 520px; font-size: 180px; }
#cta5 { top: 790px; }
#cta5 p { font-size: 120px; }
#esc5 { top: 1190px; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1  0,0 a 3,5 s  GANCHO E VIRADA NA MESMA ARTE (tipografia desenhada, sem mudança da v2.1). Quadro 0: "Aquela loja que você adora." 0,7 s: "Não entrega." (entrega. em lima).
       2,1 s: o risco lima cai sobre "Não" e "Agora" aparece ao lado: "Agora entrega." (promessa antes dos 4 s; depende do parecer J8, pendencias IJ1). -->
  <section class="sc bgr" id="s1">
    <h2 class="d vh" id="h1">
      <span class="ln" id="l1a">Aquela loja</span>
      <span class="ln" id="l1b">que você</span>
      <span class="ln" id="l1c">adora.</span>
      <span class="ln" id="l1d"><span class="no">Não<i class="strike"><b id="k1"></b></i></span> <span class="ag" id="ag1">Agora</span></span>
      <span class="ln" id="l1e"><span class="mk"><span>entrega.</span></span></span>
    </h2>
    <div class="tile" id="tf1"><img src="assets/fachada-loja.svg" alt=""></div>
    <svg class="seta" id="sa1" viewBox="0 0 96 72" aria-hidden="true"><path d="M8 36H76M52 10L82 36L52 62" fill="none" stroke="#D6FF4A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="tile moto" id="tm1"><img src="assets/etapa-a-caminho.svg" alt=""></div>
  </section>

  <!-- 2  3,5 a 5,0 s  ESCOLHA NA LOJA: clipe real app-loja de 2,5 a 4,0 s. Vitrine da Moda Express Franco termina de rolar (2,5 a 2,96 s),
       o dedo toca na camiseta (3,21 a 3,47 s) e abre a página do produto (a partir de 3,47 s = cena 4,47 s). -->
  <section class="sc bgn" id="s2">
    <h2 class="d vh" id="h2"><span class="ln" id="l2a">Escolha</span><span class="ln l" id="l2b">na loja.</span></h2>
    <div class="win" id="c2" aria-hidden="true"><div class="vslot" id="slot2"></div></div>
  </section>

  <!-- 3  5,0 a 6,5 s  PEÇA: clipe real app-sacola de 0,3 a 1,8 s. O dedo escolhe o número (0,35 a 0,6 s), toca em Adicionar (1,0 a 1,27 s) e o aviso
       "Adicionado à sacola" sobe no rodapé. (v2.1 dizia "Pediu."; adicionar à sacola ainda não é pedir, então o verbo virou "Peça.", paralelo a "Escolha" e "Acompanhe".) -->
  <section class="sc bgl" id="s3">
    <h2 class="d vh" id="h3"><span class="ln" id="l3a">Peça.</span></h2>
    <p class="vs" id="v3">Sem sair do lugar.</p>
    <div class="win" id="c3" aria-hidden="true"><div class="vslot" id="slot3"></div></div>
  </section>

  <!-- 4  6,5 a 10,5 s  ACOMPANHE: clipe real app-acompanhar inteiro (4 s). Clipe 0 a 1,1 s = "Em separação" (cena 6,5 a 7,6 s); 1,1 a 2,3 s = "Aguardando motoboy" (7,6 a 8,8 s);
       2,3 a 4,0 s = "Saiu para entrega" (8,8 a 10,5 s). "Saiu para entrega" / "A caminho" dependem do parecer J8. -->

  <section class="sc bgn" id="s4">
    <h2 class="d vh" id="h4"><span class="ln" id="l4a">Acompanhe</span><span class="ln l" id="l4b">cada etapa.</span></h2>
    <div class="win" id="c4" aria-hidden="true"><div class="vslot" id="slot4"></div></div>
  </section>

  <!-- 5  10,5 a 15,0 s  CTA ÚNICO: "Siga e ative o sininho." (em 10,75 s). "Em breve", sem data. -->
  <section class="sc bgr" id="s5">
    <img id="logo5" src="assets/webag-logo-branca.svg" alt="Webag">
    <h2 class="d vh" id="h5"><span class="ln" id="l5a">Em <span class="mk"><span>breve.</span></span></span></h2>
    <div class="cta-box" id="cta5"><p><span>Siga e ative</span><span>o sininho.</span></p></div>
    <p class="esc" id="esc5">Começamos por Francisco Morato e região.</p>
  </section>

</div>

<script src="video-engine.js"></script>
<script>
WBVideo({
  duration: 15,
  fps: 30,
  // cortes em múltiplos de 0,5 s (120 BPM). Para casar com outra trilha, mude só estes valores. Cortes visíveis no vídeo: 4 de cena + 1 do clipe da loja (toque abre o produto)
  // + 1 do clipe da sacola (toque em Adicionar) + 2 trocas de etapa do acompanhamento = 8.
  cuts: [0, 3.5, 5, 6.5, 10.5, 15],
  // clipes reais (src/clips/, ver README de lá). inn = segundo do clipe que aparece no 1º quadro da cena.
  clips: [
    { slot: 'slot2', scene: 2, base: 'clips/app-loja', inn: 2.5 },
    { slot: 'slot3', scene: 3, base: 'clips/app-sacola', inn: 0.3 },
    { slot: 'slot4', scene: 4, base: 'clips/app-acompanhar', inn: 0 }
  ],
  tracks: function (h) {
    var tr = h.tr, snap = h.snap, rise = h.rise, bump = h.bump, pop = h.pop;
    // 1: "Aquela loja que você adora." no quadro 0; "Não entrega." em 0,7 s; a fachada em 0,95 s;
    //    em 2,1 s o risco cresce sobre "Não" (0,14 s), "Agora" aparece em 2,25 s, "entrega." salta em 2,3 s e entram a seta e a moto
    snap('l1a', 0.0, 8); snap('l1b', 0.0, 8); snap('l1c', 0.0, 8);
    rise('l1d', 0.70, 24, 0.14);
    rise('l1e', 0.80, 24, 0.14);
    rise('tf1', 0.95, 30, 0.16);
    tr('k1', 'sx', 2.10, 0.14, 0, 1, 'out3');
    pop('ag1', 2.25, 0.20, 0.85);
    bump('l1e', 2.30, 0.20, 0.94);
    pop('sa1', 2.30, 0.20, 0.80);
    pop('tm1', 2.30, 0.22, 0.90);
    // 2: título no corte; a janela sobe 60 px em 0,2 s (a janela já está visível no 1º quadro)
    snap('l2a', 3.5, 10); snap('l2b', 3.5, 10);
    tr('c2', 'y', 3.50, 0.20, 60, 0, 'out5');
    // 3
    snap('l3a', 5.0, 10); snap('v3', 5.0, 10);
    tr('c3', 'y', 5.00, 0.20, 60, 0, 'out5');
    // 4
    snap('l4a', 6.5, 10); snap('l4b', 6.5, 10);
    tr('c4', 'y', 6.50, 0.20, 60, 0, 'out5');
    // 5: logo e "Em breve." no corte; o CTA sobe em 10,75 s (opaco em 10,87 s, legível por 4,1 s); escopo em 11,1 s
    snap('logo5', 10.5, 8);
    bump('l5a', 10.5, 0.18, 0.92);
    rise('cta5', 10.75, 60, 0.22);
    rise('esc5', 11.10, 14, 0.14);
  }
});
</script>
</body>
</html>
