# Configuração do gitleaks (SEC-085). Estende as regras padrão e só libera o que é, comprovadamente, valor de
# desenvolvimento publicado de propósito. Nunca adicione aqui uma credencial real: revogue e rotacione.
# Regra para novas exceções (SEC-222): uma allowlist por fixture, com targetRules, caminho E valor exato (condition AND).
# Nada de liberar um caminho inteiro para todas as regras. Revisão: docs/seguranca/revisoes/gitleaks-2026-11-22.md
title = "webag"

[extend]
useDefault = true

# Valores de desenvolvimento local e de CI (o boot da API recusa todos em produção, SEC-080). Valem em qualquer arquivo.
[[allowlists]]
description = "SEC-085: marcadores de valor de dev/CI recusados em produção"
regexTarget = "match"
regexes = [
  '''dev-only-[A-Za-z0-9-]+''',
  '''webag_dev_only''',
  '''webag_ci_only''',
  '''webag-dev-secret-only''',
  '''very-long-random-production[A-Za-z0-9-]*''',
]

# Fixtures da API e compose de dev. SEC-222: antes liberava estes caminhos para TODAS as regras (uma chave privada,
# token do Mercado Pago ou JWT colado num teste passaria). Agora só a regra genérica, que é a que dispara em senhas
# e tokens de teste; as regras específicas (private-key, jwt, aws, etc.) continuam valendo nesses caminhos.
[[allowlists]]
description = "SEC-085/SEC-222: senhas e tokens de teste da API e do compose de dev (só generic-api-key)"
targetRules = ["generic-api-key"]
paths = [
  '''infra/env\.example''',
  '''apps/api/test/.*''',
  '''apps/api/src/.*\.spec\.ts''',
  '''docker-compose\.yml''',
]

# SEC-222: falsos positivos do CI de 2026-11-22 (28 achados, 9 valores). Cada um: regra + caminho + valor exato.
[[allowlists]]
description = "SEC-222: senha da conta de teste do Maestro (maria@exemplo.test, dominio .test) no comentario de uso dos fluxos e2e"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/mobile/e2e/[a-z-]+\.yaml$''']
regexes = ['''^Cachorro-Azul-2024$''']

[[allowlists]]
description = "SEC-222: token sequencial de teste da URL do cartao (SEC-126)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/mobile/__tests__/card-url\.test\.ts$''']
regexes = ['''^0123456789abcdef0123$''']

[[allowlists]]
description = "SEC-222: nova senha ficticia no teste do formulario de recuperacao do admin"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/web/src/features/auth/forgot-form\.spec\.tsx$''']
regexes = ['''^Nova-Senha-2026-xyz$''']

[[allowlists]]
description = "SEC-222: mfaToken e nova senha ficticios nos testes das rotas de sessao do BFF (respostas mockadas)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/web/src/server/session-routes\.spec\.ts$''']
regexes = ['''^tok-123456789012345678901$''', '''^Nova-Senha-123$''']

[[allowlists]]
description = "SEC-222: JWT forjado sem assinatura (alg none, role admin) usado no reteste PAP-6 para provar que a API recusa"
targetRules = ["jwt"]
condition = "AND"
paths = ['''^docs/qa/retestes/papeis\.mjs$''']
regexes = ['''^eyJhbGciOiJub25lIn0\.eyJzdWIiOiJ4Iiwicm9sZSI6ImFkbWluIn0\.$''']
